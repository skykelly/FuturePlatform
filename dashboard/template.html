<title>FuturePlatform 시그널</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<style>
/* Layout: 리서치 포털 — 상단 내비, 홈(이번 회차·포트폴리오 지도·Thesis 카드·변경/관찰·최신 신호), 위키 리더, 신호 레이더, 다이제스트 */
:root{
  --bg:#f2f3ef; --surface:#ffffff; --surface2:#f8f9f6; --ink:#1b231f; --muted:#5d6a63; --line:#d8ddd6;
  --accent:#1f6f5c; --accent-soft:#e0eee8; --accent-ink:#ffffff;
  --pos:#2f7d4f; --neg:#b4472f; --new:#7a5a12; --warn:#9a6b10; --chip:#ecefea;
  --q-core:#1f6f5c; --q-moon:#3b5b8c; --q-quick:#a07514; --q-hedge:#7d6a63;
  --h0:#eef1ec; --h1:#d6e6de; --h2:#a9cfbd; --h3:#6fae93; --h4:#2f7d63;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111513; --surface:#191f1c; --surface2:#1e2521; --ink:#e3e9e5; --muted:#98a59e; --line:#2b3430;
  --accent:#5cc2a3; --accent-soft:#1c2f28; --accent-ink:#0f1a16;
  --pos:#6cc48f; --neg:#e58a72; --new:#d8b25a; --warn:#d8b25a; --chip:#232b27;
  --q-core:#5cc2a3; --q-moon:#86a6d8; --q-quick:#d8b25a; --q-hedge:#b3a39b;
  --h0:#1f2723; --h1:#20382f; --h2:#2b5545; --h3:#3f8268; --h4:#5cc2a3; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#111513; --surface:#191f1c; --surface2:#1e2521; --ink:#e3e9e5; --muted:#98a59e; --line:#2b3430;
  --accent:#5cc2a3; --accent-soft:#1c2f28; --accent-ink:#0f1a16;
  --pos:#6cc48f; --neg:#e58a72; --new:#d8b25a; --warn:#d8b25a; --chip:#232b27;
  --q-core:#5cc2a3; --q-moon:#86a6d8; --q-quick:#d8b25a; --q-hedge:#b3a39b;
  --h0:#1f2723; --h1:#20382f; --h2:#2b5545; --h3:#3f8268; --h4:#5cc2a3; color-scheme:dark }
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6}
a{color:var(--accent)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:10px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center}
.brand{font-weight:700;font-size:1.05rem;letter-spacing:-.01em;display:flex;align-items:baseline;gap:8px}
.brand small{font-family:var(--f-mono);font-weight:400;font-size:.72rem;color:var(--muted)}
nav{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
nav a{text-decoration:none;color:var(--muted);font-size:.88rem;padding:6px 10px;border-radius:4px}
nav a[aria-current="page"]{color:var(--accent-ink);background:var(--accent)}
nav a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:22px 64px}
.view{display:grid;gap:30px}
h1,h2,h3{text-wrap:balance}
.eyebrow{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:0 0 12px}
.sec-h h2{font-size:1.05rem;margin:0}
.sec-h a{font-size:.85rem}
/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:20px;align-items:stretch}
.brief{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:18px 20px;display:grid;gap:10px;align-content:start;min-width:0}
.brief h1{font-size:1.45rem;margin:0;line-height:1.35}
.brief .meta{font-family:var(--f-mono);font-size:.78rem;color:var(--muted)}
.brief ol{margin:4px 0 0;padding-left:1.2em;display:grid;gap:8px}
.brief li{font-size:.92rem}
.brief li strong{display:block}
.mapcard{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:14px;min-width:0;display:grid;gap:6px}
.mapcard svg{width:100%;height:auto;display:block}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:.75rem;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:-1px}
/* stats */
.stats{display:flex;flex-wrap:wrap;gap:24px;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.stats div{display:grid}
.stats b{font-size:1.25rem;font-weight:500}
.stats span{font-size:.7rem;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
/* cards */
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.tcard{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:14px 16px;display:grid;gap:8px;text-decoration:none;color:inherit;min-width:0;align-content:start}
.tcard:hover,.tcard:focus-visible{border-color:var(--accent);outline:none}
.tc-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pfid{font-family:var(--f-mono);font-size:.8rem;color:var(--accent);font-weight:500}
.qchip{font-size:.7rem;padding:2px 8px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.tcard h3{margin:0;font-size:1rem;line-height:1.35}
.tcard h3 small{display:block;font-weight:400;color:var(--muted);font-size:.8rem}
.tcard p{margin:0;font-size:.85rem;color:var(--muted)}
.score{display:flex;align-items:baseline;gap:8px;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.score b{font-size:1.35rem;font-weight:500}
.score span{font-size:.75rem;color:var(--muted)}
.d-up{color:var(--pos)} .d-dn{color:var(--neg)} .d-0{color:var(--muted)}
.strip{display:grid;grid-template-columns:repeat(8,1fr);gap:2px}
.strip i{height:14px;border-radius:2px;display:block;position:relative}
.strip i.chg::after{content:"";position:absolute;inset:-2px;border:1.5px solid var(--ink);border-radius:3px}
.strip-l{display:grid;grid-template-columns:repeat(8,1fr);gap:2px;font-size:.58rem;color:var(--muted);text-align:center;font-family:var(--f-mono)}
.tc-foot{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:.75rem;color:var(--muted);font-family:var(--f-mono)}
.tc-upd{font-size:.8rem;border-top:1px dashed var(--line);padding-top:8px;color:var(--ink)}
/* lists */
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:14px 16px;min-width:0}
.rows{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.rows li{display:grid;gap:2px;font-size:.88rem;border-bottom:1px solid var(--line);padding-bottom:10px}
.rows li:last-child{border-bottom:0;padding-bottom:0}
.rows .r-h{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:baseline;font-family:var(--f-mono);font-size:.78rem}
.rows .r-t{color:var(--muted);font-size:.84rem}
.pill{font-family:var(--f-mono);font-size:.72rem;padding:1px 7px;border-radius:3px;border:1px solid currentColor}
.p-pos{color:var(--pos)} .p-neg{color:var(--neg)} .p-new{color:var(--new)} .p-warn{color:var(--warn);border-style:dashed}
/* signals */
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.filters select,.filters label{font:inherit;font-size:.85rem}
.filters select{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:6px 8px}
.filters .count{margin-left:auto;font-family:var(--f-mono);font-size:.8rem;color:var(--muted)}
.ledger{display:grid;gap:10px}
.sig{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:14px 16px;display:grid;gap:7px;min-width:0;scroll-margin-top:80px}
.sig.hl{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.sig .top-l{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:.75rem;color:var(--muted);font-family:var(--f-mono)}
.str{letter-spacing:2px;color:var(--accent)}
.tier{font-size:.72rem;background:var(--chip);border-radius:3px;padding:1px 7px;font-family:var(--f-body);color:var(--ink)}
.sig h4{margin:0;font-size:.98rem;line-height:1.45}
.sig p{margin:0;font-size:.9rem;max-width:72ch}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:.74rem;background:var(--chip);border-radius:3px;padding:2px 7px;text-decoration:none;color:var(--ink)}
.tag.pf{font-family:var(--f-mono);color:var(--accent)}
.src{font-size:.8rem;color:var(--muted)}
/* wiki */
.wiki{display:grid;grid-template-columns:220px minmax(0,1fr);gap:24px;align-items:start}
.toc{position:sticky;top:calc(env(safe-area-inset-top,0px) + 64px);display:grid;gap:2px;font-size:.88rem}
.toc a{text-decoration:none;color:var(--ink);padding:6px 10px;border-radius:4px;display:flex;gap:8px;align-items:baseline}
.toc a span{font-family:var(--f-mono);font-size:.75rem;color:var(--accent);min-width:42px}
.toc a[aria-current="page"]{background:var(--accent-soft);color:var(--ink);font-weight:500}
.toc .grp{font-family:var(--f-mono);font-size:.7rem;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;padding:12px 10px 4px}
.doc{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:24px 28px;min-width:0}
.doc h1{font-size:1.5rem;margin:0 0 6px;line-height:1.35}
.doc h2{font-size:1.1rem;margin:30px 0 10px;padding-top:14px;border-top:1px solid var(--line)}
.doc h3{font-size:.98rem;margin:18px 0 8px}
.doc p,.doc li{max-width:74ch}
.doc blockquote{margin:10px 0 18px;padding:10px 14px;background:var(--surface2);border-left:3px solid var(--accent);color:var(--ink)}
.doc blockquote p{margin:0}
.doc table{border-collapse:collapse;font-size:.86rem;width:100%;min-width:520px}
.doc th,.doc td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}
.doc th{font-weight:500;color:var(--muted);font-size:.78rem}
.doc td:nth-child(n+2){font-variant-numeric:tabular-nums}
.doc th,.doc td{word-break:keep-all;overflow-wrap:break-word}
.doc th,.doc td{word-break:keep-all;overflow-wrap:break-word}
.tw{overflow-x:auto;margin:8px 0}
.doc code{font-family:var(--f-mono);font-size:.85em;background:var(--chip);padding:1px 4px;border-radius:3px}
.doc ol li,.doc ul li{margin:4px 0}
.wl{font-family:var(--f-mono);font-size:.82em;text-decoration:none;background:var(--accent-soft);padding:0 5px;border-radius:3px;white-space:nowrap}
.doc-head{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;margin-bottom:12px;font-family:var(--f-mono);font-size:.78rem;color:var(--muted)}
.doc-head a{color:var(--accent,inherit);text-decoration:none;font-weight:500}.doc-head a:hover{text-decoration:underline}
/* overview */
.ovdoc{padding:28px 34px}
.ovdoc h1{font-size:1.75rem;letter-spacing:-.015em;margin-bottom:10px}
.ovdoc h1.part{scroll-margin-top:calc(env(safe-area-inset-top,0px) + 70px);margin:44px -34px 8px;padding:22px 34px 20px;background:var(--accent-soft);border-top:3px solid var(--accent);border-bottom:1px solid var(--line);font-size:1.4rem;letter-spacing:-.01em}
.ovdoc h1.part::before{content:"PART";display:block;font-family:var(--f-mono);font-size:.72rem;font-weight:500;letter-spacing:.12em;color:var(--accent);margin-bottom:4px}
.ovdoc h1.part + h2{border-top:0;padding-top:0;margin-top:24px}
.toc a.toc-part{margin-top:10px;font-weight:600;border-top:1px solid var(--line);padding-top:10px}
@media (max-width:760px){.ovdoc h1.part{margin:36px -16px 8px;padding:18px 16px}}
.ovdoc h2{scroll-margin-top:calc(env(safe-area-inset-top,0px) + 70px);font-size:1.25rem}
.ovdoc h3{scroll-margin-top:80px}
.ovdoc > blockquote:first-of-type{font-size:1.02rem}
.ovdoc hr{border:0;border-top:1px solid var(--line);margin:22px 0}
.doc details{border:1px solid var(--line);border-radius:6px;margin:8px 0;background:var(--surface2)}
.doc details > summary{cursor:pointer;padding:10px 14px;list-style:none;display:flex;gap:8px;align-items:baseline}
.doc details > summary::-webkit-details-marker{display:none}
.doc details > summary::before{content:"+";font-family:var(--f-mono);color:var(--accent);width:1em;flex:none}
.doc details[open] > summary::before{content:"−"}
.doc details > *:not(summary){margin-left:14px;margin-right:14px}
.doc details[open]{padding-bottom:6px}
.viz{margin:14px 0}
.stacks{display:grid;gap:10px}
.srow{display:grid;grid-template-columns:170px minmax(0,1fr);gap:12px;align-items:center;background:var(--surface2);border:1px solid var(--line);border-radius:6px;padding:10px 12px}
.slab{display:grid;gap:2px}
.slab b{font-size:.92rem}
.slab span{font-size:.75rem;color:var(--muted)}
.snodes{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.snode{display:grid;gap:1px;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--qc);border-radius:4px;padding:6px 10px;min-width:0}
.snode:hover,.snode:focus-visible{border-color:var(--accent);outline:none}
.snode b{font-size:.84rem;font-weight:500}
.snode small{font-size:.72rem;color:var(--muted)}
.snode .pfid{font-size:.7rem}
.sep{color:var(--muted);font-family:var(--f-mono)}
.mapcard.viz{max-width:560px}
@media (max-width:760px){.ovdoc{padding:20px 16px}.srow{grid-template-columns:minmax(0,1fr)}}
/* drawer */
.drawer{position:fixed;right:0;top:0;bottom:0;width:min(440px,100%);background:var(--surface);border-left:1px solid var(--line);box-shadow:-8px 0 24px rgba(0,0,0,.12);padding:calc(env(safe-area-inset-top,0px) + 18px) 18px calc(env(safe-area-inset-bottom,0px) + 18px);overflow:auto;z-index:20;display:grid;gap:10px;align-content:start}
.drawer .close{justify-self:end;background:none;border:1px solid var(--line);color:var(--ink);border-radius:4px;padding:4px 10px;font:inherit;font-size:.85rem;cursor:pointer}
.empty{color:var(--muted);padding:24px;text-align:center;border:1px dashed var(--line);border-radius:6px}
@media (max-width:980px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.hero{grid-template-columns:minmax(0,1fr)}}
@media (max-width:760px){.two{grid-template-columns:minmax(0,1fr)}.wiki{grid-template-columns:minmax(0,1fr)}.toc{position:static;grid-template-columns:repeat(2,minmax(0,1fr))}.toc .grp{grid-column:1/-1}.doc{padding:18px 16px}}
@media (max-width:560px){.cards{grid-template-columns:minmax(0,1fr)}nav{margin-left:0}}
@media (prefers-reduced-motion:no-preference){.tcard,.toc a{transition:background .15s,border-color .15s}}
/* chat */
.chat-fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 16px);z-index:19;display:flex;align-items:center;gap:8px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:9px 16px 9px 11px;font:inherit;font-size:.9rem;font-weight:500;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.16)}
.chat-fab:hover{border-color:#a855f7}
.ai-ico{display:block;flex:none;object-fit:contain}
.chat-fab:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.chat{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 16px);z-index:19;width:min(420px,calc(100vw - 32px));height:min(640px,calc(100dvh - 96px));background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 32px rgba(0,0,0,.2);display:grid;grid-template-rows:auto minmax(0,1fr) auto;overflow:hidden}
.chat-h{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--surface2)}
.chat-h b{font-size:.92rem;font-weight:500;flex:1}
.chat-h button{background:none;border:1px solid var(--line);color:var(--ink);border-radius:4px;padding:3px 9px;font:inherit;font-size:.78rem;cursor:pointer}
.chat-log{overflow:auto;padding:14px 12px;display:grid;gap:12px;align-content:start}
.chat-note{color:var(--muted);font-size:.82rem;line-height:1.6}
.msg{max-width:100%;font-size:.88rem;line-height:1.65;word-break:keep-all;overflow-wrap:break-word}
.msg.u{justify-self:end;background:var(--accent-soft);padding:8px 11px;border-radius:10px 10px 2px 10px;max-width:88%;white-space:pre-wrap}
.msg.a{background:var(--surface2);border:1px solid var(--line);padding:10px 12px;border-radius:10px 10px 10px 2px}
.msg.a p{margin:.3em 0}.msg.a ul,.msg.a ol{margin:.3em 0;padding-left:1.3em}.msg.a h1,.msg.a h2,.msg.a h3{font-size:.95rem;margin:.6em 0 .3em}
.msg.a table{border-collapse:collapse;font-size:.8rem;display:block;overflow-x:auto}.msg.a th,.msg.a td{border-bottom:1px solid var(--line);padding:4px 6px;text-align:left;vertical-align:top;word-break:keep-all}
.msg .st{color:var(--muted);font-size:.8rem;font-family:var(--f-mono)}
.msg .err{color:var(--neg);font-size:.82rem;margin-top:6px}
.chat-f{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;padding:10px 12px;border-top:1px solid var(--line)}
.chat-f textarea{resize:none;font:inherit;font-size:.88rem;line-height:1.5;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);min-height:40px;max-height:140px}
.chat-f textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
.chat-f button{background:var(--accent);color:var(--accent-ink);border:0;border-radius:6px;padding:0 14px;font:inherit;font-size:.86rem;font-weight:500;cursor:pointer}
.chat-f button.stop{background:var(--neg)}
.chat-f button:disabled{opacity:.5;cursor:default}
@media (max-width:560px){.chat{height:calc(100dvh - 32px)}}
.chat{position:fixed}
.chat-ov{position:absolute;left:0;right:0;top:49px;bottom:0;background:var(--surface);overflow:auto;padding:14px 14px 18px;display:grid;gap:10px;align-content:start;z-index:2}
.chat-ov h5{margin:0;font-size:.92rem;font-weight:600}
.chat-ov label{display:grid;gap:4px;font-size:.8rem;color:var(--muted)}
.chat-ov input[type=url],.chat-ov textarea{font:inherit;font-size:.86rem;padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink)}
.chat-ov textarea{min-height:84px;resize:vertical}
.chat-ov .pfs{display:flex;flex-wrap:wrap;gap:6px}
.chat-ov .pfs label{display:flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:999px;padding:3px 9px;color:var(--ink);font-family:var(--f-mono);font-size:.74rem;cursor:pointer}
.chat-ov .pfs input{margin:0}
.chat-ov .row{display:flex;gap:8px;justify-content:flex-end}
.chat-ov .row button{font:inherit;font-size:.84rem;border-radius:6px;padding:6px 14px;cursor:pointer;border:1px solid var(--line);background:none;color:var(--ink)}
.chat-ov .row button.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chat-ov .hint{font-size:.78rem;color:var(--muted);line-height:1.55}
.prop-item{border:1px solid var(--line);border-radius:8px;padding:9px 11px;display:grid;gap:4px;font-size:.82rem}
.prop-item .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-family:var(--f-mono);font-size:.72rem;color:var(--muted)}

.pst{border-radius:3px;padding:0 6px;font-family:var(--f-mono);font-size:.72rem}

<script>
const DATA = /*__DATA__*/null;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const QC = {"Strategic Core":"var(--q-core)","Moonshots":"var(--q-moon)","Quick Wins":"var(--q-quick)","Hedge & Defense":"var(--q-hedge)"};
const DIR = {"+":["강화","p-pos"],"-":["약화","p-neg"],"new":["신규","p-new"]};
const TIERS = ["컨설팅","투자은행","산업리서치","정부·공공","글로벌기업","언론"];
const f1 = x => Number(x).toFixed(1);
const dlt = d => Math.abs(d)<1e-9 ? '<span class="d-0">±0.0</span>' : (d>0?`<span class="d-up">+${f1(d)}</span>`:`<span class="d-dn">−${f1(-d)}</span>`);
const PF_IDS = DATA ? Object.keys(DATA.thesis).sort() : [];
const APPX = DATA ? Object.keys(DATA.wiki).filter(k=>k.startsWith("Appendix-")).sort().map(k=>[k,(DATA.wiki[k].match(/^# (.+)$/m)||[,k])[1]]) : [];
const IDX_SLUG = DATA ? Object.fromEntries(DATA.indices.map((n,i)=>[n,"idx-"+i])) : {};
const SLUG_IDX = Object.fromEntries(Object.entries(IDX_SLUG).map(([k,v])=>[v,k]));

function md(src){
  let s = src.replace(/^---\n[\s\S]*?\n---\n?/, "").replace(/<!-- \/?AUTO:[A-Z]+ -->/g, "");
  s = s.replace(/(?<!~)~(?!~)/g, "\\~");  // 단일 물결표는 범위 표기: 취소선으로 렌더링되지 않게
  s = s.replace(/\[\[([^\]]+)\]\]/g, (m, k) => {
    let label = null;
    const pi = k.search(/\\?\|/);
    if (pi >= 0) { label = k.slice(pi).replace(/^\\?\|/, "").trim(); k = k.slice(0, pi); }
    k = k.trim();
    if (label && !k.startsWith("SIG-")) return `<a class="wl" href="${k==="Portfolio"?"#overview":"#wiki-"+esc(k)}">${esc(label)}</a>`;
    if (k.startsWith("SIG-")) return `<a class="wl" href="#signals" data-sig="${esc(k)}">${esc(k.replace("SIG-",""))}</a>`;
    if (IDX_SLUG[k]) return `<a class="wl" href="#wiki-${IDX_SLUG[k]}">${esc(k)}</a>`;
    if (k === "Portfolio") return `<a class="wl" href="#overview">개요</a>`;
    return `<a class="wl" href="#wiki-${esc(k)}">${esc(k)}</a>`;
  });
  let html;
  if (window.marked && marked.parse) html = marked.parse(s, {gfm:true, breaks:false});
  else html = '<pre style="white-space:pre-wrap;font-family:inherit">'+esc(s)+"</pre>";
  html = html.replace(/<table>/g,'<div class="tw"><table>').replace(/<\/table>/g,'</table></div>');
  html = html.replace(/<!-- VIZ:MAP -->/g, ()=>`<figure class="mapcard viz">${mapSVG()}<figcaption class="legend">${Object.entries(QC).map(([n,c])=>`<span><i style="background:${c}"></i>${n}</span>`).join("")}<span>· 점선 원은 9월 기준선 위치</span></figcaption></figure>`);
  html = html.replace(/<!-- VIZ:STACKS -->/g, ()=>stacksHTML());
  return html;
}
function stacksHTML(){
  const rows=[["Physical AI","로봇과 공간의 운영",["PF-02","PF-03","PF-06"],"→"],
              ["Household","가정 내 의사결정",["PF-07","PF-01","PF-08","PF-09"],"→"],
              ["Distribution & Infra","유통 경로와 자원",["PF-04","PF-05"],"·"]];
  return `<div class="stacks viz">${rows.map(([n,sub,ids,sep])=>`<div class="srow"><div class="slab"><b>${esc(n)}</b><span>${esc(sub)}</span></div><div class="snodes">${ids.map((id,i)=>{
    const t=DATA.thesis[id], k=t.calc.current;
    return `${i?`<span class="sep" aria-hidden="true">${sep}</span>`:""}<a class="snode" href="#wiki-${id}" style="--qc:${QC[k.quadrant]}"><span class="pfid">${id}</span><b>${esc(t.name)}</b><small>${esc(t.name_ko)} · ${f1(k.total)}점</small></a>`;}).join("")}</div></div>`).join("")}</div>`;
}

/* ---------- home ---------- */
function digestBullets(d){
  const m = d.markdown.match(/## 이번 회차 핵심 3가지\n([\s\S]*?)(\n## |$)/);
  if(!m) return [];
  return m[1].trim().split(/\n(?=\d+\.)/).map(x=>x.replace(/^\d+\.\s*/,""));
}
function mapSVG(){
  const W=420,H=330,P={l:44,r:14,t:16,b:40}, lo=4, hi=10.5;
  const sx=v=>P.l+(v-lo)/(hi-lo)*(W-P.l-P.r), sy=v=>H-P.b-(v-lo)/(hi-lo)*(H-P.t-P.b);
  const qr=DATA.quadrant_rule; let g="";
  g+=`<rect x="${sx(qr.x_threshold)}" y="${sy(hi)}" width="${sx(hi)-sx(qr.x_threshold)}" height="${sy(qr.y_threshold)-sy(hi)}" fill="var(--accent-soft)"/>`;
  for(let v=4; v<=10; v+=2){
    g+=`<line x1="${sx(v)}" x2="${sx(v)}" y1="${sy(lo)}" y2="${sy(hi)}" stroke="var(--line)"/>`;
    g+=`<line y1="${sy(v)}" y2="${sy(v)}" x1="${sx(lo)}" x2="${sx(hi)}" stroke="var(--line)"/>`;
    g+=`<text x="${sx(v)}" y="${H-P.b+14}" font-size="10" text-anchor="middle" fill="var(--muted)" font-family="IBM Plex Mono,monospace">${v}</text>`;
    g+=`<text x="${P.l-6}" y="${sy(v)+3}" font-size="10" text-anchor="end" fill="var(--muted)" font-family="IBM Plex Mono,monospace">${v}</text>`;
  }
  g+=`<line x1="${sx(qr.x_threshold)}" x2="${sx(qr.x_threshold)}" y1="${sy(lo)}" y2="${sy(hi)}" stroke="var(--muted)" stroke-dasharray="3 3"/>`;
  g+=`<line y1="${sy(qr.y_threshold)}" y2="${sy(qr.y_threshold)}" x1="${sx(lo)}" x2="${sx(hi)}" stroke="var(--muted)" stroke-dasharray="3 3"/>`;
  const ql=[["Strategic Core",hi-0.1,hi-0.15,"end"],["Moonshots",lo+0.1,hi-0.15,"start"],["Quick Wins",hi-0.1,lo+0.25,"end"],["Hedge & Defense",lo+0.1,lo+0.25,"start"]];
  ql.forEach(([n,x,y,a])=>g+=`<text x="${sx(x)}" y="${sy(y)+4}" font-size="10" text-anchor="${a}" fill="${QC[n]}" font-weight="500">${n}</text>`);
  // collision offsets for identical points
  const seen={};
  PF_IDS.forEach(id=>{
    const c=DATA.thesis[id].calc, b=c.baseline, k=c.current;
    const key=k.x+"_"+k.y; const n=(seen[key]=(seen[key]||0)+1)-1;
    const ox=n*16, cx=sx(k.x)+ox, cy=sy(k.y);
    if(b.x!==k.x||b.y!==k.y){
      g+=`<circle cx="${sx(b.x)+ox}" cy="${sy(b.y)}" r="9" fill="none" stroke="var(--muted)" stroke-dasharray="2 2"/>`;
      g+=`<line x1="${sx(b.x)+ox}" y1="${sy(b.y)}" x2="${cx}" y2="${cy}" stroke="var(--muted)"/>`;
    }
    g+=`<a href="#wiki-${id}"><circle cx="${cx}" cy="${cy}" r="11" fill="${QC[k.quadrant]}"/><text x="${cx}" y="${cy+3.5}" font-size="9.5" text-anchor="middle" fill="var(--surface)" font-family="IBM Plex Mono,monospace" font-weight="500">${id.slice(3)}</text></a>`;
  });
  g+=`<text x="${(W+P.l)/2}" y="${H-6}" font-size="10.5" text-anchor="middle" fill="var(--muted)">X · LG 독점우위 + 실행 용이성 →</text>`;

function chatAdd(cls,html){ const d=document.createElement("div"); d.className="msg "+cls; d.innerHTML=html; $("chat-log").append(d); $("chat-log").scrollTop=$("chat-log").scrollHeight; return d; }
function chatSetBusy(b){ CHAT.busy=b; const btn=$("chat-send"); btn.textContent=b?"중지":"보내기"; btn.classList.toggle("stop",b); $("chat-in").disabled=b; }
function chatIntro(){ $("chat-log").innerHTML=""; chatAdd("a chat-note-wrap",`<div class="chat-note">포털의 9개 기회 문서, 신호 ${DATA.signals.length}건, 점수와 의사결정 사항을 근거로 답합니다. 포털에 없는 내용은 일반 지식으로 보충하고 "(일반 지식)"으로 표시합니다. 답변은 보는 사람의 Claude 사용량으로 처리되며, 처음 질문할 때 사용 동의를 묻습니다.</div>`); }
const CHAT_ERR = {rate_limited:"요청이 많아 잠시 멈췄습니다. 조금 뒤 다시 질문해 주세요.", session_expired:"Claude 로그인이 만료되었습니다. 다시 로그인한 뒤 질문해 주세요.", refused:"이 질문에는 답할 수 없습니다. 질문을 바꿔 주세요.", empty_completion:"답변이 비어 있습니다. 질문을 조금 바꿔 다시 시도해 주세요.", prompt_too_large:"대화가 너무 길어졌습니다. 새 대화로 시작해 주세요.", upstream_error:"연결이 끊겼습니다. 다시 보내 주세요."};
const CHAT_OFF = ["not_granted","sampling_disabled","not_declared","capability_disabled","capability_removed"];
async function chatSend(q){
  CHAT.turns.push({role:"user",content:q});
  if(CHAT.turns.length>16) CHAT.turns=CHAT.turns.slice(-16);
  while(CHAT.turns.length && CHAT.turns[0].role!=="user") CHAT.turns.shift();
  chatAdd("u",esc(q));
  const bub=chatAdd("a",`<div class="st">생각 중 …</div>`); chatStatusEl=bub.querySelector(".st");
  CHAT.ctl=new AbortController(); chatSetBusy(true);
  const opts={cache:false, signal:CHAT.ctl.signal, onText:({text})=>{ chatStatusEl=null; bub.innerHTML=md(text); $("chat-log").scrollTop=$("chat-log").scrollHeight; }};
  if(CHAT.tools) opts.tools=CHAT_TOOLS;
  try{
    const {text,truncated}=await CHAT.sample([{role:"user",content:chatContext()}, ...CHAT.turns], opts);
    bub.innerHTML=md(text)+(truncated?`<div class="err">답변이 길이 제한으로 잘렸습니다. 범위를 좁혀 다시 질문해 주세요.</div>`:"");
    if(PROP.on) propActionOn(bub, q, text);
    CHAT.turns.push({role:"assistant",content:text});
  }catch(e){
    CHAT.turns.pop();
    const kept=e&&e.text&&e.code!=="refused"?md(e.text):"";
    if(e&&e.code==="cancelled"){ bub.innerHTML=kept||`<div class="chat-note">중지했습니다.</div>`; }
    else if(e&&CHAT_OFF.includes(e.code)){ bub.innerHTML=`<div class="err">이 화면에서는 Claude 질의 기능을 사용할 수 없습니다.</div>`; $("chat-in").disabled=true; $("chat-send").disabled=true; chatStatusEl=null; CHAT.ctl=null; CHAT.busy=false; return; }
    else if(e&&e.code==="tools_unavailable"){ CHAT.tools=false; bub.innerHTML=`<div class="err">이 화면에서는 문서 조회 기능을 쓸 수 없어 요약 정보만으로 답합니다. 질문을 다시 보내 주세요.</div>`; }
    else bub.innerHTML=kept+`<div class="err">${esc(CHAT_ERR[e&&e.code]||CHAT_ERR.upstream_error)}</div>`;
  }finally{ chatStatusEl=null; CHAT.ctl=null; if(!$("chat-send").disabled) chatSetBusy(false); $("chat-in").focus(); }
}
function chatOpen(open){ $("chat").hidden=!open; $("chat-fab").hidden=open; $("chat-fab").setAttribute("aria-expanded",String(open)); if(open){ if(!$("chat-log").children.length) chatIntro(); $("chat-in").focus(); } else $("chat-fab").focus(); }
async function chatInit(){
  if(!DATA || !window.claude || typeof window.claude.use!=="function") return;
  let sample=null; try{ sample=await window.claude.use("sample"); }catch(_){ sample=null; }
  if(!sample) return;
  CHAT.sample=sample;
  try{ const lim=await sample.limits(); CHAT.tools=!!(lim&&lim.tools&&lim.tools.maxCount>=CHAT_TOOLS.length); }catch(_){ CHAT.tools=false; }
  $("chat-fab").hidden=false;
  $("chat-fab").onclick=()=>chatOpen(true);
  $("chat-close").onclick=()=>chatOpen(false);
  $("chat-new").onclick=()=>{ if(CHAT.ctl) CHAT.ctl.abort(); CHAT.turns=[]; propClose(); chatIntro(); $("chat-in").focus(); };
  const ta=$("chat-in");
  ta.addEventListener("input",()=>{ ta.style.height="auto"; ta.style.height=Math.min(ta.scrollHeight,140)+"px"; });
  ta.addEventListener("keydown",e=>{ if(e.key==="Enter"&&!e.shiftKey&&!e.isComposing){ e.preventDefault(); $("chat-form").requestSubmit(); } });
  $("chat-form").addEventListener("submit",e=>{ e.preventDefault(); if(CHAT.busy){ CHAT.ctl&&CHAT.ctl.abort(); return; } const q=ta.value.trim(); if(!q) return; ta.value=""; ta.style.height="auto"; chatSend(q); });
}
chatInit();

/* ---------- 소스 제안 (소유자 전용) ---------- */
const PROP = { on:false, db:null, list:[], unsub:null };
const PST = {pending:"대기",accepted:"채택",review:"검토 대기",rejected:"탈락"};
const firstUrl = t => (String(t||"").match(/https?:\/\/[^\s)\]>"'`]+/)||[""])[0].replace(/[.,;]+$/,"");
function propActionOn(bub, q, a){
  const d=document.createElement("div"); d.className="act";
  const b=document.createElement("button"); b.type="button"; b.textContent="소스로 제안";
  b.onclick=()=>propForm({url:firstUrl(q)||firstUrl(a), note:q, pfs:[...new Set((a.match(/PF-0[1-9]/g)||[]))]});
  d.append(b); bub.append(d);
}
function propClose(){ $("chat-ov").hidden=true; $("chat-ov").innerHTML=""; }
function propForm(pre={}){
  const ov=$("chat-ov"); const pfs=Object.keys(DATA.thesis).sort();
  ov.innerHTML=`<h5>소스 제안</h5>
    <div class="hint">원문 링크가 있는 자료만 받습니다. 제안은 매주 수요일 정기 회차에서 원문 확인과 품질 기준을 거쳐 신호로 반영되거나 검토 대기·탈락으로 처리됩니다.</div>
    <label>원문 링크<input type="url" id="pp-url" placeholder="https://" required></label>
    <div><div class="hint" style="margin-bottom:4px">관련 기회 (선택)</div><div class="pfs">${pfs.map(p=>`<label><input type="checkbox" value="${p}">${p}</label>`).join("")}</div></div>
    <label>메모 (어떤 점이 중요한지)<textarea id="pp-note"></textarea></label>
    <div class="err" id="pp-err" hidden></div>
    <div class="row"><button type="button" id="pp-cancel">취소</button><button type="button" class="pri" id="pp-save">제안 저장</button></div>`;
  $("pp-url").value=pre.url||""; $("pp-note").value=(pre.note||"").slice(0,1000);
  ov.querySelectorAll(".pfs input").forEach(i=>i.checked=(pre.pfs||[]).includes(i.value));
  ov.hidden=false; $("pp-url").focus();
  $("pp-cancel").onclick=propClose;
  $("pp-save").onclick=async()=>{
    const url=$("pp-url").value.trim(), err=$("pp-err");
    if(!/^https?:\/\/\S+\.\S+/.test(url)){ err.hidden=false; err.textContent="http 또는 https로 시작하는 원문 링크를 넣어 주세요."; return; }
    if(PROP.list.some(p=>p.url===url) || DATA.signals.some(s=>s.url===url)){ err.hidden=false; err.textContent="이미 제안되었거나 신호로 반영된 링크입니다."; return; }
    $("pp-save").disabled=true;
    try{
      await PROP.db.collection("proposals").add({url, note:$("pp-note").value.trim(), pf:[...ov.querySelectorAll(".pfs input:checked")].map(i=>i.value), status:"pending", created_at:new Date().toISOString(), source:"portal-chat"});
      propList("제안을 저장했습니다. 다음 정기 회차에서 처리됩니다.");
    }catch(e){ $("pp-save").disabled=false; err.hidden=false; err.textContent=e&&e.code==="quota_exceeded"?"저장 공간이 가득 찼습니다. 처리된 제안을 정리해 주세요.":"저장하지 못했습니다. 잠시 뒤 다시 시도해 주세요."; }
  };
}
function propList(msg){
  const ov=$("chat-ov");
  const items=PROP.list.map(p=>`<div class="prop-item"><div class="meta"><span class="pst ${esc(p.status)}">${esc(PST[p.status]||p.status)}</span><span>${esc((p.created_at||"").slice(0,10))}</span>${(p.pf||[]).map(x=>`<span>${esc(x)}</span>`).join("")}${p.signal_id?`<a class="wl" href="#signals" data-sig="${esc(p.signal_id)}">${esc(String(p.signal_id).replace("SIG-",""))}</a>`:""}</div><a class="u" href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.url)}</a>${p.note?`<div>${esc(p.note)}</div>`:""}${p.result_note?`<div class="hint">처리 결과: ${esc(p.result_note)}</div>`:""}</div>`).join("");
  ov.innerHTML=`<h5>제안 목록</h5>${msg?`<div class="hint">${esc(msg)}</div>`:""}<div class="row" style="justify-content:flex-start"><button type="button" class="pri" id="pp-new">새 제안</button><button type="button" id="pp-back">대화로 돌아가기</button></div>${items||'<div class="hint">아직 제안이 없습니다.</div>'}`;
  ov.hidden=false; $("pp-new").onclick=()=>propForm(); $("pp-back").onclick=propClose;
}
async function propInit(){
  if(!window.claude || typeof window.claude.use!=="function") return;
  let user=null, db=null;
  try{ user=await window.claude.use("user"); }catch(_){}
  if(!user) return;
  let owner=false; try{ owner=await user.isOwner(); }catch(_){}
  if(!owner) return;
  try{ db=await window.claude.use("db"); }catch(_){}
  if(!db) return;
  PROP.db=db; PROP.on=true;
  const btn=$("chat-props"); btn.hidden=false;
  btn.onclick=()=>{ if(!$("chat-ov").hidden) propClose(); else propList(); };
  PROP.unsub=db.collection("proposals").orderBy("created_at","desc").limit(100).onSnapshot(snap=>{
    PROP.list=snap.docs.map(d=>({id:d.id,...d.data()}));
    const n=PROP.list.filter(p=>p.status==="pending").length;
    btn.textContent=n?`제안 목록 · 대기 ${n}`:"제안 목록";
    if(!$("chat-ov").hidden && $("chat-ov").querySelector("#pp-new")) propList();
  }, ()=>{ btn.hidden=true; PROP.on=false; });
}
propInit();
</script>
