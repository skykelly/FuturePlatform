:root{
  --bg:#f2f3ef; --surface:#ffffff; --surface2:#f8f9f6; --ink:#1b231f; --muted:#5d6a63; --line:#d8ddd6;
  --accent:#1f6f5c; --accent-soft:#e0eee8; --accent-ink:#ffffff;
  --pos:#2f7d4f; --neg:#b4472f; --new:#7a5a12; --warn:#9a6b10; --chip:#ecefea;
  --q-core:#1f6f5c; --q-moon:#3b5b8c; --q-quick:#a07514; --q-hedge:#7d6a63;
  --h0:#eef1ec; --h1:#d6e6de; --h2:#a9cfbd; --h3:#6fae93; --h4:#2f7d63;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111513; --surface:#191f1c; --surface2:#1e2521; --ink:#e3e9e5; --muted:#98a59e; --line:#2b3430;
  --accent:#5cc2a3; --accent-soft:#1c2f28; --accent-ink:#0f1a16;
  --pos:#6cc48f; --neg:#e58a72; --new:#d8b25a; --warn:#d8b25a; --chip:#232b27;
  --q-core:#5cc2a3; --q-moon:#86a6d8; --q-quick:#d8b25a; --q-hedge:#b3a39b;
  --h0:#1f2723; --h1:#20382f; --h2:#2b5545; --h3:#3f8268; --h4:#5cc2a3; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#111513; --surface:#191f1c; --surface2:#1e2521; --ink:#e3e9e5; --muted:#98a59e; --line:#2b3430;
  --accent:#5cc2a3; --accent-soft:#1c2f28; --accent-ink:#0f1a16;
  --pos:#6cc48f; --neg:#e58a72; --new:#d8b25a; --warn:#d8b25a; --chip:#232b27;
  --q-core:#5cc2a3; --q-moon:#86a6d8; --q-quick:#d8b25a; --q-hedge:#b3a39b;
  --h0:#1f2723; --h1:#20382f; --h2:#2b5545; --h3:#3f8268; --h4:#5cc2a3; color-scheme:dark }
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6}
a{color:var(--accent)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:10px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center}
.brand{font-weight:700;font-size:1.05rem;letter-spacing:-.01em;display:flex;align-items:baseline;gap:8px}
.brand small{font-family:var(--f-mono);font-weight:400;font-size:.72rem;color:var(--muted)}
nav{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
nav a{text-decoration:none;color:var(--muted);font-size:.88rem;padding:6px 10px;border-radius:4px}
nav a[aria-current="page"]{color:var(--accent-ink);background:var(--accent)}
nav a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:22px 64px}
.view{display:grid;gap:30px}
h1,h2,h3{text-wrap:balance}
.eyebrow{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:0 0 12px}
.sec-h h2{font-size:1.05rem;margin:0}
.sec-h a{font-size:.85rem}
/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:20px;align-items:stretch}
.brief{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:18px 20px;display:grid;gap:10px;align-content:start;min-width:0}
.brief h1{font-size:1.45rem;margin:0;line-height:1.35}
.brief .meta{font-family:var(--f-mono);font-size:.78rem;color:var(--muted)}
.brief ol{margin:4px 0 0;padding-left:1.2em;display:grid;gap:8px}
.brief li{font-size:.92rem}
.brief li strong{display:block}
.mapcard{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:14px;min-width:0;display:grid;gap:6px}
.mapcard svg{width:100%;height:auto;display:block}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:.75rem;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:-1px}
/* stats */
.stats{display:flex;flex-wrap:wrap;gap:24px;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.stats div{display:grid}
.stats b{font-size:1.25rem;font-weight:500}
.stats span{font-size:.7rem;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
/* cards */
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.tcard{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:14px 16px;display:grid;gap:8px;text-decoration:none;color:inherit;min-width:0;align-content:start}
.tcard:hover,.tcard:focus-visible{border-color:var(--accent);outline:none}
.tc-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pfid{font-family:var(--f-mono);font-size:.8rem;color:var(--accent);font-weight:500}
.qchip{font-size:.7rem;padding:2px 8px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.tcard h3{margin:0;font-size:1rem;line-height:1.35}
.tcard h3 small{display:block;font-weight:400;color:var(--muted);font-size:.8rem}
.tcard p{margin:0;font-size:.85rem;color:var(--muted)}
.score{display:flex;align-items:baseline;gap:8px;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.score b{font-size:1.35rem;font-weight:500}
.score span{font-size:.75rem;color:var(--muted)}
.d-up{color:var(--pos)} .d-dn{color:var(--neg)} .d-0{color:var(--muted)}
.strip{display:grid;grid-template-columns:repeat(8,1fr);gap:2px}
.strip i{height:14px;border-radius:2px;display:block;position:relative}
.strip i.chg::after{content:"";position:absolute;inset:-2px;border:1.5px solid var(--ink);border-radius:3px}
.strip-l{display:grid;grid-template-columns:repeat(8,1fr);gap:2px;font-size:.58rem;color:var(--muted);text-align:center;font-family:var(--f-mono)}
.tc-foot{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:.75rem;color:var(--muted);font-family:var(--f-mono)}
.tc-upd{font-size:.8rem;border-top:1px dashed var(--line);padding-top:8px;color:var(--ink)}
/* lists */
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:14px 16px;min-width:0}
.rows{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.rows li{display:grid;gap:2px;font-size:.88rem;border-bottom:1px solid var(--line);padding-bottom:10px}
.rows li:last-child{border-bottom:0;padding-bottom:0}
.rows .r-h{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:baseline;font-family:var(--f-mono);font-size:.78rem}
.rows .r-t{color:var(--muted);font-size:.84rem}
.pill{font-family:var(--f-mono);font-size:.72rem;padding:1px 7px;border-radius:3px;border:1px solid currentColor}
.p-pos{color:var(--pos)} .p-neg{color:var(--neg)} .p-new{color:var(--new)} .p-warn{color:var(--warn);border-style:dashed}
/* signals */
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.filters select,.filters label{font:inherit;font-size:.85rem}
.filters select{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:6px 8px}
.filters .count{margin-left:auto;font-family:var(--f-mono);font-size:.8rem;color:var(--muted)}
.ledger{display:grid;gap:10px}
.sig{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:14px 16px;display:grid;gap:7px;min-width:0;scroll-margin-top:80px}
.sig.hl{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.sig .top-l{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:.75rem;color:var(--muted);font-family:var(--f-mono)}
.str{letter-spacing:2px;color:var(--accent)}
.tier{font-size:.72rem;background:var(--chip);border-radius:3px;padding:1px 7px;font-family:var(--f-body);color:var(--ink)}
.sig h4{margin:0;font-size:.98rem;line-height:1.45}
.sig p{margin:0;font-size:.9rem;max-width:72ch}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:.74rem;background:var(--chip);border-radius:3px;padding:2px 7px;text-decoration:none;color:var(--ink)}
.tag.pf{font-family:var(--f-mono);color:var(--accent)}
.src{font-size:.8rem;color:var(--muted)}
/* wiki */
.wiki{display:grid;grid-template-columns:220px minmax(0,1fr);gap:24px;align-items:start}
.toc{position:sticky;top:calc(env(safe-area-inset-top,0px) + 64px);display:grid;gap:2px;font-size:.88rem}
.toc a{text-decoration:none;color:var(--ink);padding:6px 10px;border-radius:4px;display:flex;gap:8px;align-items:baseline}
.toc a span{font-family:var(--f-mono);font-size:.75rem;color:var(--accent);min-width:42px}
.toc a[aria-current="page"]{background:var(--accent-soft);color:var(--ink);font-weight:500}
.toc .grp{font-family:var(--f-mono);font-size:.7rem;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;padding:12px 10px 4px}
.doc{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:24px 28px;min-width:0}
.doc h1{font-size:1.5rem;margin:0 0 6px;line-height:1.35}
.doc h2{font-size:1.1rem;margin:30px 0 10px;padding-top:14px;border-top:1px solid var(--line)}
.doc h3{font-size:.98rem;margin:18px 0 8px}
.doc p,.doc li{max-width:74ch}
.doc blockquote{margin:10px 0 18px;padding:10px 14px;background:var(--surface2);border-left:3px solid var(--accent);color:var(--ink)}
.doc blockquote p{margin:0}
.doc table{border-collapse:collapse;font-size:.86rem;width:100%;min-width:520px}
.doc th,.doc td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}
.doc th{font-weight:500;color:var(--muted);font-size:.78rem}
.doc td:nth-child(n+2){font-variant-numeric:tabular-nums}
.doc th,.doc td{word-break:keep-all;overflow-wrap:anywhere}
.tw{overflow-x:auto;margin:8px 0}
.doc code{font-family:var(--f-mono);font-size:.85em;background:var(--chip);padding:1px 4px;border-radius:3px}
.doc ol li,.doc ul li{margin:4px 0}
.wl{font-family:var(--f-mono);font-size:.82em;text-decoration:none;background:var(--accent-soft);padding:0 5px;border-radius:3px;white-space:nowrap}
.doc-head{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;margin-bottom:12px;font-family:var(--f-mono);font-size:.78rem;color:var(--muted)}
.doc-head a{color:var(--accent,inherit);text-decoration:none;font-weight:500}.doc-head a:hover{text-decoration:underline}
/* overview */
.ovdoc{padding:28px 34px}
.ovdoc h1{font-size:1.75rem;letter-spacing:-.015em;margin-bottom:10px}
.ovdoc h2{scroll-margin-top:calc(env(safe-area-inset-top,0px) + 70px);font-size:1.25rem}
.ovdoc h3{scroll-margin-top:80px}
.ovdoc > blockquote:first-of-type{font-size:1.02rem}
.ovdoc hr{border:0;border-top:1px solid var(--line);margin:22px 0}
.doc details{border:1px solid var(--line);border-radius:6px;margin:8px 0;background:var(--surface2)}
.doc details > summary{cursor:pointer;padding:10px 14px;list-style:none;display:flex;gap:8px;align-items:baseline}
.doc details > summary::-webkit-details-marker{display:none}
.doc details > summary::before{content:"+";font-family:var(--f-mono);color:var(--accent);width:1em;flex:none}
.doc details[open] > summary::before{content:"−"}
.doc details > *:not(summary){margin-left:14px;margin-right:14px}
.doc details[open]{padding-bottom:6px}
.viz{margin:14px 0}
.stacks{display:grid;gap:10px}
.srow{display:grid;grid-template-columns:170px minmax(0,1fr);gap:12px;align-items:center;background:var(--surface2);border:1px solid var(--line);border-radius:6px;padding:10px 12px}
.slab{display:grid;gap:2px}
.slab b{font-size:.92rem}
.slab span{font-size:.75rem;color:var(--muted)}
.snodes{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.snode{display:grid;gap:1px;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--qc);border-radius:4px;padding:6px 10px;min-width:0}
.snode:hover,.snode:focus-visible{border-color:var(--accent);outline:none}
.snode b{font-size:.84rem;font-weight:500}
.snode small{font-size:.72rem;color:var(--muted)}
.snode .pfid{font-size:.7rem}
.sep{color:var(--muted);font-family:var(--f-mono)}
.mapcard.viz{max-width:560px}
@media (max-width:760px){.ovdoc{padding:20px 16px}.srow{grid-template-columns:minmax(0,1fr)}}
/* drawer */
.drawer{position:fixed;right:0;top:0;bottom:0;width:min(440px,100%);background:var(--surface);border-left:1px solid var(--line);box-shadow:-8px 0 24px rgba(0,0,0,.12);padding:calc(env(safe-area-inset-top,0px) + 18px) 18px calc(env(safe-area-inset-bottom,0px) + 18px);overflow:auto;z-index:20;display:grid;gap:10px;align-content:start}
.drawer .close{justify-self:end;background:none;border:1px solid var(--line);color:var(--ink);border-radius:4px;padding:4px 10px;font:inherit;font-size:.85rem;cursor:pointer}
.empty{color:var(--muted);padding:24px;text-align:center;border:1px dashed var(--line);border-radius:6px}
@media (max-width:980px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.hero{grid-template-columns:minmax(0,1fr)}}
@media (max-width:760px){.two{grid-template-columns:minmax(0,1fr)}.wiki{grid-template-columns:minmax(0,1fr)}.toc{position:static;grid-template-columns:repeat(2,minmax(0,1fr))}.toc .grp{grid-column:1/-1}.doc{padding:18px 16px}}
@media (max-width:560px){.cards{grid-template-columns:minmax(0,1fr)}nav{margin-left:0}}
@media (prefers-reduced-motion:no-preference){.tcard,.toc a{transition:background .15s,border-color .15s}}
</style>

et-intelligence-report-2026-60-kpis-and-forecasts-to-2030-market-to-reach-us-2-63-billion-as-trade-in-and-refurbishment-scale.html", "type": "리서치", "tier": "산업리서치", "direction": "+", "strength": 1, "pf": ["PF-09"], "index": [], "criteria": ["tam"], "japan": false, "status": "accepted", "summary": "스위스 리커머스 시장이 2026년 약 15억 달러로 17% 가까이 성장하고 2030년 26억 달러에 이를 것으로 전망됐다. 통신사의 매입·수리·리퍼·재판매 결합 모델, IKEA의 매입 후 재판매 프로그램, 결제 보호를 갖춘 중고 마켓플레이스가 성장 동력으로 꼽혔다.", "path": "signals/2026-10/SIG-20261006-43.md"}, {"id": "SIG-20261006-05", "title": "LG전자, 북미 5GW 규모 AI 데이터센터 냉각 장기공급 계약", "collected": "2026-10-06", "published": "2026-10-05", "source": "머니투데이", "url": "https://www.mt.co.kr/industry/2026/10/05/2026100516112469972", "type": "발표", "tier": "언론", "direction": "+", "strength": 2, "pf": ["PF-03"], "index": [], "criteria": ["tam", "execution"], "japan": false, "status": "accepted", "summary": "LG전자가 미국 인프라 기업과 5GW 규모 AI 데이터센터에 칠러와 냉각수분배장치(CDU)를 장기 공급하는 계약을 맺었다. 상반기 데이터센터 냉각 수주가 이미 큰 폭으로 늘었고, 미국 버지니아에 칠러 공장도 지을 계획이라고 보도됐다.", "path": "signals/2026-10/SIG-20261006-05.md"}, {"id": "SIG-20261006-37", "title": "가전 구독 판 확대 — LG 연 2.4조·베스트샵 판매의 약 50%, 케어 매니저 약 4,000명", "collected": "2026-10-06", "published": "2026-10-03", "source": "파이낸셜뉴스", "url": "https://www.fnnews.com/news/202610030700598029", "type": "사례", "tier": "언론", "direction": "+", "strength": 3, "pf": ["PF-07", "PF-01"], "index": ["가사외주화지수"], "criteria": ["execution", "monetize"], "japan": false, "status": "accepted", "summary": "LG전자 가전 구독 매출은 지난해 2.4조 원, 올해 상반기 1.3조 원이며, 베스트샵 판매 중 구독 비중이 약 절반까지 올라왔다. 약 4,000명의 케어 매니저가 정기 방문해 점검·세척·소모품 교체를 한다. 삼성도 주요 가전 구매자 셋 중 하나가 구독을 택하고 있으며 공공기관·호텔 등 B2B 구독으로 넓히고 있다.", "path": "signals/2026-10/SIG-20261006-37.md"}, {"id": "SIG-20261006-36", "title": "Warranty Week — 미국 가구 37%가 비용 때문에 수리 연기, 주택 평균 연령 44년", "collected": "2026-10-06", "published": "2026-09-29", "source": "Warranty Week", "url": "https://www.warrantyweek.com/archive/ww20260929.html", "type": "통계", "tier": "산업리서치", "direction": "+", "strength": 2, "pf": ["PF-07"], "index": [], "criteria": ["tam", "value"], "japan": false, "status": "accepted", "summary": "미국 주택 평균 연령이 44년으로 역대 최고 수준이고, 수리가 필요한 가구가 약 4,900만(전체의 약 37%)에 이른다는 분석이 나왔다. 지난 1년 사이 주요 설비 고장을 겪은 가구가 23%, 비용 때문에 수리를 미룬 가구가 37%였으며, 24시간 내 긴급 해결에 추가 비용을 낼 의향이 있다는 응답은 72%였다. 이민 감소로 현장 인력 부족도 심해질 전망이다.", "path": "signals/2026-10/SIG-20261006-36.md"}, {"id": "SIG-20261006-04", "title": "KB국민카드, AI 에이전트 결제 실증 착수", "collected": "2026-10-06", "published": "2026-09-29", "source": "아시아경제", "url": "https://view.asiae.co.kr/article/2026092914134006340", "type": "발표", "tier": "언론", "direction": "+", "strength": 2, "pf": ["PF-01"], "index": ["시간빈곤지수"], "criteria": ["execution"], "japan": false, "status": "accepted", "summary": "KB국민카드가 에스와이폴라리스와 손잡고 AI 에이전트가 사용자를 대신해 쇼핑몰에서 결제하는 흐름을 실증한다. 에이전트·쇼핑몰·결제모듈·카드사 시스템 사이의 인증과 거래 검증 요건을 확인하는 것이 목표이며, 비자의 에이전틱 커머스 프로그램에도 참여한다. 9월 들어 신한·하나카드 등 다른 카드사도 에이전트 결제 개발에 나섰다는 보도가 이어졌다.", "path": "signals/2026-10/SIG-20261006-04.md"}, {"id": "SIG-20261006-20", "title": "IFR World Robotics 2026 — 전문 서비스 로봇 24% 증가, 청소·숙박 로봇이 성장 견인", "collected": "2026-10-06", "published": "2026-09-24", "source": "IFR World Robotics 2026 (Inside Deep Tech 정리)", "url": "https://www.insidedeeptech.com/ifr-world-robotics-2026-603k-installs-five-million-stock-full-guide/", "type": "통계", "tier": "산업리서치", "direction": "+", "strength": 2, "pf": ["PF-06"], "index": ["가사외주화지수"], "criteria": ["tam"], "japan": false, "status": "accepted", "summary": "국제로봇연맹(IFR)에 따르면 산업용 로봇 설치가 약 60만 대로 11% 늘었고, 가동 중 로봇은 500만 대를 넘었다. 전문 서비스 로봇은 24% 증가한 약 25만 대였고, 청소·숙박용이 빠르게 성장했으며 이동 로봇이 서비스 로봇 설치의 절반 가까이를 차지했다.", "path": "signals/2026-10/SIG-20261006-20.md"}, {"id": "SIG-20261006-18", "title": "Goldman Sachs, 2035년 휴머노이드 650만 대·1,380억 달러로 전망 대폭 상향", "collected": "2026-10-06", "published": "2026-09-15", "source": "Humanoid.guide (Goldman Sachs 리포트 보도)", "url": "https://humanoid.guide/goldman-raises-2035-humanoid-robot-forecast-to-6-5-million/", "type": "리서치", "tier": "투자은행", "direction": "+", "strength": 2, "pf": ["PF-06", "PF-02"], "index": [], "criteria": ["tam"], "japan": false, "status": "accepted", "summary": "골드만삭스가 2035년 휴머노이드 보급 전망을 138만 대에서 650만 대로, 시장 규모를 380억 달러에서 1,380억 달러로 올렸다. 2030년 전망도 약 89만 대로 높였으며, 물류·창고·자동차 공장이 가장 빨리 커질 영역으로 꼽혔다. 리포트는 이를 검증된 생산 계획이 아닌 고성장 시나리오로 설명했다.", "path": "signals/2026-10/SIG-20261006-18.md"}, {"id": "SIG-20261006-03", "title": "포스코이앤씨, 아파트 Auto DR 2만→10만 세대 확대 추진", "collected": "2026-10-06", "published": "2026-09-10", "source": "업코리아", "url": "https://www.upkoreanews.kr/news/articleView.html?idxno=100181", "type": "사례", "tier": "언론", "direction": "+", "strength": 2, "pf": ["PF-05"], "index": [], "criteria": ["execution", "rtw"], "japan": false, "status": "accepted", "summary": "포스코이앤씨가 스마트홈 플랫폼과 연동된 가전을 전력 피크 시간에 자동 제어해 사용량을 줄이는 Auto DR을 약 2만 세대에서 10만 세대로 늘리겠다고 밝혔다. 전력거래소 감축 요청에 따라 자동으로 작동하고, 실제 감축량만큼 세대에 보상하는 구조다. 경동나비엔, 포스코DX, 전력거래소 등이 참여한다.", "path": "signals/2026-10/SIG-20261006-03.md"}, {"id": "SIG-20261006-34", "title": "LG IFA 2026 — ThinQ ON 중심 AI 홈 허브, Homey 통합, 히트펌프 라인업", "collected": "2026-10-06", "published": "2026-09-03", "source": "LG전자 (PR Newswire)", "url": "https://www.prnewswire.com/ae/news-releases/lg-electronics-showcases-expanded-ai-home-ecosystem-for-european-lifestyles-at-ifa-2026-302868307.html", "type": "발표", "tier": "글로벌기업", "direction": "+", "strength": 1, "pf": ["PF-05", "PF-04"], "index": [], "criteria": ["rtw"], "japan": false, "status": "accepted", "summary": "LG전자가 IFA 2026에서 ThinQ ON과 ThinQ 플랫폼을 중심으로 한 유럽형 AI 홈 생태계를 선보였다. 2024년 인수한 스마트홈 플랫폼 Homey를 통합하고, 상업용 ThinQ Pro와 고효율 히트펌프 제품군을 함께 전시했다.", "path": "signals/2026-10/SIG-20261006-34.md"}, {"id": "SIG-20261006-35", "title": "국토연구원 — 전국 필지 절반이 준공 30년 넘은 4층 이하 노후 저층주택", "collected": "2026-10-06", "published": "2026-08-26", "source": "국토연구원 국토정책 브리프 (뉴스핌 보도)", "url": "https://www.newspim.com/news/view/20260826000586", "type": "통계", "tier": "정부·공공", "direction": "+", "strength": 2, "pf": ["PF-07", "PF-08"], "index": ["공간제약지수", "돌봄부담지수"], "criteria": ["tam"], "japan": false, "status": "accepted", "summary": "국토연구원 분석에서 전국 약 254만 필지 중 49.6%가 준공 30년 이상·4층 이하 노후 저층주택이었고, 주거지역만 보면 약 53%였다. 노후 주거지의 65세 이상 인구 비율은 평균 24% 수준이며, 좁은 골목·사업체 감소 등 사회경제적 쇠퇴도 겹쳐 있다. 연구원은 재개발·도시재생·집수리 사업을 지역 여건에 맞게 연계하라고 제언했다.", "path": "signals/2026-10/SIG-20261006-35.md"}, {"id": "SIG-20261006-07", "title": "webOS 26 구형 TV 확대 배포, AI 챗봇·컨시어지 탑재", "collected": "2026-10-06", "published": "2026-08-25", "source": "LG전자 뉴스룸", "url": "https://www.lg.com/us/newsroom/media-entertainment/lg-electronics-introduces-an-award-winning-ai-tv-experience-at-ifa-2026", "type": "발표", "tier": "글로벌기업", "direction": "+", "strength": 1, "pf": ["PF-04"], "index": [], "criteria": ["rtw"], "japan": false, "status": "accepted", "summary": "LG전자가 IFA 2026에서 webOS 26 기반 AI TV 경험(음성 ID, AI 챗봇, AI 컨시어지)과 보안 체계를 소개했다. 같은 시기 webOS 26 업데이트가 이전 연식 TV로도 배포되기 시작했다고 해외 매체들이 보도했다.", "path": "signals/2026-10/SIG-20261006-07.md"}, {"id": "SIG-20261006-23", "title": "Johnson Controls, OpenBlue에 에이전틱 AI 추가 — 빌딩 운영 자동 실행", "collected": "2026-10-06", "published": "2026-08-05", "source": "Johnson Controls", "url": "https://www.johnsoncontrols.com/media-center/news/press-releases/2026/08/04/johnson-controls-unveils-ai-powered-openblue-platform-expansions", "type": "발표", "tier": "글로벌기업", "direction": "-", "strength": 2, "pf": ["PF-03"], "index": [], "criteria": ["rtw", "differentiation"], "japan": false, "status": "accepted", "summary": "존슨콘트롤즈가 빌딩 운영 플랫폼 OpenBlue에 인사이트 제공과 작업 실행을 자동으로 하는 에이전틱 AI와 공조 에너지 최적화 기능을 추가했다. 사례 고객에서 공조 에너지를 약 10% 줄였고 도입 기간을 크게 단축했다고 밝혔다.", "path": "signals/2026-10/SIG-20261006-23.md"}, {"id": "SIG-20261006-47", "title": "Google DeepMind Gemini Robotics 2 — 전신 제어·손재주, 로봇 OEM 4곳과 협력", "collected": "2026-10-06", "published": "2026-07-30", "source": "Google DeepMind", "url": "https://deepmind.google/blog/gemini-robotics-2-brings-whole-body-intelligence-to-robots/", "type": "발표", "tier": "글로벌기업", "direction": "-", "strength": 1, "pf": ["PF-02"], "index": [], "criteria": ["rtw"], "japan": false, "status": "accepted", "summary": "구글 딥마인드가 로봇의 전신 제어와 세밀한 손 조작을 다루는 Gemini Robotics 2를 공개했다. Apptronik, Boston Dynamics, Agile Robots, Franka가 협력사로 소개됐고, 사람과 가까워지면 안전 상태로 멈추는 등 안전 제약 준수가 개선됐다고 밝혔다. 가전이나 기기 인터페이스에 대한 언급은 없다.", "path": "signals/2026-10/SIG-20261006-47.md"}, {"id": "SIG-20261006-25", "title": "LG전자 2026년 2분기 — ES 마진 8.6%, CDU 공급망 진입, 구독 매출 성장", "collected": "2026-10-06", "published": "2026-07-30", "source": "LG전자 뉴스룸", "url": "https://www.lg.com/global/newsroom/news/corporate/lg-electronics-releases-second-quarter-2026-financial-results/", "type": "발표", "tier": "글로벌기업", "direction": "+", "strength": 2, "pf": ["PF-03", "PF-04", "PF-07"], "index": [], "criteria": ["execution", "monetize"], "japan": false, "status": "accepted", "summary": "LG전자 2분기 매출은 23.8조 원, 영업이익은 1.58조 원이었다. 에코솔루션(ES)은 해외 에어컨 판매 확대로 마진 8.6%를 기록했고, 데이터센터 냉각용 CDU의 글로벌 공급망 진입을 추진 중이다. 미디어엔터테인먼트에서는 webOS 플랫폼 사업이 성장을 이어갔고, 로봇 액추에이터 사업은 3분기 본격 운영 예정으로 밝혔다.", "path": "signals/2026-10/SIG-20261006-25.md"}, {"id": "SIG-20261006-08", "title": "EU 디지털 제품 여권 — 전자제품 수리성(2027)·재활용성(2029) 요건 예정", "collected": "2026-10-06", "published": "2026-07-30", "source": "DPP Tool 가이드", "url": "https://dpp-tool.com/en/guide/digital-product-passport-eu-sectors-timeline-2026/", "type": "제도", "tier": "산업리서치", "direction": "+", "strength": 1, "pf": ["PF-09", "PF-07"], "index": [], "criteria": ["tam"], "japan": false, "status": "accepted", "summary": "EU 디지털 제품 여권(DPP)은 배터리에 먼저 의무화되고, 전자제품은 단독 위임법이 아닌 수평 요건으로 수리 가능성(2027년 예상)과 재활용성(2029년 예상)이 순차 적용될 전망이다. 여권에는 소재 구성, 탄소발자국, 수리·분해 정보, 폐기 처리 정보 등이 담긴다.", "path": "signals/2026-10/SIG-20261006-08.md"}, {"id": "SIG-20261006-48", "title": "2025 인구주택총조사 — 1인가구 824만(36.6%), 고령자 1인가구 245만(10.9%)", "collected": "2026-10-06", "published": "2026-07-28", "source": "헤럴드경제 (국가데이터처 인구주택총조사)", "url": "https://biz.heraldcorp.com/article/10822914", "type": "통계", "tier": "언론", "direction": "+", "strength": 2, "pf": ["PF-08", "PF-07", "PF-01"], "index": ["돌봄부담지수", "공간제약지수"], "criteria": ["tam"], "japan": false, "status": "accepted", "summary": "2025년 11월 기준 1인가구가 824만 가구로 일반가구의 36.6%를 차지해 역대 최대를 기록했다. 65세 이상 혼자 사는 가구는 245만 6천으로 1년 사이 7% 넘게 늘어, 일반가구 10집 중 1집 이상이 됐다.", "path": "signals/2026-10/SIG-20261006-48.md"}, {"id": "SIG-20261006-21", "title": "LG전자, CEO 직속 로봇사업센터 신설 — 가정용·상업용·산업용 역할 분담", "collected": "2026-10-06", "published": "2026-06-30", "source": "The Korea Times", "url": "https://www.koreatimes.co.kr/business/companies/20260630/lg-electronics-to-establish-control-tower-for-robotics-business", "type": "발표", "tier": "언론", "direction": "+", "strength": 3, "pf": ["PF-06", "PF-02"], "index": [], "criteria": ["execution"], "japan": false, "status": "accepted", "summary": "LG전자가 상용화·제조·공급망을 통합 관리하는 로봇사업센터를 CEO 직속으로 신설했다. 사업개발·판매·운영을 한 조직에서 맡고 별도 데이터 생성 조직을 둔다. 가정용(CLOiD)은 LG전자가, 산업용은 로보스타가, 상업용은 베어로보틱스가 맡는 구조다.", "path": "signals/2026-10/SIG-20261006-21.md"}, {"id": "SIG-20261006-44", "title": "LG전자, 정부와 폐냉매 회수·리퍼비시 사업 착수 — 소상공인 대상 사업자몰 판매", "collected": "2026-10-06", "published": "2026-06-19", "source": "아시아경제", "url": "https://view.asiae.co.kr/article/2026061908010605527", "type": "발표", "tier": "언론", "direction": "+", "strength": 2, "pf": ["PF-09"], "index": [], "criteria": ["execution"], "japan": false, "status": "accepted", "summary": "LG전자가 정부와 순환경제 협약을 맺고 폐가전에서 냉매를 회수해 재자원화하고 리퍼비시 제품을 만드는 사업을 시작했다. LX판토스가 회수·관리를, 리사이클링센터가 해체와 냉매 추출을 맡으며, 리퍼 제품은 LG전자 사업자몰에서 소상공인에게 먼저 판매한다.", "path": "signals/2026-10/SIG-20261006-44.md"}, {"id": "SIG-20261006-41", "title": "AI 돌봄로봇 수백 개 지자체 보급 — 그러나 \"챗봇 수준, 실질 돌봄 부재\" 지적", "collected": "2026-10-06", "published": "2026-06-03", "source": "세계일보", "url": "https://segye.com/newsView/20260602514178", "type": "사례", "tier": "언론", "direction": "+", "strength": 2, "pf": ["PF-08"], "index": ["돌봄부담지수"], "criteria": ["monetize", "value"], "japan": false, "status": "accepted", "summary": "초롱이·효돌이·다솜 등 AI 말벗·돌봄 로봇이 각각 100~185개 지자체에서 운영되며 독거노인의 외로움 완화에 도움이 된다는 평가가 있다. 동시에 부적절한 발화, 과의존, 사고 시 책임 공백, 대화 수준에 머문 기능 한계가 지적됐고, 전문가들은 정부 가이드라인과 물리적 돌봄 기능 투자를 제언했다.", "path": "signals/2026-10/SIG-20261006-41.md"}, {"id": "SIG-20261006-39", "title": "AARP 장수경제 2026 — 50세 이상이 미국 GDP의 43%, 기술 지출 2018년 대비 62% 증가", "collected": "2026-10-06", "published": "2026-06-02", "source": "AARP", "url": "https://www.aarp.org/money/personal-finance/longevity-economy-report-2026/", "type": "리서치", "tier": "정부·공공", "direction": "+", "strength": 1, "pf": ["PF-08"], "index": ["돌봄부담지수"], "criteria": ["tam"], "japan": false, "status": "accepted", "summary": "AARP 보고서에 따르면 미국 50세 이상 인구가 연 12.5조 달러의 경제활동을 만들어 GDP의 43%를 차지하고, 이들 가구의 소비는 전체 소비의 절반을 넘는다. 기술 지출은 2018년 이후 62% 늘었고, 무급 돌봄에 연 57억 시간을 쓰고 있다.", "path": "signals/2026-10/SIG-20261006-39.md"}, {"id": "SIG-20261006-13", "title": "Google I/O 2026 — Universal Cart와 위임장(Mandate) 기반 에이전트 결제 AP2", "collected": "2026-10-06", "published": "2026-05-19", "source": "The Next Web", "url": "https://thenextweb.com/news/google-universal-cart-agent-payments-shopping-io-2026", "type": "발표", "tier": "글로벌기업", "direction": "-", "strength": 3, "pf": ["PF-01"], "index": [], "criteria": ["rtw", "differentiation"], "japan": false, "status": "accepted", "summary": "구글이 검색·제미나이·유튜브·지메일에 흩어진 상품을 하나로 모으는 Universal Cart와, 사용자가 정한 한도 안에서 에이전트가 대신 결제하게 하는 AP2를 공개했다. 거래마다 암호화된 위임장(Mandate)을 남겨 추적 가능하게 하며, 커머스 프로토콜(UCP)에는 대형 리테일러들이 참여하고 있다.", "path": "signals/2026-10/SIG-20261006-13.md"}, {"id": "SIG-20261006-14", "title": "Amazon \"Alexa for Shopping\" — 목표가 자동구매·정기 재구매·타 사이트 구매", "collected": "2026-10-06", "published": "2026-05-13", "source": "About Amazon", "url": "https://www.aboutamazon.com/news/retail/alexa-for-shopping-ai-assistant", "type": "발표", "tier": "글로벌기업", "direction": "-", "strength": 2, "pf": ["PF-01"], "index": ["가사외주화지수"], "criteria": ["rtw"], "japan": false, "status": "accepted", "summary": "아마존이 Rufus와 Alexa+를 합친 쇼핑 에이전트를 내놨다. 목표 가격에 도달하면 자동 구매하고, 세제·사료 같은 필수품을 정기적으로 장바구니에 넣으며, 다른 온라인 몰의 상품도 대신 산다. 프라임 회원이 아니어도 무료로 쓸 수 있다.", "path": "signals/2026-10/SIG-20261006-14.md"}, {"id": "SIG-20261006-49", "title": "KDI — 요양보호사 2035년 약 50만, 2040년 약 77만 명 부족 전망", "collected": "2026-10-06", "published": "2026-04-29", "source": "다음뉴스 (KDI 보고서 보도)", "url": "https://v.daum.net/v/20260429151946545", "type": "리서치", "tier": "언론", "direction": "+", "strength": 2, "pf": ["PF-08", "PF-06"], "index": ["돌봄부담지수"], "criteria": ["value", "tam"], "japan": false, "status": "accepted", "summary": "한국개발연구원(KDI)은 장기요양 수요가 2043년까지 2023년의 2.4배 이상으로 늘어, 요양보호사가 2035년 약 50만 명, 2040년 약 77만 명 부족할 것으로 전망했다. 현재 요양보호사는 약 71만 명이며, 보고서는 일자리 질 개선, 이민 인력, 돌봄 기술 도입을 정책 방향으로 제시했다.", "path": "signals/2026-10/SIG-20261006-49.md"}, {"id": "SIG-20261006-22", "title": "Bain, 2030년 산업 자동화 매출 절반이 AI 의존 — 가치가 소프트웨어·데이터로 이동", "collected": "2026-10-06", "published": "2026-04-07", "source": "Bain & Company", "url": "https://www.bain.com/about/media-center/press-releases/2026/nearly-half-of-industrial-automation-revenue-to-rely-on-ai-by-2030-bain--company-finds/", "type": "리서치", "tier": "컨설팅", "direction": "+", "strength": 2, "pf": ["PF-03", "PF-06"], "index": [], "criteria": ["moat", "monetize"], "japan": false, "status": "accepted", "summary": "베인은 2030년까지 산업 자동화 매출의 절반 가까이가 AI 기반 솔루션에서 나오고, 이익 풀의 절반 이상이 소프트웨어·데이터·AI 계층으로 옮겨갈 것으로 봤다. 산업 구조가 피라미드에서 모래시계형으로 바뀌며, 하이퍼스케일러와 AI 네이티브 기업이 위에서, 공격적인 하드웨어 업체가 아래에서 기존 강자를 압박한다고 분석했다.", "path": "signals/2026-10/SIG-20261006-22.md"}, {"id": "SIG-20261006-16", "title": "Physical Intelligence 기업가치 110억 달러 — 로봇 파운데이션 모델에 자본 집중", "collected": "2026-10-06", "published": "2026-03-31", "source": "The Elec", "url": "https://www.thelec.net/news/articleView.html?idxno=6214", "type": "발표", "tier": "언론", "direction": "-", "strength": 2, "pf": ["PF-02"], "index": [], "criteria": ["rtw"], "japan": false, "status": "accepted", "summary": "범용 로봇 파운데이션 모델을 만드는 Physical Intelligence가 10억 달러를 유치하며 기업가치 110억 달러로 평가됐다. 보도에 따르면 2025년 로봇·물리 AI 벤처 투자는 전년의 두 배가 넘는 276억 달러였다.", "path": "signals/2026-10/SIG-20261006-16.md"}, {"id": "SIG-20261006-01", "title": "지역사회 통합돌봄 전국 229개 시군구 시행", "collected": "2026-10-06", "published": "2026-03-26", "source": "대한민국 정책브리핑(보건복지부)", "url": "https://www.korea.kr/news/policyNewsView.do?newsId=148961536", "type": "제도", "tier": "정부·공공", "direction": "+", "strength": 3, "pf": ["PF-08", "PF-07"], "index": ["돌봄부담지수"], "criteria": ["monetize", "tam"], "japan": false, "status": "accepted", "summary": "2026년 3월 27일부터 노쇠·질병으로 일상생활이 어려운 65세 이상 노인과 중증 장애인을 대상으로 통합돌봄이 전국 229개 시군구에서 시행됐다. 의료·요양·일상생활 지원을 집에서 받도록 하는 구조이며, 지역 특화 서비스에 이동 지원과 주거환경 개선이 포함된다. 시범사업 참여자는 요양병원·시설 입소율이 비참여자보다 낮았다고 정부가 밝혔다.", "path": "signals/2026-10/SIG-20261006-01.md"}, {"id": "SIG-20261006-42", "title": "EU 수리권 지침 2026년 7월 31일까지 국내법 전환 — 세탁기·냉장고·식기세척기 제조사 수리 의무", "collected": "2026-10-06", "published": "2026-03-18", "source": "Lewis Silkin", "url": "https://www.lewissilkin.com/insights/2026/03/18/what-does-the-right-to-repair-directive-mean-for-your-business", "type": "제도", "tier": "정부·공공", "direction": "+", "strength": 2, "pf": ["PF-09", "PF-07"], "index": [], "criteria": ["tam", "execution"], "japan": false, "status": "accepted", "summary": "EU 회원국은 2026년 7월 31일까지 수리권 지침을 국내법으로 옮겨야 한다. 세탁기·냉장고·식기세척기 등 대상 제품의 제조사는 보증 기간 이후에도 합리적인 시간과 가격에 수리를 제공하고, 부품을 적정 가격에 공급하며, 예상 수리 가격을 공개해야 한다. 소비자가 교체 대신 수리를 고르면 법정 보증이 1년 연장되고, 2027년에는 유럽 수리 플랫폼이 출범한다.", "path": "signals/2026-10/SIG-20261006-42.md"}, {"id": "SIG-20261006-12", "title": "McKinsey, 유럽 소비자는 \"판단은 AI에, 지속 권한은 본인에게\"", "collected": "2026-10-06", "published": "2026-03-02", "source": "McKinsey QuantumBlack", "url": "https://www.mckinsey.com/capabilities/quantumblack/our-insights/europes-agentic-commerce-moment-decision-influence-is-here-execution-is-coming", "type": "리서치", "tier": "컨설팅", "direction": "-", "strength": 2, "pf": ["PF-01"], "index": ["시간빈곤지수"], "criteria": ["execution", "value"], "japan": false, "status": "accepted", "summary": "맥킨지 조사에서 유럽 소비자의 38%가 구매 결정에 AI를 쓰지만, 사용은 비교·탐색 단계에 몰려 있고 장바구니 구성이나 결제 같은 실행 단계는 크게 낮았다. 자동 재주문처럼 지속적인 권한을 맡기는 데 대한 신뢰가 특히 약했다. 맥킨지는 2030년 글로벌 에이전틱 커머스를 3조~5조 달러로 추산했다.", "path": "signals/2026-10/SIG-20261006-12.md"}, {"id": "SIG-20261006-10", "title": "일본 에디온, 가전 사용 이력으로 고령자 원격 안부 확인 — 복수 제조사 대응", "collected": "2026-10-06", "published": "2026-03", "source": "니혼게이자이신문", "url": "https://www.nikkei.com/article/DGXZQOUF197660Z10C26A3000000/", "type": "사례", "tier": "언론", "direction": "+", "strength": 2, "pf": ["PF-08", "PF-07"], "index": ["돌봄부담지수"], "criteria": ["rtw"], "japan": true, "status": "accepted", "summary": "일본 가전 양판점 에디온이 가전 사용 이력을 바탕으로 떨어져 사는 고령자의 안부를 원격으로 확인하는 서비스를 내놓았고, 샤프 등 여러 제조사 제품에 대응한다고 보도됐다. (원문 접근 제한으로 기사 제목 기준 기록. 2026-10-06 사용자 판단으로 채택)", "path": "signals/2026-10/SIG-20261006-10.md"}, {"id": "SIG-20261006-33", "title": "한전 — 분산에너지 특화지역 7곳 지정, 배전망 5년 10조 원 투자 필요", "collected": "2026-10-06", "published": "2026-02", "source": "한국전력 KEPCO 웹진", "url": "https://www.kepco.co.kr/KEPCO_FILE/html/2026_02/theme01.html", "type": "제도", "tier": "정부·공공", "direction": "+", "strength": 1, "pf": ["PF-05"], "index": [], "criteria": ["execution"], "japan": false, "status": "accepted", "summary": "한전 웹진에 따르면 2024년 시행된 분산에너지 활성화 특별법에 따라 2025년 말까지 분산에너지 특화지역 7곳이 지정됐다. 특화지역에서는 재생에너지·ESS·V2G 등으로 지역 내 생산·소비를 유도한다. 배전망에는 향후 5년간 10조 원 규모 투자가 필요하다고 제시됐고, 해외 모범 사례로 영국 옥토퍼스와 미국 FERC Order 2222가 소개됐다.", "path": "signals/2026-10/SIG-20261006-33.md"}, {"id": "SIG-20261006-29", "title": "Omdia — 북미 TV OS 중 리테일러 점유율 2025년 27% → 2029년 47%", "collected": "2026-10-06", "published": "2026-01-26", "source": "Omdia", "url": "https://omdia.tech.informa.com/pr/2026/jan/retailers-to-control-47percent-of-north-america-tv-os-share-by-2029-as-advertising-strategies-shift", "type": "리서치", "tier": "산업리서치", "direction": "-", "strength": 3, "pf": ["PF-04"], "index": [], "criteria": ["rtw", "network"], "japan": false, "status": "accepted", "summary": "옴디아는 월마트(비지오 기반 OS)와 아마존(Fire TV) 같은 리테일러가 북미 TV OS 점유율을 2025년 27%에서 2029년 47%로 늘릴 것으로 전망했다. 광고 중심 전략이 동력이며, AI 기반 \"쇼핑 가능한 콘텐츠\"로 시청과 구매 사이 간격을 줄이려는 것이 목적이라고 분석했다. 그 외 지역에서는 구글 TV 점유율이 여러 OS로 분산될 것으로 봤다.", "path": "signals/2026-10/SIG-20261006-29.md"}, {"id": "SIG-20261006-46", "title": "Homey by LG × EcoFlow 에너지 관리 파트너십 — Homey는 1,000개 이상 브랜드 지원", "collected": "2026-10-06", "published": "2026-01-07", "source": "DigitalMore (CES 2026 보도)", "url": "https://digitalmore.co/ces-2026-ecoflow-and-homey-by-lg-announce-partnership-to-enable-smarter-whole-home-energy-management/", "type": "발표", "tier": "언론", "direction": "+", "strength": 2, "pf": ["PF-05"], "index": [], "criteria": ["rtw", "network"], "japan": false, "status": "accepted", "summary": "CES 2026에서 LG의 스마트홈 플랫폼 Homey와 가정용 에너지 기업 EcoFlow가 파트너십을 발표했다. EcoFlow의 태양광·가정용 배터리·회로 제어를 Homey 에너지 동글과 통합해 한 화면에서 가정 에너지를 모니터링하고 시간대별 요금에 맞춰 자동화한다. Homey는 1,000개 이상 브랜드와 300개 이상 공식 파트너를 지원한다.", "path": "signals/2026-10/SIG-20261006-46.md"}, {"id": "SIG-20261006-38", "title": "삼성 CES 2026 — SmartThings 5억 사용자, 보험사(HSB)와 스마트홈 데이터 연계", "collected": "2026-10-06", "published": "2026-01-06", "source": "The Korea Herald", "url": "https://www.koreaherald.com/article/10649841", "type": "사례", "tier": "언론", "direction": "-", "strength": 2, "pf": ["PF-07", "PF-04"], "index": [], "criteria": ["rtw", "differentiation"], "japan": false, "status": "accepted", "summary": "삼성전자가 CES 2026에서 개방형 생태계를 홈 AI의 기반으로 내세우며 SmartThings 사용자가 5억 명을 넘었다고 밝혔다. 보험사 Hartford Steam Boiler와 제휴해 스마트홈 데이터를 보험과 연결하고 소비자 비용을 줄이는 사례를 소개했으며, Matter와 가전 연결 연합(HCA) 참여를 강조했다.", "path": "signals/2026-10/SIG-20261006-38.md"}, {"id": "SIG-20261006-15", "title": "NVIDIA, CES 2026에서 Cosmos·GR00T 오픈 모델 공개 — LG전자 파트너로 홈로봇 발표", "collected": "2026-10-06", "published": "2026-01-05", "source": "NVIDIA Investor Relations", "url": "https://investor.nvidia.com/news/press-release-details/2026/NVIDIA-Releases-New-Physical-AI-Models-as-Global-Partners-Unveil-Next-Generation-Robots/default.aspx", "type": "발표", "tier": "글로벌기업", "direction": "+", "strength": 2, "pf": ["PF-02", "PF-06"], "index": [], "criteria": ["differentiation", "execution"], "japan": false, "status": "accepted", "summary": "엔비디아가 월드 모델 Cosmos와 휴머노이드용 GR00T N1.6 등 물리 AI 모델을 오픈소스로 공개하고, 로봇 정책 평가용 시뮬레이션 프레임워크와 엣지 모듈을 함께 내놨다. 발표 파트너에 LG전자가 포함됐고, LG는 실내 가사용 홈로봇을 선보였다.", "path": "signals/2026-10/SIG-20261006-15.md"}, {"id": "SIG-20261006-17", "title": "LG CLOiD 홈로봇 공개 — VLA 기반, ThinQ로 가전 조율, AXIUM 액추에이터", "collected": "2026-10-06", "published": "2026-01-04", "source": "LG전자 (PR Newswire)", "url": "https://www.prnewswire.com/news-releases/lg-electronics-presents-lg-cloid-home-robot-to-demonstrate-zero-labor-home-at-ces-2026-302652192.html", "type": "발표", "tier": "글로벌기업", "direction": "+", "strength": 2, "pf": ["PF-02", "PF-06"], "index": ["가사외주화지수"], "criteria": ["execution", "rtw"], "japan": false, "status": "accepted", "summary": "LG전자가 CES 2026에서 요리·세탁 등 가사를 수행하는 홈로봇 CLOiD를 공개하며 \"Zero Labor Home\"을 내세웠다. 시각-언어-행동 모델로 상황을 이해하고, ThinQ·ThinQ ON과 연결돼 여러 가전을 조율한다. 자체 로봇 관절 액추에이터 AXIUM도 함께 소개했다.", "path": "signals/2026-10/SIG-20261006-17.md"}, {"id": "SIG-20261006-40", "title": "일본 후생노동성, 2026년도 개호 테크놀로지 도입 지원 — 보정예산 220억 엔, 보조율 최대 3/4", "collected": "2026-10-06", "published": "2026", "source": "補助金ポータル", "url": "https://hojyokin-portal.jp/columns/kaigo_technology", "type": "제도", "tier": "정부·공공", "direction": "+", "strength": 2, "pf": ["PF-08"], "index": ["돌봄부담지수"], "criteria": ["monetize"], "japan": true, "status": "accepted", "summary": "일본은 개호 현장 인력난에 대응해 개호 로봇과 ICT 기기 도입을 지원하며, 2026년도에는 보정예산 220억 엔이 추가됐다. 보조율은 최대 3/4(조합에 따라 4/5)이고, 지켜보기(見守り) 센서·이승 지원 로봇·배설 예측 센서 등이 카탈로그 방식으로 지원 대상에 올라 있다. 수급 사업소는 3년간 효과를 보고해야 한다.", "path": "signals/2026-10/SIG-20261006-40.md"}, {"id": "SIG-20261006-31", "title": "Octopus, 에너지 운영 플랫폼 Kraken 분사 — 기업가치 86.5억 달러, 유연성 2GW 이상 제어", "collected": "2026-10-06", "published": "2025-12-29", "source": "ESG News", "url": "https://esgnews.com/octopus-energy-spins-out-kraken-in-1-billion-raise-valuing-utility-ai-platform-at-8-65-billion/", "type": "사례", "tier": "글로벌기업", "direction": "-", "strength": 2, "pf": ["PF-05"], "index": [], "criteria": ["rtw", "network"], "japan": false, "status": "accepted", "summary": "옥토퍼스 에너지가 유틸리티 운영 플랫폼 크라켄을 10억 달러 투자 유치와 함께 독립 회사로 분사했다. 크라켄은 7천만 개 이상의 고객 계정을 처리하고 연 계약 매출이 5억 달러를 넘으며, 가상발전소에 연결된 기기 약 50만 대·2GW 이상의 유연 부하를 제어한다. EDF·E.ON 등 대형 유틸리티가 라이선스 고객이다.", "path": "signals/2026-10/SIG-20261006-31.md"}, {"id": "SIG-20261006-09", "title": "외국인 가사관리사 본사업 미추진 결정", "collected": "2026-10-06", "published": "2025-12-22", "source": "경향신문", "url": "https://www.khan.co.kr/article/202512221801001", "type": "제도", "tier": "언론", "direction": "+", "strength": 2, "pf": ["PF-06", "PF-02"], "index": ["가사외주화지수"], "criteria": ["value"], "japan": false, "status": "accepted", "summary": "정부가 외국인 가사관리사 시범사업을 본사업으로 전환하지 않기로 했다. 기존 인력은 체류 기간 연장 등으로 보호하되 제도 확대는 멈췄고, 고용허가제 전체 외국인력 쿼터도 2026년에 크게 줄었다.", "path": "signals/2026-10/SIG-20261006-09.md"}, {"id": "SIG-20261006-28", "title": "webOS 코파일럿 강제 설치 논란 — LG, 완전 삭제 가능하도록 변경", "collected": "2026-10-06", "published": "2025-12-19", "source": "Thurrott", "url": "https://www.thurrott.com/smart-tech/smart-home/330911/lg-to-make-microsoft-copilot-app-on-its-smart-tvs-fully-removable", "type": "사례", "tier": "언론", "direction": "-", "strength": 2, "pf": ["PF-04"], "index": [], "criteria": ["value"], "japan": false, "status": "accepted", "summary": "webOS 업데이트로 마이크로소프트 코파일럿이 삭제 불가 상태로 설치되자 사용자 반발이 일었고, LG는 앞으로 완전히 지울 수 있게 바꾸겠다고 밝혔다. 음성 입력 등은 사용자 동의 후에만 켜진다고 설명했다.", "path": "signals/2026-10/SIG-20261006-28.md"}, {"id": "SIG-20261006-26", "title": "Dell'Oro 2026 전망 — AI 랙은 공랭·액랭 혼합, 1GW급 사이트 5곳 이상", "collected": "2026-10-06", "published": "2025-12-16", "source": "Dell'Oro Group", "url": "https://www.delloro.com/2026-predictions-data-center-physical-infrastructure-market/", "type": "리서치", "tier": "산업리서치", "direction": "+", "strength": 1, "pf": ["PF-03"], "index": [], "criteria": ["tam"], "japan": false, "status": "accepted", "summary": "델오로는 2026년 데이터센터 물리 인프라에서 액체냉각이 주도하되 고밀도 AI 랙에서는 공랭과 액랭이 섞여 배치되고, 1GW 이상 운영 용량을 가진 사이트가 5곳 넘게 나올 것으로 봤다. AI 인프라 관리·성능 최적화 서비스 수요 증가와 대형 M&A도 예상했다.", "path": "signals/2026-10/SIG-20261006-26.md"}, {"id": "SIG-20261006-02", "title": "1인가구 804만·36.1%, 70세 이상이 최대 비중", "collected": "2026-10-06", "published": "2025-12-09", "source": "국가데이터처 「2025 통계로 보는 1인가구」(경향신문 보도)", "url": "https://www.khan.co.kr/article/202512091341001", "type": "통계", "tier": "정부·공공", "direction": "+", "strength": 3, "pf": ["PF-08", "PF-01", "PF-09"], "index": ["돌봄부담지수", "공간제약지수"], "criteria": ["tam"], "japan": false, "status": "accepted", "summary": "1인가구가 처음으로 800만을 넘어 전체 가구의 36% 수준에 이르렀다. 연령대별로는 70세 이상이 가장 큰 비중이며, 60세 이상을 합치면 1인가구의 3분의 1을 넘는다. 1인가구의 소득·자산은 전체 가구 평균의 절반에 못 미치고, 절반 가까이가 외로움을 느낀다고 답했다.", "path": "signals/2026-10/SIG-20261006-02.md"}, {"id": "SIG-20261006-11", "title": "Morgan Stanley, 2030년 미국 에이전틱 커머스 1,900억~3,850억 달러 전망", "collected": "2026-10-06", "published": "2025-12-08", "source": "Morgan Stanley Research", "url": "https://www.morganstanley.com/insights/articles/agentic-commerce-market-impact-outlook", "type": "리서치", "tier": "투자은행", "direction": "+", "strength": 2, "pf": ["PF-01"], "index": ["시간빈곤지수"], "criteria": ["tam"], "japan": false, "status": "accepted", "summary": "모건스탠리는 2030년 미국 온라인 쇼핑의 10%(기본)~20%(낙관)가 AI 에이전트를 거칠 것으로 보고, 규모를 1,900억~3,850억 달러로 추정했다. 이미 미국 소비자 약 4분의 1이 최근 한 달 사이 AI를 통해 구매한 경험이 있으며, 식료품과 생활소비재가 가장 먼저 에이전트 구매로 넘어갈 카테고리로 꼽혔다.", "path": "signals/2026-10/SIG-20261006-11.md"}, {"id": "SIG-20261006-32", "title": "Matter 1.5 — 전기요금·탄소 신호를 기기에 전달하는 에너지 관리 기능 표준화", "collected": "2026-10-06", "published": "2025-11-20", "source": "Connectivity Standards Alliance", "url": "https://csa-iot.org/newsroom/matter-1-5-introduces-cameras-closures-and-enhanced-energy-management-capabilities/", "type": "제도", "tier": "정부·공공", "direction": "+", "strength": 1, "pf": ["PF-05", "PF-02"], "index": [], "criteria": ["execution"], "japan": false, "status": "accepted", "summary": "스마트홈 표준 Matter 1.5가 유틸리티의 실시간·예측 요금과 탄소 데이터를 기기에 공유하는 장치 유형을 추가하고, EV 충전 기능을 강화했다. 카메라와 블라인드·차고문 같은 개폐 장치도 브랜드에 상관없이 제어할 수 있게 했다.", "path": "signals/2026-10/SIG-20261006-32.md"}, {"id": "SIG-20261006-30", "title": "RMI — VPP로 2030년 미국 최대 전력 수요의 20% 이상 대응 가능", "collected": "2026-10-06", "published": "2025-11-06", "source": "RMI", "url": "https://rmi.org/resources/how-virtual-power-plants-can-help-the-united-states-win-the-ai-race/", "type": "리서치", "tier": "정부·공공", "direction": "+", "strength": 2, "pf": ["PF-05"], "index": [], "criteria": ["tam", "value"], "japan": false, "status": "accepted", "summary": "RMI는 가상발전소(VPP)가 2030년 미국 최대 전력 수요의 20% 이상을 감당할 수 있고, AI 데이터센터 증설 수요에 대응하는 데는 연간 약 300시간의 유연성만 있으면 된다고 분석했다. 스마트 온도조절기·온수기 같은 가정용 기기는 빠르게 배치할 수 있는 유연성 자원으로 꼽혔다.", "path": "signals/2026-10/SIG-20261006-30.md"}, {"id": "SIG-20261006-24", "title": "데이터센터 냉각 M&A — Eaton·Vertiv·Daikin, \"칩에서 그리드까지\" 열관리 수직통합", "collected": "2026-10-06", "published": "2025-11-06", "source": "Data Center Frontier", "url": "https://www.datacenterfrontier.com/cooling/article/55328396/chip-to-grid-gets-bought-eaton-vertiv-and-daikin-deals-imply-a-new-thermal-capital-cycle", "type": "사례", "tier": "산업리서치", "direction": "-", "strength": 2, "pf": ["PF-03"], "index": [], "criteria": ["rtw"], "japan": false, "status": "accepted", "summary": "이튼이 보이드 써멀을 약 95억 달러에, 버티브가 냉각 현장 서비스 업체를 약 10억 달러에, 다이킨이 액체냉각 업체를 인수하는 등 냉각이 데이터센터의 핵심 인프라로 격상되며 랙부터 변전소까지 열관리를 수직통합하는 흐름이 나타났다. 버티브 인수는 현장 기술자 네트워크 확보가 목적이라는 분석이다.", "path": "signals/2026-10/SIG-20261006-24.md"}, {"id": "SIG-20261006-06", "title": "1X NEO 가정용 휴머노이드, 구매 또는 월 구독 + 원격 조작 지원", "collected": "2026-10-06", "published": "2025-11-03", "source": "AI타임스", "url": "https://www.aitimes.com/news/articleView.html?idxno=203684", "type": "사례", "tier": "언론", "direction": "+", "strength": 2, "pf": ["PF-06", "PF-02"], "index": ["가사외주화지수"], "criteria": ["monetize", "value"], "japan": false, "status": "accepted", "summary": "1X가 가정용 휴머노이드 NEO를 2만 달러 구매 또는 월 499달러 구독(6개월 이상)으로 사전 판매하며 2026년 배송을 예고했다. 완전 자율이 아니어서 회사 원격 조작자가 작업을 도울 수 있다는 점을 사용자가 수용해야 하며, 사생활 우려가 제기됐다. 식기세척기 조작, 조리대 닦기, 옷 개기 등 일상 가사를 시연했다.", "path": "signals/2026-10/SIG-20261006-06.md"}, {"id": "SIG-20261006-27", "title": "삼성 TV, Bixby·Copilot·Perplexity 멀티 AI 에이전트 탑재", "collected": "2026-10-06", "published": "2025-10-21", "source": "Thurrott", "url": "https://www.thurrott.com/a-i/328616/perplexity-ai-joins-microsoft-copilot-on-samsung-smart-tvs", "type": "사례", "tier": "언론", "direction": "-", "strength": 2, "pf": ["PF-04"], "index": [], "criteria": ["differentiation"], "japan": false, "status": "accepted", "summary": "삼성이 TV에 퍼플렉시티를 추가해, 사용자가 리모컨의 AI 버튼이나 앱으로 빅스비·코파일럿·퍼플렉시티를 골라 쓸 수 있게 했다. 이전 연식 TV도 OS 업그레이드로 지원하며, 구글 제미나이와 아마존 알렉사+도 비슷한 TV 통합을 추진 중이라고 보도됐다.", "path": "signals/2026-10/SIG-20261006-27.md"}, {"id": "SIG-20261006-19", "title": "Morgan Stanley, 2050년 휴머노이드 5조 달러·10억 대, 가정용은 약 10%", "collected": "2026-10-06", "published": "2025-05-14", "source": "Morgan Stanley Research", "url": "https://www.morganstanley.com/insights/articles/humanoid-robot-market-5-trillion-by-2050", "type": "리서치", "tier": "투자은행", "direction": "+", "strength": 1, "pf": ["PF-06", "PF-02"], "index": ["가사외주화지수"], "criteria": ["tam"], "japan": false, "status": "accepted", "summary": "모건스탠리는 2050년 휴머노이드 시장을 공급망·유지보수 포함 5조 달러, 가동 대수 약 10억 대로 전망했다. 약 90%가 산업·상업용이고 가정용은 8천만 대 수준이며, 보급은 2030년대 중반까지 완만하다가 이후 가속될 것으로 봤다. (2026년 이전 자료 — 장기 기준선으로 기록)", "path": "signals/2026-10/SIG-20261006-19.md"}, {"id": "SIG-20261006-45", "title": "webOS 외부 TV 제조사 약 400곳 채택, 탑재 기기 2026년 3억 대 목표", "collected": "2026-10-06", "published": "2024-03-29", "source": "헤럴드경제", "url": "https://biz.heraldcorp.com/article/3359423", "type": "발표", "tier": "언론", "direction": "+", "strength": 2, "pf": ["PF-04"], "index": [], "criteria": ["network", "rtw"], "japan": false, "status": "accepted", "summary": "webOS를 쓰는 외부 TV 제조사가 2021년 약 20곳에서 2024년 초 약 400곳으로 늘었고, LG는 webOS 탑재 기기를 2억 대 규모에서 2026년 3억 대로 키우겠다고 밝혔다. 플랫폼 매출은 FAST 채널 광고를 중심으로 연 1조 원 수준이 언급됐다. (2026년 이전 자료 — 설치 기반 기준선으로 기록)", "path": "signals/2026-10/SIG-20261006-45.md"}], "wiki": {"PF-01": "---\nid: PF-01\nname: Household CFO\nname_ko: 가계 구매 위임\none_liner: 비교·구매·계약을 고객이 반복하는 대신, 가계 운영권을 LG Agent에 위임받아 수요를 모으고 조달한다\nstack: Household\nessence: Money·Demand\ncontrol_point: 가계 구매 위임권 (Purchasing Mandate)\nmechanism: Demand Aggregation + Managed Procurement\nconviction: 하락\nupdated: 2026-10-06\nstudy: wiki/study/PF-01-study.md\nradar_ko: [에이전트 결제, AI 쇼핑 위임, 자동 재주문, 가전 소모품 구독, 카드사 에이전트 페이]\nradar_en: [agentic commerce, agent payments mandate, AP2 UCP, auto replenishment, Alexa for Shopping]\n---\n\n# PF-01 Household CFO — 가계 구매 위임\n\n> 비교·구매·계약을 고객이 반복하는 대신, 가계 운영권을 LG Agent에 위임받아 여러 가구의 수요를 모으고 공급자와 조건을 협상한다.\n\n## 1. 사업 가설\n\n**한 줄 요약.** 고객이 미리 정해 준 범위 안에서 LG Agent가 생활 구매를 대신 처리합니다. LG는 이렇게 모인 수요를 묶어 공급자와 더 좋은 조건을 협상합니다.\n\n### 고객 입장에서 달라지는 점\n\n| 지금 | PF-01이 실현되면 |\n|---|---|\n| 정수기 필터, 세제가 떨어질 때마다 직접 검색하고 주문 | 가전이 잔량을 감지하고, Agent가 승인된 가격 범위 안에서 자동 주문 |\n| 인터넷·렌탈 약정 만기를 놓쳐 비싼 요금을 계속 냄 | 만기 전에 Agent가 더 나은 조건을 찾아 교체하거나 해지 |\n| 청소·세탁 같은 생활 서비스를 매번 비교해서 고름 | Agent가 고객 선호와 가격을 기준으로 골라 예약 |\n\n### LG가 확보해야 할 위치: 구매 위임권 (Control Point)\n\n추천만 해서는 플랫폼이 되지 않습니다. 고객이 승인한 한도(품목, 가격, 횟수) 안에서 **대신 사고, 바꾸고, 해지할 수 있는 권한**이 핵심입니다. 이 권한은 세 가지로 나뉩니다.\n\n| 권한 | 뜻 | PF-01에서 LG가 갖는 것 |\n|---|---|---|\n| 접근권 (Access) | 구매가 필요한 시점을 남보다 먼저 아는 것 | 가전 상태, 소모품 잔량, 계약 만기 정보 |\n| 판단권 (Decision) | 어디서, 어떤 조건으로 살지 정하는 것 | 가격·품질 비교 결과와 고객 선호 |\n| 거절권 (Rejection) | 조건이 나쁜 공급자를 빼는 것 | 묶음 수요를 근거로 한 재협상과 공급자 교체 |\n\n### 사업 구조\n\n여러 가구의 수요를 모으고(수요 집약, Demand Aggregation), 구매를 대신 처리합니다(조달 대행, Managed Procurement).\n\n- 수요 쪽: 가구\n- 공급 쪽: 소모품, 생활 서비스, 금융, 통신 공급자\n\n### 플랫폼이 되는 시점\n\n| 단계 | 예시 | 성격 |\n|---|---|---|\n| LG 제품의 소모품만 대신 구매 | LG 정수기 필터 자동 주문 | LG 직판 (플랫폼 아님) |\n| 타사 공급자가 LG가 묶은 수요를 두고 경쟁 | 세제 브랜드, 통신사가 더 좋은 조건을 제시 | 플랫폼 |\n\n## 2. 시장 성숙도와 고객 수용도\n\n**한 줄 판단.** 에이전트가 대신 결제하는 기술과 결제 인프라는 2026년에 빠르게 갖춰지고 있습니다. 반면 고객은 아직 \"비교는 맡기고 구매 결정은 직접 하는\" 단계입니다. PF-01이 노리는 \"계속 맡기는 권한\"은 고객 수용도가 가장 낮은 영역입니다.\n\n### 시장은 어디까지 왔나\n\n| 영역 | 현재 단계 | 근거 |\n|---|---|---|\n| 결제 규격 | **출시** | Google이 사용자가 정한 한도 안에서 에이전트가 대신 결제하는 규격(AP2)을 공개했습니다. 결제할 때마다 위임 기록이 남습니다. (2026년 5월, [[SIG-20261006-13]]) |\n| 쇼핑 에이전트 | **출시** | Amazon이 목표 가격 자동 구매, 세제·사료 정기 재구매, 타 쇼핑몰 대리 구매 기능을 무료로 제공합니다. (2026년 5월, [[SIG-20261006-14]]) |\n| 국내 결제 인프라 | **실증** | KB국민카드가 에이전트 결제 실증을 시작했고, 신한·하나카드도 개발 중입니다. 아직 상용 서비스는 없습니다. (2026년 9월, [[SIG-20261006-04]]) |\n| 시장 규모 전망 | **성장 초입** | Morgan Stanley는 2030년 미국 온라인 쇼핑의 10~20%(1,900억~3,850억 달러)가 에이전트를 거칠 것으로 전망합니다([[SIG-20261006-11]]). McKinsey는 2030년 글로벌 규모를 3조~5조 달러로 추산합니다([[SIG-20261006-12]]). |\n\n**먼저 열리는 품목.** 식료품과 생활소비재가 에이전트 구매로 가장 먼저 넘어갈 것으로 보입니다([[SIG-20261006-11]]). 세제, 필터 같은 가전 소모품이 여기에 들어갑니다.\n\n### 고객은 어디까지 맡기나\n\n에이전트에게 맡기는 정도를 세 단계로 나누면, 단계가 올라갈수록 고객 수용도가 낮아집니다.\n\n| 위임 단계 | 예시 | 현재 수용도 |\n|---|---|---|\n| 1. 찾아보고 비교하기 | \"가장 싼 세제 찾아줘\" | **높음.** 유럽 소비자 38%가 구매 결정에 AI를 씁니다([[SIG-20261006-12]]). 미국 소비자 약 4분의 1은 최근 한 달 사이 AI로 구매한 경험이 있습니다([[SIG-20261006-11]]). |\n| 2. 한 번 대신 사기 | \"이 가격 되면 사줘\" | **시작 단계.** 서비스는 나왔지만(Amazon) 장바구니 담기와 결제 단계의 이용은 비교·탐색보다 크게 낮습니다([[SIG-20261006-12]]). |\n| 3. 계속 맡기기 | 자동 재주문, 요금제 교체·해지 | **가장 낮음.** 소비자들은 지속적인 권한을 맡기는 데 신뢰가 특히 약합니다([[SIG-20261006-12]]). **PF-01이 확보하려는 위치가 이 단계입니다.** |\n\n### LG에 주는 의미\n\n- **신뢰는 구독 가구에서 먼저 쌓을 수 있습니다.** LG 가전 구독 매출은 연 2.4조 원으로 베스트샵 판매의 약 절반입니다. 케어 매니저 약 4,000명이 정기 방문해 소모품을 교체합니다([[SIG-20261006-37]]). 이 가구들은 가전 관리를 이미 LG에 맡기고 있으므로, 3단계 위임을 받기에 가장 가까운 고객입니다.\n- **결제 규격은 따르고, 구매와 협상은 LG Agent가 직접 합니다.** Google이 위임 규격을 먼저 정했으므로 LG가 별도 규격을 만들 이유는 없습니다. 2026년 10월 결정(D-05)에 따라 구매와 공급자 협상은 LG Agent가 직접 수행합니다.\n- **소모품 자동 구매만으로는 차별화가 어렵습니다.** Amazon이 무료로 먼저 내놨기 때문입니다. LG의 강점은 구매 이력으로 추정하는 대신 기기가 감지한 잔량과 수명으로 \"언제 사야 하는지\"를 정확히 아는 것입니다.\n\n### 아직 확인되지 않은 것\n\n- 국내 소비자의 소모품 자동 재주문 이용률 (2년 안에 오르지 않으면 7장 반증 2에 해당)\n- 국내 카드사 에이전트 결제의 첫 상용 품목과 시점\n- 구독 가구 중 소모품을 자동 배송으로 받는 비중\n\n## 3. LG의 비대칭 자산\n\n**한 줄 판단.** 쇼핑 플랫폼은 구매 이력으로 수요를 추정합니다. LG는 기기 상태로 수요를 직접 확인합니다. 이 차이가 PF-01의 출발점입니다. 다만 결제, 쇼핑 에이전트, 상품 목록은 LG에 없어서 외부와 협력해야 합니다.\n\n### LG만 가진 자산\n\n| 자산 | LG가 아는 것, 할 수 있는 것 | 경쟁사는 어떻게 하나 | 받쳐 주는 권한 |\n|---|---|---|---|\n| **기기 상태 데이터** | 세제 잔량, 정수기 필터 수명, 에어컨 필터 오염도를 기기가 직접 감지 | Amazon·쿠팡은 지난 구매 주기로 다음 구매를 추정 | 접근권 (구매 시점을 먼저 앎) |\n| **고장·부품 수명 이력** | 언제 고장 날지, 수리와 교체 중 무엇이 유리한지 판단 | 커머스 플랫폼은 고장 정보가 없어 가전 교체 수요를 예측하지 못함 | 판단권 (고가 품목의 구매 판단) |\n| **구독과 정기 방문** | 구독 매출 연 2.4조 원, 베스트샵 판매의 약 50%. 케어 매니저 약 4,000명이 방문해 소모품 교체 ([[SIG-20261006-37]]) | 온라인 플랫폼은 집 안에 들어갈 수 없음 | 위임 신뢰 (계속 맡기기의 기반) |\n| **설치 기반 (ThinQ 연결 가전)** | 가구 단위로 여러 가전을 함께 파악 | 쇼핑 에이전트는 기기를 연결하지 않음 | 접근권 |\n\n※ ThinQ 연결 가전 수와 소모품 자동 주문 이용 가구 수는 아직 근거가 없습니다. 다음 정기 점검에서 찾을 항목입니다.\n\n### 경쟁사별로 본 우위의 크기\n\n| 경쟁 상대 | LG 우위 | 이유 |\n|---|---|---|\n| Google, Amazon, 쿠팡, 네이버 | **큼** | 기기 상태와 방문 접점이 없습니다. 반대로 결제와 상품 목록은 이들이 압도적으로 강합니다. |\n| 카드사 | **보완 관계** | 결제 위임 인증은 카드사가 맡고, 수요 정보는 LG가 줍니다. |\n| 삼성전자 | **작음** | 주요 가전 구매자 셋 중 하나가 구독을 택하고 SmartThings도 있어, 같은 자산을 같은 방식으로 쌓고 있습니다([[SIG-20261006-37]]). |\n\n### LG에 없는 것과 메우는 방법\n\n| 없는 것 | 가진 쪽 | 메우는 방법 |\n|---|---|---|\n| 결제와 위임 인증 | Google(AP2), 카드사 | 규격을 따르고 카드사와 협력 |\n| 상품 목록과 물류 | Amazon, 쿠팡, 네이버 | 공급자가 LG가 묶은 수요에 직접 입찰하는 구조로 대체 |\n| 쇼핑 에이전트에 대한 사용자 습관 | Google, Amazon | 구독 가구와 ThinQ 앱 안에서 먼저 위임 경험을 쌓음 |\n\n### 우위가 사라지는 조건\n\n- 쇼핑 에이전트가 제조사를 거치지 않고 기기 잔량 정보를 직접 받는 표준이 생기는 경우 (7장 반증 1)\n- 삼성이 구독 규모에서 LG를 앞서는 경우\n\n## 4. 종합 평가\n\n<!-- AUTO:SCORE -->\n**총점 34.5 / 40** (기준선 35.0, −0.5) · **사분면 Moonshots** — X(독점우위+실행) 7.0 · Y(네트워크+TAM) 9.5\n\n| 기준 | 기준선 (2026-09-13) | 현재 | 변화 | 최근 변경 근거 |\n|---|:-:|:-:|:-:|---|\n| TAM | 5.0 | **5.0** | – |  |\n| 고객가치 | 5.0 | **5.0** | – |  |\n| LG 독점우위 | 4.5 | **4.0** | −0.5 | 2026-10-06 · [[SIG-20261006-13]], [[SIG-20261006-14]] |\n| 네트워크 효과 | 4.5 | **4.5** | – |  |\n| 데이터 해자 | 4.5 | **4.5** | – |  |\n| 수익화 | 4.0 | **4.0** | – |  |\n| 실행 용이성 | 3.0 | **3.0** | – |  |\n| 전략적 차별성 | 4.5 | **4.5** | – |  |\n<!-- /AUTO:SCORE -->\n\n**해석.** TAM·고객가치는 만점에 가깝지만, 이 가치를 누가 가져가느냐가 문제다. 2026년 들어 구글·아마존이 위임장 규격과 소모품 재주문을 먼저 표준화하면서 LG 독점우위를 4.5에서 4.0으로 낮췄다. 실행 용이성(3.0)은 \"고객 신뢰 기반과 에이전트 무결성이 전제\"라는 평가 당시 판단이 맥킨지 조사로 재확인됐다. 2×2에서 Moonshot에 머무는 이유가 이 두 항목이다.\n\n## 5. 판단 근거\n\n### 강화 근거\n- 에이전트 결제가 카드사 실증 단계에 들어감 — [[SIG-20261006-04]]\n- 2030년 미국 에이전틱 커머스 1,900억~3,850억 달러, 생활소비재가 첫 카테고리 — [[SIG-20261006-11]]\n- 가전 구독이 판매의 절반 수준으로 확대, 위임 신뢰의 예행연습 — [[SIG-20261006-37]]\n- 1인가구 800만 돌파, 소득·자산 여력이 낮은 가구일수록 가격 최적화 가치가 큼 — [[SIG-20261006-02]]\n- TV가 쇼핑 관문으로 재편되며 PF-04와 결합할 여지 — [[SIG-20261006-29]]\n\n### 약화 근거\n- 구글이 위임장(Mandate)을 결제 규격으로 표준화 — Control Point의 형식을 플랫폼이 먼저 정의 — [[SIG-20261006-13]]\n- 아마존이 소모품 정기 재구매·자동구매를 무료로 제공 — 첫 웨지 선점 — [[SIG-20261006-14]]\n- 소비자는 지속 권한 위임을 꺼림 — [[SIG-20261006-12]]\n\n## 6. 경쟁 지형\n\n| 주체 | 노리는 자리 | 강점 | LG와의 관계 |\n|---|---|---|---|\n| Google (AP2·UCP·Universal Cart) | 위임장 규격 + 장바구니 통합 | 검색·제미나이·결제 | 규격을 따를 대상. 구매와 공급자 협상은 LG Agent가 직접 수행(D-05) |\n| Amazon (Alexa for Shopping) | 반복 구매 자동화 | 카탈로그·물류·프라임 | 소모품 웨지에서 정면 경쟁 |\n| 카드사 (KB·신한·하나, Visa·Mastercard) | 결제 위임 인증 | 결제 레일·신용 | 협력 대상 |\n| 쿠팡·네이버 | 국내 커머스 에이전트 | 국내 물류·회원 | 국내 웨지에서 경쟁 |\n| 삼성전자 | 가전 구독 + SmartThings | 구독 확대 속도 | 같은 경로 경쟁 |\n\n## 7. 핵심 리스크\n\n- **반증 1** — 플랫폼 쇼핑 에이전트가 IoT 기기 상태 데이터를 제조사 없이 직접 받는 표준이 생기면(예: 커머스 프로토콜에 기기 잔량 API 포함), LG의 \"관측된 수요\" 우위가 사라진다.\n- **반증 2** — 국내 소비자의 가전 소모품 자동 재주문 이용률이 2년 내 의미 있게 오르지 않으면, 위임의 첫 웨지가 성립하지 않는다.\n- **불확실성** — LG가 결제·카탈로그 없이 \"수요 묶음 협상력\"을 가질 만큼 위임 가구 수를 모을 수 있는가.\n\n## 8. 점검 지표\n\n- 커머스 프로토콜(AP2·UCP·ACP)에 IoT·가전 제조사가 참여하는지\n- 국내 카드사 에이전트 결제의 첫 상용 카테고리\n- LG·삼성 구독 가구 수, 구독 내 소모품 자동 배송 비중\n- 쿠팡·네이버의 정기 재구매 에이전트 출시\n\n## 9. 추진 로드맵 (2030 End-state)\n\n- **Wedge** — 구독 가구의 소모품 자동 재주문(필터·세제·캡슐). 기기 상태 기반이라 \"왜 지금 사야 하는지\"를 증명할 수 있다.\n- **Expansion** — 가전 교체 시점 제안 → 생활 서비스(세탁·청소·수리) 묶음 조달 → 통신·보험 등 가구 고정비 재협상.\n- **2030 End-state** — 가구가 \"가전·집 관련 지출 예산\"을 LG Agent에 맡기고, LG는 묶음 수요로 공급자 조건을 협상한다. 결제는 표준 위임장 위에서 이뤄진다.\n\n## 10. 연계 과제\n\n- Stack: **Household** — [[PF-07]] 집 진단이 수요 신호를, PF-01이 조달을 맡는 구조\n- [[PF-04]] TV·홈 허브가 쇼핑 관문이 될 경우 위임의 인터페이스\n- 수요층 지수: [[시간빈곤지수]] · [[가사외주화지수]]\n\n## 11. 평가 변경 내역\n\n<!-- AUTO:LOG -->\n**점수 변경**\n\n- 2026-10-06 · LG 독점우위 4.5 → 4.0 — Google(위임 결제 규격)과 Amazon(자동 재구매)이 구매 위임의 표준과 소모품 재주문 시장을 먼저 확보했습니다. LG의 차별 요소는 가전 상태 기반 수요 예측으로 좁아졌습니다. ([[SIG-20261006-13]], [[SIG-20261006-14]])\n<!-- /AUTO:LOG -->\n\n## 12. Source\n\n<!-- AUTO:SOURCES -->\n출처 8건 — 컨설팅 1 · 투자은행 1 · 정부·공공 1 · 글로벌기업 2 · 언론 3\n\n1. **[컨설팅]** McKinsey QuantumBlack, 2026-03-02 — [McKinsey, 유럽 소비자는 \"판단은 AI에, 지속 권한은 본인에게\"](https://www.mckinsey.com/capabilities/quantumblack/our-insights/europes-agentic-commerce-moment-decision-influence-is-here-execution-is-coming) · [[SIG-20261006-12]] · 약화 ●●○\n2. **[투자은행]** Morgan Stanley Research, 2025-12-08 — [Morgan Stanley, 2030년 미국 에이전틱 커머스 1,900억~3,850억 달러 전망](https://www.morganstanley.com/insights/articles/agentic-commerce-market-impact-outlook) · [[SIG-20261006-11]] · 강화 ●●○\n3. **[정부·공공]** 국가데이터처 「2025 통계로 보는 1인가구」(경향신문 보도), 2025-12-09 — [1인가구 804만·36.1%, 70세 이상이 최대 비중](https://www.khan.co.kr/article/202512091341001) · [[SIG-20261006-02]] · 강화 ●●●\n4. **[글로벌기업]** About Amazon, 2026-05-13 — [Amazon \"Alexa for Shopping\" — 목표가 자동구매·정기 재구매·타 사이트 구매](https://www.aboutamazon.com/news/retail/alexa-for-shopping-ai-assistant) · [[SIG-20261006-14]] · 약화 ●●○\n5. **[글로벌기업]** The Next Web, 2026-05-19 — [Google I/O 2026 — Universal Cart와 위임장(Mandate) 기반 에이전트 결제 AP2](https://thenextweb.com/news/google-universal-cart-agent-payments-shopping-io-2026) · [[SIG-20261006-13]] · 약화 ●●●\n6. **[언론]** 헤럴드경제 (국가데이터처 인구주택총조사), 2026-07-28 — [2025 인구주택총조사 — 1인가구 824만(36.6%), 고령자 1인가구 245만(10.9%)](https://biz.heraldcorp.com/article/10822914) · [[SIG-20261006-48]] · 강화 ●●○\n7. **[언론]** 아시아경제, 2026-09-29 — [KB국민카드, AI 에이전트 결제 실증 착수](https://view.asiae.co.kr/article/2026092914134006340) · [[SIG-20261006-04]] · 강화 ●●○\n8. **[언론]** 파이낸셜뉴스, 2026-10-03 — [가전 구독 판 확대 — LG 연 2.4조·베스트샵 판매의 약 50%, 케어 매니저 약 4,000명](https://www.fnnews.com/news/202610030700598029) · [[SIG-20261006-37]] · 강화 ●●●\n<!-- /AUTO:SOURCES -->\n\n## 부록. 심층 분석\n\nTemplate v2 18항목 심층 분석은 별도 문서 [[PF-01-study]]에 있습니다.\n\n## 변경 이력\n- 2026-10-06: 위키 초판. 2026년 1월 이후 글로벌 소스 반영. 독점우위 4.5→4.0 (구글 AP2·아마존 자동구매).\n- 2026-10-06: Template v2 18항목 In-depth Study 전개(부록).\n- 2026-10-06: 원안 유지로 결정(D-05). LG Agent가 구매와 공급자 협상을 직접 수행.\n- 2026-10-06: 심층 분석 부록을 별도 문서(wiki/study/PF-01-study.md)로 분리.\n- 2026-10-06: 챕터 제목 일괄 정비 (사업 가설, 시장 성숙도와 고객 수용도, 종합 평가, 판단 근거, 핵심 리스크, 점검 지표, 추진 로드맵, 연계 과제, 평가 변경 내역, Source).\n- 2026-10-06: 1~3장 재작성 (한 줄 판단, 고객 변화, 확보할 권한, 시장·고객 수용 단계, 경쟁사 대비 자산 비교 구조).\n", "PF-02": "---\nid: PF-02\nname: Physical Environment Runtime\nname_ko: 로봇용 가전 규격\none_liner: 외부 AI·로봇이 LG 제품과 공간을 별도 학습 없이 안전하게 쓰도록 하는 환경 측 런타임\nstack: Physical AI\nessence: Action\ncontrol_point: 물리 환경 행동 모델 (Physical Skill Contract)\nmechanism: Runtime + Standard + Developer Ecosystem\nconviction: 유지\nupdated: 2026-10-06\nstudy: wiki/study/PF-02-study.md\nradar_ko: [로봇 파운데이션 모델, 홈로봇 가전 연동, 피지컬 AI, 휴머노이드 가정, 가전 제어 표준]\nradar_en: [robot foundation model, physical AI home robot, VLA household, Matter robot API, humanoid appliance interaction]\n---\n\n# PF-02 Physical Environment Runtime — 물리 환경 런타임\n\n> 구글·엔비디아가 로봇의 두뇌를 발전시켜도, 기기의 내부 상태·안전 조건·실행 검증은 제조사만 안다. 그 지식을 외부 로봇과 AI가 호출하는 런타임으로 만든다.\n\n## 1. 사업 가설\n\n**한 문장 정의.** 로봇과 AI 에이전트가 집 안의 가전과 공간에서 행동할 때, 별도 학습 없이 \"이 기기를 이렇게 쓰면 안전하고, 실행 결과는 이렇게 확인된다\"를 제공하는 환경 측 실행 계층.\n\n**Control Point — 물리 환경 행동 모델(Physical Skill Contract).** 로봇이 세탁기 문을 열고, 식기세척기를 돌리고, 냉장고에서 물건을 꺼낼 때 그 행동의 **허용 조건과 완료 검증**을 누가 정의하는가.\n\n| 요건 | PF-02에서의 의미 |\n|---|---|\n| Access Right | 가전 내부 상태(잠금, 온도, 작동 단계, 오류)에 대한 실시간 접근 |\n| Decision Right | 지금 이 행동을 해도 되는지(안전 조건)를 판정 |\n| Rejection Right | 안전하지 않은 행동·검증되지 않은 로봇의 호출을 거부 |\n\n**Platform Mechanism.** Runtime(실행 계층) + Standard(행동 계약 규격) + Developer Ecosystem(로봇 OEM·AI 개발자). 수요 측은 로봇 OEM과 AI 개발자, 공급 측은 LG 및 타사 가전·설비.\n\n**플랫폼 전환점.** LG 로봇(CLOiD)이 LG 가전을 쓰는 것은 내부 통합이다. 타사 로봇이 LG 런타임을 호출하고, 타사 가전도 같은 계약 규격을 따르는 순간 플랫폼이 된다.\n\n## 2. 시장 성숙도와 고객 수용도\n\n- **로봇의 두뇌가 빠르게 범용화되고 있다.** 엔비디아는 CES 2026에서 월드 모델과 휴머노이드용 모델을 오픈소스로 공개했고([[SIG-20261006-15]]), 범용 로봇 모델 스타트업은 기업가치 110억 달러를 인정받았다([[SIG-20261006-16]]). 두뇌가 흔해질수록 차별화는 **환경 쪽**으로 이동한다.\n- **가정용 로봇이 가전을 직접 다루기 시작했다.** 1X NEO는 식기세척기 조작과 조리대 닦기를 시연했고([[SIG-20261006-06]]), LG CLOiD는 요리·세탁을 하면서 ThinQ로 가전을 조율한다([[SIG-20261006-17]]).\n- **보급 시나리오가 커졌다.** 골드만삭스는 2035년 휴머노이드 650만 대로 전망을 크게 올렸다([[SIG-20261006-18]]). 다만 모건스탠리 장기 전망에서 가정용은 2030년대 후반 이후 본격화된다([[SIG-20261006-19]]).\n- **사람 손이 줄어든다.** 외국인 가사관리사 본사업이 무산되면서 가사 노동의 인력 공급 경로가 막혔다([[SIG-20261006-09]]).\n\n## 3. LG의 비대칭 자산\n\n- **기기 내부 상태와 안전 조건.** 펌웨어, 센서, 고장 모드, 작동 단계는 제조사만 안다. 시각 기반 로봇은 문이 잠겼는지, 고온 상태인지, 작동 중인지를 정확히 알 수 없다.\n- **가장 넓은 가전 포트폴리오.** 세탁·주방·공조·TV를 모두 만드는 회사는 많지 않다.\n- **자체 로봇과 부품.** CLOiD와 AXIUM 액추에이터로 런타임을 내부에서 먼저 검증할 수 있다([[SIG-20261006-17]]). CEO 직속 로봇사업센터가 가정용 로봇을 직접 맡는다([[SIG-20261006-21]]).\n- **엔비디아 생태계 파트너.** CES 2026 엔비디아 발표 파트너에 포함됐다([[SIG-20261006-15]]).\n\n## 4. 종합 평가\n\n<!-- AUTO:SCORE -->\n**총점 34.5 / 40** (기준선 34.5, –) · **사분면 Moonshots** — X(독점우위+실행) 7.5 · Y(네트워크+TAM) 9.5\n\n| 기준 | 기준선 (2026-09-13) | 현재 | 변화 | 최근 변경 근거 |\n|---|:-:|:-:|:-:|---|\n| TAM | 5.0 | **5.0** | – |  |\n| 고객가치 | 5.0 | **5.0** | – |  |\n| LG 독점우위 | 4.5 | **4.5** | – |  |\n| 네트워크 효과 | 4.5 | **4.5** | – |  |\n| 데이터 해자 | 5.0 | **5.0** | – |  |\n| 수익화 | 2.5 | **2.5** | – |  |\n| 실행 용이성 | 3.0 | **3.0** | – |  |\n| 전략적 차별성 | 5.0 | **5.0** | – |  |\n<!-- /AUTO:SCORE -->\n\n**해석.** 데이터 해자(5.0)와 전략적 차별성(5.0)이 최고 수준이지만, 수익화(2.5)와 실행 용이성(3.0)이 병목이다. 생태계를 먼저 만들어야 돈이 되고, 로봇 호환성 표준화가 어렵다. 2026년 신호는 양방향이어서 점수를 바꾸지 않고 독점우위를 관찰 중이다 — 범용 모델이 가전을 시각만으로 다룰 수 있게 되면 약화, 두뇌가 범용화될수록 기기 측 계약 가치가 오른다면 강화.\n\n## 5. 판단 근거\n\n### 강화 근거\n- 로봇 두뇌의 오픈소스화 → 차별화가 환경 측으로 이동, LG는 엔비디아 파트너 — [[SIG-20261006-15]]\n- LG CLOiD가 ThinQ로 가전을 조율하는 구조 — 1자 런타임의 원형 — [[SIG-20261006-17]]\n- CEO 직속 로봇사업센터, 가정용 로봇 본사 직접 수행 — [[SIG-20261006-21]]\n- 골드만삭스 휴머노이드 전망 대폭 상향 — [[SIG-20261006-18]]\n- Matter 1.5 등 기기 제어 표준 확대 → 표준이 못 다루는 내부 상태가 차별점으로 남음 — [[SIG-20261006-32]]\n- 가사 인력 공급 경로 축소 — [[SIG-20261006-09]]\n\n### 약화 근거\n- 구글 Gemini Robotics 2 — 범용 모델이 시각·손 조작만으로 가정 작업 범위를 넓힘 — [[SIG-20261006-47]]\n- 범용 로봇 모델에 자본 집중, 시각 기반으로 가전을 다루는 능력이 빨라질 위험 — [[SIG-20261006-16]]\n- 가정용 휴머노이드 본격 보급은 2030년대 후반 — 수익화 지연 — [[SIG-20261006-19]]\n\n## 6. 경쟁 지형\n\n| 주체 | 노리는 자리 | 강점 | LG와의 관계 |\n|---|---|---|---|\n| NVIDIA (Cosmos·GR00T·Isaac) | 로봇 두뇌·시뮬레이션 표준 | 컴퓨팅·개발자 생태계 | 파트너. 두뇌는 엔비디아, 환경은 LG 구도가 이상적 |\n| Physical Intelligence 등 범용 모델 기업 | 범용 VLA | 자본·연구 | 런타임 필요성을 낮출 수 있는 잠재 위협 |\n| Google (Gemini Robotics) | 두뇌 + 홈(Google Home) | 모델·홈 허브 | 환경 표준까지 수직 통합할 위험 |\n| Tesla Optimus | 수직 통합 휴머노이드 | 제조·데이터 | 외부 런타임 비사용 가능성 |\n| 삼성전자 | 가전 + 로봇(볼리 등) + SmartThings | 생태계 규모 | 같은 자리 경쟁 |\n| CSA (Matter) | 기기 제어 표준 | 산업 합의 | 표준 위에 안전·검증 계층을 얹는 전략 필요 |\n\n## 7. 핵심 리스크\n\n- **반증 1** — 범용 로봇이 제조사 API 없이 가전 작업을 일정 수준 이상 안전하게 수행한다는 공개 벤치마크가 나오면 Control Point의 필요성이 약해진다.\n- **반증 2** — Matter 등 개방 표준이 \"행동 허용 조건·완료 검증\"까지 포함하게 되면 제조사 고유 계약의 가치가 줄어든다.\n- **불확실성** — 타사 로봇 OEM이 LG 런타임을 쓸 유인(안전 인증, 보험, 책임 분담)을 어떻게 설계할 것인가.\n\n## 8. 점검 지표\n\n- 로봇 OEM이 가전 API를 공식 지원한다는 발표\n- Matter·HCA 규격에 로봇 액션 계층이 추가되는지\n- CLOiD 출시 일정과 ThinQ 로봇 API의 외부 개방\n- 가정용 로봇의 가전 조작 실패·안전 사고 보고\n\n## 9. 추진 로드맵 (2030 End-state)\n\n- **Wedge** — LG 가전 + LG 로봇(CLOiD) 조합에서 \"안전 행동 계약\" 규격을 만들고 내부 검증.\n- **Expansion** — 엔비디아 Isaac 등 개발 도구에 LG 가전 행동 모델 공개 → 타사 로봇 OEM 호출 → 타사 가전의 규격 채택.\n- **2030 End-state** — 로봇이 집 안에서 가전을 다룰 때 거쳐야 하는 안전·검증 계층의 사실상 표준.\n\n## 10. 연계 과제\n\n- Stack: **Physical AI** — PF-02(기술·개발자 계층) → [[PF-03]] 공간 OS → [[PF-06]] 로봇 운영(운영·SLA 계층)\n- 수요층 지수: [[가사외주화지수]] · [[돌봄부담지수]]\n\n## 11. 평가 변경 내역\n\n<!-- AUTO:LOG -->\n점수 변경 없음 (기준선 유지).\n\n**관찰 중 (변경 보류)**\n\n- 2026-10-06~ · LG 독점우위 약화 방향 — 범용 로봇 AI가 화면 인식과 손 조작만으로 가전을 다루게 되면 가전 규격의 필요성이 줄어듭니다. 반대로 로봇 AI가 범용화될수록 가전 안전·검증 기준의 가치가 커진다는 근거도 있어 점수를 유지합니다. (근거 [[SIG-20261006-16]], [[SIG-20261006-47]]; 반대 근거 [[SIG-20261006-15]], [[SIG-20261006-17]])\n<!-- /AUTO:LOG -->\n\n## 12. Source\n\n<!-- AUTO:SOURCES -->\n출처 10건 — 투자은행 2 · 정부·공공 1 · 글로벌기업 3 · 언론 4\n\n1. **[투자은행]** Morgan Stanley Research, 2025-05-14 — [Morgan Stanley, 2050년 휴머노이드 5조 달러·10억 대, 가정용은 약 10%](https://www.morganstanley.com/insights/articles/humanoid-robot-market-5-trillion-by-2050) · [[SIG-20261006-19]] · 강화 ●○○\n2. **[투자은행]** Humanoid.guide (Goldman Sachs 리포트 보도), 2026-09-15 — [Goldman Sachs, 2035년 휴머노이드 650만 대·1,380억 달러로 전망 대폭 상향](https://humanoid.guide/goldman-raises-2035-humanoid-robot-forecast-to-6-5-million/) · [[SIG-20261006-18]] · 강화 ●●○\n3. **[정부·공공]** Connectivity Standards Alliance, 2025-11-20 — [Matter 1.5 — 전기요금·탄소 신호를 기기에 전달하는 에너지 관리 기능 표준화](https://csa-iot.org/newsroom/matter-1-5-introduces-cameras-closures-and-enhanced-energy-management-capabilities/) · [[SIG-20261006-32]] · 강화 ●○○\n4. **[글로벌기업]** LG전자 (PR Newswire), 2026-01-04 — [LG CLOiD 홈로봇 공개 — VLA 기반, ThinQ로 가전 조율, AXIUM 액추에이터](https://www.prnewswire.com/news-releases/lg-electronics-presents-lg-cloid-home-robot-to-demonstrate-zero-labor-home-at-ces-2026-302652192.html) · [[SIG-20261006-17]] · 강화 ●●○\n5. **[글로벌기업]** NVIDIA Investor Relations, 2026-01-05 — [NVIDIA, CES 2026에서 Cosmos·GR00T 오픈 모델 공개 — LG전자 파트너로 홈로봇 발표](https://investor.nvidia.com/news/press-release-details/2026/NVIDIA-Releases-New-Physical-AI-Models-as-Global-Partners-Unveil-Next-Generation-Robots/default.aspx) · [[SIG-20261006-15]] · 강화 ●●○\n6. **[글로벌기업]** Google DeepMind, 2026-07-30 — [Google DeepMind Gemini Robotics 2 — 전신 제어·손재주, 로봇 OEM 4곳과 협력](https://deepmind.google/blog/gemini-robotics-2-brings-whole-body-intelligence-to-robots/) · [[SIG-20261006-47]] · 약화 ●○○\n7. **[언론]** AI타임스, 2025-11-03 — [1X NEO 가정용 휴머노이드, 구매 또는 월 구독 + 원격 조작 지원](https://www.aitimes.com/news/articleView.html?idxno=203684) · [[SIG-20261006-06]] · 강화 ●●○\n8. **[언론]** 경향신문, 2025-12-22 — [외국인 가사관리사 본사업 미추진 결정](https://www.khan.co.kr/article/202512221801001) · [[SIG-20261006-09]] · 강화 ●●○\n9. **[언론]** The Elec, 2026-03-31 — [Physical Intelligence 기업가치 110억 달러 — 로봇 파운데이션 모델에 자본 집중](https://www.thelec.net/news/articleView.html?idxno=6214) · [[SIG-20261006-16]] · 약화 ●●○\n10. **[언론]** The Korea Times, 2026-06-30 — [LG전자, CEO 직속 로봇사업센터 신설 — 가정용·상업용·산업용 역할 분담](https://www.koreatimes.co.kr/business/companies/20260630/lg-electronics-to-establish-control-tower-for-robotics-business) · [[SIG-20261006-21]] · 강화 ●●●\n<!-- /AUTO:SOURCES -->\n\n## 부록. 심층 분석\n\nTemplate v2 18항목 심층 분석은 별도 문서 [[PF-02-study]]에 있습니다.\n\n## 변경 이력\n- 2026-10-06: 위키 초판. 점수 변경 없음, 독점우위 관찰 등록 (범용 로봇 모델 vs 환경 측 계약).\n- 2026-10-06: Template v2 18항목 In-depth Study 전개(부록), 신호 1건 추가.\n- 2026-10-06: 심층 분석 부록을 별도 문서(wiki/study/PF-02-study.md)로 분리.\n- 2026-10-06: 챕터 제목 일괄 정비 (사업 가설, 시장 성숙도와 고객 수용도, 종합 평가, 판단 근거, 핵심 리스크, 점검 지표, 추진 로드맵, 연계 과제, 평가 변경 내역, Source).\n", "PF-03": "---\nid: PF-03\nname: Autonomous Space OS\nname_ko: 공간 운영 OS\none_liner: HVAC를 앵커로 가전·디스플레이·로봇·정비를 묶어 공간의 운영 목표와 가동률을 자율 최적화한다\nstack: Physical AI\nessence: Space Operation\ncontrol_point: 공간의 자율 운영 상태 + Uptime 책임\nmechanism: Runtime + Aggregation + Application Ecosystem\nconviction: 유지\nupdated: 2026-10-06\nstudy: 별도 문서 (2026-09, 저장소 미포함)\nradar_ko: [데이터센터 냉각 수주, 빌딩 자동화 AI, 칠러 CDU, 빌딩 운영 SLA, 상업공간 에너지 관리]\nradar_en: [data center cooling contract, building automation agentic AI, OpenBlue Building X, liquid cooling acquisition, uptime service agreement]\n---\n\n# PF-03 Autonomous Space OS — 자율 공간 운영 OS\n\n> 설비별 모니터링이 아니라, 공간의 운영 목표와 가동(Uptime)을 책임지고 자율 최적화한다. Sense → Understand → Predict → Act → Learn.\n\n## 1. 사업 가설\n\n**한 문장 정의.** HVAC를 앵커로 공간 안의 가전·디스플레이·로봇·정비 서비스를 하나의 운영 체계로 묶고, 건물주·운영사에게 장비가 아니라 **가동률과 운영 성과**를 약속한다.\n\n**Control Point — 공간의 자율 운영 상태 + Uptime 책임.** 공간이 지금 어떤 상태이고 무엇을 해야 하는지를 판단하고, 결과(가동률·에너지·쾌적)에 책임지는 자리.\n\n| 요건 | PF-03에서의 의미 |\n|---|---|\n| Access Right | 공조·전력·출입·설비 데이터에 대한 상시 접근 |\n| Decision Right | 설정값·정비 시점·로봇 배치를 결정 |\n| Rejection Right | 성능 기준에 못 미치는 설비·서비스 공급자를 교체 |\n\n**Platform Mechanism.** Runtime(공간 운영 실행) + Aggregation(이종 설비 통합) + Application Ecosystem(외부 앱·서비스).\n\n**플랫폼 전환점.** LG HVAC만 관리하면 \"설비 원격관리\"다. 타사 설비와 외부 앱이 같은 OS 위에서 돌고, 계약이 장비 납품에서 성과 보증으로 바뀌는 순간 플랫폼이 된다.\n\n## 2. 시장 성숙도와 고객 수용도\n\n- **AI 데이터센터가 냉각을 핵심 인프라로 격상시켰다.** LG전자는 북미에서 5GW 규모 AI 데이터센터에 칠러·CDU를 장기 공급하는 계약을 맺었고([[SIG-20261006-05]]), 2분기 에코솔루션 마진 8.6%와 CDU 공급망 진입 추진을 밝혔다([[SIG-20261006-25]]). 델오로는 2026년 1GW급 사이트가 5곳 넘게 나오고 공랭·액랭 혼합 운영이 필요하다고 봤다([[SIG-20261006-26]]).\n- **가치가 장비에서 운영 소프트웨어로 이동한다.** 베인은 2030년 산업 자동화 이익 풀의 절반 이상이 소프트웨어·데이터·AI 계층으로 옮겨간다고 분석했다([[SIG-20261006-22]]).\n- **경쟁사가 운영 계층을 먼저 채우고 있다.** 존슨콘트롤즈는 빌딩 OS에 에이전틱 AI를 붙였고([[SIG-20261006-23]]), 이튼·버티브·다이킨은 열관리와 현장 서비스 업체를 인수했다([[SIG-20261006-24]]).\n- **데이터센터는 전력 유연성의 수요자이기도 하다.** VPP가 AI 데이터센터 전력 병목을 푸는 수단으로 거론된다([[SIG-20261006-30]]) — [[PF-05]]와 같은 고객.\n\n## 3. LG의 비대칭 자산\n\n- **HVAC 설치 기반과 설비 내부 데이터.** 칠러·VRF·히트펌프의 작동 상태와 고장 모드.\n- **데이터센터 냉각 레퍼런스의 급성장.** 5GW 장기 공급 계약은 대형 고객과의 장기 관계를 만든다.\n- **공간 안 다른 제품군.** 디스플레이(사이니지), 상업용 로봇(베어로보틱스), 상업용 가전.\n\n약점: 평가 당시 지적된 **4개 본부 손익 분산** — HVAC·디스플레이·로봇·서비스가 다른 조직에 있다.\n\n## 4. 종합 평가\n\n<!-- AUTO:SCORE -->\n**총점 34.0 / 40** (기준선 34.0, –) · **사분면 Moonshots** — X(독점우위+실행) 7.5 · Y(네트워크+TAM) 8.5\n\n| 기준 | 기준선 (2026-09-13) | 현재 | 변화 | 최근 변경 근거 |\n|---|:-:|:-:|:-:|---|\n| TAM | 5.0 | **5.0** | – |  |\n| 고객가치 | 4.5 | **4.5** | – |  |\n| LG 독점우위 | 4.0 | **4.0** | – |  |\n| 네트워크 효과 | 3.5 | **3.5** | – |  |\n| 데이터 해자 | 4.0 | **4.0** | – |  |\n| 수익화 | 4.5 | **4.5** | – |  |\n| 실행 용이성 | 3.5 | **3.5** | – |  |\n| 전략적 차별성 | 5.0 | **5.0** | – |  |\n<!-- /AUTO:SCORE -->\n\n**해석.** TAM(5.0)과 차별성(5.0)은 유지된다. 데이터센터 냉각 수주는 HVAC 앵커의 사업 체력을 확인했지만, 계약 내용이 **장비 공급**이지 **가동률 책임**이 아니어서 실행 용이성(3.5)을 올리지 않았다. 평가 당시 병목(본부 간 손익 통합)이 풀렸다는 신호가 없기 때문이다. 경쟁사의 운영 계층 선점은 독점우위 관찰 항목으로 올렸다.\n\n## 5. 판단 근거\n\n### 강화 근거\n- 북미 5GW AI 데이터센터 냉각 장기공급 계약 — [[SIG-20261006-05]]\n- ES 마진 개선, CDU 글로벌 공급망 진입 추진 — [[SIG-20261006-25]]\n- 산업 자동화 이익 풀이 소프트웨어·데이터로 이동 — 운영 OS 방향이 맞음 — [[SIG-20261006-22]]\n- 혼합 냉각·대형 사이트 확대로 공간 단위 통합 운영 필요 — [[SIG-20261006-26]]\n- 데이터센터 전력 병목 → 냉각과 유연성의 결합 고객 — [[SIG-20261006-30]]\n\n### 약화 근거\n- JCI OpenBlue 에이전틱 AI — 빌딩 자율 운영 자리 선점 시도 — [[SIG-20261006-23]]\n- Eaton·Vertiv·Daikin의 열관리·현장서비스 M&A — [[SIG-20261006-24]]\n\n## 6. 경쟁 지형\n\n| 주체 | 노리는 자리 | 강점 | LG와의 관계 |\n|---|---|---|---|\n| Johnson Controls (OpenBlue) | 빌딩 운영 OS + HVAC | BAS 설치 기반·서비스망 | 직접 경쟁 |\n| Siemens (Building X) | 빌딩 디지털 플랫폼 | 자동화·SI 채널 | 직접 경쟁 |\n| Vertiv·Schneider·Eaton | 데이터센터 열·전력 통합 | 데이터센터 전문성·M&A | 데이터센터에서 경쟁 |\n| Daikin·Trane·Carrier | HVAC + 액체냉각 | HVAC 점유율 | 설비·운영 모두 경쟁 |\n| 대형 SI | 빌딩 통합 구축 | 고객 관계 | 채널 파트너 또는 경쟁 |\n\n## 7. 핵심 리스크\n\n- **반증 1** — 데이터센터 운영사가 냉각 설비 데이터를 제조사에 열지 않고 자체·제3자 DCIM으로만 운영하면 Uptime 책임 모델이 성립하지 않는다.\n- **반증 2** — LG의 데이터센터 계약이 3년 내에도 장비 공급에만 머물면, PF-03은 \"HVAC 사업\"이지 플랫폼이 아니다.\n- **불확실성** — 본부 간 손익 구조를 공간 단위 계약으로 통합할 수 있는가.\n\n## 8. 점검 지표\n\n- LG 데이터센터 계약에 운영·유지보수·성능 보증 조항 포함 여부\n- 빌딩 OS 분야 에이전틱 AI 출시와 도입 사례 (JCI, Siemens, Honeywell)\n- 냉각·열관리 분야 M&A와 현장 서비스 인력 경쟁\n- 국내 대형 건물의 성과 기반 계약(ESCO 등) 확산\n\n## 9. 추진 로드맵 (2030 End-state)\n\n- **Wedge** — 데이터센터 냉각: 칠러·CDU 공급 고객에게 냉각 성능·가동률 모니터링을 붙여 운영 데이터 접근권 확보.\n- **Expansion** — 냉각 성능 보증 계약 → 상업 빌딩 공조 운영 → 로봇·디스플레이·정비를 같은 OS로 통합.\n- **2030 End-state** — 공간 운영 성과를 보증하는 OS. [[PF-06]] 로봇의 배치처, [[PF-05]] 유연성의 공급처가 된다.\n\n## 10. 연계 과제\n\n- Stack: **Physical AI** — [[PF-02]] 환경 런타임 → PF-03 → [[PF-06]] 로봇 운영\n- [[PF-05]] 데이터센터·빌딩이 유연 부하의 원천\n\n## 11. 평가 변경 내역\n\n<!-- AUTO:LOG -->\n점수 변경 없음 (기준선 유지).\n\n**관찰 중 (변경 보류)**\n\n- 2026-10-06~ · LG 독점우위 약화 방향 — Johnson Controls의 AI 빌딩 운영 시스템, Eaton·Vertiv·Daikin의 냉각·현장 서비스 업체 인수로 경쟁사가 운영 영역을 먼저 채우고 있습니다. LG의 데이터센터 냉각 수주 확대는 반대 근거입니다. 운영·성과 보증 계약이 확인되면 재판단합니다. (근거 [[SIG-20261006-23]], [[SIG-20261006-24]]; 반대 근거 [[SIG-20261006-05]], [[SIG-20261006-25]])\n<!-- /AUTO:LOG -->\n\n## 12. Source\n\n<!-- AUTO:SOURCES -->\n출처 6건 — 컨설팅 1 · 산업리서치 2 · 글로벌기업 2 · 언론 1\n\n1. **[컨설팅]** Bain & Company, 2026-04-07 — [Bain, 2030년 산업 자동화 매출 절반이 AI 의존 — 가치가 소프트웨어·데이터로 이동](https://www.bain.com/about/media-center/press-releases/2026/nearly-half-of-industrial-automation-revenue-to-rely-on-ai-by-2030-bain--company-finds/) · [[SIG-20261006-22]] · 강화 ●●○\n2. **[산업리서치]** Data Center Frontier, 2025-11-06 — [데이터센터 냉각 M&A — Eaton·Vertiv·Daikin, \"칩에서 그리드까지\" 열관리 수직통합](https://www.datacenterfrontier.com/cooling/article/55328396/chip-to-grid-gets-bought-eaton-vertiv-and-daikin-deals-imply-a-new-thermal-capital-cycle) · [[SIG-20261006-24]] · 약화 ●●○\n3. **[산업리서치]** Dell'Oro Group, 2025-12-16 — [Dell'Oro 2026 전망 — AI 랙은 공랭·액랭 혼합, 1GW급 사이트 5곳 이상](https://www.delloro.com/2026-predictions-data-center-physical-infrastructure-market/) · [[SIG-20261006-26]] · 강화 ●○○\n4. **[글로벌기업]** LG전자 뉴스룸, 2026-07-30 — [LG전자 2026년 2분기 — ES 마진 8.6%, CDU 공급망 진입, 구독 매출 성장](https://www.lg.com/global/newsroom/news/corporate/lg-electronics-releases-second-quarter-2026-financial-results/) · [[SIG-20261006-25]] · 강화 ●●○\n5. **[글로벌기업]** Johnson Controls, 2026-08-05 — [Johnson Controls, OpenBlue에 에이전틱 AI 추가 — 빌딩 운영 자동 실행](https://www.johnsoncontrols.com/media-center/news/press-releases/2026/08/04/johnson-controls-unveils-ai-powered-openblue-platform-expansions) · [[SIG-20261006-23]] · 약화 ●●○\n6. **[언론]** 머니투데이, 2026-10-05 — [LG전자, 북미 5GW 규모 AI 데이터센터 냉각 장기공급 계약](https://www.mt.co.kr/industry/2026/10/05/2026100516112469972) · [[SIG-20261006-05]] · 강화 ●●○\n<!-- /AUTO:SOURCES -->\n\n## 변경 이력\n- 2026-10-06: 위키 초판. 점수 변경 없음(장비 공급 ≠ Uptime 책임). 독점우위 관찰 등록.\n- 2026-10-06: 데이터센터 냉각은 장비 공급 중심으로 유지하기로 결정(D-02). 장기 Moonshot 과제로 관리.\n- 2026-10-06: 챕터 제목 일괄 정비 (사업 가설, 시장 성숙도와 고객 수용도, 종합 평가, 판단 근거, 핵심 리스크, 점검 지표, 추진 로드맵, 연계 과제, 평가 변경 내역, Source).\n", "PF-04": "---\nid: PF-04\nname: Ambient AI Distribution\nname_ko: AI 서비스 유통\none_liner: webOS와 TV·디스플레이 설치 기반으로 어떤 AI 서비스가 어떤 고객에게 언제 호출될지 결정하는 유통 계층이 된다\nstack: Distribution·Infrastructure\nessence: Customer Access\ncontrol_point: AI 서비스 유통 및 맥락 라우팅 결정권\nmechanism: Distribution + Runtime + Context Gateway\nconviction: 하락\nupdated: 2026-10-06\nstudy: wiki/study/PF-04-study.md\nradar_ko: [webOS AI, TV AI 에이전트, 스마트TV 운영체제 점유율, TV 광고 플랫폼, 홈 허브 AI]\nradar_en: [smart TV OS share, TV AI assistant Copilot Gemini Perplexity, webOS platform, retail media CTV, Vision AI Companion]\n---\n\n# PF-04 Ambient AI Distribution — 앰비언트 AI 유통\n\n> App Economy에서는 사용자가 앱을 골랐지만, Agent Economy에서는 AI가 의도를 이해하고 필요한 서비스를 호출한다. 그 호출을 결정하는 유통 계층이 된다.\n\n## 1. 사업 가설\n\n**한 문장 정의.** webOS와 TV·디스플레이 설치 기반을 이용해, 가정의 공용 화면에서 \"어떤 AI 서비스가 어떤 고객에게 언제 호출될 것인가\"를 결정한다. 현재의 콘텐츠·OTT 유통에서 AI 서비스 유통으로 진화하는 경로다.\n\n**Control Point — AI 서비스 유통 및 맥락 라우팅 결정권.**\n\n| 요건 | PF-04에서의 의미 |\n|---|---|\n| Access Right | 거실 화면·리모컨·음성 입력이라는 가구 공용 접점 |\n| Decision Right | 사용자 의도와 맥락(시청 중 콘텐츠, 시간, 가구 구성)에 따라 AI 서비스를 고르는 권한 |\n| Rejection Right | 기본 탑재·노출 위치·수익 배분 조건으로 AI 서비스 공급자를 선택·배제 |\n\n**Platform Mechanism.** Distribution(유통) + Runtime(실행 환경) + Context Gateway(맥락 제공). 수요 측은 가구, 공급 측은 AI 서비스 기업(LLM·에이전트·커머스·광고).\n\n**플랫폼 전환점.** LG 자체 AI만 TV에 넣으면 기능 추가다. 외부 AI 사업자가 webOS를 **유통 채널로 계약**(기본 탑재, 수익 배분, 맥락 API 사용)하는 순간 플랫폼이 된다.\n\n## 2. 시장 성숙도와 고객 수용도\n\n- **TV가 멀티 에이전트 관문이 되고 있다.** 삼성은 TV에서 빅스비·코파일럿·퍼플렉시티를 골라 쓰게 했고, 제미나이·알렉사+도 TV 통합을 추진 중이다([[SIG-20261006-27]]). 개념 자체는 검증됐지만 경쟁도 시작됐다.\n- **TV OS가 리테일 미디어로 재편된다.** 옴디아는 북미 TV OS 중 월마트·아마존 같은 리테일러 점유율이 2025년 27%에서 2029년 47%로 커질 것으로 봤다. 광고와 \"쇼핑 가능한 콘텐츠\"가 동력이다([[SIG-20261006-29]]).\n- **신뢰가 관문의 조건임이 드러났다.** webOS에 코파일럿이 삭제 불가로 들어가자 반발이 일었고 LG는 삭제 가능하게 바꿨다([[SIG-20261006-28]]).\n- **LG는 설치 기반을 넓히고 있다.** webOS 26을 구형 TV에도 배포하고 자체 AI 챗봇·컨시어지를 넣었으며([[SIG-20261006-07]]), webOS 플랫폼 사업은 실적 발표에서 성장 항목으로 언급된다([[SIG-20261006-25]]). 유럽에서는 ThinQ ON·Homey 홈 허브로 관문을 TV 밖으로 넓힌다([[SIG-20261006-34]]).\n\n## 3. LG의 비대칭 자산\n\n- **webOS 활성 기기 약 2.6억 대** — 평가 당시 \"대체 불가 자산\"으로 꼽힌 근거.\n- **OS를 직접 소유.** 구글 TV를 쓰는 제조사와 달리 라우팅 규칙을 LG가 정한다.\n- **TV 외 접점.** ThinQ ON 홈 허브, 가전 화면, 상업용 디스플레이.\n\n## 4. 종합 평가\n\n<!-- AUTO:SCORE -->\n**총점 35.5 / 40** (기준선 36.0, −0.5) · **사분면 Strategic Core** — X(독점우위+실행) 9.0 · Y(네트워크+TAM) 10.0\n\n| 기준 | 기준선 (2026-09-13) | 현재 | 변화 | 최근 변경 근거 |\n|---|:-:|:-:|:-:|---|\n| TAM | 5.0 | **5.0** | – |  |\n| 고객가치 | 4.5 | **4.5** | – |  |\n| LG 독점우위 | 4.5 | **4.5** | – |  |\n| 네트워크 효과 | 5.0 | **5.0** | – |  |\n| 데이터 해자 | 4.0 | **4.0** | – |  |\n| 수익화 | 4.5 | **4.5** | – |  |\n| 실행 용이성 | 4.5 | **4.5** | – |  |\n| 전략적 차별성 | 4.0 | **3.5** | −0.5 | 2026-10-06 · [[SIG-20261006-27]], [[SIG-20261006-38]] |\n<!-- /AUTO:SCORE -->\n\n**해석.** 9개 중 총점 최상위는 유지되지만 전략적 차별성을 4.0에서 3.5로 낮췄다. TV를 AI 유통 관문으로 쓰는 개념을 삼성이 먼저 구현했고 홈 허브 경쟁도 넓어졌기 때문이다. LG 독점우위(4.5)는 북미 리테일러 OS 확대라는 강한 반대 신호가 있지만 글로벌 설치 기반이 반대 근거여서 관찰로 두었다. 차별화는 이제 \"버튼으로 AI를 고르게 하는 것\"이 아니라 **맥락 기반 라우팅과 신뢰 설계**에서만 나온다.\n\n## 5. 판단 근거\n\n### 강화 근거\n- webOS 외부 TV 제조사 약 400곳 채택 — 이미 타사 기기를 받아들인 플랫폼 — [[SIG-20261006-45]]\n- webOS 26 구형 TV 배포, 자체 AI 기능 탑재 — [[SIG-20261006-07]]\n- webOS 플랫폼 사업 성장 지속 — [[SIG-20261006-25]]\n- ThinQ ON·Homey로 TV 밖 홈 허브 확장 — [[SIG-20261006-34]]\n\n### 약화 근거\n- 삼성 TV 멀티 AI 에이전트 — 개념 선점 — [[SIG-20261006-27]]\n- 삼성 SmartThings 5억 사용자, 홈 AI 관문 경쟁 — [[SIG-20261006-38]]\n- 북미 TV OS의 리테일러 점유율 확대 전망 — [[SIG-20261006-29]]\n- 코파일럿 강제 설치 반발 — 관문 지위는 신뢰에 의존 — [[SIG-20261006-28]]\n\n## 6. 경쟁 지형\n\n| 주체 | 노리는 자리 | 강점 | LG와의 관계 |\n|---|---|---|---|\n| Samsung (Tizen·Vision AI Companion) | 멀티 에이전트 TV 관문 | 최대 TV 점유율·SmartThings | 직접 경쟁 |\n| Google (Google TV + Gemini) | TV OS + AI | 모델·광고·안드로이드 | 직접 경쟁 |\n| Walmart (Vizio OS)·Amazon (Fire TV) | 리테일 미디어 TV OS | 커머스 데이터·광고 | 북미에서 직접 경쟁 |\n| Roku | 독립 TV OS | 미국 점유율 | 북미 경쟁 |\n| AI 기업 (Microsoft·Perplexity·OpenAI) | 유통 채널 확보 | 모델 | 공급자 — 협상 대상 |\n\n## 7. 핵심 리스크\n\n- **반증 1** — AI 사용이 TV가 아니라 스마트폰·웨어러블·스마트 글래스에 집중되면 거실 공용 화면의 관문 가치가 낮아진다.\n- **반증 2** — 외부 AI 기업이 webOS 기본 탑재에 대가를 지불하지 않고, 오히려 LG가 탑재료를 내는 구조가 고착되면 Control Point가 아니다.\n- **불확실성** — 맥락 기반 라우팅이 사용자 신뢰(프라이버시) 문제 없이 가능한가.\n\n## 8. 점검 지표\n\n- webOS 외부 AI 파트너 계약 구조(수익 배분·기본값)\n- 지역별 TV OS 점유율(옴디아·Kagan)\n- TV에서의 AI 서비스 사용량 지표\n- 홈 허브(ThinQ ON, SmartThings, Google Home) 경쟁\n\n## 9. 추진 로드맵 (2030 End-state)\n\n- **Wedge** — 시청 맥락 기반 AI 호출(콘텐츠 질문, 쇼핑, 여행 계획)을 webOS 기본 기능으로 만들고, 외부 AI는 사용자가 고르게 한다.\n- **Expansion** — AI 서비스 사업자에게 맥락 API·노출 위치를 상품화 → [[PF-01]] 구매 위임의 인터페이스 → 홈 허브로 접점 확장.\n- **2030 End-state** — 가정에서 AI 서비스가 호출되는 기본 경로 중 하나. 라우팅 수수료와 광고가 수익 구조.\n\n## 10. 연계 과제\n\n- Stack: **Distribution·Infrastructure** — [[PF-05]]와 함께 설치 기반을 새 시장의 관문으로 쓰는 축\n- [[PF-01]] TV가 쇼핑 관문이 되면 구매 위임의 화면\n- 수요층 지수: [[시간빈곤지수]]\n\n## 11. 평가 변경 내역\n\n<!-- AUTO:LOG -->\n**점수 변경**\n\n- 2026-10-06 · 전략적 차별성 4.0 → 3.5 — 삼성이 TV에서 여러 AI 서비스를 선택하는 기능을 먼저 출시하고 SmartThings로 가정 AI 접점을 넓혔습니다. TV를 AI 유통 채널로 쓰는 전략이 업계 공통이 되어, 차별화는 시청 맥락 기반 호출에 한정됩니다. ([[SIG-20261006-27]], [[SIG-20261006-38]])\n\n**관찰 중 (변경 보류)**\n\n- 2026-10-06~ · LG 독점우위 약화 방향 — 북미 TV 운영체제 시장에서 유통사 점유율이 2029년 47%로 커질 전망입니다. 글로벌 webOS 설치 기반 우위는 유지되므로 지역별 점유율 자료를 확인한 뒤 판단합니다. (근거 [[SIG-20261006-29]]; 반대 근거 [[SIG-20261006-07]], [[SIG-20261006-25]])\n<!-- /AUTO:LOG -->\n\n## 12. Source\n\n<!-- AUTO:SOURCES -->\n출처 8건 — 산업리서치 1 · 글로벌기업 3 · 언론 4\n\n1. **[산업리서치]** Omdia, 2026-01-26 — [Omdia — 북미 TV OS 중 리테일러 점유율 2025년 27% → 2029년 47%](https://omdia.tech.informa.com/pr/2026/jan/retailers-to-control-47percent-of-north-america-tv-os-share-by-2029-as-advertising-strategies-shift) · [[SIG-20261006-29]] · 약화 ●●●\n2. **[글로벌기업]** LG전자 뉴스룸, 2026-07-30 — [LG전자 2026년 2분기 — ES 마진 8.6%, CDU 공급망 진입, 구독 매출 성장](https://www.lg.com/global/newsroom/news/corporate/lg-electronics-releases-second-quarter-2026-financial-results/) · [[SIG-20261006-25]] · 강화 ●●○\n3. **[글로벌기업]** LG전자 뉴스룸, 2026-08-25 — [webOS 26 구형 TV 확대 배포, AI 챗봇·컨시어지 탑재](https://www.lg.com/us/newsroom/media-entertainment/lg-electronics-introduces-an-award-winning-ai-tv-experience-at-ifa-2026) · [[SIG-20261006-07]] · 강화 ●○○\n4. **[글로벌기업]** LG전자 (PR Newswire), 2026-09-03 — [LG IFA 2026 — ThinQ ON 중심 AI 홈 허브, Homey 통합, 히트펌프 라인업](https://www.prnewswire.com/ae/news-releases/lg-electronics-showcases-expanded-ai-home-ecosystem-for-european-lifestyles-at-ifa-2026-302868307.html) · [[SIG-20261006-34]] · 강화 ●○○\n5. **[언론]** 헤럴드경제, 2024-03-29 — [webOS 외부 TV 제조사 약 400곳 채택, 탑재 기기 2026년 3억 대 목표](https://biz.heraldcorp.com/article/3359423) · [[SIG-20261006-45]] · 강화 ●●○\n6. **[언론]** Thurrott, 2025-10-21 — [삼성 TV, Bixby·Copilot·Perplexity 멀티 AI 에이전트 탑재](https://www.thurrott.com/a-i/328616/perplexity-ai-joins-microsoft-copilot-on-samsung-smart-tvs) · [[SIG-20261006-27]] · 약화 ●●○\n7. **[언론]** Thurrott, 2025-12-19 — [webOS 코파일럿 강제 설치 논란 — LG, 완전 삭제 가능하도록 변경](https://www.thurrott.com/smart-tech/smart-home/330911/lg-to-make-microsoft-copilot-app-on-its-smart-tvs-fully-removable) · [[SIG-20261006-28]] · 약화 ●●○\n8. **[언론]** The Korea Herald, 2026-01-06 — [삼성 CES 2026 — SmartThings 5억 사용자, 보험사(HSB)와 스마트홈 데이터 연계](https://www.koreaherald.com/article/10649841) · [[SIG-20261006-38]] · 약화 ●●○\n<!-- /AUTO:SOURCES -->\n\n## 부록. 심층 분석\n\nTemplate v2 18항목 심층 분석은 별도 문서 [[PF-04-study]]에 있습니다.\n\n## 변경 이력\n- 2026-10-06: 위키 초판. 전략적 차별성 4.0→3.5 (삼성 멀티 에이전트 TV·SmartThings). 독점우위 관찰 등록 (북미 리테일러 OS).\n- 2026-10-06: Template v2 18항목 In-depth Study 전개(부록), 신호 1건 추가.\n- 2026-10-06: 심층 분석 부록을 별도 문서(wiki/study/PF-04-study.md)로 분리.\n- 2026-10-06: 챕터 제목 일괄 정비 (사업 가설, 시장 성숙도와 고객 수용도, 종합 평가, 판단 근거, 핵심 리스크, 점검 지표, 추진 로드맵, 연계 과제, 평가 변경 내역, Source).\n", "PF-05": "---\nid: PF-05\nname: Flexible Energy Network\nname_ko: 에너지 유연성 네트워크\none_liner: 가전·HVAC를 고객 승인 기반의 검증된 유연 부하로 묶어 유틸리티와 애그리게이터가 쓰는 네트워크를 만든다\nstack: Distribution·Infrastructure\nessence: Energy\ncontrol_point: 고객 승인 기반의 검증된 유연 전력 부하\nmechanism: Aggregation + Optimization + Utility Interface\nconviction: 유지\nupdated: 2026-10-06\nstudy: wiki/study/PF-05-study.md\nradar_ko: [국민DR, 가정용 수요반응, 가상발전소, 분산에너지 특화지역, 히트펌프 전력 유연성]\nradar_en: [virtual power plant residential, demand flexibility heat pump, Kraken flexibility, Matter energy management, FERC 2222 aggregation]\n---\n\n# PF-05 Flexible Energy Network — 유연 에너지 네트워크\n\n> 재생에너지·EV·ESS·히트펌프가 늘면 발전량뿐 아니라 \"언제 소비를 줄이거나 옮길 수 있는가\"가 자산이 된다. LG가 에너지 트레이더가 되는 것이 아니라, 유틸리티가 쓰는 유연성 자원 네트워크를 만든다.\n\n## 1. 사업 가설\n\n**한 문장 정의.** LG 가전·HVAC·Homey가 아는 기기 상태와 고객의 쾌적 제약을 바탕으로, 고객이 승인한 범위의 전력 소비 조정을 **검증 가능한 유연 부하**로 만들어 전력회사·애그리게이터·데이터센터에 제공한다.\n\n**Control Point — 고객 승인 기반의 검증된 유연 부하.**\n\n| 요건 | PF-05에서의 의미 |\n|---|---|\n| Access Right | 기기 제어 권한과 고객 동의 |\n| Decision Right | 쾌적을 해치지 않는 범위에서 언제·얼마나 줄일지 판단 |\n| Rejection
