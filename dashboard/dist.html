Right | 보상 조건이 나쁜 프로그램·애그리게이터에 부하를 내주지 않을 권한 |\n\n**Platform Mechanism.** Aggregation(부하 묶음) + Optimization(쾌적·요금 최적화) + Utility Interface(전력 시장 연계).\n\n**플랫폼 전환점.** LG 기기만 묶으면 \"LG 에너지 기능\"이다. 타사 기기(EV 충전기, 배터리, 타사 히트펌프)가 Homey 등으로 들어오고, 여러 전력회사가 이 네트워크를 구매하는 순간 플랫폼이 된다.\n\n## 2. 시장 성숙도와 고객 수용도\n\n- **AI 데이터센터가 유연성의 가격을 올린다.** RMI는 VPP가 2030년 미국 최대 전력 수요의 20% 이상을 감당할 수 있고, 데이터센터 증설 대응에는 연 약 300시간의 유연성이면 된다고 봤다([[SIG-20261006-30]]).\n- **중립 애그리게이터가 커졌다.** 옥토퍼스는 크라켄을 기업가치 86.5억 달러로 분사했고, 크라켄은 2GW 이상의 유연 부하를 제어한다([[SIG-20261006-31]]).\n- **표준이 기기 제어 비용을 낮춘다.** Matter 1.5는 요금·탄소 신호를 기기에 전달하는 장치 유형을 추가했다([[SIG-20261006-32]]).\n- **국내 제도가 열리고 있다.** 분산에너지 특화지역 7곳이 지정됐고([[SIG-20261006-33]]), 건설사 단지 플랫폼이 국민DR과 연동된 Auto DR을 10만 세대로 늘리려 한다([[SIG-20261006-03]]).\n\n## 3. LG의 비대칭 자산\n\n- **기기 내부 상태와 쾌적 제약 지식.** 히트펌프·에어컨이 얼마나 줄여도 쾌적이 유지되는지를 제조사가 가장 정확히 안다.\n- **Homey.** 타사 기기까지 묶는 유럽 스마트홈 허브(2024 인수) — 플랫폼 전환점의 기반([[SIG-20261006-34]]).\n- **유럽 히트펌프 포트폴리오.** 가장 큰 유연 부하 중 하나.\n\n## 4. 종합 평가\n\n<!-- AUTO:SCORE -->\n**총점 33.0 / 40** (기준선 33.5, −0.5) · **사분면 Moonshots** — X(독점우위+실행) 7.5 · Y(네트워크+TAM) 8.5\n\n> ⚠ 사분면 이동: Strategic Core → Moonshots\n\n| 기준 | 기준선 (2026-09-13) | 현재 | 변화 | 최근 변경 근거 |\n|---|:-:|:-:|:-:|---|\n| TAM | 4.5 | **4.5** | – |  |\n| 고객가치 | 4.5 | **4.5** | – |  |\n| LG 독점우위 | 4.0 | **3.5** | −0.5 | 2026-10-06 · [[SIG-20261006-31]], [[SIG-20261006-03]] |\n| 네트워크 효과 | 4.0 | **4.0** | – |  |\n| 데이터 해자 | 4.0 | **4.0** | – |  |\n| 수익화 | 3.5 | **3.5** | – |  |\n| 실행 용이성 | 4.0 | **4.0** | – |  |\n| 전략적 차별성 | 5.0 | **5.0** | – |  |\n<!-- /AUTO:SCORE -->\n\n**해석.** 2026-10-06 평가 범위를 국내 포함으로 결정(D-01)하고, 독점우위를 4.0에서 3.5로 낮췄다. 크라켄 같은 중립 애그리게이터와 국내 건설사 단지 플랫폼이 부하 제어 권한을 먼저 확보했고, 국내 가정용 수요반응 보상도 작다. 그 결과 X축(독점우위+실행 용이성)이 7.5가 되어 **Strategic Core에서 Moonshot으로 이동**했다. 유럽(Homey·히트펌프)의 설치 기반 우위는 여전히 유효하므로, 국내에서 단지 플랫폼과의 제휴나 국민DR 가정 참여 확대가 확인되면 독점우위를 다시 올릴 수 있다.\n\n## 5. 판단 근거\n\n### 강화 근거\n- Homey × EcoFlow 에너지 파트너십, Homey는 1,000개 이상 브랜드 지원 — 타사 기기를 묶는 허브 — [[SIG-20261006-46]]\n- AI 데이터센터 전력 병목이 유연성 가치를 높임 — [[SIG-20261006-30]]\n- Matter 1.5 요금 신호 표준화로 구현 비용 하락 — [[SIG-20261006-32]]\n- 국내 분산에너지 특화지역 지정 — [[SIG-20261006-33]]\n- Homey 통합과 유럽 히트펌프 라인업 — [[SIG-20261006-34]]\n\n### 약화 근거\n- 크라켄 분사, 2GW+ 유연 부하를 중립 플랫폼으로 운영 — [[SIG-20261006-31]]\n- 국내 Auto DR을 건설사 단지 플랫폼이 운영, 세대당 보상은 소액 — [[SIG-20261006-03]]\n\n## 6. 경쟁 지형\n\n| 주체 | 노리는 자리 | 강점 | LG와의 관계 |\n|---|---|---|---|\n| Kraken (Octopus 분사) | 유틸리티 운영 + 유연성 | 7천만 계정·2GW+ | 경쟁 또는 기기 측 파트너 |\n| Tesla·Enphase·Sonnen | 배터리 기반 VPP | 저장장치 | 다른 자원 유형, 일부 경쟁 |\n| Google (Nest Renew)·Amazon | 온도조절기 기반 DR | 홈 허브 | 미국에서 경쟁 |\n| 국내 건설사·월패드 플랫폼 | 단지 단위 Auto DR | 신축 단지 설치 | 국내 경쟁 |\n| 한전·전력거래소 | 제도 운영 | 규제 | 시장 규칙 결정자 |\n\n## 7. 핵심 리스크\n\n- **반증 1** — 주요 유럽 유틸리티가 기기 제조사가 아니라 크라켄 같은 중립 플랫폼만 통해 유연성을 조달하면, LG는 기기 공급자에 머문다.\n- **반증 2** — 국내 가정용 DR 보상이 계속 소액이면 B2C 참여가 늘지 않아 국내 네트워크 효과가 생기지 않는다.\n- **불확실성** — 사업 범위를 유럽 중심으로 정할 것인가, 국내를 포함할 것인가.\n\n## 8. 점검 지표\n\n- Homey 연결 기기 수, 에너지 기능 사용률\n- 크라켄·유틸리티와 가전 제조사의 연동 파트너십\n- 국민DR 가정 참여 규모·보상 단가, 소규모 전력중개 실적\n- 데이터센터 전력 계약과 VPP 연계 사례\n\n## 9. 추진 로드맵 (2030 End-state)\n\n- **Wedge** — 유럽 히트펌프 고객 대상 동적 요금 최적화(Homey) → 유틸리티 유연성 프로그램 연동.\n- **Expansion** — 타사 기기 포함 → 여러 유틸리티에 유연성 판매 → 국내 특화지역 진입.\n- **2030 End-state** — 유틸리티가 구매하는 \"검증된 가정용 유연 부하\"의 대형 공급 네트워크.\n\n## 10. 연계 과제\n\n- Stack: **Distribution·Infrastructure** — [[PF-04]]와 함께 설치 기반 활용 축\n- [[PF-03]] 데이터센터·빌딩은 같은 전력 시장의 다른 쪽\n- 수요층: 공급측 중심 (수요층 지수와 간접 연결)\n\n## 11. 평가 변경 내역\n\n<!-- AUTO:LOG -->\n**점수 변경**\n\n- 2026-10-06 · LG 독점우위 4.0 → 3.5 — 평가 범위를 국내 포함으로 결정(D-01)함에 따라 국내 시장 기준으로 독점우위를 다시 평가했습니다. 국내에서는 건설사 단지 플랫폼이 가전 전력 제어 권한을 먼저 확보했고 가정용 수요반응 보상이 작아, 유럽의 설치 기반 우위를 그대로 적용하기 어렵습니다. ([[SIG-20261006-31]], [[SIG-20261006-03]])\n<!-- /AUTO:LOG -->\n\n## 12. Source\n\n<!-- AUTO:SOURCES -->\n출처 7건 — 정부·공공 3 · 글로벌기업 2 · 언론 2\n\n1. **[정부·공공]** RMI, 2025-11-06 — [RMI — VPP로 2030년 미국 최대 전력 수요의 20% 이상 대응 가능](https://rmi.org/resources/how-virtual-power-plants-can-help-the-united-states-win-the-ai-race/) · [[SIG-20261006-30]] · 강화 ●●○\n2. **[정부·공공]** Connectivity Standards Alliance, 2025-11-20 — [Matter 1.5 — 전기요금·탄소 신호를 기기에 전달하는 에너지 관리 기능 표준화](https://csa-iot.org/newsroom/matter-1-5-introduces-cameras-closures-and-enhanced-energy-management-capabilities/) · [[SIG-20261006-32]] · 강화 ●○○\n3. **[정부·공공]** 한국전력 KEPCO 웹진, 2026-02 — [한전 — 분산에너지 특화지역 7곳 지정, 배전망 5년 10조 원 투자 필요](https://www.kepco.co.kr/KEPCO_FILE/html/2026_02/theme01.html) · [[SIG-20261006-33]] · 강화 ●○○\n4. **[글로벌기업]** ESG News, 2025-12-29 — [Octopus, 에너지 운영 플랫폼 Kraken 분사 — 기업가치 86.5억 달러, 유연성 2GW 이상 제어](https://esgnews.com/octopus-energy-spins-out-kraken-in-1-billion-raise-valuing-utility-ai-platform-at-8-65-billion/) · [[SIG-20261006-31]] · 약화 ●●○\n5. **[글로벌기업]** LG전자 (PR Newswire), 2026-09-03 — [LG IFA 2026 — ThinQ ON 중심 AI 홈 허브, Homey 통합, 히트펌프 라인업](https://www.prnewswire.com/ae/news-releases/lg-electronics-showcases-expanded-ai-home-ecosystem-for-european-lifestyles-at-ifa-2026-302868307.html) · [[SIG-20261006-34]] · 강화 ●○○\n6. **[언론]** DigitalMore (CES 2026 보도), 2026-01-07 — [Homey by LG × EcoFlow 에너지 관리 파트너십 — Homey는 1,000개 이상 브랜드 지원](https://digitalmore.co/ces-2026-ecoflow-and-homey-by-lg-announce-partnership-to-enable-smarter-whole-home-energy-management/) · [[SIG-20261006-46]] · 강화 ●●○\n7. **[언론]** 업코리아, 2026-09-10 — [포스코이앤씨, 아파트 Auto DR 2만→10만 세대 확대 추진](https://www.upkoreanews.kr/news/articleView.html?idxno=100181) · [[SIG-20261006-03]] · 강화 ●●○\n<!-- /AUTO:SOURCES -->\n\n## 부록. 심층 분석\n\nTemplate v2 18항목 심층 분석은 별도 문서 [[PF-05-study]]에 있습니다.\n\n## 변경 이력\n- 2026-10-06: 위키 초판. 점수 유지, 독점우위 관찰 등록 (Kraken·단지 플랫폼). 3.5로 내려가면 사분면 이동.\n- 2026-10-06: Template v2 18항목 In-depth Study 전개(부록), 신호 1건 추가.\n- 2026-10-06: 평가 범위를 국내 포함으로 결정(D-01). 유럽 기반 반대 근거의 비중을 낮추고, 국내 근거 1건 추가 시 독점우위 하향 예정.\n- 2026-10-06: 심층 분석 부록을 별도 문서(wiki/study/PF-05-study.md)로 분리.\n- 2026-10-06: LG 독점우위 4.0→3.5 (국내 포함 범위 기준 재평가). Strategic Core → Moonshots 이동, 관찰 해제.\n- 2026-10-06: 챕터 제목 일괄 정비 (사업 가설, 시장 성숙도와 고객 수용도, 종합 평가, 판단 근거, 핵심 리스크, 점검 지표, 추진 로드맵, 연계 과제, 평가 변경 내역, Source).\n", "PF-06": "---\nid: PF-06\nname: Robot Operations\nname_ko: 로봇 운영\none_liner: 고객은 로봇이 아니라 \"일이 끝나 있기\"를 원한다 — 작업 결과를 보증하고 이기종 로봇을 할당한다\nstack: Physical AI\nessence: Labor·Task\ncontrol_point: 작업 결과 보증(SLA) + 이기종 로봇 할당권\nmechanism: Runtime + Marketplace + Work-as-a-Service\nconviction: 상승\nupdated: 2026-10-06\nstudy: 별도 문서 (2026-09, 저장소 미포함)\nradar_ko: [서비스 로봇 구독, 로봇 관제 플랫폼, 베어로보틱스, 청소 로봇 상업, 휴머노이드 상용 배치]\nradar_en: [robot as a service, multi-vendor robot fleet management, service robot sales IFR, humanoid deployment warehouse, Bear Robotics]\n---\n\n# PF-06 Robot Operations — 로봇 운영\n\n> 고객은 로봇을 원하는 것이 아니라 \"일이 끝나 있기\"를 원한다. 청소·배송·점검·순찰의 결과를 보증해 노동 지출 시장을 대체한다. 타사 로봇을 수용하는 순간 플랫폼이 된다.\n\n## 1. 사업 가설\n\n**한 문장 정의.** 상업 공간의 반복 작업을 로봇으로 수행하되, 고객에게는 로봇이 아니라 **작업 결과**(면적당 청소 품질, 배송 건수, 점검 완료율)를 계약하고, 어떤 로봇을 어디에 배치할지는 LG가 결정한다.\n\n**Control Point — 작업 결과 보증(SLA) + 이기종 로봇 할당권.**\n\n| 요건 | PF-06에서의 의미 |\n|---|---|\n| Access Right | 고객 공간과 작업 일정에 대한 지속 접근 |\n| Decision Right | 작업을 어떤 로봇(자사·타사)·사람에게 배정할지 결정 |\n| Rejection Right | 성능이 낮은 로봇 공급자를 배제 |\n\n**Platform Mechanism.** Runtime(관제·할당) + Marketplace(로봇·작업 공급자) + Work-as-a-Service(결과 과금).\n\n**플랫폼 전환점.** LG·베어로보틱스 로봇만 운영하면 RaaS 사업이다. 타사 로봇이 LG 관제에 들어와 작업을 배정받는 순간 플랫폼이 된다.\n\n## 2. 시장 성숙도와 고객 수용도\n\n- **서비스 로봇 시장이 실제로 커지고 있다.** IFR 기준 전문 서비스 로봇이 24% 늘어 약 25만 대가 됐고, 청소·숙박 로봇이 성장을 이끌었으며 이동 로봇이 절반 가까이를 차지했다([[SIG-20261006-20]]).\n- **보급 전망이 크게 올랐다.** 골드만삭스는 2035년 휴머노이드 650만 대로 전망을 약 4.7배 높였고, 물류·창고·자동차 공장이 먼저 커진다고 봤다([[SIG-20261006-18]]). 모건스탠리 장기 전망에서도 약 90%가 산업·상업용이다([[SIG-20261006-19]]).\n- **운영 계층이 이익을 가져간다.** 베인은 자동화 이익 풀이 하드웨어에서 소프트웨어·데이터로 이동한다고 분석했다([[SIG-20261006-22]]). 1X NEO도 구독과 원격 운영 인력을 묶어 판다([[SIG-20261006-06]]).\n- **로봇 두뇌가 범용화된다.** 엔비디아 오픈 모델은 이기종 로봇 운영 비용을 낮춘다([[SIG-20261006-15]]).\n- **사람 손이 부족하다.** 가사·서비스 인력 공급 확대가 막혔다([[SIG-20261006-09]]).\n\n## 3. LG의 비대칭 자산\n\n- **CEO 직속 로봇사업센터.** 사업개발·판매·운영을 한 조직이 맡고 데이터 생성 조직을 따로 둔다. 상업용은 베어로보틱스, 산업용은 로보스타, 가정용은 본사([[SIG-20261006-21]]).\n- **서비스·유지보수 인력망.** 로봇 결과 보증에는 현장 대응이 필수.\n- **로봇 하드웨어와 부품.** CLOiD, AXIUM 액추에이터([[SIG-20261006-17]]).\n- **공간 접점.** [[PF-03]]의 상업 공간 고객.\n\n## 4. 종합 평가\n\n<!-- AUTO:SCORE -->\n**총점 36.0 / 40** (기준선 35.0, +1.0) · **사분면 Strategic Core** — X(독점우위+실행) 9.0 · Y(네트워크+TAM) 8.5\n\n| 기준 | 기준선 (2026-09-13) | 현재 | 변화 | 최근 변경 근거 |\n|---|:-:|:-:|:-:|---|\n| TAM | 4.5 | **5.0** | +0.5 | 2026-10-06 · [[SIG-20261006-18]], [[SIG-20261006-20]] |\n| 고객가치 | 4.5 | **4.5** | – |  |\n| LG 독점우위 | 4.5 | **4.5** | – |  |\n| 네트워크 효과 | 3.5 | **3.5** | – |  |\n| 데이터 해자 | 5.0 | **5.0** | – |  |\n| 수익화 | 4.5 | **4.5** | – |  |\n| 실행 용이성 | 4.0 | **4.5** | +0.5 | 2026-10-06 · [[SIG-20261006-21]] |\n| 전략적 차별성 | 4.5 | **4.5** | – |  |\n<!-- /AUTO:SCORE -->\n\n**해석.** 2026년 신호가 가장 일관되게 강화 방향인 Thesis다. TAM을 4.5에서 5.0으로(골드만 상향, IFR 서비스 로봇 24% 성장), 실행 용이성을 4.0에서 4.5로(로봇사업센터 공식화) 올려 총점 36.0으로 PF-04와 같은 최상위가 됐다. 남은 약점은 네트워크 효과(3.5) — 타사 로봇을 실제로 받아들이기 전까지는 양면 효과가 약하다.\n\n## 5. 판단 근거\n\n### 강화 근거\n- CEO 직속 로봇사업센터 신설 (strength 3) — [[SIG-20261006-21]]\n- 전문 서비스 로봇 24% 성장, 청소·숙박 주도 — [[SIG-20261006-20]]\n- 골드만삭스 휴머노이드 전망 대폭 상향 — [[SIG-20261006-18]]\n- 이익 풀의 소프트웨어·데이터 이동 — [[SIG-20261006-22]]\n- 가정용 로봇도 구독 + 원격 운영 형태로 판매 — [[SIG-20261006-06]]\n- 오픈 로봇 모델로 이기종 운영 비용 하락 — [[SIG-20261006-15]]\n- CLOiD·AXIUM — 하드웨어 역량 — [[SIG-20261006-17]]\n- 가사·서비스 인력 공급 경로 축소 — [[SIG-20261006-09]]\n\n### 약화 근거\n- 로봇 제조사의 수직 통합(1X처럼 운영까지 직접 하는 모델)이 표준이 되면 중립 운영자 자리가 좁아짐 — [[SIG-20261006-06]]\n\n## 6. 경쟁 지형\n\n| 주체 | 노리는 자리 | 강점 | LG와의 관계 |\n|---|---|---|---|\n| 로봇 제조사 직접 운영 (1X, Figure, Agility) | 수직 통합 RaaS | 하드웨어·모델 | 타사 로봇 수용 여부가 관건 |\n| 시설관리(FM) 기업 | 청소·경비 아웃소싱 | 고객 계약 | 채널 또는 경쟁 |\n| 로봇 관제 소프트웨어 (VDA 5050 기반 등) | 이기종 관제 | 표준 | 관제 기술 경쟁 |\n| 삼성·현대(보스턴다이나믹스) | 로봇 + 운영 | 그룹 시너지 | 국내 경쟁 |\n| 중국 로봇 기업 (유니트리 등) | 저가 하드웨어 | 가격 | 공급자로 수용 가능 |\n\n## 7. 핵심 리스크\n\n- **반증 1** — 주요 로봇 제조사가 타사 관제 연동을 거부하고 자체 RaaS만 고집하면 할당권이 성립하지 않는다.\n- **반증 2** — 로봇 작업 단가가 인력 단가를 넘지 못하면(㎡당 로봇 청소 원가 ÷ 인력 청소 단가 > 1) 결과 보증 모델이 수익이 나지 않는다.\n- **불확실성** — 사고 책임과 보험 구조를 누가 질 것인가.\n\n## 8. 점검 지표\n\n- **검증 숫자**: ㎡당 로봇 청소 원가 ÷ 인력 청소 단가 (평가 당시 제안된 Initial Wedge 지표)\n- 베어로보틱스 관제에 타사 로봇 연동 발표\n- 로봇사업센터 KPI(판매 대수 vs 운영 성과)\n- 서비스 로봇 RaaS 비중, 휴머노이드 상용 배치 계약\n\n## 9. 추진 로드맵 (2030 End-state)\n\n- **Wedge** — 상업 공간 청소: 베어로보틱스·LG 로봇으로 면적당 결과 보증 계약.\n- **Expansion** — 서빙·배송·점검 작업 추가 → 타사 로봇 수용 → [[PF-03]] 공간 OS 고객으로 확대.\n- **2030 End-state** — 상업 공간의 반복 작업을 결과 단위로 판매하고, 어떤 로봇이 일할지 결정하는 운영자.\n\n## 10. 연계 과제\n\n- Stack: **Physical AI** — [[PF-02]] 기술 계층 → [[PF-03]] 공간 OS → PF-06 운영·SLA 계층\n- 수요층 지수: [[가사외주화지수]] · [[돌봄부담지수]]\n\n## 11. 평가 변경 내역\n\n<!-- AUTO:LOG -->\n**점수 변경**\n\n- 2026-10-06 · TAM 4.5 → 5.0 — Goldman Sachs가 2035년 휴머노이드 전망을 약 4.7배 상향했고, IFR 기준 전문 서비스 로봇 판매가 24% 증가했습니다. 성장을 주도한 청소·숙박 로봇은 PF-06의 초기 사업 영역입니다. ([[SIG-20261006-18]], [[SIG-20261006-20]])\n- 2026-10-06 · 실행 용이성 4.0 → 4.5 — CEO 직속 로봇사업센터가 신설되어 사업개발, 판매, 운영을 한 조직이 맡게 되었습니다. 9월 평가의 전제였던 단일 의사결정 구조가 확정되었습니다. ([[SIG-20261006-21]])\n<!-- /AUTO:LOG -->\n\n## 12. Source\n\n<!-- AUTO:SOURCES -->\n출처 10건 — 컨설팅 1 · 투자은행 2 · 산업리서치 1 · 글로벌기업 2 · 언론 4\n\n1. **[컨설팅]** Bain & Company, 2026-04-07 — [Bain, 2030년 산업 자동화 매출 절반이 AI 의존 — 가치가 소프트웨어·데이터로 이동](https://www.bain.com/about/media-center/press-releases/2026/nearly-half-of-industrial-automation-revenue-to-rely-on-ai-by-2030-bain--company-finds/) · [[SIG-20261006-22]] · 강화 ●●○\n2. **[투자은행]** Morgan Stanley Research, 2025-05-14 — [Morgan Stanley, 2050년 휴머노이드 5조 달러·10억 대, 가정용은 약 10%](https://www.morganstanley.com/insights/articles/humanoid-robot-market-5-trillion-by-2050) · [[SIG-20261006-19]] · 강화 ●○○\n3. **[투자은행]** Humanoid.guide (Goldman Sachs 리포트 보도), 2026-09-15 — [Goldman Sachs, 2035년 휴머노이드 650만 대·1,380억 달러로 전망 대폭 상향](https://humanoid.guide/goldman-raises-2035-humanoid-robot-forecast-to-6-5-million/) · [[SIG-20261006-18]] · 강화 ●●○\n4. **[산업리서치]** IFR World Robotics 2026 (Inside Deep Tech 정리), 2026-09-24 — [IFR World Robotics 2026 — 전문 서비스 로봇 24% 증가, 청소·숙박 로봇이 성장 견인](https://www.insidedeeptech.com/ifr-world-robotics-2026-603k-installs-five-million-stock-full-guide/) · [[SIG-20261006-20]] · 강화 ●●○\n5. **[글로벌기업]** LG전자 (PR Newswire), 2026-01-04 — [LG CLOiD 홈로봇 공개 — VLA 기반, ThinQ로 가전 조율, AXIUM 액추에이터](https://www.prnewswire.com/news-releases/lg-electronics-presents-lg-cloid-home-robot-to-demonstrate-zero-labor-home-at-ces-2026-302652192.html) · [[SIG-20261006-17]] · 강화 ●●○\n6. **[글로벌기업]** NVIDIA Investor Relations, 2026-01-05 — [NVIDIA, CES 2026에서 Cosmos·GR00T 오픈 모델 공개 — LG전자 파트너로 홈로봇 발표](https://investor.nvidia.com/news/press-release-details/2026/NVIDIA-Releases-New-Physical-AI-Models-as-Global-Partners-Unveil-Next-Generation-Robots/default.aspx) · [[SIG-20261006-15]] · 강화 ●●○\n7. **[언론]** AI타임스, 2025-11-03 — [1X NEO 가정용 휴머노이드, 구매 또는 월 구독 + 원격 조작 지원](https://www.aitimes.com/news/articleView.html?idxno=203684) · [[SIG-20261006-06]] · 강화 ●●○\n8. **[언론]** 경향신문, 2025-12-22 — [외국인 가사관리사 본사업 미추진 결정](https://www.khan.co.kr/article/202512221801001) · [[SIG-20261006-09]] · 강화 ●●○\n9. **[언론]** 다음뉴스 (KDI 보고서 보도), 2026-04-29 — [KDI — 요양보호사 2035년 약 50만, 2040년 약 77만 명 부족 전망](https://v.daum.net/v/20260429151946545) · [[SIG-20261006-49]] · 강화 ●●○\n10. **[언론]** The Korea Times, 2026-06-30 — [LG전자, CEO 직속 로봇사업센터 신설 — 가정용·상업용·산업용 역할 분담](https://www.koreatimes.co.kr/business/companies/20260630/lg-electronics-to-establish-control-tower-for-robotics-business) · [[SIG-20261006-21]] · 강화 ●●●\n<!-- /AUTO:SOURCES -->\n\n## 변경 이력\n- 2026-10-06: 위키 초판. TAM 4.5→5.0, 실행 용이성 4.0→4.5. 총점 36.0으로 공동 1위.\n- 2026-10-06: 자사 로봇 중심 운영으로 결정(D-03). 타사 로봇 연동은 운영 사업 확대 후 재검토.\n- 2026-10-06: 챕터 제목 일괄 정비 (사업 가설, 시장 성숙도와 고객 수용도, 종합 평가, 판단 근거, 핵심 리스크, 점검 지표, 추진 로드맵, 연계 과제, 평가 변경 내역, Source).\n", "PF-07": "---\nid: PF-07\nname: Home Diagnostics\nname_ko: 집 상태 진단\none_liner: 가전 정기 방문을 집의 진단 행위로 재정의해 공간 그래프와 설비 상태를 확보하고, 시공·수리·가사 서비스를 중개한다\nstack: Household\nessence: Home Decision\ncontrol_point: 현관문 출입 신뢰 기반 공간 그래프\nmechanism: Diagnostics + Demand Aggregation + Service Marketplace\nconviction: 상승\nupdated: 2026-10-06\nstudy: 별도 문서 (2026-09, 저장소 미포함)\nradar_ko: [가전 구독 케어, 노후 주택 수리, 집수리 지원사업, 가전 원격 진단, 스마트홈 보험 연계]\nradar_en: [home maintenance deferred repairs, home warranty, right to repair directive, predictive maintenance appliances, smart home insurance]\n---\n\n# PF-07 Home Diagnostics — 집 상태 진단\n\n> 가전 정기 방문을 집의 진단 행위로 재정의한다. 현관문 안에 들어갈 수 있는 신뢰로 공간 그래프와 설비 상태를 확보하고, 시공·수리·가사 서비스를 중개한다.\n\n## 1. 사업 가설\n\n**한 문장 정의.** 구독 케어 매니저와 A/S 기사의 정기 방문, 가전 원격 진단 데이터를 결합해 \"이 집의 설비·공간 상태\"를 기록하고, 그 진단을 근거로 수리·교체·리모델링·가사 서비스를 연결한다.\n\n**Control Point — 현관문 출입 신뢰 기반 공간 그래프.**\n\n| 요건 | PF-07에서의 의미 |\n|---|---|\n| Access Right | 정기 방문으로 집 안에 들어가는 신뢰, 가전 원격 진단 데이터 |\n| Decision Right | 무엇을 고치고 바꿔야 하는지 판정하는 진단 권한 |\n| Rejection Right | 진단 결과에 따라 시공·수리 공급자를 선택·배제 |\n\n**Platform Mechanism.** Diagnostics(진단) + Demand Aggregation(수리·시공 수요 묶음) + Service Marketplace(외부 서비스 중개).\n\n**플랫폼 전환점.** LG 가전만 점검하면 A/S다. 외부 시공·수리·보험·금융 사업자가 LG의 진단 결과를 근거로 거래하는 순간 플랫폼이 된다.\n\n## 2. 시장 성숙도와 고객 수용도\n\n- **집이 늙고 있다.** 국토연구원 분석에서 전국 필지 절반이 준공 30년 넘은 4층 이하 저층주택이었고, 이들 지역의 고령 인구 비율도 높았다([[SIG-20261006-35]]). 미국도 주택 평균 연령이 44년이고 37%의 가구가 비용 때문에 수리를 미뤘다([[SIG-20261006-36]]).\n- **방문 접점이 이미 대규모다.** LG 가전 구독은 연 2.4조 원, 약 4,000명의 케어 매니저가 정기 방문한다([[SIG-20261006-37]]).\n- **수리가 제도 의무가 된다.** EU 수리권 지침으로 세탁기·냉장고·식기세척기 제조사가 보증 이후에도 수리를 제공해야 한다([[SIG-20261006-42]]). 원격 진단으로 수리 원가를 낮추는 역량이 곧 경쟁력이다.\n- **돌봄 정책이 집을 들여다본다.** 통합돌봄 지역 특화 서비스에 주거환경 개선이 포함됐다([[SIG-20261006-01]]).\n- **경쟁사가 먼저 보험과 연결했다.** 삼성은 SmartThings 데이터를 보험사 HSB와 연계했다([[SIG-20261006-38]]).\n\n## 3. LG의 비대칭 자산\n\n- **현관문 출입 신뢰.** 정기 방문하는 케어 매니저·기사 — 소프트웨어 기업이 복제할 수 없다.\n- **제조사만 아는 펌웨어·고장 이력.** 평가 당시 PF-02·07·09의 공통 우위로 꼽힌 근거.\n- **추가 CAPEX 없이 시작 가능.** 기존 방문 체크리스트(L1)만 확장하면 된다 — 실행 용이성 4.5의 근거.\n\n## 4. 종합 평가\n\n<!-- AUTO:SCORE -->\n**총점 32.5 / 40** (기준선 32.0, +0.5) · **사분면 Quick Wins** — X(독점우위+실행) 9.0 · Y(네트워크+TAM) 7.5\n\n| 기준 | 기준선 (2026-09-13) | 현재 | 변화 | 최근 변경 근거 |\n|---|:-:|:-:|:-:|---|\n| TAM | 4.0 | **4.5** | +0.5 | 2026-10-06 · [[SIG-20261006-35]], [[SIG-20261006-36]] |\n| 고객가치 | 4.0 | **4.0** | – |  |\n| LG 독점우위 | 4.5 | **4.5** | – |  |\n| 네트워크 효과 | 3.0 | **3.0** | – |  |\n| 데이터 해자 | 4.0 | **4.0** | – |  |\n| 수익화 | 4.0 | **4.0** | – |  |\n| 실행 용이성 | 4.5 | **4.5** | – |  |\n| 전략적 차별성 | 4.0 | **4.0** | – |  |\n<!-- /AUTO:SCORE -->\n\n**해석.** TAM을 4.0에서 4.5로 올렸다. 노후 주택과 미뤄진 수리 수요가 평가 당시 가정보다 넓다는 근거가 국내외에서 동시에 나왔다. Quick Win 위치는 유지된다(네트워크 효과 3.0이 Y축을 제한). 경쟁 측면에서는 삼성의 보험 연계가 독점우위의 첫 도전 신호다.\n\n## 5. 판단 근거\n\n### 강화 근거\n- 노후 저층주택이 전국 필지의 절반 — [[SIG-20261006-35]]\n- 미국 수리 연기 37%, 빠른 해결에 대한 지불 의향 72% — [[SIG-20261006-36]]\n- 구독 2.4조 원, 케어 매니저 약 4,000명 (strength 3) — [[SIG-20261006-37]]\n- EU 수리권 — 제조사 수리 의무 — [[SIG-20261006-42]]\n- 통합돌봄 주거환경 개선 — [[SIG-20261006-01]]\n- 구독·케어 사업 성장 — [[SIG-20261006-25]]\n- 일본 유통사의 가전 이력 기반 안부 확인 — 데이터 활용 선례 — [[SIG-20261006-10]]\n\n### 약화 근거\n- 삼성 SmartThings × 보험사 데이터 연계 선점 — [[SIG-20261006-38]]\n- 수리 정보 공개 의무로 제3자 수리업체 확대 → 진단 데이터 독점성 약화 가능 — [[SIG-20261006-42]], [[SIG-20261006-08]]\n\n## 6. 경쟁 지형\n\n| 주체 | 노리는 자리 | 강점 | LG와의 관계 |\n|---|---|---|---|\n| 삼성전자 (구독 + SmartThings + 보험) | 집 데이터 + 금융 연계 | 5억 사용자, 보험 제휴 | 직접 경쟁 |\n| 홈서비스 플랫폼 (숨고·당근 등) | 수리·시공 중개 | 공급자 풀 | 진단 없는 중개로 접점 선점 위험 |\n| 보험·홈워런티 사업자 | 설비 고장 리스크 | 지불 주체 | 협력 대상 |\n| 건설사·리모델링 | 대형 수리 | 시공 | 수요 연결 대상 |\n\n## 7. 핵심 리스크\n\n- **반증 1** — 케어 매니저 방문이 가전 세척에만 머물고 집 상태 데이터 수집으로 확장되지 못하면 공간 그래프가 생기지 않는다.\n- **반증 2** — 고객이 집 상태 데이터 제공에 동의하지 않으면 중개 사업이 성립하지 않는다.\n- **불확실성** — 진단 결과로 외부 공급자에게 과금(수수료)할 수 있는가.\n\n## 8. 점검 지표\n\n- **검증 숫자**: 연간 이전설치·정기 방문 건수 (평가 당시 제안된 Initial Wedge 지표)\n- 케어 매니저 방문 체크리스트 범위\n- 국내 보험사·금융사의 주택 설비 데이터 활용 사례\n- 지자체 집수리 지원 사업의 진단 절차\n\n## 9. 추진 로드맵 (2030 End-state)\n\n- **Wedge** — 케어 매니저 정기 방문에 \"집 상태 L1 체크리스트\"를 추가해 진단 리포트 제공.\n- **Expansion** — 수리·교체 수요를 외부 공급자에 중개 → 보험·금융과 데이터 연계 → [[PF-08]] 고령 가구 특화 서비스 통합 → [[PF-09]] 중고 회수 채널.\n- **2030 End-state** — 집의 설비·공간 상태를 가장 정확히 아는 사업자로서 수리·시공·보험 결정의 기준점.\n\n## 10. 연계 과제\n\n- Stack: **Household** 진입점 — PF-07 → [[PF-01]] → [[PF-08]] → [[PF-09]]\n- 수요층 지수: [[공간제약지수]] · [[가사외주화지수]]\n\n## 11. 평가 변경 내역\n\n<!-- AUTO:LOG -->\n**점수 변경**\n\n- 2026-10-06 · TAM 4.0 → 4.5 — 국내 필지의 절반이 준공 30년 이상 저층주택이고(국토연구원), 미국은 주택 평균 연령 44년, 수리 연기 가구 37%입니다. 집 상태 진단과 수리 연결 수요가 9월 가정보다 큽니다. ([[SIG-20261006-35]], [[SIG-20261006-36]])\n<!-- /AUTO:LOG -->\n\n## 12. Source\n\n<!-- AUTO:SOURCES -->\n출처 10건 — 산업리서치 2 · 정부·공공 3 · 글로벌기업 1 · 언론 4\n\n1. **[산업리서치]** DPP Tool 가이드, 2026-07-30 — [EU 디지털 제품 여권 — 전자제품 수리성(2027)·재활용성(2029) 요건 예정](https://dpp-tool.com/en/guide/digital-product-passport-eu-sectors-timeline-2026/) · [[SIG-20261006-08]] · 강화 ●○○\n2. **[산업리서치]** Warranty Week, 2026-09-29 — [Warranty Week — 미국 가구 37%가 비용 때문에 수리 연기, 주택 평균 연령 44년](https://www.warrantyweek.com/archive/ww20260929.html) · [[SIG-20261006-36]] · 강화 ●●○\n3. **[정부·공공]** Lewis Silkin, 2026-03-18 — [EU 수리권 지침 2026년 7월 31일까지 국내법 전환 — 세탁기·냉장고·식기세척기 제조사 수리 의무](https://www.lewissilkin.com/insights/2026/03/18/what-does-the-right-to-repair-directive-mean-for-your-business) · [[SIG-20261006-42]] · 강화 ●●○\n4. **[정부·공공]** 대한민국 정책브리핑(보건복지부), 2026-03-26 — [지역사회 통합돌봄 전국 229개 시군구 시행](https://www.korea.kr/news/policyNewsView.do?newsId=148961536) · [[SIG-20261006-01]] · 강화 ●●●\n5. **[정부·공공]** 국토연구원 국토정책 브리프 (뉴스핌 보도), 2026-08-26 — [국토연구원 — 전국 필지 절반이 준공 30년 넘은 4층 이하 노후 저층주택](https://www.newspim.com/news/view/20260826000586) · [[SIG-20261006-35]] · 강화 ●●○\n6. **[글로벌기업]** LG전자 뉴스룸, 2026-07-30 — [LG전자 2026년 2분기 — ES 마진 8.6%, CDU 공급망 진입, 구독 매출 성장](https://www.lg.com/global/newsroom/news/corporate/lg-electronics-releases-second-quarter-2026-financial-results/) · [[SIG-20261006-25]] · 강화 ●●○\n7. **[언론]** The Korea Herald, 2026-01-06 — [삼성 CES 2026 — SmartThings 5억 사용자, 보험사(HSB)와 스마트홈 데이터 연계](https://www.koreaherald.com/article/10649841) · [[SIG-20261006-38]] · 약화 ●●○\n8. **[언론]** 니혼게이자이신문, 2026-03 — [일본 에디온, 가전 사용 이력으로 고령자 원격 안부 확인 — 복수 제조사 대응](https://www.nikkei.com/article/DGXZQOUF197660Z10C26A3000000/) · [[SIG-20261006-10]] · 강화 ●●○\n9. **[언론]** 헤럴드경제 (국가데이터처 인구주택총조사), 2026-07-28 — [2025 인구주택총조사 — 1인가구 824만(36.6%), 고령자 1인가구 245만(10.9%)](https://biz.heraldcorp.com/article/10822914) · [[SIG-20261006-48]] · 강화 ●●○\n10. **[언론]** 파이낸셜뉴스, 2026-10-03 — [가전 구독 판 확대 — LG 연 2.4조·베스트샵 판매의 약 50%, 케어 매니저 약 4,000명](https://www.fnnews.com/news/202610030700598029) · [[SIG-20261006-37]] · 강화 ●●●\n<!-- /AUTO:SOURCES -->\n\n## 변경 이력\n- 2026-10-06: 위키 초판. TAM 4.0→4.5 (국내외 노후 주택·수리 연기 근거).\n- 2026-10-06: 챕터 제목 일괄 정비 (사업 가설, 시장 성숙도와 고객 수용도, 종합 평가, 판단 근거, 핵심 리스크, 점검 지표, 추진 로드맵, 연계 과제, 평가 변경 내역, Source).\n", "PF-08": "---\nid: PF-08\nname: Independent Living\nname_ko: 고령 독립생활\none_liner: 카메라 없이 기존 가전 데이터만으로 고령자의 일상생활 수행 능력을 종단 기록해, 감시가 아니라 자립을 증명하는 도구로 쓴다\nstack: Household\nessence: Care·Life State\ncontrol_point: 자립 생활 상태의 증명 표준 지위\nmechanism: State Standard + Care / Service Ecosystem\nconviction: 상승\nupdated: 2026-10-06\nstudy: 별도 문서 (2026-09, 저장소 미포함)\nradar_ko: [통합돌봄, AI 돌봄로봇 지자체, 독거노인 안부 확인, 고령 1인가구, 재가 요양]\nradar_en: [aging in place technology, remote monitoring older adults, 見守り 家電, 介護テクノロジー 補助, longevity economy]\n---\n\n# PF-08 Independent Living — 고령 독립생활\n\n> 카메라 없이 기존 가전 데이터만으로 고령자의 일상생활 수행 능력을 종단 기록한다. 감시가 아니라 \"아직 혼자 잘 지내고 있다\"는 자립을 증명하는 도구다.\n\n## 1. 사업 가설\n\n**한 문장 정의.** 냉장고 여닫기, 세탁기·밥솥 사용, TV 시청, 에어컨 설정 같은 가전 사용 패턴으로 고령자의 생활 리듬과 변화를 기록하고, 그 기록을 가족·지자체·돌봄 기관이 신뢰하는 **자립 상태의 근거**로 만든다.\n\n**Control Point — 자립 생활 상태의 증명 표준 지위.**\n\n| 요건 | PF-08에서의 의미 |\n|---|---|\n| Access Right | 고령 가구의 가전 사용 데이터에 대한 지속 접근(동의 기반) |\n| Decision Right | 생활 리듬 변화가 개입이 필요한 수준인지 판정 |\n| Rejection Right | 어떤 돌봄 서비스·기관에 연결할지 선택 |\n\n**Platform Mechanism.** State Standard(상태 표준) + Care/Service Ecosystem(돌봄 서비스 연결).\n\n**플랫폼 전환점.** LG 고객에게 안부 알림을 주면 부가서비스다. 지자체·요양기관·보험사가 LG의 상태 기록을 **판단 근거로 채택**하는 순간 플랫폼이 된다.\n\n## 2. 시장 성숙도와 고객 수용도\n\n- **돌봄이 제도 안으로 들어왔다.** 2026년 3월부터 통합돌봄이 전국 229개 시군구에서 시행됐다([[SIG-20261006-01]]).\n- **혼자 사는 고령자가 가장 큰 1인가구 집단이다.** 1인가구 804만, 그중 70세 이상이 최대 비중이다([[SIG-20261006-02]]). 노후 저층주택 지역의 고령 비율도 높다([[SIG-20261006-35]]).\n- **공공이 이미 기기를 산다.** 국내 수백 개 지자체가 AI 돌봄로봇을 운영하지만, 대화 수준에 머물고 실질 돌봄·책임 공백이 지적된다([[SIG-20261006-41]]).\n- **일본은 공공 보조로 지켜보기 센서를 보급한다.** 2026년도 개호 테크놀로지 도입 지원에 보정예산 220억 엔, 보조율 최대 3/4, 3년 효과 보고 의무([[SIG-20261006-40]]). 유통사가 가전 이력으로 안부를 확인하는 상용 서비스도 나왔다([[SIG-20261006-10]]).\n- **고령층의 지불 능력.** 미국 50세 이상이 GDP의 43%, 기술 지출이 크게 늘었다([[SIG-20261006-39]]).\n\n## 3. LG의 비대칭 자산\n\n- **카메라 없는 상태 데이터.** 감시 거부감이 적은 가전 사용 패턴.\n- **이미 집 안에 있는 기기.** 별도 센서 설치 없이 시작.\n- **방문 신뢰.** [[PF-07]] 케어 매니저 접점.\n\n약점: 사고 시 인명·브랜드 리스크, 단독 수익화의 어려움(평가 당시 Hedge & Defense 배치 근거).\n\n## 4. 종합 평가\n\n<!-- AUTO:SCORE -->\n**총점 26.0 / 40** (기준선 25.0, +1.0) · **사분면 Hedge & Defense** — X(독점우위+실행) 7.0 · Y(네트워크+TAM) 4.5\n\n| 기준 | 기준선 (2026-09-13) | 현재 | 변화 | 최근 변경 근거 |\n|---|:-:|:-:|:-:|---|\n| TAM | 2.0 | **2.5** | +0.5 | 2026-10-06 · [[SIG-20261006-01]], [[SIG-20261006-02]] |\n| 고객가치 | 4.0 | **4.0** | – |  |\n| LG 독점우위 | 4.5 | **4.5** | – |  |\n| 네트워크 효과 | 2.0 | **2.0** | – |  |\n| 데이터 해자 | 4.0 | **4.0** | – |  |\n| 수익화 | 2.0 | **2.5** | +0.5 | 2026-10-06 · [[SIG-20261006-40]], [[SIG-20261006-41]] |\n| 실행 용이성 | 2.5 | **2.5** | – |  |\n| 전략적 차별성 | 4.0 | **4.0** | – |  |\n<!-- /AUTO:SCORE -->\n\n**해석.** 9개 중 최하위지만 2026년 신호가 가장 많이 쌓인 Thesis다. TAM을 2.0에서 2.5로(통합돌봄 시행, 고령 1인가구 최대 집단), 수익화를 2.0에서 2.5로(국내 지자체 구매, 일본 공공 보조) 올렸다. 핵심 변화는 **지불 주체가 개인이 아니라 공공**이라는 경로가 확인된 것 — 평가 당시 지적된 \"B2C 과금 저항\"을 우회할 수 있다. 다만 네트워크 효과(2.0)와 실행 리스크는 그대로라 사분면은 Hedge & Defense에 남는다. 9월 포트폴리오 판단은 PF-07의 고령화 특화 부가서비스로 통합하는 것이었으나, 2026-10-06 결정(D-04)으로 지자체 대상 독립 과제로 전환했다. 첫 단계는 1~2개 지자체 통합돌봄 시범사업이며, 사고 책임 기준과 조달 단가가 확인되면 실행 용이성을 다시 평가한다.\n\n## 5. 판단 근거\n\n### 강화 근거\n- 고령자 1인가구 245만, 일반가구의 10.9% (2025 인구주택총조사) — [[SIG-20261006-48]]\n- 요양보호사 2035년 약 50만·2040년 약 77만 명 부족 전망, 돌봄 기술 도입이 정책 방향 — [[SIG-20261006-49]]\n- 통합돌봄 전국 시행 (strength 3) — [[SIG-20261006-01]]\n- 1인가구 중 70세 이상 최대 비중 (strength 3) — [[SIG-20261006-02]]\n- 일본 공공 보조로 지켜보기 센서 보급 — [[SIG-20261006-40]]\n- 국내 지자체 AI 돌봄로봇 보급 — 시장 존재, 상태 증명 기능 공백 — [[SIG-20261006-41]]\n- 일본 유통사 가전 이력 기반 안부 확인 — [[SIG-20261006-10]]\n- 노후 주택·고령 거주 겹침 — [[SIG-20261006-35]]\n- 고령층 지불 능력 확대(미국) — [[SIG-20261006-39]]\n\n### 약화 근거\n- 돌봄로봇의 사고 책임 공백 지적 — PF-08 핵심 리스크 재확인 — [[SIG-20261006-41]]\n- 일본에서 Control Point를 제조사가 아닌 유통사가 가져감 — [[SIG-20261006-10]]\n\n## 6. 경쟁 지형\n\n| 주체 | 노리는 자리 | 강점 | LG와의 관계 |\n|---|---|---|---|\n| 돌봄로봇 기업 (효돌·다솜·초롱이) | 지자체 돌봄 기기 | 조달 레퍼런스 | 대화 기능 vs 상태 증명 — 보완 관계 가능 |\n| 통신사 (AI 스피커 안부) | 안부 확인 | 회선·지자체 사업 | 경쟁 |\n| 삼성전자 (SmartThings 케어) | 가전 기반 돌봄 | 생태계 | 직접 경쟁 |\n| 일본 유통사 (에디온 등) | 멀티 브랜드 안부 확인 | 판매 접점 | 국내 유통사의 같은 시도 가능성 |\n\n## 7. 핵심 리스크\n\n- **반증 1** — 지자체가 가전 데이터를 돌봄 판단 근거로 채택하지 않고 전용 센서·로봇만 조달하면 상태 증명 표준이 성립하지 않는다.\n- **반증 2** — 개인정보·책임 규제로 가전 데이터의 돌봄 활용이 제한되면 시작할 수 없다.\n- **불확실성** — 사고 발생 시 책임을 어떻게 나눌 것인가(감지 실패의 법적 책임).\n\n## 8. 점검 지표\n\n- 통합돌봄 예산 중 기기·ICT 지원 항목\n- 지자체 돌봄 기기 조달 단가와 평가 기준\n- 국내 유통사·통신사의 멀티 브랜드 안부 확인 서비스\n- 일본 개호 테크놀로지 보조 효과 보고 결과\n\n## 9. 추진 로드맵 (2030 End-state)\n\n- **Wedge** — 구독 고령 가구 대상 \"생활 리듬 리포트\"를 자녀에게 제공(B2C), 동시에 1~2개 지자체 통합돌봄 시범.\n- **Expansion** — 지자체 조달 → 요양기관·보험 연계 → 타사 가전 데이터 수용.\n- **2030 End-state** — 지자체·요양·보험이 참조하는 자립 상태 기록의 표준.\n\n## 10. 연계 과제\n\n- Stack: **Household** — [[PF-07]] 방문 접점과 연계하되, 2026-10-06 결정(D-04)에 따라 지자체 대상 독립 과제로 추진\n- 수요층 지수: [[돌봄부담지수]]\n\n## 11. 평가 변경 내역\n\n<!-- AUTO:LOG -->\n**점수 변경**\n\n- 2026-10-06 · TAM 2.0 → 2.5 — 통합돌봄 전국 시행으로 재가 돌봄 대상이 제도화되었고, 70세 이상이 1인가구 중 가장 큰 집단입니다. 대상 규모와 공공 시장이 함께 확인되었습니다. ([[SIG-20261006-01]], [[SIG-20261006-02]])\n- 2026-10-06 · 수익화 2.0 → 2.5 — 일본은 돌봄 센서 도입 비용의 최대 3/4을 보조하고, 국내 지자체는 이미 돌봄 기기를 구매하고 있습니다. 개인 과금 대신 공공 재원으로 사업화할 수 있는 경로가 확인되었습니다. ([[SIG-20261006-40]], [[SIG-20261006-41]])\n<!-- /AUTO:LOG -->\n\n## 12. Source\n\n<!-- AUTO:SOURCES -->\n출처 9건 — 정부·공공 5 · 언론 4\n\n1. **[정부·공공]** 국가데이터처 「2025 통계로 보는 1인가구」(경향신문 보도), 2025-12-09 — [1인가구 804만·36.1%, 70세 이상이 최대 비중](https://www.khan.co.kr/article/202512091341001) · [[SIG-20261006-02]] · 강화 ●●●\n2. **[정부·공공]** 補助金ポータル, 2026 — [일본 후생노동성, 2026년도 개호 테크놀로지 도입 지원 — 보정예산 220억 엔, 보조율 최대 3/4](https://hojyokin-portal.jp/columns/kaigo_technology) · [[SIG-20261006-40]] · 강화 ●●○\n3. **[정부·공공]** 대한민국 정책브리핑 mmerce trade-in, right to repair directive, digital product passport, certified pre-owned appliances]\n---\n\n# PF-09 Second Life Exchange — 중고 가전 상태 인증\n\n> 제조·수리·사용 이력을 가진 제조사로서 중고 가전의 상태를 판정하고 보증한다. 타인이 보유한 제품에 등급을 부여하는 순간 플랫폼이 된다.\n\n## 1. 사업 가설\n\n**한 문장 정의.** 중고 가전 거래에서 가장 큰 문제는 \"이 제품이 실제로 어떤 상태인가\"를 모른다는 것이다. 제조사가 사용 이력·수리 이력·원격 진단으로 상태 등급을 매기고 보증하면, 그 등급이 중고 거래 가격과 신뢰의 기준이 된다.\n\n**Control Point — 개별 기기의 상태 인증권.**\n\n| 요건 | PF-09에서의 의미 |\n|---|---|\n| Access Right | 제품의 사용·수리 이력과 원격 진단 데이터 |\n| Decision Right | 상태 등급과 잔존 가치를 판정 |\n| Rejection Right | 기준 미달 제품을 인증에서 제외, 인증 거래 채널 선택 |\n\n**Platform Mechanism.** Certification Standard(인증 표준) + Marketplace(거래 연결).\n\n**플랫폼 전환점.** LG가 회수한 제품을 리퍼해 팔면 리퍼 사업이다. 개인·중고업자가 보유한 제품에 LG 인증을 붙여 다른 마켓플레이스에서 거래하는 순간 플랫폼이 된다.\n\n## 2. 시장 성숙도와 고객 수용도\n\n- **수리·재사용이 제도로 밀린다.** EU 수리권 지침이 2026년 7월까지 회원국 법으로 전환되며 대형 가전 제조사의 수리 의무, 수리 시 보증 연장, 2027년 유럽 수리 플랫폼이 생긴다([[SIG-20261006-42]]). 디지털 제품 여권(DPP)도 수리성·재활용성 정보 공개를 예고한다([[SIG-20261006-08]]).\n- **리커머스가 성장한다.** 스위스 사례에서 리커머스가 연 17% 가까이 성장하며 제조사·리테일러 인증 리퍼와 신뢰 장치가 있는 마켓플레이스가 동력이었다([[SIG-20261006-43]]).\n- **LG가 첫 걸음을 뗐다.** 정부 순환경제 협약으로 폐가전 회수·폐냉매 재자원화와 리퍼비시를 시작하고, 리퍼 제품을 소상공인에게 먼저 판다([[SIG-20261006-44]]). 평가 결론(B2B 소상공인 중심 PoC)과 같은 형태다.\n- **저자산 1인가구.** 1인가구의 자산은 전체 가구의 약 40% 수준이다([[SIG-20261006-02]]).\n\n## 3. LG의 비대칭 자산\n\n- **제조·수리·사용 이력.** 제조사만 가진 펌웨어 로그와 수리 기록.\n- **회수 물류.** 그룹 물류사(LX판토스)와 리사이클링센터([[SIG-20261006-44]]).\n- **방문 접점.** [[PF-07]] 케어 매니저가 회수 채널이 될 수 있다.\n\n약점: 역물류 원가, 신제품 판매 잠식 우려.\n\n## 4. 종합 평가\n\n<!-- AUTO:SCORE -->\n**총점 28.5 / 40** (기준선 28.0, +0.5) · **사분면 Hedge & Defense** — X(독점우위+실행) 7.5 · Y(네트워크+TAM) 5.5\n\n| 기준 | 기준선 (2026-09-13) | 현재 | 변화 | 최근 변경 근거 |\n|---|:-:|:-:|:-:|---|\n| TAM | 2.5 | **2.5** | – |  |\n| 고객가치 | 4.0 | **4.0** | – |  |\n| LG 독점우위 | 4.5 | **4.5** | – |  |\n| 네트워크 효과 | 3.0 | **3.0** | – |  |\n| 데이터 해자 | 4.0 | **4.0** | – |  |\n| 수익화 | 3.0 | **3.0** | – |  |\n| 실행 용이성 | 2.5 | **3.0** | +0.5 | 2026-10-06 · [[SIG-20261006-44]], [[SIG-20261006-42]] |\n| 전략적 차별성 | 4.5 | **4.5** | – |  |\n<!-- /AUTO:SCORE -->\n\n**해석.** 실행 용이성을 2.5에서 3.0으로 올렸다. 평가 당시 최대 장벽이던 역물류에 대해 정부 협약과 그룹 물류로 첫 해법이 나왔고, EU 수리권이 수리·재사용 경로를 제도화했다. TAM(2.5)은 유지 — 단일 국가 리커머스 데이터로는 상향 근거가 약하다. 사분면은 Hedge & Defense에 남고, 현재 사업은 아직 자사 제품 리퍼여서 플랫폼 전환점(타인 보유 제품 인증)에는 도달하지 않았다.\n\n## 5. 판단 근거\n\n### 강화 근거\n- LG 폐가전 회수·리퍼 사업 착수, 소상공인 판매 — [[SIG-20261006-44]]\n- EU 수리권 지침 — 수리·재사용 제도화 — [[SIG-20261006-42]]\n- EU DPP — 제품 이력 공개 예고 — [[SIG-20261006-08]]\n- 리커머스 성장, 인증 리퍼가 동력 — [[SIG-20261006-43]]\n- 저자산 1인가구 확대 — [[SIG-20261006-02]]\n\n### 약화 근거\n- 제품 이력 공개 의무가 확대되면 제3자도 상태 판정을 할 수 있어 제조사 인증의 독점성이 약해질 수 있음 — [[SIG-20261006-08]]\n\n## 6. 경쟁 지형\n\n| 주체 | 노리는 자리 | 강점 | LG와의 관계 |\n|---|---|---|---|\n| 중고 플랫폼 (당근·번개장터) | 중고 거래 접점 | 사용자 규모 | 인증 채널 파트너 또는 자체 인증 경쟁 |\n| 리테일러 (하이마트·IKEA형 바이백) | 매입·재판매 | 매장·물류 | 경쟁 |\n| 삼성전자 (인증 중고폰 경험) | 제조사 인증 | 모바일 리퍼 운영 경험 | 가전으로 확장 시 경쟁 |\n| 전문 리퍼 업체 | 리퍼 가공 | 원가 | 공급자 |\n\n## 7. 핵심 리스크\n\n- **반증 1** — 중고 플랫폼이 자체 검수·인증을 도입해 소비자 신뢰를 충분히 확보하면 제조사 인증의 가치가 줄어든다.\n- **반증 2** — 리퍼 사업이 3년 내에도 자사 제품 회수에만 머물면 플랫폼이 아니다.\n- **불확실성** — 신제품 판매 잠식을 감수할 내부 의사결정이 가능한가.\n\n## 8. 점검 지표\n\n- LG 리퍼 제품 등급 기준·보증 조건·판매 실적\n- 중고 플랫폼의 가전 검수·인증 도입\n- 국내 EPR·순환경제 제도 변화\n- EU 수리 플랫폼 출범과 제조사 참여\n\n## 9. 추진 로드맵 (2030 End-state)\n\n- **Wedge** — 소상공인 대상 리퍼 판매(현재 진행 중)에 등급·보증 표준을 붙인다.\n- **Expansion** — 보상 판매 회수 → 개인 보유 제품 원격 진단 등급 → 중고 플랫폼에 인증 API 제공.\n- **2030 End-state** — 중고 가전 가격을 결정하는 상태 인증의 기준.\n\n## 10. 연계 과제\n\n- Stack: **Household** 끝단 — [[PF-07]] 방문 접점이 회수 채널\n- 수요층 지수: [[공간제약지수]]\n\n## 11. 평가 변경 내역\n\n<!-- AUTO:LOG -->\n**점수 변경**\n\n- 2026-10-06 · 실행 용이성 2.5 → 3.0 — LG가 정부 협약과 그룹 물류사를 통해 폐가전 회수와 리퍼 제품 판매(소상공인 대상)를 시작해, 가장 큰 장애였던 회수 물류 문제의 첫 해결 방안을 확보했습니다. EU 수리권 지침도 수리·재사용을 제도화했습니다. ([[SIG-20261006-44]], [[SIG-20261006-42]])\n<!-- /AUTO:LOG -->\n\n## 12. Source\n\n<!-- AUTO:SOURCES -->\n출처 5건 — 산업리서치 2 · 정부·공공 2 · 언론 1\n\n1. **[산업리서치]** DPP Tool 가이드, 2026-07-30 — [EU 디지털 제품 여권 — 전자제품 수리성(2027)·재활용성(2029) 요건 예정](https://dpp-tool.com/en/guide/digital-product-passport-eu-sectors-timeline-2026/) · [[SIG-20261006-08]] · 강화 ●○○\n2. **[산업리서치]** GlobeNewswire (ResearchAndMarkets), 2026-10-05 — [스위스 리커머스 시장 2026년 연 16.9% 성장 — 인증 리퍼·리테일러 주도 리셀이 동력](https://www.globenewswire.com/news-release/2026/10/05/3374287/28124/en/switzerland-recommerce-market-intelligence-report-2026-60-kpis-and-forecasts-to-2030-market-to-reach-us-2-63-billion-as-trade-in-and-refurbishment-scale.html) · [[SIG-20261006-43]] · 강화 ●○○\n3. **[정부·공공]** 국가데이터처 「2025 통계로 보는 1인가구」(경향신문 보도), 2025-12-09 — [1인가구 804만·36.1%, 70세 이상이 최대 비중](https://www.khan.co.kr/article/202512091341001) · [[SIG-20261006-02]] · 강화 ●●●\n4. **[정부·공공]** Lewis Silkin, 2026-03-18 — [EU 수리권 지침 2026년 7월 31일까지 국내법 전환 — 세탁기·냉장고·식기세척기 제조사 수리 의무](https://www.lewissilkin.com/insights/2026/03/18/what-does-the-right-to-repair-directive-mean-for-your-business) · [[SIG-20261006-42]] · 강화 ●●○\n5. **[언론]** 아시아경제, 2026-06-19 — [LG전자, 정부와 폐냉매 회수·리퍼비시 사업 착수 — 소상공인 대상 사업자몰 판매](https://view.asiae.co.kr/article/2026061908010605527) · [[SIG-20261006-44]] · 강화 ●●○\n<!-- /AUTO:SOURCES -->\n\n## 변경 이력\n- 2026-10-06: 위키 초판. 실행 용이성 2.5→3.0 (회수·리퍼 사업 착수, EU 수리권).\n- 2026-10-06: 챕터 제목 일괄 정비 (사업 가설, 시장 성숙도와 고객 수용도, 종합 평가, 판단 근거, 핵심 리스크, 점검 지표, 추진 로드맵, 연계 과제, 평가 변경 내역, Source).\n", "Portfolio": "---\nid: Portfolio\nname: LG Future Platform 검토 보고\nupdated: 2026-10-06\n---\n\n# LG Future Platform 검토 보고\n\nAI 에이전트 시대에 LG전자가 플랫폼 사업자로 자리 잡을 수 있는 영역을 9개로 정리하고, 각 영역의 사업성을 평가한 자료입니다. 평가 결과는 국내외 시장 동향을 2주마다 반영해 갱신합니다.\n\n<!-- AUTO:SNAPSHOT -->\n> 기준일 2026-10-06 · 반영 자료 49건 (컨설팅·투자은행 5건) · 9월 대비 점수 조정 9건 · 관찰 항목 3건 · 의사결정 대기 0건 · 결정 완료 5건\n<!-- /AUTO:SNAPSHOT -->\n\n## 요약\n\n**1. 검토 질문을 재정의했습니다.**\n\"LG전자가 Google·Amazon 같은 플랫폼 기업이 될 수 있는가\"를 묻는 대신, \"산업 구조가 바뀔 때 LG의 설치 기반, 서비스 인력, 제품 이력 때문에 LG가 차지하기 유리한 위치는 어디인가\"를 검토했습니다.\n\n**2. 51개 후보에서 9개 플랫폼 기회를 도출했습니다.**\n두 가지 관점으로 51개 후보를 만들고 5가지 제외 기준으로 9개를 선정했습니다. 선정된 9개는 공통적으로 LG가 결과를 책임질 수 있는 영역이며, 책임을 지는 사업자가 공급자 선택권도 갖는다는 판단에 근거합니다.\n\n**3. 9개를 4개 그룹으로 나눠 추진 우선순위를 정했습니다.**\n\n| 그룹 | 의미 | 해당 기회 |\n|---|---|---|\n| Strategic Core | 즉시 투자해 확대 | AI 서비스 유통(PF-04), 로봇 운영(PF-06) |\n| Moonshots | 중장기 선행 투자 | 로봇용 가전 규격(PF-02), 가계 구매 위임(PF-01), 공간 운영 OS(PF-03), 에너지 유연성(PF-05) |\n| Quick Wins | 단기 착수 | 집 상태 진단(PF-07) |\n| Hedge & Defense | 본업 보호 | 고령 독립생활(PF-08), 중고 가전 인증(PF-09) |\n\n**4. 9월 평가 이후 점수와 그룹이 일부 바뀌었습니다.**\n로봇 운영은 시장 전망 상향과 전담 조직 신설로 1위가 되었습니다. 가계 구매 위임과 AI 서비스 유통은 Google, Amazon, 삼성의 선행 출시로 점수가 낮아졌습니다. 에너지 유연성은 평가 범위를 국내까지 넓히면서 독점우위를 낮춰 Moonshots로 옮겼습니다. 경영 판단이 필요했던 5개 사항은 2026년 10월 6일 결정했습니다(부록 C).\n\n## 1. 검토 배경\n\n### 기존 질문의 한계\n\n처음 질문은 \"LG전자가 Google·Amazon·Naver 같은 플랫폼 기업이 될 수 있는가\"였습니다. 이 질문은 LG가 보유하지 않은 자산을 기준으로 삼기 때문에 결론이 항상 \"어렵다\"로 끝납니다.\n\n| 구분 | 기존 질문 | 재정의한 질문 |\n|---|---|---|\n| 질문 | LG가 빅테크 같은 플랫폼이 될 수 있는가 | 산업 구조 변화 속에서 LG가 차지하기 유리한 위치는 어디인가 |\n| 출발점 | 검색, 트래픽, 결제, 물류 (LG 미보유) | 설치 기반, 현장 인력, 제조·수리 이력, 서비스 책임 (LG 보유) |\n| 결과 | 부정적 결론 반복 | 구체적인 사업 후보 도출 |\n\n### 플랫폼 판단 기준\n\n이번 검토에서는 다른 사업자와 고객의 선택에 영향을 줄 수 있는 위치를 확보한 경우에만 플랫폼으로 봤습니다. 서비스 품질이 좋은 것만으로는 플랫폼으로 분류하지 않았습니다.\n\n### 경쟁 영역 선택\n\nAI 시대의 가치 사슬을 4개 층으로 나누면, LG가 경쟁 우위를 가질 수 있는 층은 L2입니다.\n\n| 층 | 역할 | 주요 사업자 | LG 방향 |\n|---|---|---|---|\n| L4. 범용 AI·검색 | 대화형 서비스, 정보 검색 | OpenAI, Google, Naver | 경쟁하지 않음 |\n| L3. 커머스·결제·물류 | 상품 탐색과 거래 | Amazon, 쿠팡, Naver | 경쟁하지 않음 |\n| **L2. 물리 상태·실행·책임** | 집·건물·기기의 실제 상태 파악, 현장 실행, 결과 책임 | 주도 사업자 없음 | **집중 영역** |\n| L1. 기기 | 가전, HVAC, 디스플레이, 로봇 | LG 포함 제조사 | 기반 자산 |\n\nL2는 현장 인력과 설비가 있어야 진입할 수 있어 빅테크가 쉽게 들어오기 어렵습니다. 이번 검토의 모든 후보는 L2에서 도출했습니다.\n\n## 2. 9개 플랫폼 기회\n\n9개 기회는 3개 묶음(Stack)으로 연결됩니다. 앞 단계의 사업이 뒤 단계 사업의 고객과 데이터를 만들어 줍니다.\n\n<!-- VIZ:STACKS -->\n\n### Stack 1. Physical AI: 로봇과 공간의 운영\n\n외부 로봇이 LG 가전을 안전하게 쓰는 규격(PF-02)이 있어야 건물 전체를 자율 운영할 수 있고(PF-03), 운영되는 건물이 있어야 로봇 작업을 결과 단위로 판매할 수 있습니다(PF-06).\n\n<details><summary><b>PF-02 Physical Environment Runtime<\/b> · 로봇용 가전 규격<\/summary>\n\n| 항목 | 내용 |\n|---|---|\n| 개요 | 외부 로봇과 AI가 LG 가전을 별도 학습 없이 안전하게 사용하도록 하는 실행 규격 |\n| 필요성 | 로봇 AI는 빠르게 발전하고 있으나, 가전의 잠금·온도·작동 상태와 작업 완료 여부는 제조사만 정확히 알 수 있음 |\n| 확보할 위치 | 로봇이 가전을 다룰 때의 허용 조건과 완료 검증 기준 |\n| 사업 방식 | 실행 규격, 표준, 개발자 생태계 |\n| 플랫폼 전환 조건 | 타사 로봇이 LG 규격을 사용하고, 타사 가전도 같은 규격을 채택할 때 |\n\n[[PF-02]] 상세 보기\n<\/details>\n\n<details><summary><b>PF-03 Autonomous Space OS<\/b> · 공간 운영 OS<\/summary>\n\n| 항목 | 내용 |\n|---|---|\n| 개요 | HVAC를 중심으로 가전·디스플레이·로봇·정비를 묶어 건물의 가동률과 운영 목표를 자율 관리 |\n| 필요성 | 건물주는 개별 설비보다 멈추지 않는 공간을 원함 |\n| 확보할 위치 | 공간 운영 상태와 가동률에 대한 책임 |\n| 사업 방식 | 운영 시스템, 이종 설비 통합, 외부 앱 생태계 |\n| 플랫폼 전환 조건 | 타사 설비와 외부 앱이 같은 시스템에서 작동하고, 계약이 장비 납품에서 성과 보증으로 바뀔 때 |\n\n[[PF-03]] 상세 보기\n<\/details>\n\n<details><summary><b>PF-06 Robot Operations<\/b> · 로봇 운영<\/summary>\n\n| 항목 | 내용 |\n|---|---|\n| 개요 | 청소·배송·점검·순찰 작업의 결과를 보증하고, 작업에 투입할 로봇을 LG가 결정 |\n| 필요성 | 고객은 로봇 구매보다 작업 완료를 원하며, 인력 부족이 심화되고 있음 |\n| 확보할 위치 | 작업 결과 보증(SLA)과 이기종 로봇 배정 권한 |\n| 사업 방식 | 운영 시스템, 로봇 공급자 마켓플레이스, 작업 단위 과금 |\n| 플랫폼 전환 조건 | 타사 로봇을 받아 작업을 배정할 때 |\n\n[[PF-06]] 상세 보기\n<\/details>\n\n### Stack 2. Household: 가정 내 의사결정\n\n정기 방문으로 집 안 상태를 파악하는 서비스(PF-07)에서 출발해, 가구의 구매 관리(PF-01), 고령자 생활 관리(PF-08), 중고 가전 가치 판정(PF-09)으로 확장합니다. 방문 서비스가 중고 회수 채널이 되고, 진단 데이터가 구매 판단의 근거가 됩니다.\n\n<details><summary><b>PF-07 Home Diagnostics<\/b> · 집 상태 진단<\/summary>\n\n| 항목 | 내용 |\n|---|---|\n| 개요 | 케어 매니저와 서비스 기사의 정기 방문을 집 전체 진단으로 확대하고, 진단 결과로 수리·시공·가사 서비스를 연결 |\n| 필요성 | 노후 주택 증가, 수리 인력 부족, 고장 전 예방 수요 |\n| 확보할 위치 | 고객 집에 정기적으로 들어갈 수 있는 신뢰와 축적된 집 상태 정보 |\n| 사업 방식 | 진단, 수요 집약, 서비스 마켓플레이스 |\n| 플랫폼 전환 조건 | 외부 시공·수리·보험 사업자가 LG 진단 결과를 근거로 거래할 때 |\n\n[[PF-07]] 상세 보기\n<\/details>\n\n<details><summary><b>PF-01 Household CFO<\/b> · 가계 구매 위임<\/summary>\n\n| 항목 | 내용 |\n|---|---|\n| 개요 | 가구가 가전·소모품·생활 서비스 구매 권한을 LG Agent에 위임하고, LG는 여러 가구의 수요를 모아 공급자와 조건을 협상 |\n| 필요성 | 반복적인 비교·구매·교체 판단에 드는 시간 부담 |\n| 확보할 위치 | 고객이 사전 승인한 범위 안에서 구매·교체·해지할 수 있는 권한 |\n| 사업 방식 | 수요 집약, 구매 대행 |\n| 차별화 근거 | 커머스 플랫폼은 구매 이력으로 수요를 추정하고, LG는 가전 상태로 수요를 확인 |\n\n[[PF-01]] 상세 보기\n<\/details>\n\n<details><summary><b>PF-08 Independent Living<\/b> · 고령 독립생활<\/summary>\n\n| 항목 | 내용 |\n|---|---|\n| 개요 | 카메라 없이 냉장고·세탁기·TV 등 가전 사용 패턴으로 고령자의 생활 상태를 기록 |\n| 필요성 | 고령 1인가구 증가, 돌봄 인력 부족, 재가 돌봄 정책 확대 |\n| 확보할 위치 | 가족·지자체·돌봄 기관이 신뢰하는 생활 상태 기록 기준 |\n| 사업 방식 | 상태 기록 표준, 돌봄 서비스 연계 |\n| 플랫폼 전환 조건 | 지자체·요양기관·보험사가 LG 기록을 판단 근거로 채택할 때 |\n\n[[PF-08]] 상세 보기\n<\/details>\n\n<details><summary><b>PF-09 Second Life Exchange<\/b> · 중고 가전 인증<\/summary>\n\n| 항목 | 내용 |\n|---|---|\n| 개요 | 제조·수리·사용 이력으로 중고 가전의 상태 등급을 판정하고 보증 |\n| 필요성 | 중고 거래에서 실제 제품 상태를 확인하기 어려움 |\n| 확보할 위치 | 개별 제품의 상태 인증 권한 |\n| 사업 방식 | 인증 기준, 거래 연결 |\n| 플랫폼 전환 조건 | 타인이 보유한 제품에 LG 등급을 부여해 다른 거래처에서 유통될 때 |\n\n[[PF-09]] 상세 보기\n<\/details>\n\n### Stack 3. Distribution & Infrastructure: 유통 경로와 자원\n\n이미 보급된 TV와 냉난방 기기를 새로운 시장의 진입 경로로 활용합니다. 추가 설비 투자 부담이 가장 적은 묶음입니다.\n\n<details><summary><b>PF-04 Ambient AI Distribution<\/b> · AI 서비스 유통<\/summary>\n\n| 항목 | 내용 |\n|---|---|\n| 개요 | webOS와 TV 설치 기반을 활용해 가정에서 어떤 AI 서비스가 언제 호출될지 결정하는 유통 계층 |\n| 필요성 | AI 서비스 기업은 스마트폰 외의 가구 단위 접점이 필요함 |\n| 확보할 위치 | AI 서비스 노출과 호출 순서를 정하는 권한 |\n| 사업 방식 | 유통, 실행 환경, 시청 맥락 제공 |\n| 플랫폼 전환 조건 | 외부 AI 사업자가 webOS를 유통 채널로 계약할 때 |\n\n[[PF-04]] 상세 보기\n<\/details>\n\n<details><summary><b>PF-05 Flexible Energy Network<\/b> · 에너지 유연성 네트워크<\/summary>\n\n| 항목 | 내용 |\n|---|---|\n| 개요 | 가전·HVAC의 전력 사용을 고객 동의 범위에서 조절해 전력회사가 구매하는 유연성 자원으로 제공 |\n| 필요성 | 재생에너지와 AI 데이터센터 확대로 전력 수요 조절의 가치가 커짐 |\n| 확보할 위치 | 쾌적함을 유지하면서 줄일 수 있는 전력량을 보증하는 권한 |\n| 사업 방식 | 부하 집약, 최적화, 전력 시장 연계 |\n| 플랫폼 전환 조건 | 타사 기기가 Homey로 연결되고 여러 전력회사가 이 네트워크를 구매할 때 |\n\n[[PF-05]] 상세 보기\n<\/details>\n\n### 9개 기회의 차별점\n\n| 기회 | 확보 대상 | 확보할 위치 |\n|---|---|---|\n| [[PF-01]] 가계 구매 위임 | 가구 지출 | 구매 위임 권한 |\n| [[PF-02]] 로봇용 가전 규격 | 로봇의 행동 | 가전 사용 허용 조건과 검증 기준 |\n| [[PF-03]] 공간 운영 OS | 건물 운영 | 운영 상태와 가동률 책임 |\n| [[PF-04]] AI 서비스 유통 | 고객 접점 | AI 서비스 호출 결정권 |\n| [[PF-05]] 에너지 유연성 | 전력 수요 | 검증된 감축 가능 전력량 |\n| [[PF-06]] 로봇 운영 | 작업 | 작업 결과 보증과 로봇 배정권 |\n| [[PF-07]] 집 상태 진단 | 주거 관리 | 집 상태 정보와 방문 신뢰 |\n| [[PF-08]] 고령 독립생활 | 돌봄 | 생활 상태 기록 기준 |\n| [[PF-09]] 중고 가전 인증 | 제품 잔존가치 | 상태 인증 권한 |\n\n9개 기회는 확보 대상이 서로 겹치지 않아 동시에 추진해도 상호 잠식이 없습니다.\n\n## 3. 평가 결과\n\n### 평가 기준\n\n8개 기준을 각 5점, 총 40점으로 평가했습니다.\n\n| 기준 | 평가 내용 |\n|---|---|\n| TAM | 대체하거나 진입하려는 시장의 규모와 성장성 |\n| 고객가치 | 고객 문제를 해결하는 정도 |\n| LG 독점우위 | 빅테크·삼성과 비교한 LG 고유 자산의 우위 |\n| 네트워크 효과 | 참여자가 늘수록 가치가 커지는 정도 |\n| 데이터 해자 | 시간이 갈수록 축적되어 모방하기 어려운 데이터 |\n| 수익화 | 구독·수수료 등 반복 수익 구조 |\n| 실행 용이성 | 조직, 투자, 기술, 물류 측면의 실행 난이도 |\n| 전략적 차별성 | 빅테크·업계 선도 기업과의 정면 경쟁 회피 정도 |\n\n### 점수와 위치\n\n<!-- VIZ:MAP -->\n\n<!-- AUTO:PORTFOLIO -->\n| 번호 | 기회 | 총점 | 9월 대비 | 그룹 | 가로축 | 세로축 | 근거 (긍정/부정) | 추세 |\n|---|---|:-:|:-:|---|:-:|:-:|:-:|:-:|\n| [[PF-06]] | Robot Operations (로봇 운영) | **36.0** | +1.0 | Strategic Core | 9.0 | 8.5 | 10 / 0 | 상승 |\n| [[PF-04]] | Ambient AI Distribution (AI 서비스 유통) | **35.5** | −0.5 | Strategic Core | 9.0 | 10.0 | 4 / 4 | 하락 |\n| [[PF-01]] | Household CFO (가계 구매 위임) | **34.5** | −0.5 | Moonshots | 7.0 | 9.5 | 5 / 3 | 하락 |\n| [[PF-02]] | Physical Environment Runtime (로봇용 가전 규격) | **34.5** | – | Moonshots | 7.5 | 9.5 | 8 / 2 | 유지 |\n| [[PF-03]] | Autonomous Space OS (공간 운영 OS) | **34.0** | – | Moonshots | 7.5 | 8.5 | 4 / 2 | 유지 |\n| [[PF-05]] | Flexible Energy Network (에너지 유연성 네트워크) | **33.0** | −0.5 | Moonshots ⚠ | 7.5 | 8.5 | 6 / 1 | 유지 |\n| [[PF-07]] | Home Diagnostics (집 상태 진단) | **32.5** | +0.5 | Quick Wins | 9.0 | 7.5 | 9 / 1 | 상승 |\n| [[PF-09]] | Second Life Exchange (중고 가전 인증) | **28.5** | +0.5 | Hedge & Defense | 7.5 | 5.5 | 5 / 0 | 유지 |\n| [[PF-08]] | Independent Living (고령 독립생활) | **26.0** | +1.0 | Hedge & Defense | 7.0 | 4.5 | 9 / 0 | 상승 |\n<!-- /AUTO:PORTFOLIO -->\n\n총점과 사분면은 각각 다른 판단에 쓰입니다.\n\n- 총점: 사업 기회의 전체 매력도 (8개 기준 합계)\n- 사분면: 현재 착수 가능성\n  - 가로축: LG 독점우위 + 실행 용이성 (LG가 실행할 수 있는가)\n  - 세로축: 네트워크 효과 + TAM (시장이 충분히 큰가)\n  - 각 축 8.0점 이상을 상위로 분류\n\n총점이 높더라도 실행 난이도가 높으면 Moonshot으로, 총점이 중간이라도 즉시 실행이 가능하면 Quick Win으로 분류됩니다. 기준점은 2026년 9월 평가이며, 이후 근거가 확인될 때마다 0.5점 단위로 조정합니다.\n\n### 그룹별 추진 방향\n\n| 그룹 | 해당 기회 | 추진 방향 |\n|---|---|---|\n| Strategic Core | [[PF-04]] [[PF-06]] | webOS와 로봇사업센터를 활용해 즉시 사업화 |\n| Moonshots | [[PF-02]] [[PF-01]] [[PF-03]] [[PF-05]] | 기술 표준화, 고객 신뢰 확보 등 선행 조건부터 해결. PF-03은 장비 공급 중심으로 유지(D-02). PF-05는 국내 단지 플랫폼과의 관계 정립이 선행 조건(D-01) |\n| Quick Wins | [[PF-07]] | 케어 매니저 방문에 집 진단 항목을 추가해 즉시 착수 |\n| Hedge & Defense | [[PF-08]] [[PF-09]] | PF-08은 지자체 대상 독립 과제로 통합돌봄 시범사업부터 착수(D-04), PF-09는 소상공인 대상 시범사업으로 한정 |\n\n## 4. 9월 평가 이후 변화\n\n2026년 1월 이후 국내외 자료를 수집해 9월 평가 점수를 재검토했습니다. 점수 변경 내역은 아래 표와 같습니다.\n\n<!-- AUTO:CHANGES -->\n- 점수 상승: PF-06 (+1.0), PF-08 (+1.0), PF-07 (+0.5), PF-09 (+0.5)\n- 점수 하락: PF-01 (−0.5), PF-04 (−0.5), PF-05 (−0.5)\n- 사분면 이동: PF-05 Strategic Core → Moonshots\n\n**점수 조정 내역**\n\n| 기회 | 기준 | 9월 → 현재 | 조정 사유 | 근거 |\n|---|---|:-:|---|---|\n| [[PF-09]] Second Life Exchange | 실행 용이성 | 2.5→**3.0** | LG가 정부 협약과 그룹 물류사를 통해 폐가전 회수와 리퍼 제품 판매(소상공인 대상)를 시작해, 가장 큰 장애였던 회수 물류 문제의 첫 해결 방안을 확보했습니다. EU 수리권 지침도 수리·재사용을 제도화했습니다. | [[SIG-20261006-44]] [[SIG-20261006-42]] |\n| [[PF-08]] Independent Living | TAM | 2.0→**2.5** | 통합돌봄 전국 시행으로 재가 돌봄 대상이 제도화되었고, 70세 이상이 1인가구 중 가장 큰 집단입니다. 대상 규모와 공공 시장이 함께 확인되었습니다. | [[SIG-20261006-01]] [[SIG-20261006-02]] |\n| [[PF-08]] Independent Living | 수익화 | 2.0→**2.5** | 일본은 돌봄 센서 도입 비용의 최대 3/4을 보조하고, 국내 지자체는 이미 돌봄 기기를 구매하고 있습니다. 개인 과금 대신 공공 재원으로 사업화할 수 있는 경로가 확인되었습니다. | [[SIG-20261006-40]] [[SIG-20261006-41]] |\n| [[PF-07]] Home Diagnostics | TAM | 4.0→**4.5** | 국내 필지의 절반이 준공 30년 이상 저층주택이고(국토연구원), 미국은 주택 평균 연령 44년, 수리 연기 가구 37%입니다. 집 상태 진단과 수리 연결 수요가 9월 가정보다 큽니다. | [[SIG-20261006-35]] [[SIG-20261006-36]] |\n| [[PF-06]] Robot Operations | TAM | 4.5→**5.0** | Goldman Sachs가 2035년 휴머노이드 전망을 약 4.7배 상향했고, IFR 기준 전문 서비스 로봇 판매가 24% 증가했습니다. 성장을 주도한 청소·숙박 로봇은 PF-06의 초기 사업 영역입니다. | [[SIG-20261006-18]] [[SIG-20261006-20]] |\n| [[PF-06]] Robot Operations | 실행 용이성 | 4.0→**4.5** | CEO 직속 로봇사업센터가 신설되어 사업개발, 판매, 운영을 한 조직이 맡게 되었습니다. 9월 평가의 전제였던 단일 의사결정 구조가 확정되었습니다. | [[SIG-20261006-21]] |\n| [[PF-05]] Flexible Energy Network | LG 독점우위 | 4.0→**3.5** | 평가 범위를 국내 포함으로 결정(D-01)함에 따라 국내 시장 기준으로 독점우위를 다시 평가했습니다. 국내에서는 건설사 단지 플랫폼이 가전 전력 제어 권한을 먼저 확보했고 가정용 수요반응 보상이 작아, 유럽의 설치 기반 우위를 그대로 적용하기 어렵습니다. | [[SIG-20261006-31]] [[SIG-20261006-03]] |\n| [[PF-04]] Ambient AI Distribution | 전략적 차별성 | 4.0→**3.5** | 삼성이 TV에서 여러 AI 서비스를 선택하는 기능을 먼저 출시하고 SmartThings로 가정 AI 접점을 넓혔습니다. TV를 AI 유통 채널로 쓰는 전략이 업계 공통이 되어, 차별화는 시청 맥락 기반 호출에 한정됩니다. | [[SIG-20261006-27]] [[SIG-20261006-38]] |\n| [[PF-01]] Household CFO | LG 독점우위 | 4.5→**4.0** | Google(위임 결제 규격)과 Amazon(자동 재구매)이 구매 위임의 표준과 소모품 재주문 시장을 먼저 확보했습니다. LG의 차별 요소는 가전 상태 기반 수요 예측으로 좁아졌습니다. | [[SIG-20261006-13]] [[SIG-20261006-14]] |\n\n**관찰 항목** (근거가 상충해 점수를 유지하고 추이를 확인 중)\n\n| 기회 | 기준 | 우려 방향 | 확인 내용 |\n|---|---|:-:|---|\n| [[PF-02]] Physical Environment Runtime | LG 독점우위 | 약화 | 범용 로봇 AI가 화면 인식과 손 조작만으로 가전을 다루게 되면 가전 규격의 필요성이 줄어듭니다. 반대로 로봇 AI가 범용화될수록 가전 안전·검증 기준의 가치가 커진다는 근거도 있어 점수를 유지합니다. |\n| [[PF-03]] Autonomous Space OS | LG 독점우위 | 약화 | Johnson Controls의 AI 빌딩 운영 시스템, Eaton·Vertiv·Daikin의 냉각·현장 서비스 업체 인수로 경쟁사가 운영 영역을 먼저 채우고 있습니다. LG의 데이터센터 냉각 수주 확대는 반대 근거입니다. 운영·성과 보증 계약이 확인되면 재판단합니다. |\n| [[PF-04]] Ambient AI Distribution | LG 독점우위 | 약화 | 북미 TV 운영체제 시장에서 유통사 점유율이 2029년 47%로 커질 전망입니다. 글로벌 webOS 설치 기반 우위는 유지되므로 지역별 점유율 자료를 확인한 뒤 판단합니다. |\n<!-- /AUTO:CHANGES -->\n\n### 주요 시사점\n\n**1) 경쟁사가 먼저 진입하는 영역이 늘고 있습니다.**\nLG가 확보하려는 위치 중 일부를 제조사가 아닌 사업자가 먼저 확보하고 있습니다. 다른 사업자가 LG 기기를 연결해 쓰는 구조가 되면 LG는 플랫폼 사업자가 아닌 기기 공급자로 남게 됩니다.\n\n| 기회 | 선행 사업자 | 근거 |\n|---|---|---|\n| PF-01 가계 구매 위임 | Google(위임 결제 규격), Amazon(자동 재구매) | [[SIG-20261006-13]] [[SIG-20261006-14]] |\n| PF-04 AI 서비스 유통 | 북미 유통사 TV OS, 삼성 멀티 AI TV | [[SIG-20261006-29]] [[SIG-20261006-27]] |\n| PF-05 에너지 유연성 | Kraken(중립 에너지 플랫폼), 국내 건설사 | [[SIG-20261006-31]] [[SIG-20261006-03]] |\n| PF-08 고령 독립생활 | 일본 가전 유통사(복수 제조사 통합) | [[SIG-20261006-10]] |\n\n**2) 현장 서비스 인력의 가치가 커지고 있습니다.**\n데이터센터 냉각 경쟁사들은 현장 서비스 업체를 인수하고 있고([[SIG-20261006-24]]), 미국에서는 수리 인력 부족이 심화되고 있습니다([[SIG-20261006-36]]). LG는 약 4,000명의 케어 매니저를 운영하고 있어([[SIG-20261006-37]]) 결과를 책임지는 사업 모델에 유리합니다.\n\n**3) 공공 부문이 비용 부담 주체로 등장했습니다.**\n통합돌봄 전국 시행([[SIG-20261006-01]]), 일본 돌봄 기술 보조금([[SIG-20261006-40]]), 국내 분산에너지 특화지역([[SIG-20261006-33]]), EU 수리권 의무화([[SIG-20261006-42]])가 대표적입니다. 개인 과금이 어려웠던 PF-08, PF-09, PF-05에 공공 재원 기반의 사업 경로가 생기고 있습니다.\n\n**4) 로봇 AI는 범용화되고, 운영과 현장 데이터의 가치가 커지고 있습니다.**\nNVIDIA는 로봇 AI 모델을 공개했고([[SIG-20261006-15]]), 범용 로봇 모델 기업에 대규모 투자가 이어지고 있습니다([[SIG-20261006-16]]). Bain은 자동화 산업의 이익이 하드웨어에서 운영 소프트웨어와 데이터로 이동한다고 분석했습니다([[SIG-20261006-22]]). PF-02와 PF-06의 방향과 일치합니다.\n\n## 5. 수요 환경\n\n9개 기회의 수요 근거가 되는 가구 변화를 4개 지수로 관리합니다.\n\n| 지수 | 의미 | 현재 추세 | 관련 기회 |\n|---|---|---|---|\n| [[시간빈곤지수]] | 가사·생활 관리에 쓸 시간의 부족 | 상승 (맞벌이 48.6%, 자녀 가구 60.4%) | PF-01, PF-04, PF-06 |\n| [[가사외주화지수]] | 가사를 기기·서비스에 맡기는 정도 | 빠른 상승 (로봇청소기 보유 24%, 5년간 2.5배) | PF-06, PF-02, PF-01 |\n| [[돌봄부담지수]] | 고령자 돌봄 부담 | 가장 빠른 상승 (고령 1인가구 245만, 일반가구의 10.9%) | PF-08, PF-06, PF-07 |\n| [[공간제약지수]] | 주거 공간의 협소함과 노후도 | 완만한 상승 (1인가구 36.6%, 노후 저층주택 필지 49.6%) | PF-07, PF-09 |\n\n## 6. 최근 점검 결과\n\n<!-- AUTO:LATEST -->\n**다이제스트 2026-10-06 · 베이스라인**\n\n1. **경쟁사가 먼저 진입하는 영역이 늘고 있습니다.** Google은 구매 위임 결제 규격(AP2)을 발표했고, Kraken은 2GW 규모의 가정 전력 조절 자원을 운영하며, 북미 TV 운영체제 시장에서는 유통사 점유율이 커지고 있습니다. PF-01과 PF-05의 독점우위를 낮추고 PF-04를 관찰 항목에 올렸습니다. PF-05는 이에 따라 Strategic Core에서 Moonshots로 옮겼습니다.\n2. **로봇 운영(PF-06)이 총점 1위가 되었습니다.** Goldman Sachs의 휴머노이드 전망 상향(4.7배), IFR 서비스 로봇 판매 24% 증가, LG CEO 직속 로봇사업센터 신설을 반영해 TAM과 실행 용이성을 각 0.5점 올렸습니다.\n3. **공공 부문이 비용 부담 주체로 등장했습니다.** 통합돌봄 시행, 일본 돌봄 기술 보조금, EU 수리권 의무화를 반영해 PF-08(TAM, 수익화 각 +0.5)과 PF-09(실행 용이성 +0.5)의 점수를 처음으로 올렸습니다.\n\n상세 내용은 다이제스트 탭에 있습니다.\n<!-- /AUTO:LATEST -->\n\n## 부록\n\n| 문서 | 내용 |\n|---|---|\n| [[Appendix-A\\|부록 A. 검토 방법]] | 후보 도출 절차, 플랫폼 성립 요건, 사업 방식, 선정 기준, 후보 수렴 과정 |\n| [[Appendix-B\\|부록 B. 용어]] | 본문에 쓰인 용어 설명 |\n| [[Appendix-C\\|부록 C. 의사결정 사항]] | 경영 판단이 필요한 사항과 결정 내역 |\n\n## 변경 이력\n- 2026-10-06: 의사결정 사항(6장)을 부록 C로 분리. PF-05 독점우위 하향으로 Strategic Core에서 Moonshots로 이동.\n- 2026-10-06: 부록 A(검토 방법)와 부록 B(용어)를 하위 문서로 분리.\n- 2026-10-06: 의사결정 요청 5건 결정 반영 (D-01 국내 포함, D-02 장비 공급 유지, D-03 자사 로봇 중심, D-04 독립 과제, D-05 원안 유지).\n- 2026-10-06: 경영진 보고용으로 문안과 목차 재정비. 요약, 검토 배경, 9개 기회, 평가, 변화, 수요 환경, 의사결정 요청 순으로 재구성하고 방법론은 부록으로 이동.\n- 2026-10-06: 개요 페이지로 재구성.\n- 2026-10-06: 포트폴리오 개요 초판. 2026년 1월 이후 글로벌 소스 44건 반영, 6개 Thesis 8건 점수 조정, 4건 관찰 등록.\n", "Appendix-A": "---\nid: Appendix-A\nname: 부록 A. 검토 방법\nupdated: 2026-10-06\n---\n\n# 부록 A. 검토 방법\n\n> [[Portfolio]]의 부속 문서입니다. 9개 플랫폼 기회를 도출하고 선정한 절차와 기준을 정리했습니다.\n\n## 후보 도출 절차 (Platform Ideation Genome v3)\n\n| 단계 | 검토 내용 | 예시 |\n|---|---|---|\n| 1. 구조 변화 | 10년 후 산업의 역할 분담을 바꿀 변화 | AI 에이전트의 구매 대행, 가사 인력 감소, 고령화 |\n| 2. 새로운 고객 과제 | 변화로 인해 새로 생기는 고객 요구 | 건물주는 개별 설비보다 공간 가동률을 원함 |\n| 3. LG 고유 자산 | LG만 가진 자산의 조합 | 설치 기반, A/S망, 수리 이력, 구독 |\n| 4. 시장 실패 | 현재 시장이 해결하지 못하는 이유 | 중고 가전 상태를 보증하는 주체가 없음 |\n| 5. 확보할 위치 | LG가 결정·허용·거절할 수 있는 영역과 그 근거가 되는 책임 | 작업 결과를 보증하므로 투입 로봇을 결정 |\n| 6. 사업 방식 | 시장 확장 방식 | 아래 표 참조 |\n| 7. 성장 구조와 방어력 | 규모가 커질수록 가치가 커지는 구조, 축적되는 자산 | 진단할수록 쌓이는 집 상태 데이터 |\n\n## 플랫폼 성립 요건\n\n| 요건 | 확인 질문 | LG 예시 |\n|---|---|---|\n| 접근권 | 고객·공간·기기에 지속적으로 접근할 수 있는가 | 정기 방문 계약, 설비 원격 접속, 설치 기반 |\n| 판단권 | 판단에 필요한 정보와 권한이 있는가 | 제조 이력, 고장 이력, 센서 데이터 |\n| 거절권 | 공급자·서비스를 선택하거나 배제할 수 있는가 | 이 요건이 없으면 플랫폼이 아닌 인프라로 분류 |\n\n거절권은 결과에 대한 책임에서 생깁니다. 결과를 보증하는 사업자는 품질 관리를 위해 하위 공급자를 선택·배제해야 하고, 이 권한이 플랫폼 사업의 기반이 됩니다. LG는 사람을 보내고, 수리하고, 보증할 수 있다는 점에서 소프트웨어 기업과 차별화됩니다.\n\n## 사업 방식 5가지\n\n| 사업 방식 | 내용 | 적용 기회 |\n|---|---|---|\n| 실행 계층 (Runtime) | 타사 기기·로봇·AI가 거쳐야 하는 운영 계층 확보 | PF-02, PF-03, PF-06 |\n| 수요 집약 (Aggregation) | 분산된 수요를 모아 공급자 협상력 확보 | PF-01, PF-05, PF-07 |\n| 중개 (Marketplace) | 진단·보증으로 확정된 수요를 공급자와 연결 | PF-06, PF-07, PF-09 |\n| 표준·인증 (Standard) | 등급·인증·규격을 정의해 가격과 채택에 영향 | PF-02, PF-08, PF-09 |\n| 유통 (Distribution) | 서비스 노출 순서와 시점 결정 | PF-04 |\n\n## 선정 기준\n\n통과 기준 6가지를 모두 충족해야 합니다.\n\n1. LG가 빠지면 시장 참여자의 행동이 달라지는가\n2. 경쟁사보다 유리한 출발점이 있는가\n3. LG가 이 위치를 맡는 것이 산업 구조상 자연스러운가\n4. 규모가 커질수록 가치가 커지는 구조가 있는가\n5. 외부 참여자가 들어올 이유가 있는가\n6. 다른 후보의 하위 기능이 아닌가\n\n다음 중 하나라도 해당하면 제외했습니다.\n\n| 제외 기준 | 내용 |\n|---|---|\n| 확보할 위치 없음 | 데이터 제공이나 사용성 개선만으로는 플랫폼이 아님 |\n| LG 자격 없음 | 관련 자산이 없거나 브랜드·규제상 부적합 |\n| 자기잠식 | 기존 사업 손익을 직접 훼손 |\n| 중복 | 다른 후보의 하위 기능 |\n| 범위 이탈 | 담당 소관 또는 검토 범위 밖 |\n\n시장 규모가 가장 컸던 Physical World Data Trust(가정 데이터 거래)는 고객 신뢰를 낮은 수익과 맞바꾸는 구조여서 다른 사업의 기반을 훼손한다고 판단해 제외했습니다.\n\n## 후보 수렴 과정\n\n| 구분 | Route A (미래 플랫폼 관점) | Route B (책임 관점) |\n|---|---|---|\n| 접근 | 2030~2035년 산업 변화에서 출발해 하향식 탐색 | 10개 구조 변화를 정의하고 LG가 책임질 수 있는 영역을 집중 탐색 |\n| 주요 주제 | 에이전트 커머스, Physical AI, 자율 공간, 앰비언트 컴퓨팅, 에너지 전환, 모빌리티 | 에이전트 구매, 가사 인력 감소, 고령화, 공간 재편, 제품 수명 연장, 현장 지식 소멸 |\n| 후보 수 | 25개 | 26개 |\n\n| 단계 | 후보 수 | 제외 사유 |\n|---|:-:|---|\n| 원천 후보 | 51 | |\n| 1차 선별 | 39 | 범위 이탈, 공장·제조 혁신 과제 제외 |\n| 2차 선별 | 16 | 중복 통합, 하위 기능 흡수 |\n| 최종 | 9 | 선정 기준 6가지 충족 |\n\n가장 많이 적용된 제외 사유는 중복입니다. 가정 영역 후보 상당수가 \"고객 집에 정기적으로 들어갈 수 있는 신뢰\"라는 같은 위치로 수렴했습니다.\n\n- 통합: Route A의 Autonomous Building OS와 Route B의 Commercial Space OS는 건물 운영 결과를 책임진다는 점이 같아 PF-03으로 통합했습니다.\n- 분리 유지: PF-02와 PF-06은 모두 로봇을 다루지만 고객이 다릅니다. PF-02는 로봇 제조사와 AI 개발자, PF-06은 건물·매장·호텔 운영자가 고객이므로 별도 기회로 유지했습니다.\n\n## 변경 이력\n- 2026-10-06: 개요 페이지에서 하위 문서로 분리.\n", "Appendix-B": "---\nid: Appendix-B\nname: 부록 B. 용어\nupdated: 2026-10-06\n---\n\n# 부록 B. 용어\n\n> [[Portfolio]]의 부속 문서입니다. 본문에 쓰인 용어를 설명합니다.\n\n| 용어 | 설명 |\n|---|---|\n| 플랫폼 기회 (Platform Thesis, PF) | LG가 확보할 수 있다고 판단한 사업 위치와 그 사업 가설 |\n| 확보할 위치 (Control Point) | 다른 사업자와 고객의 선택에 영향을 주는 위치. 접근권·판단권·거절권이 모두 필요 |\n| 사분면 | 실행 가능성과 시장 규모로 분류한 4개 추진 그룹 |\n| 신호 (SIG) | 평가에 반영한 외부 근거 1건 |\n| 관찰 항목 | 근거가 상충해 점수를 바꾸지 않고 추이를 보는 항목 |\n| 수요 지수 | 가구 변화를 측정하는 4개 지표 |\n\n## 변경 이력\n- 2026-10-06: 개요 페이지에서 하위 문서로 분리.\n", "Appendix-C": "---\nid: Appendix-C\nname: 부록 C. 의사결정 사항\nupdated: 2026-10-06\n---\n\n# 부록 C. 의사결정 사항\n\n> [[Portfolio]]의 부속 문서입니다. 결정 결과에 따라 해당 기회의 그룹이나 추진 방식이 달라지는 사항을 관리합니다.\n\n새 사항이 생기면 결정 대기 목록에 추가하고, 결정된 사항은 결정 완료 표로 옮깁니다. 각 사항의 배경, 선택안, 판단 지표는 `data/decisions.json`에서 관리합니다.\n\n<!-- AUTO:DECISIONS -->\n현재 결정 대기 사항은 없습니다.\n\n### 결정 완료 사항\n\n| 번호 | 결정 사항 | 결정 내용 | 관련 기회 | 결정일 |\n|---|---|---|---|---|\n| D-01 | Flexible Energy Network의 평가 범위를 유럽 사업으로 한정할 것인가, 국내 사업까지 포함할 것인가? | B. 국내 포함. 유럽과 국내 사업을 함께 기준으로 평가 | [[PF-05]] | 2026-10-06 |\n| D-02 | 데이터센터 냉각 사업을 장비 공급에서 냉각 성능·가동률 보증 계약으로 확대할 것인가? | B. 장비 공급 유지. PF-03은 장기 Moonshot 과제로 관리 | [[PF-03]] | 2026-10-06 |\n| D-03 | 베어로보틱스 관제 시스템에 타사 로봇 연동을 허용할 것인가? | B. 자사 로봇 중심. 운영 사업을 먼저 확대하고 타사 연동은 추후 재검토 | [[PF-06]] | 2026-10-06 |\n| D-04 | Independent Living을 Home Diagnostics의 부가서비스로 유지할 것인가, 지자체 대상 독립 과제로 재검토할 것인가? | B. B2G 독립 과제. 지자체 통합돌봄 시범사업부터 착수 | [[PF-08]] [[PF-07]] | 2026-10-06 |\n| D-05 | Household CFO의 역할을 구매 대행에서 수요 신호 공급으로 재정의할 것인가? | B. 원안 유지. LG Agent가 구매와 공급자 협상을 직접 수행 | [[PF-01]] | 2026-10-06 |\n<!-- /AUTO:DECISIONS -->\n\n## 변경 이력\n- 2026-10-06: 개요 6장에서 하위 문서로 분리. D-01~D-05 결정 완료.\n", "PF-01-study": "---\nid: PF-01-study\nname: PF-01 Household CFO 심층 분석\nthesis: PF-01\nupdated: 2026-10-06\n---\n\n# PF-01 Household CFO 심층 분석\n\n> [[PF-01]] (가계 구매 위임) 위키의 부속 문서입니다. Template v2 18항목으로 사업 구조를 전개했습니다.\n\n> 9월 평가 당시 18항목 전개가 비어 있던 Thesis다. 2026-10-06에 본문 위키와 신호를 바탕으로 전개했다. 본문 위키와 겹치는 내용은 짧게 요약하고, 이 문서에서는 **사업이 실제로 어떻게 돌아가는가**에 집중한다.\n\n## A. Scenario Genesis — 왜 지금, 왜 이 기회인가\n\n**01 · Future Structural Shift.** 구매의 주체가 사람에서 에이전트로 넘어간다. 2026년 구글은 위임장 기반 결제 규격을, 아마존은 자동 재구매를, 국내 카드사는 에이전트 결제 실증을 시작했다([[SIG-20261006-13]] [[SIG-20261006-14]] [[SIG-20261006-04]]). 다만 소비자는 탐색은 맡기되 **지속적인 결제 권한**은 쉽게 내주지 않는다([[SIG-20261006-12]]). 앞으로 5년의 승부는 \"누가 그 지속 권한을 먼저 신뢰받느냐\"다.\n\n**02 · New Job-to-be-Done.** 가구는 \"더 싸게 사는 법\"보다 \"**신경 쓰지 않아도 집이 굴러가는 상태**\"를 원한다. 필터가 언제 막힐지, 세제가 언제 떨어질지, 냉장고를 언제 바꿔야 할지를 기억하고 판단하는 일 자체를 맡기고 싶어 한다. 맞벌이·1인가구일수록 이 수요가 크다([[시간빈곤지수]]).\n\n**03 · LG Asymmetric Asset.**\n\n| 자산 | 구매 위임에서 하는 역할 |\n|---|---|\n| 기기 상태 데이터 (소모품 잔량·부품 수명·고장 이력) | 수요를 추정이 아니라 **관측** — \"왜 지금 사야 하나\"를 증명 |\n| 가전 구독 가구 (연 2.4조 원, 판매의 약 절반) | 이미 관리를 제조사에 맡긴 가구 — 위임 신뢰의 출발점 ([[SIG-20261006-37]]) |\n| 케어 매니저 약 4,000명 | 사람이 방문해 확인 — 고가 품목 교체 판단의 신뢰 장치 |\n| 교체 주기·수리 이력 | 고관여 품목(가전 교체)의 시점 예측 |\n\n**04 · Market Failure / White Space.** 커머스 플랫폼의 반복 구매는 **과거 구매 이력**으로 다음 주문을 추정한다. 그래서 너무 이르거나 늦고, 고장·교체 같은 비정기 수요는 다루지 못한다. 반대로 제조사는 상태를 알지만 커머스·결제를 갖지 않았다. \"상태를 아는 쪽\"과 \"살 수 있는 쪽\"이 분리된 것이 빈자리다.\n\n## B. Platform Thesis — 무엇을 장악하고 누가 참여하는가\n\n**05 · Control Point.** 가계 구매 위임권(Purchasing Mandate) — 고객이 사전 승인한 범위 안에서 대신 사고, 바꾸고, 해지하는 권한. 상세는 1장.\n\n**06 · Platform Mechanism.** Demand Aggregation(여러 가구 수요 묶음) + Managed Procurement(조달 대행). 2026년 신호 이후 현실적인 형태는 \"결제는 표준 위임장(AP2 등) 위에서, LG는 수요 신호와 조건 협상을 맡는\" 구조다([[SIG-20261006-13]]).\n\n**07 · Demand & Supply Participants.**\n\n| 쪽 | 참여자 | 왜 들어오나 |\n|---|---|---|\n| 수요 | LG 구독·ThinQ 가구 | 신경 쓸 일 감소, 묶음 가격 |\n| 공급 | 소모품·세제·필터 제조사 | 정확한 시점의 확정 수요 |\n| 공급 | 생활 서비스(세탁·청소·수리) | 진단으로 확정된 작업 수요 |\n| 공급 | 통신·보험·렌탈 등 가구 고정비 사업자 | 해지 위험이 낮은 장기 고객 |\n| 인프라 | 카드사·결제 규격 사업자 | 위임 결제 거래량 |\n\n**08 · Value Exchange.**\n\n| 참여자 | 주는 것 | 받는 것 |\n|---|---|---|\n| 가구 | 위임 권한, 사용 데이터 동의 | 시간 절약, 묶음 가격, 결품·고장 예방 |\n| 공급자 | 수수료, 묶음 할인 | 확정 수요, 낮은 고객 획득 비용 |\n| LG | 수요 신호, 조건 협상, 위임 신뢰 보증 | 중개 수수료, 구독 유지율 상승 |\n\n## C. Economics & Defensibility — 돈이 되고 지켜지는가\n\n**09 · Business Model.**\n\n| 수익원 | 구조 | 시기 |\n|---|---|---|\n| 소모품 자동 재주문 마진 | 구독 가구 대상 정기 배송 | 즉시 (웨지) |\n| 공급자 중개 수수료 | 생활 서비스·타사 소모품 거래당 | 확장 단계 |\n| 묶음 조달 스프레드 | 가구 수요를 묶어 협상한 조건 차이 | 규모 도달 후 |\n| 구독 유지율 상승 | 위임 가구의 해지율 감소 → 구독 LTV 증가 | 간접 효과 |\n\n**10 · Platform Flywheel.**\n> 위임 가구 증가 → 확정 수요 규모 증가 → 공급자 조건 개선 → 가구 혜택 증가 → 위임 가구 증가\n\n보조 고리: 위임이 쌓일수록 기기 상태와 구매 결과를 잇는 데이터가 늘어 수요 예측이 정확해진다.\n\n**11 · Accumulating Asset / Moat.** \"기기 상태 → 필요 시점 → 실제 구매 → 만족도\"를 잇는 가구 단위 이력. 커머스 플랫폼은 구매만, 제조사는 상태만 가지고 있어 이 연결 자체가 복제하기 어렵다.\n\n**12 · North Star KPI.** **위임 활성 가구 수** — 최소 1개 카테고리를 자동 구매로 맡긴 가구. 보조 지표: 가구당 위임 카테고리 수, 위임 거래의 취소·반품률(신뢰 지표).\n\n## D. LG Strategy — 어떻게 시작하고 무엇이 위험한가\n\n**13 · Right-to-Win.** 상태 기반 수요 신호, 구독 가구, 방문 인력. 다만 2026년 들어 구글·아마존이 위임 형식과 첫 웨지를 선점해 독점우위를 4.5에서 4.0으로 내렸다.\n\n**14 · Right-to-Own.** 가전과 관련된 지출(소모품·수리·교체)은 제조사가 판단하는 것이 산업 구조상 자연스럽다. 반면 식료품·일반 생필품까지 넓히는 것은 커머스 플랫폼의 자리이므로, **LG가 소유할 자연스러운 범위는 \"집과 기기에 관한 지출\"로** 한정하는 것이 맞다.\n\n**15 · Initial Wedge.** 구독 가구의 소모품 자동 재주문. 기기가 잔량을 알기 때문에 \"지금 사야 하는 이유\"를 고객에게 보여줄 수 있고, 아마존식 이력 기반 재구매와 차별화된다.\n\n**16 · Expansion Path.**\n\n| 단계 | 범위 | 전제 조건 |\n|---|---|---|\n| 1 | LG 소모품 자동 재주문 | 구독 가구 동의, 결제 위임 규격 |\n| 2 | 타사 소모품·생활 서비스 중개 | 공급자 확보, 진단 데이터([[PF-07]]) |\n| 3 | 가전 교체 시점 제안·조달 | 수리 이력 기반 교체 예측 |\n| 4 | 가구 고정비(통신·보험) 재협상 | 위임 가구 규모, 금융 파트너 |\n\n**17 · Biggest Risk.** 커머스 플랫폼이 **IoT 기기 상태 데이터를 제조사 없이 직접 받는 표준**을 만드는 것. 그러면 LG의 유일한 차별점(관측된 수요)이 사라진다. 대응: 위임장 표준에는 참여하되, 상태 데이터는 고객 동의 기반으로 LG 경유를 유지한다.\n\n**18 · 2030 End-state.** 한국·주요 시장의 LG 구독 가구 상당수가 \"집과 가전에 관한 지출\"을 LG Agent에 맡긴다. 결제는 표준 위임장 위에서 일어나고, LG는 수요 신호와 공급자 조건을 쥔 **가구 지출의 운영자**가 된다.\n\n## 변경 이력\n- 2026-10-06: Template v2 18항목 전개. 같은 날 Thesis 위키 부록에서 별도 문서로 분리.\n", "PF-02-study": "---\nid: PF-02-study\nname: PF-02 Physical Environment Runtime 심층 분석\nthesis: PF-02\nupdated: 2026-10-06\n---\n\n# PF-02 Physical Environment Runtime 심층 분석\n\n> [[PF-02]] (로봇용 가전 규격) 위키의 부속 문서입니다. Template v2 18항목으로 사업 구조를 전개했습니다.\n\n> 9월 평가 당시 18항목 전개가 비어 있던 Thesis다. 2026-10-06에 본문 위키와 신호를 바탕으로 전개했다. 본문 위키와 겹치는 내용은 짧게 요약하고, 이 문서에서는 **사업이 실제로 어떻게 돌아가는가**에 집중한다.\n\n## A. Scenario Genesis — 왜 지금, 왜 이 기회인가\n\n**01 · Future Structural Shift.** 로봇의 \"두뇌\"가 범용화되고 있다. 엔비디아는 휴머노이드용 모델을 오픈소스로 풀었고([[SIG-20261006-15]]), 구글은 전신 제어 모델을 로봇 제조사들과 함께 내놓았으며([[SIG-20261006-47]]), 범용 로봇 모델 기업이 기업가치 110억 달러를 인정받았다([[SIG-20261006-16]]). 두뇌가 흔해지면 다음 병목은 **로봇이 실제 환경에서 안전하게 행동하는 조건**으로 옮겨 간다.\n\n**02 · New Job-to-be-Done.** 로봇 제조사와 AI 개발자는 \"집집마다 다른 가전을 일일이 학습시키지 않고도 안전하게 쓰는 방법\"이 필요하다. 세탁기 문이 잠겼는지, 오븐이 뜨거운지, 식기세척기가 작동 중인지, 작업이 정말 끝났는지를 **카메라로 추측하지 않고 확인**할 수 있어야 한다.\n\n**03 · LG Asymmetric Asset.**\n\n| 자산 | 런타임에서 하는 역할 |\n|---|---|\n| 가전 내부 상태·펌웨어·고장 모드 | 행동 허용 조건과 완료 검증의 원천 |\n| 세탁·주방·공조·TV를 아우르는 포트폴리오 | 한 회사 규격으로 집 안 주요 기기를 커버 |\n| 자체 로봇 CLOiD, AXIUM 액추에이터 | 규격을 내부에서 먼저 검증 ([[SIG-20261006-17]]) |\n| CEO 직속 로봇사업센터·데이터 생성 조직 | 실행 조직 ([[SIG-20261006-21]]) |\n| 엔비디아 생태계 파트너 | 개발자 도구에 규격을 노출할 경로 ([[SIG-20261006-15]]) |\n\n**04 · Market Failure / White Space.** 로봇 회사는 두뇌를 만들지만 가전 내부를 모르고, 가전 회사는 내부를 알지만 로봇을 위한 규격을 만들지 않았다. Matter 같은 표준은 켜고 끄는 **제어**는 다루지만, \"지금 이 행동을 해도 안전한가\"와 \"제대로 끝났는가\"는 다루지 않는다([[SIG-20261006-32]]). 이 사이가 비어 있다.\n\n## B. Platform Thesis — 무엇을 장악하고 누가 참여하는가\n\n**05 · Control Point.** 물리 환경 행동 모델(Physical Skill Contract) — 로봇이 기기를 다룰 때의 허용 조건과 완료 검증을 정의하는 권한. 상세는 1장.\n\n**06 · Platform Mechanism.** Runtime(로봇이 호출하는 실행 계층) + Standard(행동 계약 규격) + Developer Ecosystem(로봇 OEM·AI 개발자 도구).\n\n**07 · Demand & Supply Participants.**\n\n| 쪽 | 참여자 | 왜 들어오나 |\n|---|---|---|\n| 수요 | 휴머노이드·가정용 로봇 제조사 | 가전별 학습 비용 절감, 안전 사고 책임 분담 |\n| 수요 | AI 에이전트 개발자 | 물리 행동을 API로 호출 |\n| 공급 | LG 가전 | 규격의 첫 구현체 |\n| 공급 | 타사 가전·설비 제조사 | 로봇 호환 인증으로 판매 경쟁력 |\n| 보완 | 보험사·인증기관 | 로봇 행동 안전의 기준 |\n\n**08 · Value Exchange.**\n\n| 참여자 | 주는 것 | 받는 것 |\n|---|---|---|\n| 로봇 OEM | 라이선스·호출 비용, 행동 데이터 | 검증된 행동 계약, 안전 보증 |\n| 가전 제조사 | 규격 채택 | \"로봇 호환\" 인증과 판매 경쟁력 |\n| LG | 규격·런타임·인증 | 라이선스 수익, 실세계 행동 데이터 |\n\n## C. Economics & Defensibility — 돈이 되고 지켜지는가\n\n**09 · Business Model.**\n\n| 수익원 | 구조 | 시기 |\n|---|---|---|\n| 런타임 라이선스 | 로봇 OEM당 또는 대수당 | 가정용 로봇 상용화 이후 |\n| 호출 과금 | 행동 계약 API 호출량 | 규모 도달 후 |\n| 로봇 호환 인증 | 타사 가전·설비 인증 수수료 | 확장 단계 |\n| 자사 로봇·가전 판매 기여 | CLOiD·LG 가전 동반 판매 | 즉시 (간접) |\n\n수익화 점수가 2.5로 낮은 이유는 가정용 휴머노이드의 본격 보급이 2030년대 이후로 전망되기 때문이다([[SIG-20261006-19]]).\n\n**10 · Platform Flywheel.**\n> 규격을 쓰는 로봇 증가 → 규격을 채택하는 가전 증가 → 로봇이 할 수 있는 작업 증가 → 로봇 가치 상승 → 규격을 쓰는 로봇 증가\n\n**11 · Accumulating Asset / Moat.** 실제 가정에서 로봇이 기기를 다룬 **행동–결과 데이터**(성공·실패·안전 개입). 데이터 해자 5.0점의 근거이며, 시뮬레이션으로 대체하기 어렵다.\n\n**12 · North Star KPI.** **규격을 호출하는 외부 로봇 기종 수**. 보조 지표: 규격을 채택한 가전 모델 수, 행동 계약 호출 성공률, 안전 개입 비율.\n\n## D. LG Strategy — 어떻게 시작하고 무엇이 위험한가\n\n**13 · Right-to-Win.** 가장 넓은 가전 포트폴리오, 기기 내부 상태 지식, 자체 로봇과 부품, 엔비디아 파트너십.\n\n**14 · Right-to-Own.** 기기의 안전 조건은 제조사가 책임지는 영역이다. 사고가 나면 제조사에 묻는 구조이므로, 그 조건을 정의하는 것도 제조사가 맡는 것이 자연스럽다. 이 점이 소프트웨어 기업이 대신하기 어려운 이유다.\n\n**15 · Initial Wedge.** LG 가전 + CLOiD 조합에서 행동 계약 규격 v1을 만든다. 세탁기 문 열기, 식기세척기 적재·시작, 냉장고 물건 꺼내기처럼 반복 빈도가 높고 안전 조건이 분명한 작업부터.\n\n**16 · Expansion Path.**\n\n| 단계 | 범위 | 전제 조건 |\n|---|---|---|\n| 1 | LG 가전 × LG 로봇 내부 규격 | CLOiD 출시 |\n| 2 | 엔비디아 Isaac 등 개발 도구에 규격 공개 | 시뮬레이션용 기기 모델 |\n| 3 | 타사 로봇 OEM 호출 | 라이선스 조건, 안전 책임 분담 |\n| 4 | 타사 가전의 규격 채택·인증 | 업계 표준화 (Matter 등과의 관계 정리) |\n\n**17 · Biggest Risk.** 범용 로봇 모델이 **시각과 손 조작만으로** 가전 작업을 충분히 안전하게 해내는 것([[SIG-20261006-16]] [[SIG-20261006-47]]). 그러면 런타임의 필요성이 줄어든다. 현재 관찰 중인 항목이다. 대응: 런타임의 가치를 \"가능하게 함\"이 아니라 \"**안전과 책임을 보증함**\"으로 정의해, 보험·인증과 결합한다.\n\n**18 · 2030 End-state.** 가정용 로봇이 집 안에서 가전을 다룰 때 거치는 **안전·검증 계층의 사실상 표준**. LG 로봇이 아닌 로봇도 LG 규격을 호출한다.\n\n## 변경 이력\n- 2026-10-06: Template v2 18항목 전개. 같은 날 Thesis 위키 부록에서 별도 문서로 분리.\n", "PF-04-study": "---\nid: PF-04-study\nname: PF-04 Ambient AI Distribution 심층 분석\nthesis: PF-04\nupdated: 2026-10-06\n---\n\n# PF-04 Ambient AI Distribution 심층 분석\n\n> [[PF-04]] (AI 서비스 유통) 위키의 부속 문서입니다. Template v2 18항목으로 사업 구조를 전개했습니다.\n\n> 9월 평가 당시 18항목 전개가 비어 있던 Thesis다. 2026-10-06에 본문 위키와 신호를 바탕으로 전개했다. 본문 위키와 겹치는 내용은 짧게 요약하고, 이 문서에서는 **사업이 실제로 어떻게 돌아가는가**에 집중한다.\n\n## A. Scenario Genesis — 왜 지금, 왜 이 기회인가\n\n**01 · Future Structural Shift.** 앱을 고르는 시대에서 AI가 서비스를 부르는 시대로 넘어간다. 거실의 공용 화면에서도 같은 일이 일어나고 있다. 삼성 TV는 여러 AI 에이전트를 골라 쓰게 했고([[SIG-20261006-27]]), 북미에서는 리테일러가 TV OS를 광고·쇼핑 채널로 바꾸고 있다([[SIG-20261006-29]]). **TV OS가 \"앱 장터\"에서 \"AI·커머스 관문\"으로** 성격이 바뀌는 중이다.\n\n**02 · New Job-to-be-Done.** AI 서비스 기업은 스마트폰 밖에서 **가구 단위의 고객**을 만날 경로가 필요하다. 가구는 리모컨 버튼 하나로 지금 보는 것과 관련된 질문·쇼핑·예약을 해결하고 싶어 한다.\n\n**03 · LG Asymmetric Asset.**\n\n| 자산 | 유통 관문에서 하는 역할 |\n|---|---|\n| webOS 활성 기기 약 2.6억 대 (9월 평가 기준) | 접근권의 원천 |\n| 외부 TV 제조사 약 400곳에 webOS 공급 | 이미 \"타사 기기를 받아들인\" 플랫폼 ([[SIG-20261006-45]]) |\n| FAST 채널·광고 사업 | 유통 수익 모델 경험 |\n| OS 직접 소유 (구글 TV 미사용) | 라우팅 규칙을 LG가 결정 |\n| ThinQ ON·Homey 홈 허브 | TV 밖 접점 ([[SIG-20261006-34]]) |\n\n**04 · Market Failure / White Space.** AI 서비스는 대부분 개인 스마트폰에 갇혀 있고, 가구 공용 공간에서 **\"지금 무엇을 보고 있는지\"라는 맥락**을 활용하지 못한다. TV 제조사의 AI 탑재는 아직 버튼으로 고르는 수준이다([[SIG-20261006-27]]). 맥락을 근거로 서비스를 연결하는 계층이 비어 있다.\n\n## B. Platform Thesis — 무엇을 장악하고 누가 참여하는가\n\n**05 · Control Point.** AI 서비스 유통 및 맥락 라우팅 결정권 — 어떤 AI 서비스가 어떤 가구에 언제 호출될지 정하는 권한. 상세는 1장.\n\n**06 · Platform Mechanism.** Distribution(노출·기본값) + Runtime(TV 위 실행 환경) + Context Gateway(시청 맥락 제공).\n\n**07 · Demand & Supply Participants.**\n\n| 쪽 | 참여자 | 왜 들어오나 |\n|---|---|---|\n| 수요 | webOS 가구 (LG + 외부 제조사 TV) | 리모컨 하나로 해결, 시청 맥락 활용 |\n| 공급 | LLM·에이전트 기업 (Microsoft, Perplexity 등) | 가구 단위 고객 접점 |\n| 공급 | 커머스·광고주 | 시청과 구매를 잇는 채널 |\n| 공급 | 콘텐츠·FAST 사업자 | 기존 유통 관계 |\n| 기기 | 외부 TV 제조사 | AI 기능을 갖춘 OS를 직접 개발하지 않아도 됨 |\n\n**08 · Value Exchange.**\n\n| 참여자 | 주는 것 | 받는 것 |\n|---|---|---|\n| AI 서비스 기업 | 탑재·노출 비용, 수익 배분 | 가구 고객 접근, 맥락 API |\n| 광고주 | 광고비 | 시청 맥락 기반 노출·구매 전환 |\n| 외부 TV 제조사 | OS 라이선스 | AI 기능 포함 OS |\n| LG | 라우팅·맥락·설치 기반 | 수수료·광고 수익, 데이터 |\n\n## C. Economics & Defensibility — 돈이 되고 지켜지는가\n\n**09 · Business Model.**\n\n| 수익원 | 구조 | 시기 |\n|---|---|---|\n| 광고·FAST (기존) | 시청 광고 | 현재 (연 1조 원 수준 언급, [[SIG-20261006-45]]) |\n| AI 서비스 기본 탑재·노출료 | AI 기업이 지불 | 협상력 확보 시 |\n| 라우팅·커머스 수수료 | AI 경유 구매·예약당 | 확장 단계 |\n| OS 라이선스 | 외부 TV 제조사 | 현재 |\n\n**10 · Platform Flywheel.**\n> webOS 설치 기반 증가 → AI 서비스 기업의 참여 증가 → TV에서 할 수 있는 일 증가 → 가구 사용량 증가 → 외부 제조사의 webOS 채택 증가 → 설치 기반 증가\n\n**11 · Accumulating Asset / Moat.** 시청 맥락과 AI 요청·구매 결과를 잇는 가구 단위 데이터. 리테일러 OS는 구매 데이터를, 스마트폰은 개인 데이터를 갖지만, **가구 공용 맥락**은 TV OS가 가장 잘 안다.\n\n**12 · North Star KPI.** **AI 호출 활성 기기 수** — 월 1회 이상 AI 서비스를 부른 webOS 기기. 보조 지표: 외부 AI 파트너 수, 기기당 AI 호출 수, AI 경유 거래액.\n\n## D. LG Strategy — 어떻게 시작하고 무엇이 위험한가\n\n**13 · Right-to-Win.** 대형 설치 기반, 외부 제조사로 넓어진 OS, OS 직접 소유. 9개 중 실행 용이성이 가장 높은(4.5) 이유는 이미 있는 인프라를 그대로 쓰기 때문이다.\n\n**14 · Right-to-Own.** TV OS 사업자가 그 화면에서 무엇을 보여줄지 정하는 것은 산업 구조상 자연스럽다. 다만 **사용자 신뢰를 잃으면 이 권리는 즉시 흔들린다** — 코파일럿 강제 설치 반발이 그 예다([[SIG-20261006-28]]).\n\n**15 · Initial Wedge.** 시청 맥락 기반 AI 호출을 webOS 기본 기능으로 만든다. 예: 경기 중계 중 선수 정보, 여행 프로그램 중 숙소 검색, 요리 프로그램 중 재료 주문. 외부 AI는 사용자가 고르게 하고, 맥락은 LG가 제공한다.\n\n**16 · Expansion Path.**\n\n| 단계 | 범위 | 전제 조건 |\n|---|---|---|\n| 1 | 맥락 기반 AI 호출 (LG TV) | 프라이버시 동의 설계 |\n| 2 | 외부 AI 기업에 맥락 API·노출 상품화 | 파트너 계약 구조 |\n| 3 | 외부 제조사 TV로 확대 | OS 라이선스 계약 갱신 |\n| 4 | 홈 허브·가전 화면으로 확장, [[PF-01]] 구매 위임 인터페이스 | ThinQ ON 보급 |\n\n**17 · Biggest Risk.** 두 가지다. 하나는 **AI 사용이 스마트폰·웨어러블·글래스에 집중**되어 거실 화면의 관문 가치가 낮아지는 것. 다른 하나는 **북미처럼 리테일러가 TV OS를 가져가** 설치 기반 우위가 지역별로 무너지는 것([[SIG-20261006-29]], 현재 관찰 중).\n\n**18 · 2030 End-state.** 가정에서 AI 서비스가 호출되는 기본 경로 중 하나. LG TV와 외부 제조사 TV를 합친 설치 기반 위에서, 라우팅 수수료와 맥락 기반 광고가 플랫폼 수익의 중심이 된다.\n\n## 변경 이력\n- 2026-10-06: Template v2 18항목 전개. 같은 날 Thesis 위키 부록에서 별도 문서로 분리.\n", "PF-05-study": "---\nid: PF-05-study\nname: PF-05 Flexible Energy Network 심층 분석\nthesis: PF-05\nupdated: 2026-10-06\n---\n\n# PF-05 Flexible Energy Network 심층 분석\n\n> [[PF-05]] (에너지 유연성 네트워크) 위키의 부속 문서입니다. Template v2 18항목으로 사업 구조를 전개했습니다.\n\n> 9월 평가 당시 18항목 전개가 비어 있던 Thesis다. 2026-10-06에 본문 위키와 신호를 바탕으로 전개했다. 본문 위키와 겹치는 내용은 짧게 요약하고, 이 문서에서는 **사업이 실제로 어떻게 돌아가는가**에 집중한다.\n\n## A. Scenario Genesis — 왜 지금, 왜 이 기회인가\n\n**01 · Future Structural Shift.** 전력망의 병목이 \"발전량\"에서 \"**수요를 언제 줄이고 옮길 수 있느냐**\"로 바뀌고 있다. 재생에너지가 늘어 공급이 출렁이고, AI 데이터센터가 피크 수요를 밀어 올린다. RMI는 가상발전소(VPP)가 2030년 미국 최대 수요의 20% 이상을 감당할 수 있다고 봤다([[SIG-20261006-30]]).\n\n**02 · New Job-to-be-Done.** 전력회사와 애그리게이터는 발전소를 새로 짓는 대신, **믿고 쓸 수 있는 수요 감축 자원**이 필요하다. 가구는 쾌적함을 해치지 않으면서 전기요금을 줄이고 싶다.\n\n**03 · LG Asymmetric Asset.**\n\n| 자산 | 유연 에너지에서 하는 역할 |\n|---|---|\n| 에어컨·히트펌프·가전의 내부 상태와 쾌적 제약 지식 | 얼마나 줄여도 불편하지 않은지 정확히 앎 — \"검증된\" 부하의 근거 |\n| 유럽 히트펌프 포트폴리오 | 가장 큰 가정용 유연 부하 |\n| Homey (1,000개 이상 브랜드 지원) | 타사 배터리·태양광·EV 충전기까지 묶는 허브 ([[SIG-20261006-46]]) |\n| 상업용 HVAC 설치 기반 | 빌딩 단위 대형 유연 자원 ([[PF-03]]) |\n\n**04 · Market Failure / White Space.** 전력회사는 가정 기기를 직접 제어하지 못하고, 제어해도 고객 불편을 예측하지 못해 참여율이 낮다. 기기 제조사는 제어할 수 있지만 전력 시장에 접속하지 않는다. 국내에서는 가정용 수요반응 보상이 작아 참여 동기가 약하다([[SIG-20261006-03]]).\n\n## B. Platform Thesis — 무엇을 장악하고 누가 참여하는가\n\n**05 · Control Point.** 고객 승인 기반의 검증된 유연 전력 부하 — 쾌적을 지키면서 줄일 수 있는 양을 보증하고 내주는 권한. 상세는 1장.\n\n**06 · Platform Mechanism.** Aggregation(부하 묶음) + Optimization(쾌적·요금 최적화) + Utility Interface(전력 시장·전력회사 연계).\n\n**07 · Demand & Supply Participants.**\n\n| 쪽 | 참여자 | 왜 들어오나 |\n|---|---|---|\n| 수요 | 전력회사·계통 운영자 | 피크 대응 비용 절감, 설비 투자 회피 |\n| 수요 | 애그리게이터 (Kraken 등) | 검증된 부하 확보 ([[SIG-20261006-31]]) |\n| 수요 | 데이터센터 | 접속 대기 해소용 유연성 |\n| 공급 | LG 가전·HVAC 가구 | 요금 절감, 보상 |\n| 공급 | 타사 기기 (배터리·태양광·EV 충전기) via Homey | 단독으로는 시장 접속이 어려움 |\n\n**08 · Value Exchange.**\n\n| 참여자 | 주는 것 | 받는 것 |\n|---|---|---|\n| 가구 | 제어 동의, 약간의 유연성 | 요금 절감, 보상 |\n| 전력회사·애그리게이터 | 용량·감축 대가 | 검증된 감축량, 예측 가능성 |\n| 타사 기기 제조사 | Homey 연동 | 전력 시장 접근 |\n| LG | 최적화·검증·묶음 | 플랫폼 수수료, 가전 판매 경쟁력 |\n\n## C. Economics & Defensibility — 돈이 되고 지켜지는가\n\n**09 · Business Model.**\n\n| 수익원 | 구조 | 시기 |\n|---|---|---|\n| 유연성 판매 수익 배분 | 감축량·용량 대가 중 일부 | 유럽 프로그램 연동 시 |\n| 에너지 최적화 구독 | 가구 대상 요금 최적화 서비스 | 즉시 가능 (Homey) |\n| 전력회사 대상 플랫폼 이용료 | 유연 자원 관리 소프트웨어 | 확장 단계 |\n| 가전 판매 기여 | \"요금을 줄이는 히트펌프\" 차별화 | 간접 |\n\n수익화가 3.5인 이유는 국가별 전력 시장 규칙에 따라 돈을 받을 수 있는 구조가 다르기 때문이다.\n\n**10 · Platform Flywheel.**\n> 연결 기기 증가 → 보증 가능한 감축량 증가 → 전력회사 계약 조건 개선 → 가구 보상 증가 → 연결 기기 증가\n\n**11 · Accumulating Asset / Moat.** 기기별 감축 반응 이력(얼마나 줄였고, 쾌적이 유지됐는지). 이 이력이 쌓일수록 감축량을 더 정확히 보증할 수 있고, 보증 정확도가 곧 가격이다.\n\n**12 · North Star KPI.** **검증된 유연 용량(MW)** — 전력회사 프로그램에 등록돼 실제 감축 실적이 있는 용량. 보조 지표: 연결 기기 수, 감축 요청 응답률, 참여 가구의 이탈률.\n\n## D. LG Strategy — 어떻게 시작하고 무엇이 위험한가\n\n**13 · Right-to-Win.** 기기 내부와 쾌적 제약에 대한 지식, 유럽 히트펌프, Homey의 타사 연동 범위. 다만 중립 애그리게이터와 국내 단지 플랫폼이 부하 제어 권한을 먼저 쥐고 있어 독점우위를 관찰 중이다.\n\n**14 · Right-to-Own.** 고객 쾌적과 기기 수명에 책임지는 쪽이 제어 한도를 정하는 것이 자연스럽다. 전력회사가 마음대로 끄면 고객 불만과 기기 고장 책임이 제조사로 온다.\n\n**15 · Initial Wedge.** 유럽 히트펌프 고객 대상 동적 요금 최적화(Homey 기반) → 유틸리티 유연성 프로그램 연동. EcoFlow처럼 배터리·태양광 파트너를 붙여 가구당 유연 용량을 키운다([[SIG-20261006-46]]).\n\n**16 · Expansion Path.**\n\n| 단계 | 범위 | 전제 조건 |\n|---|---|---|\n| 1 | 유럽 히트펌프 요금 최적화 | Homey 에너지 기능 |\n| 2 | 유럽 유틸리티·애그리게이터 프로그램 연동 | 감축 검증 체계 |\n| 3 | 타사 기기 포함 유연 자원 판매 | Homey 파트너 확대 |\n| 4 | 국내 분산에너지 특화지역·상업용 HVAC | 국내 제도 정비 ([[SIG-20261006-33]]) |\n\n**17 · Biggest Risk.** 유틸리티가 기기 제조사가 아니라 **Kraken 같은 중립 플랫폼만 통해** 유연성을 조달하는 구조가 굳어지는 것([[SIG-20261006-31]]). 그러면 LG는 기기 공급자에 머문다. 이 판단은 평가 범위를 유럽으로 할지 국내까지 할지(결정 질문 D-01)와 직결된다.\n\n**18 · 2030 End-state.** 유럽을 중심으로 전력회사가 구매하는 **검증된 가정용 유연 부하의 대형 공급 네트워크**. 히트펌프·에어컨·타사 배터리를 하나로 묶어 계약 가능한 용량으로 만든다.\n\n## 변경 이력\n- 2026-10-06: Template v2 18항목 전개. 같은 날 Thesis 위키 부록에서 별도 문서로 분리.\n", "가사외주화지수": "---\nid: IDX-OUTSRC\nname: 가사외주화지수\nlayer: 수요층 (Korea Futures Lab)\nupdated: 2026-10-06\n---\n# 가사외주화지수\n\n> 가구가 집안일을 기계·서비스·사람에게 얼마나 맡기는가.\n\n## 왜 이 지수를 보나\n\n맡기는 비중이 커질수록 가구는 \"기기\"가 아니라 \"끝난 일\"을 사려 한다. 이 지수가 오르면 작업 결과를 파는 [[PF-06]], 로봇이 가전을 다루게 하는 [[PF-02]], 구매를 맡기는 [[PF-01]]의 수요가 커진다.\n\n## 관측 데이터\n\n<!-- AUTO:INDICATORS -->\n변수 3개 — 이전값 대비 지수 상승 요인 2개 · 하락 요인 0개 · 비교값 없음/변화 없음 1개. 원장: `data/indicators.json`\n\n| 변수 | 최신값 | 이전값 | 지수 영향 | 출처 · 갱신 주기 |\n|---|:-:|:-:|:-:|---|\n| 온라인 음식서비스(배달) 거래액<br><small>41조 5,889억 원. 배달 플랫폼 매출은 2030년 약 40조 원 전망(그랜드뷰리서치)<\/small> | **41.6조 원** (2025) | – | 비교값 없음 | [국가데이터처 온라인쇼핑동향 (전자신문 인용)](https://www.etnews.com/20260424000291) · 월간·연간 |\n| 로봇청소기 보유율<br><small>5년 만에 2.5배 이상. 60대 이상 1인가구는 9%<\/small> | **24%** (2025) | 9% (2020) | ▲ 상승 요인 | [한국갤럽 가전제품 보유율 조사 (아이뉴스24 보도)](https://www.inews24.com/view/1909326) · 비정기 (약 2년) |\n| 식기세척기 보유율<br><small>2019년 12%에서 6년간 2배<\/small> | **24%** (2025) | 15% (2023) | ▲ 상승 요인 | [한국갤럽 가전제품 보유율 조사](https://www.gallup.co.kr/gallupdb/reportContent.asp?seqNo=1595) · 비정기 (약 2년) |\n<!-- /AUTO:INDICATORS -->\n\n## 지금 읽히는 방향 — 빠른 상승, 경로는 \"사람\"보다 \"기계와 플랫폼\"\n\n- **음식은 이미 크게 외주화됐다.** 온라인 음식서비스 거래액이 연 40조 원을 넘었다.\n- **집안일 자동화 가전이 빠르게 퍼지고 있다.** 로봇청소기 보유율은 5년 만에 9%에서 24%로, 식기세척기는 2년 만에 15%에서 24%로 올랐다.\n- **사람에게 맡기는 경로는 막혔다.** 외국인 가사관리사 본사업이 추진되지 않기로 했다([[SIG-20261006-09]]). 남은 외주화 수요는 기계·플랫폼·로봇 쪽으로 향할 가능성이 크다.\n- **세대 격차가 크다.** 60대 이상 1인가구의 로봇청소기 보유율은 9%에 그친다. 고령 가구의 외주화는 기기보다 서비스·돌봄과 묶여야 한다([[돌봄부담지수]]).\n\n## 아직 비어 있는 변수\n\n- 가사서비스 플랫폼 이용 가구 비율 — 공식 통계 없음, 업계 자료 필요\n- 세탁·청소 대행 시장 규모\n\n## 일본 선행 참조\n\n일본은 가사대행 서비스 시장이 정부 인증 제도와 함께 성장했다.\n\n## 변경 이력\n- 2026-10-06: 관측 데이터 3개 연결 (음식 배달 거래액, 로봇청소기·식기세척기 보유율).\n", "공간제약지수": "---\nid: IDX-SPACE\nname: 공간제약지수\nlayer: 수요층 (Korea Futures Lab)\nupdated: 2026-10-06\n---\n# 공간제약지수\n\n> 가구가 가전과 가구를 두고 쓰는 물리적 공간이 얼마나 좁고 낡았는가.\n\n## 왜 이 지수를 보나\n\n공간이 좁고 집이 낡을수록 작고 겸용인 제품, 빌트인, 그리고 집 상태 점검·수리 수요가 커진다. 자주 이사하면 가전을 짧게 쓰고 되파는 일도 늘어난다. 그래서 이 지수는 [[PF-07]] 집 상태 진단과 [[PF-09]] 중고 인증의 수요 기반이다.\n\n## 관측 데이터\n\n<!-- AUTO:INDICATORS -->\n변수 4개 — 이전값 대비 지수 상승 요인 1개 · 하락 요인 0개 · 비교값 없음/변화 없음 3개. 원장: `data/indicators.json`\n\n| 변수 | 최신값 | 이전값 | 지수 영향 | 출처 · 갱신 주기 |\n|---|:-:|:-:|:-:|---|\n| 1인당 주거면적<br><small>정체. 최저주거기준 미달 가구는 3.8%로 전년보다 증가<\/small> | **36㎡** (2024) | 36㎡ (2023) | 변화 없음 | [국토교통부 2024년도 주거실태조사 (KDI 경제정보센터)](https://eiec.kdi.re.kr/policy/materialView.do?num=273475) · 연 1회 |\n| 1인가구 비중 (일반가구 대비)<br><small>824만 4천 가구, 역대 최대. 소형 주거 수요의 선행 변수<\/small> | **36.6%** (2025-11) | 36.1% (2024-11) | ▲ 상승 요인 | [국가데이터처 인구주택총조사 (헤럴드경제 보도)](https://biz.heraldcorp.com/article/10822914) · 연 1회 (7월 발표) |\n| 준공 30년 넘은 4층 이하 노후 저층주택 필지 비율<br><small>주거지역만 보면 약 53%. 대구 66%로 최고<\/small> | **49.6%** (2026) | – | 비교값 없음 | [국토연구원 국토정책 브리프 (뉴스핌 보도)](https://www.newspim.com/news/view/20260826000586) · 비정기 |\n| 최근 2년 내 이사 가구 비율 (주거이동률)<br><small>전년 대비 감소. 평균 거주기간은 8.4년으로 증가 — 단기 보유·재판매 수요에는 약화 요인<\/small> | **30.3%** (2024) | – | 비교값 없음 | [국토교통부 2024년도 주거실태조사 (KDI 경제정보센터)](https://eiec.kdi.re.kr/policy/materialView.do?num=273475) · 연 1회 |\n<!-- /AUTO:INDICATORS -->\n\n## 지금 읽히는 방향 — 완만한 상승, 다만 이동성은 반대\n\n- **1인가구가 계속 늘고 있다.** 일반가구의 36.6%로 역대 최대다. 1인가구는 소형 주거와 짝을 이루므로 공간 제약의 선행 변수다.\n- **1인당 주거면적은 정체**(36.0㎡)이고, 최저주거기준 미달 가구는 오히려 늘었다.\n- **집이 낡았다.** 전국 필지의 절반이 준공 30년 넘은 4층 이하 저층주택이다. 공간 제약보다는 \"설비와 공간의 상태\" 문제로, PF-07에 가장 직접적인 근거다.\n- **반대 방향 신호**: 이사하는 가구 비율은 줄고 평균 거주기간은 늘었다. 짧게 쓰고 되파는 중고 가전 수요(PF-09)에는 약화 요인이다.\n\n## 아직 비어 있는 변수\n\n- 오피스텔·원룸 거주 비율 — 주거실태조사 세부 표\n- 빌트인 가전 채택률 — 업계 자료\n\n## 일본 선행 참조\n\n도쿄 등 대도시 소형 주거에서 일체형·소형 가전과 렌탈·중고 순환 시장이 함께 발달했다.\n\n## 변경 이력\n- 2026-10-06: 관측 데이터 4개 연결 (1인당 주거면적, 1인가구 비중, 노후 저층주택, 주거이동률).\n", "돌봄부담지수": "---\nid: IDX-CARE\nname: 돌봄부담지수\nlayer: 수요층 (Korea Futures Lab)\nupdated: 2026-10-06\n---\n# 돌봄부담지수\n\n> 가구와 사회가 고령자와 아이를 돌보는 데 지는 부담이 얼마나 큰가.\n\n## 왜 이 지수를 보나\n\n돌볼 사람은 늘고 돌봐줄 사람은 줄면, 상태를 원격으로 확인하고 필요한 서비스를 연결하는 기술의 가치가 커진다. 이 지수는 [[PF-08]] 독립생활의 핵심 수요 근거이며, [[PF-06]] 로봇 운영과 [[PF-07]] 집 상태 진단에도 이어진다.\n\n## 관측 데이터\n\n<!-- AUTO:INDICATORS -->\n변수 5개 — 이전값 대비 지수 상승 요인 1개 · 하락 요인 0개 · 비교값 없음/변화 없음 4개. 원장: `data/indicators.json`\n\n| 변수 | 최신값 | 이전값 | 지수 영향 | 출처 · 갱신 주기 |\n|---|:-:|:-:|:-:|---|\n| 65세 이상 인구 비중<br><small>1,112만 5천 명. 2036년 30%, 2050년 40% 초과 전망<\/small> | **21.6%** (2026) | – | 비교값 없음 | [국가데이터처 2026 고령자 통계 (머니투데이 보도)](https://www.mt.co.kr/economy/2026/10/01/2026100113565540469) · 연 1회 (9~10월 발표) |\n| 65세 이상 1인가구 (일반가구 대비)<br><small>245만 6천 가구(+16만 7천, +7.3%). 일반가구 10집 중 1집<\/small> | **10.9%** (2025-11) | 10.2% (2024-11) | ▲ 상승 요인 | [국가데이터처 인구주택총조사 (헤럴드경제 보도)](https://biz.heraldcorp.com/article/10822914) · 연 1회 (7월 발표) |\n| 노년부양비 (생산연령인구 100명당)<br><small>2066년 100.8명 전망<\/small> | **31.3명** (2026) | – | 비교값 없음 | [국가데이터처 2026 고령자 통계 (머니투데이 보도)](https://www.mt.co.kr/economy/2026/10/01/2026100113565540469) · 연 1회 |\n| 요양보호사 부족 전망 (2035년)<br><small>2040년 77만 명 부족. 현재 약 71만 명(2023). 장기요양 수요 2043년 2.4배 이상<\/small> | **49.8만 명** (2026-04) | – | 비교값 없음 | [KDI (다음뉴스 보도)](https://v.daum.net/v/20260429151946545) · 비정기 |\n| 55세 이상 '현 거주지 계속 거주' 희망 비율<br><small>건강 악화 시에도 현 주택 유지 희망 43.2% — 재가 돌봄(aging in place) 수요<\/small> | **85.7%** (2026) | – | 비교값 없음 | [경기연구원 경기 라이프 서베이 (머니투데이 보도)](https://www.mt.co.kr/policy/2026/04/20/2026042015041196095) · 비정기 |\n<!-- /AUTO:INDICATORS -->\n\n## 지금 읽히는 방향 — 가장 뚜렷한 상승\n\n- **혼자 사는 고령자가 10집 중 1집이다.** 65세 이상 1인가구가 245만을 넘어 일반가구의 10.9%가 됐고, 1년 사이 7% 넘게 늘었다.\n- **고령 인구가 5명 중 1명을 넘었다.** 2036년 30%, 2050년 40%를 넘을 전망이다.\n- **돌볼 사람이 모자란다.** KDI는 2035년 요양보호사가 약 50만 명, 2040년 약 77만 명 부족할 것으로 봤다. 사람으로 메울 수 없는 몫이 기술·제도로 넘어온다.\n- **고령자는 집에 머물고 싶어 한다.** 55세 이상 86%가 지금 사는 곳에서 계속 살기를 원한다. 통합돌봄 시행([[SIG-20261006-01]])과 같은 방향이다.\n\n## 아직 비어 있는 변수\n\n- 원거리 부모 부양 가구 비율 — 별도 조사 필요\n- 통합돌봄 대상자 수와 서비스 이용 실적 — 보건복지부 발표 대기\n\n## 일본 선행 참조\n\n일본은 개호보험으로 복지용구를 대여하고, 2026년도 개호 테크놀로지 도입에 보조율 최대 3/4를 적용한다([[SIG-20261006-40]]). 가전 사용 이력으로 안부를 확인하는 유통사 서비스도 나왔다([[SIG-20261006-10]]).\n\n## 변경 이력\n- 2026-10-06: 관측 데이터 5개 연결 (고령 인구 비중, 고령 1인가구, 노년부양비, 요양보호사 부족 전망, 재가 희망).\n", "시간빈곤지수": "---\nid: IDX-TIME\nname: 시간빈곤지수\nlayer: 수요층 (Korea Futures Lab)\nupdated: 2026-10-06\n---\n# 시간빈곤지수\n\n> 가구가 집안일과 생활 관리에 쓸 수 있는 시간이 얼마나 부족한가.\n\n## 왜 이 지수를 보나\n\n시간이 부족한 가구일수록 판단과 실행을 남에게 맡긴다. 그래서 이 지수가 오르면 구매를 맡기는 [[PF-01]], 거실에서 AI가 대신 처리하는 [[PF-04]], 작업을 결과 단위로 사는 [[PF-06]]의 수요가 함께 커진다.\n\n## 관측 데이터\n\n<!-- AUTO:INDICATORS -->\n변수 5개 — 이전값 대비 지수 상승 요인 2개 · 하락 요인 1개 · 비교값 없음/변화 없음 2개. 원장: `data/indicators.json`\n\n| 변수 | 최신값 | 이전값 | 지수 영향 | 출처 · 갱신 주기 |\n|---|:-:|:-:|:-:|---|\n| 맞벌이 가구 비율 (유배우 가구 대비)<br><small>615만 3천 가구, 역대 최고. 60세 이상 고령층 맞벌이 증가가 주도<\/small> | **48.6%** (2025-10) | 48% (2024-10) | ▲ 상승 요인 | [국가데이터처 지역별고용조사 (디지털타임스 보도)](https://www.dt.co.kr/article/12068350) · 연 1회 (6월 발표) |\n| 18세 미만 자녀 가구의 맞벌이 비율<br><small>처음으로 60% 돌파. 막내가 6세 이하인 가구는 56.5%(+3.3%p)<\/small> | **60.4%** (2025-10) | 58.5% (2024-10) | ▲ 상승 요인 | [국가데이터처 지역별고용조사 (디지털타임스 보도)](https://www.dt.co.kr/article/12068350) · 연 1회 (6월 발표) |\n| 맞벌이 가구 아내의 하루 가사노동시간<br><small>3시간 32분. 남편은 1시간 24분(13분 증가) — 부부 격차 약 30분 축소<\/small> | **212분** (2024) | 229분 (2019) | ▼ 하락 요인 | [국가데이터처 2024 생활시간조사 (정책브리핑)](https://www.korea.kr/briefing/policyBriefingView.do?newsId=156721673) · 5년 주기 |\n| 경기→서울 편도 출퇴근 시간<br><small>경기 지역 내 이동은 약 34분<\/small> | **61.9분** (2026) | – | 비교값 없음 | [경기연구원 경기 라이프 서베이 (머니투데이 보도)](https://www.mt.co.kr/policy/2026/04/20/2026042015041196095) · 비정기 |\n| [일본 참고] 맞벌이 세대 수 vs 전업주부 세대 수<br><small>전업주부 세대 550만 — 맞벌이가 약 3배. 한국의 선행 경로 참고<\/small> | **1599만 세대** (2025) | – | 비교값 없음 | [JILPT (총무성 노동력조사 기본집계)](https://www.jil.go.jp/kokunai/statistics/qa/a07.html) · 연 1회 |\n<!-- /AUTO:INDICATORS -->\n\n## 지금 읽히는 방향 — 상승\n\n- **맞벌이가 늘고 있고, 특히 아이 있는 집이 빠르게 늘었다.** 맞벌이 비율이 역대 최고(48.6%)이고, 18세 미만 자녀 가구는 처음으로 60%를 넘었다. 시간 압박이 가장 큰 가구 유형이 커지고 있다.\n- **집안일 시간은 줄었지만 \"해결된\" 것은 아니다.** 맞벌이 아내의 가사노동은 2019년보다 17분 줄었고 남편은 13분 늘었다. 총량이 줄어든 만큼은 배달·가전·외부 서비스가 메웠다고 보는 것이 자연스럽다([[가사외주화지수]]).\n- **이동에 쓰는 시간이 크다.** 경기→서울 편도 출퇴근이 평균 1시간을 넘는다.\n\n## 아직 비어 있는 변수\n\n- 1인가구의 식사 형태(간편식·외식 비중) — 가계동향조사 세부 항목 확인 필요\n- 주당 실근로시간 추이 — 경제활동인구조사\n\n## 일본 선행 참조\n\n일본은 맞벌이 세대(약 1,600만)가 전업주부 세대(약 550만)의 약 3배다. 맞벌이 확산기에 식기세척기·건조기 같은 시간 단축 가전과 가사대행 서비스가 함께 커졌다.\n\n## 변경 이력\n- 2026-10-06: 관측 데이터 5개 연결 (맞벌이 비율, 자녀 가구 맞벌이, 가사노동시간, 출퇴근 시간, 일본 비교).\n"}, "digests": [{"date": "2026-10-06", "kind": "baseline", "title": "베이스라인 — 2026년 1~10월 글로벌 소스 백필", "path": "digests/2026-10-06.md", "markdown": "# 다이제스트 2026-10-06 · 베이스라인\n\n> **사분면 이동** PF-05 Flexible Energy Network: Strategic Core → Moonshots. 평가 범위를 국내 포함으로 결정(D-01)한 뒤 LG 독점우위를 4.0에서 3.5로 낮춰 가로축이 7.5가 되었습니다.\n\n2026년 1월 이후 국내외 소스 **44건**(컨설팅·투자은행·산업리서치·정부·글로벌기업·언론)을 수집해 9개 Thesis 위키의 기준선을 만들었다. 채택 44건 (검토 대기였던 2건은 사용자 판단으로 채택). 6개 Thesis에서 8개 기준 점수를 조정했고 4건을 관찰 목록에 올렸다.\n\n## 이번 회차 핵심 3가지\n1. **경쟁사가 먼저 진입하는 영역이 늘고 있습니다.** Google은 구매 위임 결제 규격(AP2)을 발표했고, Kraken은 2GW 규모의 가정 전력 조절 자원을 운영하며, 북미 TV 운영체제 시장에서는 유통사 점유율이 커지고 있습니다. PF-01과 PF-05의 독점우위를 낮추고 PF-04를 관찰 항목에 올렸습니다. PF-05는 이에 따라 Strategic Core에서 Moonshots로 옮겼습니다.\n2. **로봇 운영(PF-06)이 총점 1위가 되었습니다.** Goldman Sachs의 휴머노이드 전망 상향(4.7배), IFR 서비스 로봇 판매 24% 증가, LG CEO 직속 로봇사업센터 신설을 반영해 TAM과 실행 용이성을 각 0.5점 올렸습니다.\n3. **공공 부문이 비용 부담 주체로 등장했습니다.** 통합돌봄 시행, 일본 돌봄 기술 보조금, EU 수리권 의무화를 반영해 PF-08(TAM, 수익화 각 +0.5)과 PF-09(실행 용이성 +0.5)의 점수를 처음으로 올렸습니다.\n\n## 점수 변경\n| PF | 기준 | 변경 | 근거 |\n|---|---|:-:|---|\n| [[PF-01]] | LG 독점우위 | 4.5 → 4.0 | [[SIG-20261006-13]] [[SIG-20261006-14]] |\n| [[PF-04]] | 전략적 차별성 | 4.0 → 3.5 | [[SIG-20261006-27]] [[SIG-20261006-38]] |\n| [[PF-06]] | TAM | 4.5 → 5.0 | [[SIG-20261006-18]] [[SIG-20261006-20]] |\n| [[PF-06]] | 실행 용이성 | 4.0 → 4.5 | [[SIG-20261006-21]] |\n| [[PF-07]] | TAM | 4.0 → 4.5 | [[SIG-20261006-35]] [[SIG-20261006-36]] |\n| [[PF-08]] | TAM | 2.0 → 2.5 | [[SIG-20261006-01]] [[SIG-20261006-02]] |\n| [[PF-08]] | 수익화 | 2.0 → 2.5 | [[SIG-20261006-40]] [[SIG-20261006-41]] |\n| [[PF-09]] | 실행 용이성 | 2.5 → 3.0 | [[SIG-20261006-44]] [[SIG-20261006-42]] |\n| [[PF-05]] | LG 독점우위 | 4.0 → 3.5 | [[SIG-20261006-31]] [[SIG-20261006-03]] (D-01 국내 포함 결정 후 재평가) |\n\n## 관찰 등록 (변경 보류)\n- [[PF-02]] 독점우위 — 범용 로봇 모델 vs 환경 측 계약\n- [[PF-03]] 독점우위 — JCI 에이전틱 빌딩 OS, 냉각 M&A\n- [[PF-04]] 독점우위 — 북미 리테일러 TV OS 확대\n- [[PF-05]] 독점우위 — 관찰 해제. D-01(국내 포함) 결정에 따라 3.5로 하향, Strategic Core → Moonshots\n\n## 2x2 재배치 검토 (분기 첫 실행)\n사분면 이동은 없다. 다만 이동 조건이 가까운 Thesis가 둘이다.\n- **PF-05 Core → Moonshot 위험** — X축 8.0으로 경계선. 독점우위가 0.5 내려가면 이탈.\n- **PF-03 Moonshot → Core 조건** — 실행 용이성 +0.5면 X축 8.0 도달. 데이터센터 계약에 운영·성과 보증이 들어가는 신호가 조건.\n\n## 검토 대기\n- 없음. [[SIG-20261006-08]] EU DPP 일정, [[SIG-20261006-10]] 에디온 2건은 2026-10-06 사용자 판단으로 채택\n\n## 다음 회차 관찰 포인트\n- LG 데이터센터 계약의 운영·유지보수 조항 (PF-03)\n- Homey 에너지 기능 실적, 크라켄 기기 파트너 (PF-05)\n- 베어로보틱스 관제의 타사 로봇 연동 (PF-06)\n- 통합돌봄 예산의 기기·ICT 항목 (PF-08)\n- webOS 외부 AI 파트너 계약 구조, 지역별 TV OS 점유율 (PF-04)\n"}], "decisions": [{"id": "D-01", "pf": ["PF-05"], "question": "Flexible Energy Network의 평가 범위를 유럽 사업으로 한정할 것인가, 국내 사업까지 포함할 것인가?", "why": "범위에 따라 LG 독점우위 점수가 달라집니다. 유럽은 Homey와 히트펌프 설치 기반이 있어 우위가 유지되지만, 국내는 건설사 단지 플랫폼이 가전 제어 권한을 먼저 확보했고 가정용 수요반응 보상도 작습니다. 현재 가로축 점수가 8.0으로 사분면 경계에 있어, 독점우위가 0.5점 낮아지면 Strategic Core에서 Moonshot으로 이동합니다.", "options": ["A. 유럽 한정: Strategic Core 유지, 국내는 별도 과제로 분리", "B. 국내 포함: 독점우위 하향 가능성, Moonshot 이동 검토"], "watch_signals": ["Homey 에너지 기능 사용 실적", "Kraken 등 유럽 유틸리티 플랫폼의 가전 제조사 연동 여부", "국민DR 가정 참여 규모와 보상 단가"], "evidence": ["SIG-20261006-31", "SIG-20261006-03", "SIG-20261006-34", "SIG-20261006-46"], "owner": "AX 포트폴리오 검토 (경영진 보고 전 확정)", "due": "2026년 4분기", "status": "closed", "decision": "B. 국내 포함. 유럽과 국내 사업을 함께 기준으로 평가", "decided": "2026-10-06"}, {"id": "D-02", "pf": ["PF-03"], "question": "데이터센터 냉각 사업을 장비 공급에서 냉각 성능·가동률 보증 계약으로 확대할 것인가?", "why": "북미 5GW 장기공급 계약으로 HVAC 사업부터 착수", "decided": "2026-10-06"}, {"id": "D-05", "pf": ["PF-01"], "question": "Household CFO의 역할을 구매 대행에서 수요 신호 공급으로 재정의할 것인가?", "why": "구글은 위임장 기반 결제 규격을, 아마존은 소모품 자동 재구매를 먼저 출시해 구매 위임의 표준과 초기 시장을 선점했습니다. 이에 따라 LG 독점우위 점수를 4.5에서 4.0으로 낮췄습니다. LG가 차별화할 수 있는 영역은 가전 상태 데이터로 각 가구의 구매 필요 시점을 제시하는 기능입니다.", "options": ["A. 재정의: 표준 결제 규격 위에서 가전 상태 기반 수요 신호를 공급", "B. 원안 유지: LG Agent가 구매와 공급자 협상을 직접 수행"], "watch_signals": ["AP2·UCP 등 커머스 규격에 가전 제조사 참여 여부", "국내 카드사 에이전트 결제의 첫 상용 품목", "구독 가구의 소모품 자동 배송 비중"], "evidence": ["SIG-20261006-13", "SIG-20261006-14", "SIG-20261006-12"], "owner": "AX, 구독사업", "due": "2026년 4분기", "status": "closed", "decision": "B. 원안 유지. LG Agent가 구매와 공급자 협상을 직접 수행", "decided": "2026-10-06"}], "indicators": [{"index": "시간빈곤지수", "label": "맞벌이 가구 비율 (유배우 가구 대비)", "value": 48.6, "unit": "%", "as_of": "2025-10", "prev_value": 48.0, "prev_as_of": "2024-10", "raises_index_when": "up", "source": "국가데이터처 지역별고용조사 (디지털타임스 보도)", "url": "https://www.dt.co.kr/article/12068350", "cadence": "연 1회 (6월 발표)", "note": "615만 3천 가구, 역대 최고. 60세 이상 고령층 맞벌이 증가가 주도"}, {"index": "시간빈곤지수", "label": "18세 미만 자녀 가구의 맞벌이 비율", "value": 60.4, "unit": "%", "as_of": "2025-10", "prev_value": 58.5, "prev_as_of": "2024-10", "raises_index_when": "up", "source": "국가데이터처 지역별고용조사 (디지털타임스 보도)", "url": "https://www.dt.co.kr/article/12068350", "cadence": "연 1회 (6월 발표)", "note": "처음으로 60% 돌파. 막내가 6세 이하인 가구는 56.5%(+3.3%p)"}, {"index": "시간빈곤지수", "label": "맞벌이 가구 아내의 하루 가사노동시간", "value": 212, "unit": "분", "as_of": "2024", "prev_value": 229, "prev_as_of": "2019", "raises_index_when": "up", "source": "국가데이터처 2024 생활시간조사 (정책브리핑)", "url": "https://www.korea.kr/briefing/policyBriefingView.do?newsId=156721673", "cadence": "5년 주기", "note": "3시간 32분. 남편은 1시간 24분(13분 증가) — 부부 격차 약 30분 축소"}, {"index": "시간빈곤지수", "label": "경기→서울 편도 출퇴근 시간", "value": 61.9, "unit": "분", "as_of": "2026", "prev_value": null, "prev_as_of": null, "raises_index_when": "up", "source": "경기연구원 경기 라이프 서베이 (머니투데이 보도)", "url": "https://www.mt
