SOURCES -->\n\n## 변경 이력\n- 2026-10-06: 위키 초판. TAM 4.5→5.0, 실행 용이성 4.0→4.5. 총점 36.0으로 공동 1위.\n", "PF-07": "---\nid: PF-07\nname: Home Diagnostics\nname_ko: 집 상태 진단\none_liner: 가전 정기 방문을 집의 진단 행위로 재정의해 공간 그래프와 설비 상태를 확보하고, 시공·수리·가사 서비스를 중개한다\nstack: Household\nessence: Home Decision\ncontrol_point: 현관문 출입 신뢰 기반 공간 그래프\nmechanism: Diagnostics + Demand Aggregation + Service Marketplace\nconviction: 상승\nupdated: 2026-10-06\nradar_ko: [가전 구독 케어, 노후 주택 수리, 집수리 지원사업, 가전 원격 진단, 스마트홈 보험 연계]\nradar_en: [home maintenance deferred repairs, home warranty, right to repair directive, predictive maintenance appliances, smart home insurance]\n---\n\n# PF-07 Home Diagnostics — 집 상태 진단\n\n> 가전 정기 방문을 집의 진단 행위로 재정의한다. 현관문 안에 들어갈 수 있는 신뢰로 공간 그래프와 설비 상태를 확보하고, 시공·수리·가사 서비스를 중개한다.\n\n## 1. Thesis 정의\n\n**한 문장 정의.** 구독 케어 매니저와 A/S 기사의 정기 방문, 가전 원격 진단 데이터를 결합해 \"이 집의 설비·공간 상태\"를 기록하고, 그 진단을 근거로 수리·교체·리모델링·가사 서비스를 연결한다.\n\n**Control Point — 현관문 출입 신뢰 기반 공간 그래프.**\n\n| 요건 | PF-07에서의 의미 |\n|---|---|\n| Access Right | 정기 방문으로 집 안에 들어가는 신뢰, 가전 원격 진단 데이터 |\n| Decision Right | 무엇을 고치고 바꿔야 하는지 판정하는 진단 권한 |\n| Rejection Right | 진단 결과에 따라 시공·수리 공급자를 선택·배제 |\n\n**Platform Mechanism.** Diagnostics(진단) + Demand Aggregation(수리·시공 수요 묶음) + Service Marketplace(외부 서비스 중개).\n\n**플랫폼 전환점.** LG 가전만 점검하면 A/S다. 외부 시공·수리·보험·금융 사업자가 LG의 진단 결과를 근거로 거래하는 순간 플랫폼이 된다.\n\n## 2. 왜 지금인가 — 구조 변화 맥락\n\n- **집이 늙고 있다.** 국토연구원 분석에서 전국 필지 절반이 준공 30년 넘은 4층 이하 저층주택이었고, 이들 지역의 고령 인구 비율도 높았다([[SIG-20261006-35]]). 미국도 주택 평균 연령이 44년이고 37%의 가구가 비용 때문에 수리를 미뤘다([[SIG-20261006-36]]).\n- **방문 접점이 이미 대규모다.** LG 가전 구독은 연 2.4조 원, 약 4,000명의 케어 매니저가 정기 방문한다([[SIG-20261006-37]]).\n- **수리가 제도 의무가 된다.** EU 수리권 지침으로 세탁기·냉장고·식기세척기 제조사가 보증 이후에도 수리를 제공해야 한다([[SIG-20261006-42]]). 원격 진단으로 수리 원가를 낮추는 역량이 곧 경쟁력이다.\n- **돌봄 정책이 집을 들여다본다.** 통합돌봄 지역 특화 서비스에 주거환경 개선이 포함됐다([[SIG-20261006-01]]).\n- **경쟁사가 먼저 보험과 연결했다.** 삼성은 SmartThings 데이터를 보험사 HSB와 연계했다([[SIG-20261006-38]]).\n\n## 3. LG의 비대칭 자산\n\n- **현관문 출입 신뢰.** 정기 방문하는 케어 매니저·기사 — 소프트웨어 기업이 복제할 수 없다.\n- **제조사만 아는 펌웨어·고장 이력.** 평가 당시 PF-02·07·09의 공통 우위로 꼽힌 근거.\n- **추가 CAPEX 없이 시작 가능.** 기존 방문 체크리스트(L1)만 확장하면 된다 — 실행 용이성 4.5의 근거.\n\n## 4. 스코어 — 8대 기준\n\n<!-- AUTO:SCORE -->\n**총점 32.5 / 40** (기준선 32.0, +0.5) · **사분면 Quick Wins** — X(독점우위+실행) 9.0 · Y(네트워크+TAM) 7.5\n\n| 기준 | 기준선 (2026-09-13) | 현재 | 변화 | 최근 변경 근거 |\n|---|:-:|:-:|:-:|---|\n| TAM | 4.0 | **4.5** | +0.5 | 2026-10-06 · [[SIG-20261006-35]], [[SIG-20261006-36]] |\n| 고객가치 | 4.0 | **4.0** | – |  |\n| LG 독점우위 | 4.5 | **4.5** | – |  |\n| 네트워크 효과 | 3.0 | **3.0** | – |  |\n| 데이터 해자 | 4.0 | **4.0** | – |  |\n| 수익화 | 4.0 | **4.0** | – |  |\n| 실행 용이성 | 4.5 | **4.5** | – |  |\n| 전략적 차별성 | 4.0 | **4.0** | – |  |\n<!-- /AUTO:SCORE -->\n\n**해석.** TAM을 4.0에서 4.5로 올렸다. 노후 주택과 미뤄진 수리 수요가 평가 당시 가정보다 넓다는 근거가 국내외에서 동시에 나왔다. Quick Win 위치는 유지된다(네트워크 효과 3.0이 Y축을 제한). 경쟁 측면에서는 삼성의 보험 연계가 독점우위의 첫 도전 신호다.\n\n## 5. Evidence\n\n### 강화 근거\n- 노후 저층주택이 전국 필지의 절반 — [[SIG-20261006-35]]\n- 미국 수리 연기 37%, 빠른 해결에 대한 지불 의향 72% — [[SIG-20261006-36]]\n- 구독 2.4조 원, 케어 매니저 약 4,000명 (strength 3) — [[SIG-20261006-37]]\n- EU 수리권 — 제조사 수리 의무 — [[SIG-20261006-42]]\n- 통합돌봄 주거환경 개선 — [[SIG-20261006-01]]\n- 구독·케어 사업 성장 — [[SIG-20261006-25]]\n- 일본 유통사의 가전 이력 기반 안부 확인 — 데이터 활용 선례 — [[SIG-20261006-10]]\n\n### 약화 근거\n- 삼성 SmartThings × 보험사 데이터 연계 선점 — [[SIG-20261006-38]]\n- 수리 정보 공개 의무로 제3자 수리업체 확대 → 진단 데이터 독점성 약화 가능 — [[SIG-20261006-42]], [[SIG-20261006-08]]\n\n## 6. 경쟁 지형\n\n| 주체 | 노리는 자리 | 강점 | LG와의 관계 |\n|---|---|---|---|\n| 삼성전자 (구독 + SmartThings + 보험) | 집 데이터 + 금융 연계 | 5억 사용자, 보험 제휴 | 직접 경쟁 |\n| 홈서비스 플랫폼 (숨고·당근 등) | 수리·시공 중개 | 공급자 풀 | 진단 없는 중개로 접점 선점 위험 |\n| 보험·홈워런티 사업자 | 설비 고장 리스크 | 지불 주체 | 협력 대상 |\n| 건설사·리모델링 | 대형 수리 | 시공 | 수요 연결 대상 |\n\n## 7. 핵심 불확실성과 반증 조건\n\n- **반증 1** — 케어 매니저 방문이 가전 세척에만 머물고 집 상태 데이터 수집으로 확장되지 못하면 공간 그래프가 생기지 않는다.\n- **반증 2** — 고객이 집 상태 데이터 제공에 동의하지 않으면 중개 사업이 성립하지 않는다.\n- **불확실성** — 진단 결과로 외부 공급자에게 과금(수수료)할 수 있는가.\n\n## 8. 관찰 지표\n\n- **검증 숫자**: 연간 이전설치·정기 방문 건수 (평가 당시 제안된 Initial Wedge 지표)\n- 케어 매니저 방문 체크리스트 범위\n- 국내 보험사·금융사의 주택 설비 데이터 활용 사례\n- 지자체 집수리 지원 사업의 진단 절차\n\n## 9. Initial Wedge → 2030 End-state\n\n- **Wedge** — 케어 매니저 정기 방문에 \"집 상태 L1 체크리스트\"를 추가해 진단 리포트 제공.\n- **Expansion** — 수리·교체 수요를 외부 공급자에 중개 → 보험·금융과 데이터 연계 → [[PF-08]] 고령 가구 특화 서비스 통합 → [[PF-09]] 중고 회수 채널.\n- **2030 End-state** — 집의 설비·공간 상태를 가장 정확히 아는 사업자로서 수리·시공·보험 결정의 기준점.\n\n## 10. 연결\n\n- Stack: **Household** 진입점 — PF-07 → [[PF-01]] → [[PF-08]] → [[PF-09]]\n- 수요층 지수: [[공간제약지수]] · [[가사외주화지수]]\n\n## 11. 스코어 변경 이력과 관찰\n\n<!-- AUTO:LOG -->\n**점수 변경**\n\n- 2026-10-06 · TAM 4.0 → 4.5 — 국내 필지 절반이 30년 넘은 노후 저층주택(국토연), 미국 주택 평균 연령 44년·수리 연기 37%. 집 상태 진단→수리 연결의 잠재 수요 기반이 평가 당시 가정보다 넓음. ([[SIG-20261006-35]], [[SIG-20261006-36]])\n<!-- /AUTO:LOG -->\n\n## 12. Sources\n\n<!-- AUTO:SOURCES -->\n출처 9건 — 산업리서치 2 · 정부·공공 3 · 글로벌기업 1 · 언론 3\n\n1. **[산업리서치]** DPP Tool 가이드, 2026-07-30 — [EU 디지털 제품 여권 — 전자제품 수리성(2027)·재활용성(2029) 요건 예정](https://dpp-tool.com/en/guide/digital-product-passport-eu-sectors-timeline-2026/) · [[SIG-20261006-08]] · 강화 ●○○ · 검토 대기\n2. **[산업리서치]** Warranty Week, 2026-09-29 — [Warranty Week — 미국 가구 37%가 비용 때문에 수리 연기, 주택 평균 연령 44년](https://www.warrantyweek.com/archive/ww20260929.html) · [[SIG-20261006-36]] · 강화 ●●○\n3. **[정부·공공]** Lewis Silkin, 2026-03-18 — [EU 수리권 지침 2026년 7월 31일까지 국내법 전환 — 세탁기·냉장고·식기세척기 제조사 수리 의무](https://www.lewissilkin.com/insights/2026/03/18/what-does-the-right-to-repair-directive-mean-for-your-business) · [[SIG-20261006-42]] · 강화 ●●○\n4. **[정부·공공]** 대한민국 정책브리핑(보건복지부), 2026-03-26 — [지역사회 통합돌봄 전국 229개 시군구 시행](https://www.korea.kr/news/policyNewsView.do?newsId=148961536) · [[SIG-20261006-01]] · 강화 ●●●\n5. **[정부·공공]** 국토연구원 국토정책 브리프 (뉴스핌 보도), 2026-08-26 — [국토연구원 — 전국 필지 절반이 준공 30년 넘은 4층 이하 노후 저층주택](https://www.newspim.com/news/view/20260826000586) · [[SIG-20261006-35]] · 강화 ●●○\n6. **[글로벌기업]** LG전자 뉴스룸, 2026-07-30 — [LG전자 2026년 2분기 — ES 마진 8.6%, CDU 공급망 진입, 구독 매출 성장](https://www.lg.com/global/newsroom/news/corporate/lg-electronics-releases-second-quarter-2026-financial-results/) · [[SIG-20261006-25]] · 강화 ●●○\n7. **[언론]** The Korea Herald, 2026-01-06 — [삼성 CES 2026 — SmartThings 5억 사용자, 보험사(HSB)와 스마트홈 데이터 연계](https://www.koreaherald.com/article/10649841) · [[SIG-20261006-38]] · 약화 ●●○\n8. **[언론]** 니혼게이자이신문, 2026-03 — [일본 에디온, 가전 사용 이력으로 고령자 원격 안부 확인 — 복수 제조사 대응](https://www.nikkei.com/article/DGXZQOUF197660Z10C26A3000000/) · [[SIG-20261006-10]] · 강화 ●●○ · 검토 대기\n9. **[언론]** 파이낸셜뉴스, 2026-10-03 — [가전 구독 판 확대 — LG 연 2.4조·베스트샵 판매의 약 50%, 케어 매니저 약 4,000명](https://www.fnnews.com/news/202610030700598029) · [[SIG-20261006-37]] · 강화 ●●●\n<!-- /AUTO:SOURCES -->\n\n## 변경 이력\n- 2026-10-06: 위키 초판. TAM 4.0→4.5 (국내외 노후 주택·수리 연기 근거).\n", "PF-08": "---\nid: PF-08\nname: Independent Living\nname_ko: 고령 독립생활\none_liner: 카메라 없이 기존 가전 데이터만으로 고령자의 일상생활 수행 능력을 종단 기록해, 감시가 아니라 자립을 증명하는 도구로 쓴다\nstack: Household\nessence: Care·Life State\ncontrol_point: 자립 생활 상태의 증명 표준 지위\nmechanism: State Standard + Care / Service Ecosystem\nconviction: 상승\nupdated: 2026-10-06\nradar_ko: [통합돌봄, AI 돌봄로봇 지자체, 독거노인 안부 확인, 고령 1인가구, 재가 요양]\nradar_en: [aging in place technology, remote monitoring older adults, 見守り 家電, 介護テクノロジー 補助, longevity economy]\n---\n\n# PF-08 Independent Living — 고령 독립생활\n\n> 카메라 없이 기존 가전 데이터만으로 고령자의 일상생활 수행 능력을 종단 기록한다. 감시가 아니라 \"아직 혼자 잘 지내고 있다\"는 자립을 증명하는 도구다.\n\n## 1. Thesis 정의\n\n**한 문장 정의.** 냉장고 여닫기, 세탁기·밥솥 사용, TV 시청, 에어컨 설정 같은 가전 사용 패턴으로 고령자의 생활 리듬과 변화를 기록하고, 그 기록을 가족·지자체·돌봄 기관이 신뢰하는 **자립 상태의 근거**로 만든다.\n\n**Control Point — 자립 생활 상태의 증명 표준 지위.**\n\n| 요건 | PF-08에서의 의미 |\n|---|---|\n| Access Right | 고령 가구의 가전 사용 데이터에 대한 지속 접근(동의 기반) |\n| Decision Right | 생활 리듬 변화가 개입이 필요한 수준인지 판정 |\n| Rejection Right | 어떤 돌봄 서비스·기관에 연결할지 선택 |\n\n**Platform Mechanism.** State Standard(상태 표준) + Care/Service Ecosystem(돌봄 서비스 연결).\n\n**플랫폼 전환점.** LG 고객에게 안부 알림을 주면 부가서비스다. 지자체·요양기관·보험사가 LG의 상태 기록을 **판단 근거로 채택**하는 순간 플랫폼이 된다.\n\n## 2. 왜 지금인가 — 구조 변화 맥락\n\n- **돌봄이 제도 안으로 들어왔다.** 2026년 3월부터 통합돌봄이 전국 229개 시군구에서 시행됐다([[SIG-20261006-01]]).\n- **혼자 사는 고령자가 가장 큰 1인가구 집단이다.** 1인가구 804만, 그중 70세 이상이 최대 비중이다([[SIG-20261006-02]]). 노후 저층주택 지역의 고령 비율도 높다([[SIG-20261006-35]]).\n- **공공이 이미 기기를 산다.** 국내 수백 개 지자체가 AI 돌봄로봇을 운영하지만, 대화 수준에 머물고 실질 돌봄·책임 공백이 지적된다([[SIG-20261006-41]]).\n- **일본은 공공 보조로 지켜보기 센서를 보급한다.** 2026년도 개호 테크놀로지 도입 지원에 보정예산 220억 엔, 보조율 최대 3/4, 3년 효과 보고 의무([[SIG-20261006-40]]). 유통사가 가전 이력으로 안부를 확인하는 상용 서비스도 나왔다([[SIG-20261006-10]]).\n- **고령층의 지불 능력.** 미국 50세 이상이 GDP의 43%, 기술 지출이 크게 늘었다([[SIG-20261006-39]]).\n\n## 3. LG의 비대칭 자산\n\n- **카메라 없는 상태 데이터.** 감시 거부감이 적은 가전 사용 패턴.\n- **이미 집 안에 있는 기기.** 별도 센서 설치 없이 시작.\n- **방문 신뢰.** [[PF-07]] 케어 매니저 접점.\n\n약점: 사고 시 인명·브랜드 리스크, 단독 수익화의 어려움(평가 당시 Hedge & Defense 배치 근거).\n\n## 4. 스코어 — 8대 기준\n\n<!-- AUTO:SCORE -->\n**총점 26.0 / 40** (기준선 25.0, +1.0) · **사분면 Hedge & Defense** — X(독점우위+실행) 7.0 · Y(네트워크+TAM) 4.5\n\n| 기준 | 기준선 (2026-09-13) | 현재 | 변화 | 최근 변경 근거 |\n|---|:-:|:-:|:-:|---|\n| TAM | 2.0 | **2.5** | +0.5 | 2026-10-06 · [[SIG-20261006-01]], [[SIG-20261006-02]] |\n| 고객가치 | 4.0 | **4.0** | – |  |\n| LG 독점우위 | 4.5 | **4.5** | – |  |\n| 네트워크 효과 | 2.0 | **2.0** | – |  |\n| 데이터 해자 | 4.0 | **4.0** | – |  |\n| 수익화 | 2.0 | **2.5** | +0.5 | 2026-10-06 · [[SIG-20261006-40]], [[SIG-20261006-41]] |\n| 실행 용이성 | 2.5 | **2.5** | – |  |\n| 전략적 차별성 | 4.0 | **4.0** | – |  |\n<!-- /AUTO:SCORE -->\n\n**해석.** 9개 중 최하위지만 2026년 신호가 가장 많이 쌓인 Thesis다. TAM을 2.0에서 2.5로(통합돌봄 시행, 고령 1인가구 최대 집단), 수익화를 2.0에서 2.5로(국내 지자체 구매, 일본 공공 보조) 올렸다. 핵심 변화는 **지불 주체가 개인이 아니라 공공**이라는 경로가 확인된 것 — 평가 당시 지적된 \"B2C 과금 저항\"을 우회할 수 있다. 다만 네트워크 효과(2.0)와 실행 리스크는 그대로라 사분면은 Hedge & Defense에 남는다. 포트폴리오 판단(PF-07의 고령화 특화 부가서비스로 통합)은 유지하되, B2G 경로가 열리면 독립 재평가 대상이다.\n\n## 5. Evidence\n\n### 강화 근거\n- 통합돌봄 전국 시행 (strength 3) — [[SIG-20261006-01]]\n- 1인가구 중 70세 이상 최대 비중 (strength 3) — [[SIG-20261006-02]]\n- 일본 공공 보조로 지켜보기 센서 보급 — [[SIG-20261006-40]]\n- 국내 지자체 AI 돌봄로봇 보급 — 시장 존재, 상태 증명 기능 공백 — [[SIG-20261006-41]]\n- 일본 유통사 가전 이력 기반 안부 확인 — [[SIG-20261006-10]]\n- 노후 주택·고령 거주 겹침 — [[SIG-20261006-35]]\n- 고령층 지불 능력 확대(미국) — [[SIG-20261006-39]]\n\n### 약화 근거\n- 돌봄로봇의 사고 책임 공백 지적 — PF-08 핵심 리스크 재확인 — [[SIG-20261006-41]]\n- 일본에서 Control Point를 제조사가 아닌 유통사가 가져감 — [[SIG-20261006-10]]\n\n## 6. 경쟁 지형\n\n| 주체 | 노리는 자리 | 강점 | LG와의 관계 |\n|---|---|---|---|\n| 돌봄로봇 기업 (효돌·다솜·초롱이) | 지자체 돌봄 기기 | 조달 레퍼런스 | 대화 기능 vs 상태 증명 — 보완 관계 가능 |\n| 통신사 (AI 스피커 안부) | 안부 확인 | 회선·지자체 사업 | 경쟁 |\n| 삼성전자 (SmartThings 케어) | 가전 기반 돌봄 | 생태계 | 직접 경쟁 |\n| 일본 유통사 (에디온 등) | 멀티 브랜드 안부 확인 | 판매 접점 | 국내 유통사의 같은 시도 가능성 |\n\n## 7. 핵심 불확실성과 반증 조건\n\n- **반증 1** — 지자체가 가전 데이터를 돌봄 판단 근거로 채택하지 않고 전용 센서·로봇만 조달하면 상태 증명 표준이 성립하지 않는다.\n- **반증 2** — 개인정보·책임 규제로 가전 데이터의 돌봄 활용이 제한되면 시작할 수 없다.\n- **불확실성** — 사고 발생 시 책임을 어떻게 나눌 것인가(감지 실패의 법적 책임).\n\n## 8. 관찰 지표\n\n- 통합돌봄 예산 중 기기·ICT 지원 항목\n- 지자체 돌봄 기기 조달 단가와 평가 기준\n- 국내 유통사·통신사의 멀티 브랜드 안부 확인 서비스\n- 일본 개호 테크놀로지 보조 효과 보고 결과\n\n## 9. Initial Wedge → 2030 End-state\n\n- **Wedge** — 구독 고령 가구 대상 \"생활 리듬 리포트\"를 자녀에게 제공(B2C), 동시에 1~2개 지자체 통합돌봄 시범.\n- **Expansion** — 지자체 조달 → 요양기관·보험 연계 → 타사 가전 데이터 수용.\n- **2030 End-state** — 지자체·요양·보험이 참조하는 자립 상태 기록의 표준.\n\n## 10. 연결\n\n- Stack: **Household** — [[PF-07]] 방문 접점 위에 얹는 고령 특화 서비스(포트폴리오 판단)\n- 수요층 지수: [[돌봄부담지수]]\n\n## 11. 스코어 변경 이력과 관찰\n\n<!-- AUTO:LOG -->\n**점수 변경**\n\n- 2026-10-06 · TAM 2.0 → 2.5 — 통합돌봄 전국 시행으로 재가 돌봄 대상이 제도화되고, 70세 이상이 1인가구 최대 집단. 대상 모수와 공공 시장이 동시에 확인됨. ([[SIG-20261006-01]], [[SIG-20261006-02]])\n- 2026-10-06 · 수익화 2.0 → 2.5 — 일본은 지켜보기 센서를 공공이 최대 3/4 보조, 국내는 수백 개 지자체가 돌봄 기기를 이미 구매. B2C 과금 저항을 B2G 지불 구조로 우회할 경로가 실재. ([[SIG-20261006-40]], [[SIG-20261006-41]])\n<!-- /AUTO:LOG -->\n\n## 12. Sources\n\n<!-- AUTO:SOURCES -->\n출처 7건 — 정부·공공 5 · 언론 2\n\n1. **[정부·공공]** 국가데이터처 「2025 통계로 보는 1인가구」(경향신문 보도), 2025-12-09 — [1인가구 804만·36.1%, 70세 이상이 최대 비중](https://www.khan.co.kr/article/202512091341001) · [[SIG-20261006-02]] · 강화 ●●●\n2. **[정부·공공]** 補助金ポータル, 2026 — [일본 후생노동성, 2026년도 개호 테크놀로지 도입 지원 — 보정예산 220억 엔, 보조율 최대 3/4](https://hojyokin-portal.jp/columns/kaigo_technology) · [[SIG-20261006-40]] · 강화 ●●○\n3. **[정부·공공]** 대한민국 정책브리핑(보건복지부), 2026-03-26 — [지역사회 통합돌봄 전국 229개 시군구 시행](https://www.korea.kr/news/policyNewsView.do?newsId=148961536) · [[SIG-20261006-01]] · 강화 ●●●\n4. **[정부·공공]** AARP, 2026-06-02 — [AARP 장수경제 2026 — 50세 이상이 미국 GDP의 43%, 기술 지출 2018년 대비 62% 증가](https://www.aarp.org/money/personal-finance/longevity-economy-report-2026/) · [[SIG-20261006-39]] · 강화 ●○○\n5. **[정부·공공]** 국토연구원 국토정책 브리프 (뉴스핌 보도), 2026-08-26 — [국토연구원 — 전국 필지 절반이 준공 30년 넘은 4층 이하 노후 저층주택](https://www.newspim.com/news/view/20260826000586) · [[SIG-20261006-35]] · 강화 ●●○\n6. **[언론]** 니혼게이자이신문, 2026-03 — [일본 에디온, 가전 사용 이력으로 고령자 원격 안부 확인 — 복수 제조사 대응](https://www.nikkei.com/article/DGXZQOUF197660Z10C26A3000000/) · [[SIG-20261006-10]] · 강화 ●●○ · 검토 대기\n7. **[언론]** 세계일보, 2026-06-03 — [AI 돌봄로봇 수백 개 지자체 보급 — 그러나 \"챗봇 수준, 실질 돌봄 부재\" 지적](https://segye.com/newsView/20260602514178) · [[SIG-20261006-41]] · 강화 ●●○\n<!-- /AUTO:SOURCES -->\n\n## 변경 이력\n- 2026-10-06: 위키 초판. TAM 2.0→2.5, 수익화 2.0→2.5 (통합돌봄·지자체 조달·일본 공공 보조).\n", "PF-09": "---\nid: PF-09\nname: Second Life Exchange\nname_ko: 중고 가전 상태 인증\none_liner: 제조·수리·사용 이력을 가진 제조사로서 중고 가전의 상태를 판정·보증한다 — 타인 보유 제품에 등급을 부여하는 순간 플랫폼이 된다\nstack: Household\nessence: Asset Value·Trust\ncontrol_point: 개별 기기의 상태 인증권\nmechanism: Certification Standard + Marketplace\nconviction: 유지\nupdated: 2026-10-06\nradar_ko: [리퍼비시 가전, 중고 가전 거래, 자원순환 EPR, 수리권, 디지털 제품 여권]\nradar_en: [refurbished appliances, recommerce trade-in, right to repair directive, digital product passport, certified pre-owned appliances]\n---\n\n# PF-09 Second Life Exchange — 중고 가전 상태 인증\n\n> 제조·수리·사용 이력을 가진 제조사로서 중고 가전의 상태를 판정하고 보증한다. 타인이 보유한 제품에 등급을 부여하는 순간 플랫폼이 된다.\n\n## 1. Thesis 정의\n\n**한 문장 정의.** 중고 가전 거래에서 가장 큰 문제는 \"이 제품이 실제로 어떤 상태인가\"를 모른다는 것이다. 제조사가 사용 이력·수리 이력·원격 진단으로 상태 등급을 매기고 보증하면, 그 등급이 중고 거래 가격과 신뢰의 기준이 된다.\n\n**Control Point — 개별 기기의 상태 인증권.**\n\n| 요건 | PF-09에서의 의미 |\n|---|---|\n| Access Right | 제품의 사용·수리 이력과 원격 진단 데이터 |\n| Decision Right | 상태 등급과 잔존 가치를 판정 |\n| Rejection Right | 기준 미달 제품을 인증에서 제외, 인증 거래 채널 선택 |\n\n**Platform Mechanism.** Certification Standard(인증 표준) + Marketplace(거래 연결).\n\n**플랫폼 전환점.** LG가 회수한 제품을 리퍼해 팔면 리퍼 사업이다. 개인·중고업자가 보유한 제품에 LG 인증을 붙여 다른 마켓플레이스에서 거래하는 순간 플랫폼이 된다.\n\n## 2. 왜 지금인가 — 구조 변화 맥락\n\n- **수리·재사용이 제도로 밀린다.** EU 수리권 지침이 2026년 7월까지 회원국 법으로 전환되며 대형 가전 제조사의 수리 의무, 수리 시 보증 연장, 2027년 유럽 수리 플랫폼이 생긴다([[SIG-20261006-42]]). 디지털 제품 여권(DPP)도 수리성·재활용성 정보 공개를 예고한다([[SIG-20261006-08]]).\n- **리커머스가 성장한다.** 스위스 사례에서 리커머스가 연 17% 가까이 성장하며 제조사·리테일러 인증 리퍼와 신뢰 장치가 있는 마켓플레이스가 동력이었다([[SIG-20261006-43]]).\n- **LG가 첫 걸음을 뗐다.** 정부 순환경제 협약으로 폐가전 회수·폐냉매 재자원화와 리퍼비시를 시작하고, 리퍼 제품을 소상공인에게 먼저 판다([[SIG-20261006-44]]). 평가 결론(B2B 소상공인 중심 PoC)과 같은 형태다.\n- **저자산 1인가구.** 1인가구의 자산은 전체 가구의 약 40% 수준이다([[SIG-20261006-02]]).\n\n## 3. LG의 비대칭 자산\n\n- **제조·수리·사용 이력.** 제조사만 가진 펌웨어 로그와 수리 기록.\n- **회수 물류.** 그룹 물류사(LX판토스)와 리사이클링센터([[SIG-20261006-44]]).\n- **방문 접점.** [[PF-07]] 케어 매니저가 회수 채널이 될 수 있다.\n\n약점: 역물류 원가, 신제품 판매 잠식 우려.\n\n## 4. 스코어 — 8대 기준\n\n<!-- AUTO:SCORE -->\n**총점 28.5 / 40** (기준선 28.0, +0.5) · **사분면 Hedge & Defense** — X(독점우위+실행) 7.5 · Y(네트워크+TAM) 5.5\n\n| 기준 | 기준선 (2026-09-13) | 현재 | 변화 | 최근 변경 근거 |\n|---|:-:|:-:|:-:|---|\n| TAM | 2.5 | **2.5** | – |  |\n| 고객가치 | 4.0 | **4.0** | – |  |\n| LG 독점우위 | 4.5 | **4.5** | – |  |\n| 네트워크 효과 | 3.0 | **3.0** | – |  |\n| 데이터 해자 | 4.0 | **4.0** | – |  |\n| 수익화 | 3.0 | **3.0** | – |  |\n| 실행 용이성 | 2.5 | **3.0** | +0.5 | 2026-10-06 · [[SIG-20261006-44]], [[SIG-20261006-42]] |\n| 전략적 차별성 | 4.5 | **4.5** | – |  |\n<!-- /AUTO:SCORE -->\n\n**해석.** 실행 용이성을 2.5에서 3.0으로 올렸다. 평가 당시 최대 장벽이던 역물류에 대해 정부 협약과 그룹 물류로 첫 해법이 나왔고, EU 수리권이 수리·재사용 경로를 제도화했다. TAM(2.5)은 유지 — 단일 국가 리커머스 데이터로는 상향 근거가 약하다. 사분면은 Hedge & Defense에 남고, 현재 사업은 아직 자사 제품 리퍼여서 플랫폼 전환점(타인 보유 제품 인증)에는 도달하지 않았다.\n\n## 5. Evidence\n\n### 강화 근거\n- LG 폐가전 회수·리퍼 사업 착수, 소상공인 판매 — [[SIG-20261006-44]]\n- EU 수리권 지침 — 수리·재사용 제도화 — [[SIG-20261006-42]]\n- EU DPP — 제품 이력 공개 예고 — [[SIG-20261006-08]]\n- 리커머스 성장, 인증 리퍼가 동력 — [[SIG-20261006-43]]\n- 저자산 1인가구 확대 — [[SIG-20261006-02]]\n\n### 약화 근거\n- 제품 이력 공개 의무가 확대되면 제3자도 상태 판정을 할 수 있어 제조사 인증의 독점성이 약해질 수 있음 — [[SIG-20261006-08]]\n\n## 6. 경쟁 지형\n\n| 주체 | 노리는 자리 | 강점 | LG와의 관계 |\n|---|---|---|---|\n| 중고 플랫폼 (당근·번개장터) | 중고 거래 접점 | 사용자 규모 | 인증 채널 파트너 또는 자체 인증 경쟁 |\n| 리테일러 (하이마트·IKEA형 바이백) | 매입·재판매 | 매장·물류 | 경쟁 |\n| 삼성전자 (인증 중고폰 경험) | 제조사 인증 | 모바일 리퍼 운영 경험 | 가전으로 확장 시 경쟁 |\n| 전문 리퍼 업체 | 리퍼 가공 | 원가 | 공급자 |\n\n## 7. 핵심 불확실성과 반증 조건\n\n- **반증 1** — 중고 플랫폼이 자체 검수·인증을 도입해 소비자 신뢰를 충분히 확보하면 제조사 인증의 가치가 줄어든다.\n- **반증 2** — 리퍼 사업이 3년 내에도 자사 제품 회수에만 머물면 플랫폼이 아니다.\n- **불확실성** — 신제품 판매 잠식을 감수할 내부 의사결정이 가능한가.\n\n## 8. 관찰 지표\n\n- LG 리퍼 제품 등급 기준·보증 조건·판매 실적\n- 중고 플랫폼의 가전 검수·인증 도입\n- 국내 EPR·순환경제 제도 변화\n- EU 수리 플랫폼 출범과 제조사 참여\n\n## 9. Initial Wedge → 2030 End-state\n\n- **Wedge** — 소상공인 대상 리퍼 판매(현재 진행 중)에 등급·보증 표준을 붙인다.\n- **Expansion** — 보상 판매 회수 → 개인 보유 제품 원격 진단 등급 → 중고 플랫폼에 인증 API 제공.\n- **2030 End-state** — 중고 가전 가격을 결정하는 상태 인증의 기준.\n\n## 10. 연결\n\n- Stack: **Household** 끝단 — [[PF-07]] 방문 접점이 회수 채널\n- 수요층 지수: [[공간제약지수]]\n\n## 11. 스코어 변경 이력과 관찰\n\n<!-- AUTO:LOG -->\n**점수 변경**\n\n- 2026-10-06 · 실행 용이성 2.5 → 3.0 — LG가 정부 협약·그룹 물류사로 폐가전 회수와 리퍼 판매(소상공인)를 시작해 최대 장벽이던 역물류의 첫 해법을 확보. EU 수리권 지침도 수리·재사용 경로를 제도화. ([[SIG-20261006-44]], [[SIG-20261006-42]])\n<!-- /AUTO:LOG -->\n\n## 12. Sources\n\n<!-- AUTO:SOURCES -->\n출처 5건 — 산업리서치 2 · 정부·공공 2 · 언론 1\n\n1. **[산업리서치]** DPP Tool 가이드, 2026-07-30 — [EU 디지털 제품 여권 — 전자제품 수리성(2027)·재활용성(2029) 요건 예정](https://dpp-tool.com/en/guide/digital-product-passport-eu-sectors-timeline-2026/) · [[SIG-20261006-08]] · 강화 ●○○ · 검토 대기\n2. **[산업리서치]** GlobeNewswire (ResearchAndMarkets), 2026-10-05 — [스위스 리커머스 시장 2026년 연 16.9% 성장 — 인증 리퍼·리테일러 주도 리셀이 동력](https://www.globenewswire.com/news-release/2026/10/05/3374287/28124/en/switzerland-recommerce-market-intelligence-report-2026-60-kpis-and-forecasts-to-2030-market-to-reach-us-2-63-billion-as-trade-in-and-refurbishment-scale.html) · [[SIG-20261006-43]] · 강화 ●○○\n3. **[정부·공공]** 국가데이터처 「2025 통계로 보는 1인가구」(경향신문 보도), 2025-12-09 — [1인가구 804만·36.1%, 70세 이상이 최대 비중](https://www.khan.co.kr/article/202512091341001) · [[SIG-20261006-02]] · 강화 ●●●\n4. **[정부·공공]** Lewis Silkin, 2026-03-18 — [EU 수리권 지침 2026년 7월 31일까지 국내법 전환 — 세탁기·냉장고·식기세척기 제조사 수리 의무](https://www.lewissilkin.com/insights/2026/03/18/what-does-the-right-to-repair-directive-mean-for-your-business) · [[SIG-20261006-42]] · 강화 ●●○\n5. **[언론]** 아시아경제, 2026-06-19 — [LG전자, 정부와 폐냉매 회수·리퍼비시 사업 착수 — 소상공인 대상 사업자몰 판매](https://view.asiae.co.kr/article/2026061908010605527) · [[SIG-20261006-44]] · 강화 ●●○\n<!-- /AUTO:SOURCES -->\n\n## 변경 이력\n- 2026-10-06: 위키 초판. 실행 용이성 2.5→3.0 (회수·리퍼 사업 착수, EU 수리권).\n", "Portfolio": "---\nid: Portfolio\nname: LG Future Platform — 개요\nupdated: 2026-10-06\n---\n\n# LG는 어디서 플랫폼이 될 수 있는가\n\n> AI 에이전트가 고객 대신 판단하고 실행하는 시대에, LG전자가 Google·Amazon·Naver와 **다른 방식으로** 플랫폼 기업이 될 수 있는 9개의 자리(Platform Thesis)와, 그 가설이 실제 세계에서 어떻게 검증되고 있는지를 추적하는 문서입니다.\n\n<!-- AUTO:SNAPSHOT -->\n> **현재 상태** · 2026-10-06 갱신 · 신호 44건 (컨설팅·투자은행 5건) · 9월 평가 이후 점수 변경 8건 · 관찰 중 4건 · 결정이 필요한 질문 5건\n<!-- /AUTO:SNAPSHOT -->\n\n### 한눈에 보는 세 가지 결론\n\n1. **질문을 바꿨다.** \"LG도 빅테크 같은 플랫폼이 될 수 있나\"가 아니라, \"산업 구조가 바뀔 때 LG가 가진 물리 자산·고객 관계·서비스 역량 때문에 **자연스럽게 차지하게 되는 자리(Control Point)는 어디인가**\"를 물었다.\n2. **51개를 펼쳐 9개로 좁혔다.** 두 갈래로 51개 후보를 만들고, 다섯 가지 제외 기준으로 걸러 9개를 남겼다. 살아남은 9개는 대부분 하나의 논리로 설명된다 — **실패했을 때 책임질 수 있는 쪽이 판단하고 고를 권한도 갖는다.**\n3. **9개를 네 묶음으로 나눴고, 지금도 계속 검증 중이다.** 8개 기준으로 평가해 즉시 키울 3개, 장기 투자할 3개, 빠르게 시작할 1개, 본업을 지키는 2개로 배치했다. 이 배치는 고정된 결론이 아니라, 격주로 들어오는 국내외 신호에 따라 점수와 위치가 움직이는 **살아있는 가설**이다.\n\n---\n\n## 1. 출발 질문 — 왜 질문부터 바꿨나\n\n처음 질문은 \"LG전자가 Google·Amazon·Naver 같은 플랫폼 기업이 될 수 있는가\"였다. 이 질문으로는 답이 나오지 않는다. LG가 **갖지 못한 것**을 기준으로 묻기 때문이다.\n\n| | 기존 질문 | 바꾼 질문 |\n|---|---|---|\n| 질문 | LG가 빅테크 같은 플랫폼이 될 수 있는가? | 산업 구조가 바뀔 때, LG의 자산 때문에 다른 회사보다 **자연스럽게 소유할 수 있는 자리**는 어디인가? |\n| 출발점 | 검색·트래픽·결제·물류 — LG에 없는 것 | 설치 기반·현장 인력·제조 이력·서비스 책임 — LG에 있는 것 |\n| 결과 | 구조적으로 \"어렵다\"는 답만 나옴 | 새로운 Control Point 후보가 나옴 |\n| 배제한 것 | — | 기존 사업의 AI화, 시장이 크다는 이유만 있는 후보 |\n\n**판단 원칙.** 좋은 서비스를 만드는 것만으로는 플랫폼이 아니다. **다른 사업자와 고객의 행동을 좌우할 수 있는 위치**여야 플랫폼이다.\n\n## 2. 어디서 싸울 것인가 — 경쟁 층위를 먼저 정했다\n\nAI 시대의 가치 사슬을 네 개 층으로 나누면, LG가 이길 수 있는 층은 하나뿐이다.\n\n| 층 | 무엇을 하는 층인가 | 누가 쥐고 있나 | LG의 선택 |\n|---|---|---|---|\n| L4 · 범용 Assistant·검색 | 대화 인터페이스와 정보 인덱스 | ChatGPT, Gemini, Naver | 경쟁 회피 |\n| L3 · 커머스 트래픽·결제·물류 | 수요 탐색과 거래 체결 | Amazon, Coupang, Naver | 경쟁 회피 |\n| **L2 · 물리 상태·실행·책임** | **집·공간·기기의 실제 상태를 알고, 물리적으로 실행하고, 결과를 책임지는 층** | 아직 주인이 없음 | **LG의 자리** |\n| L1 · 기기·하드웨어 | 가전·HVAC·디스플레이·로봇 | LG를 포함한 제조사 | 보유 자산 |\n\nL2는 검색 기록이 아니라 **실제 상태**(state)를 근거로 판단이 일어나는 층이다. 현장 인력과 설비 없이 들어오기 어려워 빅테크도 쉽게 진입하지 못한다. 이번 작업은 처음부터 끝까지 L2에 한정했다.\n\n## 3. 어떻게 9개를 골랐나\n\n### 3-1. 아이디어를 만드는 고정 경로 — Platform Ideation Genome v3\n\n아이디어를 \"떠올리는\" 대신, 네 가지 입력에서 Control Point를 끌어내고 시장으로 확장하는 정해진 경로를 밟았다.\n\n| 단계 | 묻는 것 | 예시 |\n|---|---|---|\n| ① Future Structural Shift | 10년 뒤 산업의 역할 분담 자체를 바꿀 변화는? (단순 트렌드 제외) | AI 에이전트가 구매를 대신함, 가사 노동력 감소, 고령화 |\n| ② New Job-to-be-Done | 그 변화로 누가 무엇을 새로 필요로 하나? | 건물주는 \"설비\"가 아니라 \"멈추지 않는 공간\"이 필요 |\n| ③ LG Asymmetric Asset | LG만 가진 자산의 **조합**은? | 설치 기반 + A/S망 + 수리 이력 + 구독 |\n| ④ Market Failure | 지금 시장은 왜 이 문제를 못 푸나? | 중고 가전의 실제 상태를 아무도 보증하지 않음 |\n| ⑤ Control Point × Responsibility | LG가 무엇을 결정·허용·거절하게 되나? 그 권한이 \"결과에 대한 책임\"에서 나오나? | 작업 결과를 보증하니 어떤 로봇을 쓸지 정할 수 있음 |\n| ⑥ Platform Mechanism | 어떤 방식으로 시장에 확장하나? | 아래 3-3 참고 |\n| ⑦ Flywheel & Moat | 규모가 커질수록 가치가 커지는 고리와 시간이 갈수록 쌓이는 자산은? | 진단할수록 쌓이는 집 상태 데이터 |\n\n### 3-2. Control Point는 세 가지 권리가 모두 있어야 성립한다\n\n| 권리 | 질문 | LG에서의 예 |\n|---|---|---|\n| **Access Right** (접근권) | 고객·공간·기기·거래에 지속적으로 접근할 수 있나? | 정기 방문 계약, 설비 원격 접속, 설치 기반 |\n| **Decision Right** (판단권) | 무엇이 좋은지 판단할 정보와 권한이 있나? | 제조 이력·고장 이력·센서 상태 |\n| **Rejection Right** (거절권) | 공급자·서비스를 고르거나 뺄 수 있나? | **API와 플랫폼을 가르는 결정적 요건.** 이것이 없으면 인프라일 뿐 |\n\n거절권은 어디서 나오는가. **책임에서 나온다.**\n\n> 결과를 보증한다 → 보증하려면 하위 공급자를 통제해야 한다 → 공급자를 고르고 뺄 권리가 생긴다 → 플랫폼이 된다\n\n건물이 멈췄을 때, 로봇 작업이 실패했을 때, 집 진단이 틀렸을 때, 중고 상태가 틀렸을 때 — 결과를 책임지는 쪽이 판단권과 거절권을 함께 갖는다. 사람을 보내고, 고치고, 보증하고, 재무적으로 책임질 수 있다는 점이 소프트웨어 기업과 비교한 **LG의 비대칭 자산**이다.\n\n### 3-3. 자리를 시장으로 넓히는 다섯 가지 방식\n\n| Mechanism | 한 줄 설명 | 적용된 Thesis |\n|---|---|---|\n| Runtime | 타사 기기·로봇·AI가 반드시 거쳐 실행되는 운영 계층을 쥔다 | PF-02, PF-03, PF-06 |\n| Aggregation | 흩어진 수요를 모아 공급자와의 협상력으로 바꾼다 | PF-01, PF-05, PF-07 |\n| Marketplace | 진단·보증으로 확정된 수요를 공급자에게 연결한다 | PF-06, PF-07, PF-09 |\n| Standard / Certification | 등급·인증·규격을 정의해 가격과 채택을 좌우한다 | PF-02, PF-08, PF-09 |\n| Distribution | 어떤 서비스가 어떤 고객에게 언제 노출될지 결정한다 | PF-04 |\n\n한 Thesis가 두세 가지 방식을 함께 갖는 것이 보통이다. 하나도 붙지 않으면 플랫폼이 아니라 좋은 제품·서비스다.\n\n### 3-4. 통과 기준과 제외 기준\n\n**통과하려면 여섯 가지를 모두 만족해야 한다.**\n\n1. Control Point가 실재하는가 — LG가 없어지면 시장 참여자의 행동이 달라지는가\n2. Right-to-Win — 다른 회사보다 유리한 출발점이 있는가\n3. Right-to-Own — LG가 이 자리를 차지하는 것이 산업 구조상 자연스러운가\n4. Mechanism과 Flywheel — 규모가 커질수록 가치가 커지는 고리가 도는가\n5. 외부 참여자의 이유 — 경쟁사나 제3자가 왜 LG 플랫폼에 들어오는가\n6. 독립성 — 다른 후보의 하위 기능이 아닌가\n\n**하나라도 걸리면 제외한다 (Hard Gate).**\n\n- Control Point 부재 — 데이터 제공이나 좋은 UX만으로는 플랫폼이 아님\n- LG 자격 부재 — 자산이 없거나 브랜드·규제상 LG가 할 자리가 아님\n- 자기잠식 — 본업 손익을 정면으로 훼손\n- 모듈 중복 — 다른 Thesis의 하위 기능\n- 범위 이탈 — 담당 소관이나 연구 범위를 벗어남\n\n가장 무거운 제외 판정은 \"Physical World Data Trust\"였다. 시장은 가장 컸지만, 집 안 데이터에 대한 신뢰를 가장 낮은 마진에 팔아버리는 구조여서 다른 모든 시나리오의 기반을 훼손한다고 봤다.\n\n### 3-5. 51개에서 9개로\n\n두 갈래로 후보를 펼쳤다.\n\n| | Route A · 미래 플랫폼 관점 | Route B · 책임 관점 |\n|---|---|---|\n| 접근 | 2030~2035 산업 변화를 넓게 보고 위에서 아래로 탐색 | 10개 구조 변화를 정의하고 \"LG가 책임질 수 있어서 권한을 얻는 영역\"을 깊게 탐색 |\n| 출발 주제 | 에이전트 커머스, Physical AI, 자율 공간, 앰비언트 컴퓨팅, 에너지 전환, 모빌리티 | 에이전트 구매, 가구 노동력 감소, 고령화, 공간 재편, 제품 수명 연장, 현장 지식 소멸 |\n| 후보 수 | 25개 | 26개 |\n\n| 단계 | 남은 수 | 걸러낸 이유 |\n|---|:-:|---|\n| 원천 후보 | 51 | — |\n| 1차 | 39 | 범위 이탈, 공장·제조 내부 혁신 성격 제외 |\n| 2차 | 16 | 모듈 흡수·중복 통합 |\n| 최종 | **9** | 6기준 통과 |\n\n가장 많이 걸린 사유는 **모듈 중복**이었다. 집 영역 후보 상당수가 결국 같은 Control Point — \"현관문 안으로 들어갈 수 있는 신뢰\" — 로 모였다.\n\n**합친 것과 끝까지 나눈 것.**\n\n- **합침**: Route A의 Autonomous Building OS와 Route B의 Commercial Space OS는 \"공간의 운영 결과를 책임진다\"는 같은 본질이어서 [[PF-03]]으로 합쳤다.\n- **나눔**: [[PF-02]] Physical Environment Runtime과 [[PF-06]] Robot Operations는 둘 다 로봇을 다루지만 층이 다르다. PF-02는 로봇 OEM·AI 개발자가 고객인 기술 층, PF-06은 건물·매장·호텔 운영자가 고객인 운영 층이다. 합치면 어느 쪽도 성립하지 않는다.\n\n## 4. 9개 Thesis와 3개 Stack\n\n9개는 따로 떨어진 과제가 아니라 세 개의 Stack으로 이어진다. **앞 Thesis가 뒤 Thesis의 수요나 공급 기반을 만든다.**\n\n<!-- VIZ:STACKS -->\n\n### Stack 1 · Physical AI — 로봇과 공간의 실행 계층\n\n기술 층(PF-02) → 공간 운영 층(PF-03) → 작업 결과 층(PF-06)으로 이어진다. 로봇이 LG 기기를 안전하게 쓸 수 있어야(PF-02) 공간을 자율 운영할 수 있고(PF-03), 운영되는 공간이 있어야 로봇 작업을 결과 단위로 팔 수 있다(PF-06).\n\n<details><summary><b>PF-02 Physical Environment Runtime<\/b> — 로봇이 LG 기기를 안전하게 쓰는 규칙을 쥔다<\/summary>\n\n구글·엔비디아가 로봇의 \"두뇌\"를 아무리 발전시켜도, 세탁기 문이 잠겼는지·오븐이 뜨거운지·작업이 제대로 끝났는지는 제조사만 정확히 안다. 외부 로봇과 AI가 LG 가전과 공간을 별도 학습 없이 안전하게 쓰도록 하는 **환경 측 실행 계층**을 만든다.\n\n- **Control Point**: 물리 환경 행동 모델 (Physical Skill Contract)\n- **Mechanism**: Runtime + Standard + Developer Ecosystem\n- **플랫폼이 되는 순간**: 타사 로봇이 LG 규격을 호출하고, 타사 가전도 같은 규격을 따를 때\n\n[[PF-02]] 위키 보기\n<\/details>\n\n<details><summary><b>PF-03 Autonomous Space OS<\/b> — 설비가 아니라 공간의 가동을 책임진다<\/summary>\n\nHVAC를 중심에 두고 가전·디스플레이·로봇·정비를 묶어, 설비별로 모니터링하는 대신 **공간의 운영 목표와 가동률**을 스스로 최적화한다. 건물주에게 장비가 아니라 \"멈추지 않는 공간\"을 약속한다.\n\n- **Control Point**: 공간의 자율 운영 상태 + Uptime 책임\n- **Mechanism**: Runtime + Aggregation + Application Ecosystem\n- **플랫폼이 되는 순간**: 타사 설비와 외부 앱이 같은 OS 위에서 돌고, 계약이 장비 납품에서 성과 보증으로 바뀔 때\n\n[[PF-03]] 위키 보기\n<\/details>\n\n<details><summary><b>PF-06 Robot Operations<\/b> — 로봇이 아니라 \"끝난 일\"을 판다<\/summary>\n\n고객은 로봇을 원하지 않는다. **일이 끝나 있기**를 원한다. 청소·배송·점검·순찰의 결과를 보증해 인건비 시장을 대체하고, 어떤 로봇을 어디에 배치할지는 LG가 결정한다.\n\n- **Control Point**: 작업 결과 보증(SLA) + 이기종 로봇 할당권\n- **Mechanism**: Runtime + Marketplace + Work-as-a-Service\n- **플랫폼이 되는 순간**: 타사 로봇을 받아들여 작업을 배정할 때\n\n[[PF-06]] 위키 보기\n<\/details>\n\n### Stack 2 · Household — 집과 생활의 의사결정 계층\n\n정기적으로 집 안에 들어가는 접점(PF-07)에서 출발해, 가구의 구매 운영(PF-01), 고령자의 자립(PF-08), 중고 가전의 가치 판정(PF-09)으로 넓어진다. 집 진단의 방문 접점이 중고 회수 채널이 되고, 진단 데이터가 구매 위임의 근거가 된다.\n\n<details><summary><b>PF-07 Home Diagnostics<\/b> — 가전 방문을 집 진단으로 바꾼다<\/summary>\n\n케어 매니저와 기사의 정기 방문을 \"가전 점검\"이 아니라 **집 전체의 진단**으로 재정의한다. 설비와 공간 상태를 기록하고, 그 진단을 근거로 수리·시공·가사 서비스를 연결한다.\n\n- **Control Point**: 현관문 출입 신뢰 기반 공간 그래프\n- **Mechanism**: Diagnostics + Demand Aggregation + Service Marketplace\n- **플랫폼이 되는 순간**: 외부 시공·수리·보험 사업자가 LG의 진단 결과를 근거로 거래할 때\n\n[[PF-07]] 위키 보기\n<\/details>\n\n<details><summary><b>PF-01 Household CFO<\/b> — 가구의 구매 결정을 위임받는다<\/summary>\n\n고객이 비교·구매·계약을 매번 반복하는 대신, 그 권한을 LG Agent에 맡긴다. LG는 여러 가구의 수요를 묶어 공급자와 조건을 협상한다. 커머스 플랫폼이 구매 이력으로 **추정**한다면, LG는 기기 상태로 수요를 **관측**한다.\n\n- **Control Point**: 가계 구매 위임권 (Purchasing Mandate)\n- **Mechanism**: Demand Aggregation + Managed Procurement\n- **플랫폼이 되는 순간**: 타사 제품·타 카테고리 공급자가 LG가 묶은 수요에 입찰할 때\n\n[[PF-01]] 위키 보기\n<\/details>\n\n<details><summary><b>PF-08 Independent Living<\/b> — 감시가 아니라 자립을 증명한다<\/summary>\n\n카메라 없이 냉장고·세탁기·밥솥·TV 사용 패턴만으로 고령자의 생활 리듬을 기록한다. 가족·지자체·돌봄 기관이 믿을 수 있는 **\"아직 혼자 잘 지내고 있다\"는 근거**를 만든다.\n\n- **Control Point**: 자립 생활 상태의 증명 표준 지위\n- **Mechanism**: State Standard + Care / Service Ecosystem\n- **플랫폼이 되는 순간**: 지자체·요양기관·보험사가 LG의 기록을 판단 근거로 채택할 때\n\n[[PF-08]] 위키 보기\n<\/details>\n\n<details><summary><b>PF-09 Second Life Exchange<\/b> — 중고 가전의 상태를 판정·보증한다<\/summary>\n\n중고 거래의 가장 큰 문제는 \"실제로 어떤 상태인가\"를 모른다는 것이다. 제조·수리·사용 이력을 가진 제조사가 **상태 등급을 매기고 보증**하면, 그 등급이 중고 가격과 신뢰의 기준이 된다.\n\n- **Control Point**: 개별 기기의 상태 인증권\n- **Mechanism**: Certification Standard + Marketplace\n- **플랫폼이 되는 순간**: LG가 남이 가진 제품에 등급을 붙여 다른 마켓에서 거래될 때\n\n[[PF-09]] 위키 보기\n<\/details>\n\n### Stack 3 · Distribution & Infrastructure — 접근 경로와 자원 계층\n\n이미 깔려 있는 설치 기반을 그대로 새 시장의 관문으로 쓰는 두 Thesis다. 새로운 설비 투자 부담이 가장 적다.\n\n<details><summary><b>PF-04 Ambient AI Distribution<\/b> — 어떤 AI가 언제 호출될지 정한다<\/summary>\n\n앱 시대에는 사용자가 앱을 골랐지만, 에이전트 시대에는 AI가 의도를 이해하고 필요한 서비스를 부른다. webOS와 TV·디스플레이 설치 기반으로 \"어떤 AI 서비스가 어떤 고객에게 언제 호출될지\"를 결정하는 **유통 계층**이 된다. 지금의 콘텐츠·OTT 유통이 AI 서비스 유통으로 진화하는 경로다.\n\n- **Control Point**: AI 서비스 유통 및 맥락 라우팅 결정권\n- **Mechanism**: Distribution + Runtime + Context Gateway\n- **플랫폼이 되는 순간**: 외부 AI 사업자가 webOS를 유통 채널로 계약할 때\n\n[[PF-04]] 위키 보기\n<\/details>\n\n<details><summary><b>PF-05 Flexible Energy Network<\/b> — 가전을 전력망의 유연 자원으로 묶는다<\/summary>\n\n재생에너지·전기차·배터리·히트펌프가 늘수록 \"얼마나 만드느냐\"만큼 \"**언제 소비를 줄이거나 옮길 수 있느냐**\"가 자산이 된다. LG가 에너지 트레이더가 되는 것이 아니라, 가전·HVAC가 아는 기기 상태와 쾌적 조건을 바탕으로 전력회사가 사서 쓰는 유연성 네트워크를 만든다.\n\n- **Control Point**: 고객 승인 기반의 검증된 유연 전력 부하\n- **Mechanism**: Aggregation + Optimization + Utility Interface\n- **플랫폼이 되는 순간**: 타사 기기가 Homey 등으로 들어오고 여러 전력회사가 이 네트워크를 살 때\n\n[[PF-05]] 위키 보기\n<\/details>\n\n### 9개는 서로 다른 것을 노린다\n\n| PF | 장악하려는 본질 | Control Point |\n|---|---|---|\n| [[PF-01]] | 돈·수요 (Money·Demand) | 가계 구매 위임권 |\n| [[PF-02]] | 행동 (Action) | 물리 환경 행동 모델 |\n| [[PF-03]] | 공간 운영 (Space Operation) | 공간 자율 운영 상태 + Uptime 책임 |\n| [[PF-04]] | 고객 접근 (Customer Access) | AI 서비스 라우팅 결정권 |\n| [[PF-05]] | 에너지 (Energy) | 검증된 유연 부하 |\n| [[PF-06]] | 노동·작업 (Labor·Task) | 작업 결과 보증 + 로봇 할당권 |\n| [[PF-07]] | 집의 결정 (Home Decision) | 현관문 신뢰 기반 공간 그래프 |\n| [[PF-08]] | 돌봄·생활 상태 (Care·Life State) | 자립 상태 증명 표준 |\n| [[PF-09]] | 자산 가치·신뢰 (Asset Value·Trust) | 기기 상태 인증권 |\n\n장악하려는 대상이 겹치지 않아서, 서로 잠식하지 않고 함께 추진할 수 있다.\n\n## 5. 평가 — 무엇이 먼저인가\n\n### 5-1. 8개 기준, 각 5점, 총 40점\n\n| 기준 | 무엇을 보나 |\n|---|---|\n| TAM | 대체하거나 들어가려는 시장의 크기와 성장성 |\n| 고객가치 | 고객의 문제를 얼마나 근본적으로 푸는가 |\n| LG 독점우위 | 빅테크·삼성이 아닌 LG만의 물리·데이터 자산 우위 |\n| 네트워크 효과 | 참여자가 늘수록 플랫폼 가치가 커지는 정도 |\n| 데이터 해자 | 시간이 갈수록 쌓여 복제하기 어려워지는 데이터 |\n| 수익화 | 일회성 판매가 아닌 구독·수수료 같은 반복 수익 구조 |\n| 실행 용이성 | 조직 준비도, 투자 규모, 기술 구현, 역물류 등 장애물의 크기 |\n| 전략적 차별성 | 빅테크·산업 강자와의 정면 대결을 피해 가는가 |\n\n### 5-2. 현재 점수와 위치\n\n<!-- VIZ:MAP -->\n\n<!-- AUTO:PORTFOLIO -->\n| PF | Thesis | 총점 | 변화 | 사분면 | X | Y | 신호 (강화/약화) | 확신도 |\n|---|---|:-:|:-:|---|:-:|:-:|:-:|:-:|\n| [[PF-06]] | Robot Operations (로봇 운영) | **36.0** | +1.0 | Strategic Core | 9.0 | 8.5 | 9 / 0 | 상승 |\n| [[PF-04]] | Ambient AI Distribution (앰비언트 AI 유통) | **35.5** | −0.5 | Strategic Core | 9.0 | 10.0 | 3 / 4 | 하락 |\n| [[PF-01]] | Household CFO (가계 구매 위임) | **34.5** | −0.5 | Moonshots | 7.0 | 9.5 | 4 / 3 | 하락 |\n| [[PF-02]] | Physical Environment Runtime (물리 환경 런타임) | **34.5** | – | Moonshots | 7.5 | 9.5 | 8 / 1 | 유지 |\n| [[PF-03]] | Autonomous Space OS (자율 공간 운영 OS) | **34.0** | – | Moonshots | 7.5 | 8.5 | 4 / 2 | 유지 |\n| [[PF-05]] | Flexible Energy Network (유연 에너지 네트워크) | **33.5** | – | Strategic Core | 8.0 | 8.5 | 5 / 1 | 유지 |\n| [[PF-07]] | Home Diagnostics (집 상태 진단) | **32.5** | +0.5 | Quick Wins | 9.0 | 7.5 | 8 / 1 | 상승 |\n| [[PF-09]] | Second Life Exchange (중고 가전 상태 인증) | **28.5** | +0.5 | Hedge & Defense | 7.5 | 5.5 | 5 / 0 | 유지 |\n| [[PF-08]] | Independent Living (고령 독립생활) | **26.0** | +1.0 | Hedge & Defense | 7.0 | 4.5 | 7 / 0 | 상승 |\n<!-- /AUTO:PORTFOLIO -->\n\n**읽는 법.** 총점과 사분면은 서로 다른 질문에 답한다.\n\n- **총점** = 이 Thesis가 얼마나 매력적인가 (8개 기준 합계)\n- **사분면** = 지금 착수할 수 있는가. 가로축은 \"LG가 이길 수 있고 실행할 수 있는가\"(독점우위 + 실행 용이성), 세로축은 \"커질 수 있는 판인가\"(네트워크 효과 + TAM)다. 각 축 8.0 이상이 높음.\n\n그래서 총점이 높아도 실행 장벽이 크면 Moonshot에 가고, 총점이 중간이어도 바로 시작할 수 있으면 Quick Win이 된다. 점수는 9월 평가가 기준선이며, 이후 근거가 쌓일 때마다 0.5점 단위로 움직인다(6장).\n\n### 5-3. 사분면별로 무엇을 할 것인가\n\n| 사분면 | 의미 | Thesis | 실행 방향 |\n|---|---|---|---|\n| **Strategic Core** | 지금 자원을 넣어 키운다 | [[PF-04]] [[PF-06]] [[PF-05]] | 이미 가진 webOS·로봇 조직·HVAC 고객을 바로 새 시장에 연결 |\n| **Moonshots** | 잠재력은 크지만 선행 투자·조직 정비가 필요 | [[PF-02]] [[PF-01]] [[PF-03]] | 기술 표준화, 고객 신뢰, 본부 간 손익 통합 같은 전제 조건부터 |\n| **Quick Wins** | 현금 흐름과 접점을 바로 만드는 쐐기 | [[PF-07]] | 케어 매니저 방문에 집 진단 체크리스트를 얹어 즉시 시작 |\n| **Hedge & Defense** | 수익보다 본업 방어와 리스크 관리 | [[PF-08]] [[PF-09]] | PF-08은 PF-07의 고령 특화 서비스로, PF-09는 소상공인 대상 PoC로 한정 |\n\n## 6. 9월 이후 무엇이 바뀌었나\n\n9월 평가 이후 국내외 신호를 모아 점수를 다시 봤다. 개별 변화는 아래 표에, 여러 Thesis에 걸쳐 반복되는 패턴은 그 아래에 정리했다.\n\n<!-- AUTO:CHANGES -->\n- **점수가 오른 Thesis**: PF-06 (+1.0), PF-08 (+1.0), PF-07 (+0.5), PF-09 (+0.5)\n- **점수가 내려간 Thesis**: PF-01 (−0.5), PF-04 (−0.5)\n- **사분면 이동**: 없음 — 9개 모두 9월 위치 유지\n\n**점수 변경 내역**\n\n| Thesis | 기준 | 9월 → 현재 | 왜 바뀌었나 | 근거 |\n|---|---|:-:|---|---|\n| [[PF-09]] Second Life Exchange | 실행 용이성 | 2.5→**3.0** | LG가 정부 협약·그룹 물류사로 폐가전 회수와 리퍼 판매(소상공인)를 시작해 최대 장벽이던 역물류의 첫 해법을 확보. EU 수리권 지침도 수리·재사용 경로를 제도화. | [[SIG-20261006-44]] [[SIG-20261006-42]] |\n| [[PF-08]] Independent Living | TAM | 2.0→**2.5** | 통합돌봄 전국 시행으로 재가 돌봄 대상이 제도화되고, 70세 이상이 1인가구 최대 집단. 대상 모수와 공공 시장이 동시에 확인됨. | [[SIG-20261006-01]] [[SIG-20261006-02]] |\n| [[PF-08]] Independent Living | 수익화 | 2.0→**2.5** | 일본은 지켜보기 센서를 공공이 최대 3/4 보조, 국내는 수백 개 지자체가 돌봄 기기를 이미 구매. B2C 과금 저항을 B2G 지불 구조로 우회할 경로가 실재. | [[SIG-20261006-40]] [[SIG-20261006-41]] |\n| [[PF-07]] Home Diagnostics | TAM | 4.0→**4.5** | 국내 필지 절반이 30년 넘은 노후 저층주택(국토연), 미국 주택 평균 연령 44년·수리 연기 37%. 집 상태 진단→수리 연결의 잠재 수요 기반이 평가 당시 가정보다 넓음. | [[SIG-20261006-35]] [[SIG-20261006-36]] |\n| [[PF-06]] Robot Operations | TAM | 4.5→**5.0** | 골드만삭스가 2035년 휴머노이드 전망을 약 4.7배 상향, IFR 기준 전문 서비스 로봇이 24% 성장하고 청소·숙박 로봇이 성장을 견인. PF-06 초기 영역과 일치. | [[SIG-20261006-18]] [[SIG-20261006-20]] |\n| [[PF-06]] Robot Operations | 실행 용이성 | 4.0→**4.5** | CEO 직속 로봇사업센터 신설(사업개발·판매·운영 통합, 데이터 생성 조직 별도). 평가 당시 전제였던 단일 의사결정 구조가 공식화됨 (strength 3 단일 근거). | [[SIG-20261006-21]] |\n| [[PF-04]] Ambient AI Distribution | 전략적 차별성 | 4.0→**3.5** | 삼성이 TV에서 멀티 AI 에이전트 선택을 먼저 구현하고 SmartThings로 홈 AI 관문을 확장. 'TV가 AI 서비스 유통 관문'이라는 개념 자체는 업계 공통 전략이 됨. 차별화는 맥락 기반 라우팅으로만 남음. | [[SIG-20261006-27]] [[SIG-20261006-38]] |\n| [[PF-01]] Household CFO | LG 독점우위 | 4.5→**4.0** | 구글(AP2 위임장 규격)과 아마존(Alexa 자동구매·정기 재구매)이 구매 위임의 형식과 첫 웨지(소모품 재주문)를 플랫폼 기본 기능으로 선점. LG 고유 우위는 '기기 상태 기반 수요 신호'로 좁아짐. | [[SIG-20261006-13]] [[SIG-20261006-14]] |\n\n**관찰 중 — 근거가 엇갈려 아직 점수를 바꾸지 않은 항목**\n\n| Thesis | 기준 | 방향 | 무엇을 보고 있나 |\n|---|---|:-:|---|\n| [[PF-02]] Physical Environment Runtime | LG 독점우위 | 약화 | 범용 로봇 모델이 가전을 시각·물리 조작만으로 다루게 되면 환경 측 런타임의 필요성이 줄어듦. 반대로 두뇌가 범용화될수록 기기 측 안전·검증 계약 가치가 오른다는 근거도 있어 보류. |\n| [[PF-03]] Autonomous Space OS | LG 독점우위 | 약화 | JCI의 에이전틱 빌딩 OS, Eaton·Vertiv·Daikin의 열관리·현장서비스 M&A로 경쟁사가 운영 계층을 먼저 채우는 중. LG의 데이터센터 냉각 수주 확대가 반대 근거. 운영(Uptime) 계약 신호가 나오면 재판단. |\n| [[PF-04]] Ambient AI Distribution | LG 독점우위 | 약화 | 북미 TV OS의 리테일러 점유율이 2029년 47%로 확대 전망. 글로벌 webOS 설치 기반 우위는 유지되므로 지역별 점유율 데이터 확보 후 판단. |\n| [[PF-05]] Flexible Energy Network | LG 독점우위 | 약화 | 중립 애그리게이터(Kraken 2GW+)와 국내 건설사 단지 플랫폼이 부하 제어 권한을 먼저 확보. LG Homey의 유럽 기반이 반대 근거. Homey의 에너지 기능 실적 확인 후 판단. 독점우위가 3.5로 내려가면 X축이 8 미만이 되어 Strategic Core에서 이탈. |\n<!-- /AUTO:CHANGES -->\n\n### 반복해서 보이는 네 가지 패턴\n\n**① Control Point를 먼저 가져가는 쪽이 제조사가 아닌 경우가 많다.**\n\"타사 기기를 받아들이는 순간 플랫폼이 된다\"는 원칙이 반대로도 작동하고 있다. 다른 사업자가 LG 기기를 받아들이면, LG는 플랫폼이 아니라 공급자가 된다.\n\n| Thesis | 그 자리를 먼저 가져가는 쪽 | 근거 |\n|---|---|---|\n| PF-01 구매 위임 | 구글(위임장 결제 규격), 아마존(자동 재구매) | [[SIG-20261006-13]] [[SIG-20261006-14]] |\n| PF-04 AI 유통 | 북미 리테일러 TV OS, 삼성 멀티 에이전트 TV | [[SIG-20261006-29]] [[SIG-20261006-27]] |\n| PF-05 유연 에너지 | 중립 플랫폼 Kraken, 국내 건설사 단지 플랫폼 | [[SIG-20261006-31]] [[SIG-20261006-03]] |\n| PF-08 독립생활 | 일본 가전 유통사(복수 제조사 통합) | [[SIG-20261006-10]] |\n\n**② 현장 인력과 물리 실행은 여전히 복제하기 어렵다.**\n데이터센터 냉각 경쟁사들은 현장 서비스 업체를 인수하고 있고([[SIG-20261006-24]]), 미국에서는 수리 인력 부족이 심해지고 있다([[SIG-20261006-36]]). LG는 약 4,000명의 케어 매니저를 운영한다([[SIG-20261006-37]]). \"책임질 수 있는 쪽\"이라는 LG의 비대칭 자산은 가치가 오르는 방향이다.\n\n**③ 공공이 돈을 내는 쪽으로 등장했다.**\n통합돌봄 전국 시행([[SIG-20261006-01]]), 일본의 돌봄 기술 보조금([[SIG-20261006-40]]), 국내 분산에너지 특화지역([[SIG-20261006-33]]), EU 수리권 의무화([[SIG-20261006-42]]). 개인에게 돈을 받기 어려웠던 PF-08·PF-09·PF-05에 공공이 지불하는 경로가 생기고 있다.\n\n**④ 로봇의 두뇌는 흔해지고, 환경과 운영이 남는다.**\n엔비디아는 로봇 AI 모델을 오픈소스로 풀었고([[SIG-20261006-15]]), 범용 로봇 모델 기업에는 큰 자본이 몰린다([[SIG-20261006-16]]). 베인은 자동화 산업의 이익이 하드웨어에서 운영 소프트웨어·데이터로 옮겨간다고 본다([[SIG-20261006-22]]). PF-02·PF-06의 논리를 지지하는 흐름이다.\n\n## 7. 결정이 필요한 질문\n\n아래는 **답에 따라 Thesis의 위치나 추진 방식이 바뀌는 질문**이다. 각 질문에는 왜 지금 중요한지, 어떤 신호가 나오면 답이 바뀌는지, 언제까지 정해야 하는지를 함께 적었다. 신호 레이더가 관련 근거를 찾으면 이 목록이 함께 갱신된다.\n\n<!-- AUTO:DECISIONS -->\n| # | 질문 | 관련 Thesis | 결정 시점 |\n|---|---|---|---|\n| D-01 | Flexible Energy Network를 유럽(Homey·히트펌프) 기준으로 평가할 것인가, 국내 사업을 포함해 평가할 것인가? | [[PF-05]] | 2026년 4분기 |\n| D-02 | 데이터센터 냉각 사업을 '장비 공급'에서 '냉각 성능·가동률 보증'으로 넓힐 것인가? | [[PF-03]] | 2027년 1분기 |\n| D-03 | 베어로보틱스 관제에 타사 로봇을 받아들일 것인가? | [[PF-06]] | 2027년 상반기 |\n| D-04 | Independent Living을 Home Diagnostics의 부가서비스로 계속 둘 것인가, 지자체 대상 독립 과제로 다시 볼 것인가? | [[PF-08]] [[PF-07]] | 2027년 1분기 |\n| D-05 | Household CFO를 '구매를 대신하는 에이전트'가 아니라 '수요 신호를 공급하는 쪽'으로 다시 정의할 것인가? | [[PF-01]] | 2026년 4분기 |\n\n### D-01 · Flexible Energy Network를 유럽(Homey·히트펌프) 기준으로 평가할 것인가, 국내 사업을 포함해 평가할 것인가?\n\n**왜 중요한가.** 범위에 따라 LG 독점우위가 달라진다. 유럽은 Homey와 히트펌프로 기기 측 기반이 있지만, 국내는 건설사 단지 플랫폼이 부하 제어 권한을 먼저 쥐고 보상도 작다. 현재 가로축이 8.0으로 사분면 경계에 있어, 독점우위가 0.5만 내려가도 Strategic Core에서 Moonshot으로 이동한다.\n\n**선택지**\n\n- 유럽 기준 — Core 유지 가능성 높음, 국내는 별도 과제로 분리\n- 국내 포함 — 독점우위 하향 압력, Moonshot 이동 가능\n\n**답을 바꿀 신호**\n\n- Homey 에너지 기능 사용 실적\n- Kraken·유럽 유틸리티의 가전 제조사 연동\n- 국민DR 가정 참여 규모와 보상 단가\n\n**지금까지의 근거** [[SIG-20261006-31]] [[SIG-20261006-03]] [[SIG-20261006-34]]  \n**결정 주체** AX 포트폴리오 검토 (경영진 보고 전 확정) · **시점** 2026년 4분기\n\n### D-02 · 데이터센터 냉각 사업을 '장비 공급'에서 '냉각 성능·가동률 보증'으로 넓힐 것인가?\n\n**왜 중요한가.** 북미 5GW 계약으로 HVAC 앵커의 사업 체력은 확인됐지만, 계약 내용은 장비 공급이다. Space OS의 Control Point는 가동률 책임이므로 운영 계약이 없으면 플랫폼이 아니다. 운영·성과 보증이 들어가면 실행 용이성이 오를 근거가 되고, 가로축이 8.0에 닿아 Moonshot에서 Strategic Core로 이동할 수 있다.\n\n**선택지**\n\n- 성능 보증 계약 시범 — Core 이동 조건 충족 시도\n- 장비 공급 유지 — PF-03은 장기 Moonshot으로 유지\n\n**답을 바꿀 신호**\n\n- LG 데이터센터 계약의 운영·유지보수·성능 보증 조항\n- 경쟁사의 현장 서비스 M&A\n- 본부 간 손익 통합 논의\n\n**지금까지의 근거** [[SIG-20261006-05]] [[SIG-20261006-24]] [[SIG-20261006-23]]  \n**결정 주체** ES사업본부 · AX · **시점** 2027년 1분기\n\n### D-03 · 베어로보틱스 관제에 타사 로봇을 받아들일 것인가?\n\n**왜 중요한가.** Robot Operations는 총점 공동 1위로 올라섰지만 네트워크 효과(3.5)는 타사 로봇을 실제로 받아들이기 전까지 오르지 않는다. 자사 로봇만 운영하면 좋은 RaaS 사업이고, 타사 로봇에 작업을 배정하는 순간 플랫폼이 된다. 로봇 제조사들이 운영까지 직접 하는 흐름이 굳어지기 전에 정해야 한다.\n\n**선택지**\n\n- 타사 연동 개방 — 할당권 확보, 네트워크 효과 상향 근거\n- 자사 로봇 중심 — 운영 사업으로 키우되 플랫폼 전환은 보류\n\n**답을 바꿀 신호**\n\n- 로봇 제조사의 타사 관제 연동 허용 여부\n- ㎡당 로봇 청소 원가 ÷ 인력 청소 단가\n- 로봇사업센터 KPI(판매 대수 vs 운영 성과)\n\n**지금까지의 근거** [[SIG-20261006-21]] [[SIG-20261006-20]] [[SIG-20261006-06]]  \n**결정 주체** 로봇사업센터 · **시점** 2027년 상반기\n\n### D-04 · Independent Living을 Home Diagnostics의 부가서비스로 계속 둘 것인가, 지자체 대상 독립 과제로 다시 볼 것인가?\n\n**왜 중요한가.** 9월 판단은 단독 수익화가 어렵고 사고 리스크가 커서 PF-07에 통합하는 것이었다. 이후 통합돌봄 시행과 지자체의 돌봄 기기 구매, 일본의 공공 보조가 확인되면서 '공공이 돈을 내는' 경로가 생겼고 TAM·수익화 점수가 올랐다. 다만 여전히 Hedge & Defense에 있고 책임 리스크는 그대로다.\n\n**선택지**\n\n- 통합 유지 — PF-07 방문 접점 위 고령 특화 서비스\n- B2G 독립 과제 — 1~2개 지자체 통합돌봄 시범부터\n\n**답을 바꿀 신호**\n\n- 통합돌봄 예산 중 기기·ICT 항목\n- 지자체 돌봄 기기 조달 단가·평가 기준\n- 돌봄 기기 사고 책임 가이드라인\n\n**지금까지의 근거** [[SIG-20261006-01]] [[SIG-20261006-40]] [[SIG-20261006-41]]  \n**결정 주체** AX 포트폴리오 검토 · **시점** 2027년 1분기\n\n### D-05 · Household CFO를 '구매를 대신하는 에이전트'가 아니라 '수요 신호를 공급하는 쪽'으로 다시 정의할 것인가?\n\n**왜 중요한가.** 구글이 위임장 기반 결제 규격을, 아마존이 소모품 자동 재구매를 먼저 내놓으면서 구매 위임의 형식과 첫 시장을 플랫폼이 선점했다. LG 독점우위는 4.5에서 4.0으로 내려갔다. LG만 할 수 있는 것은 '이 가구에 무엇이 언제 필요한지'를 기기 상태로 증명하는 일이다.\n\n**선택지**\n\n- 재정의 — 표준 위임장 위에 기기 상태 기반 수요 신호를 공급\n- 원안 유지 — LG Agent가 직접 구매·협상\n\n**답을 바꿀 신호**\n\n- AP2·UCP 등 커머스 규격에 IoT·가전 제조사 참여\n- 국내 카드사 에이전트 결제의 첫 상용 카테고리\n- 구독 가구의 소모품 자동 배송 비중\n\n**지금까지의 근거** [[SIG-20261006-13]] [[SIG-20261006-14]] [[SIG-20261006-12]]  \n**결정 주체** AX · 구독사업 · **시점** 2026년 4분기\n<!-- /AUTO:DECISIONS -->\n\n## 8. 최근 회차\n\n<!-- AUTO:LATEST -->\n**다이제스트 2026-10-06 · 베이스라인**\n\n1. **Control Point를 먼저 가져가는 쪽이 제조사가 아니다.** 구글은 구매 위임장(AP2)을 규격화했고, 크라켄은 2GW 유연 부하를 중립 플랫폼으로 운영하며, 북미 TV OS는 리테일러로 넘어가고 있다. PF-01 독점우위를 낮추고 PF-04·05를 관찰에 올렸다.\n2. **PF-06 로봇 운영이 공동 1위로 올라섰다.** 골드만삭스 휴머노이드 전망 4.7배 상향, IFR 서비스 로봇 24% 성장, LG CEO 직속 로봇사업센터 신설이 한 방향을 가리킨다(TAM·실행 용이성 각 +0.5).\n3. **공공이 지불자로 등장했다.** 통합돌봄 시행, 일본 개호 테크놀로지 보조, EU 수리권. 가장 약했던 PF-08(TAM·수익화 +0.5)과 PF-09(실행 +0.5)의 점수가 처음으로 올라갔다.\n\n전문은 다이제스트 탭(`digests/2026-10-06.md`)에서 볼 수 있다.\n<!-- /AUTO:LATEST -->\n\n---\n\n### 용어\n\n| 용어 | 뜻 |\n|---|---|\n| Control Point | 다른 사업자와 고객의 행동을 좌우할 수 있는 자리. 접근권·판단권·거절권이 모두 있어야 성립 |\n| Platform Thesis (PF) | \"LG는 이 자리를 차지할 수 있다\"는 검증 가능한 가설 하나 |\n| Mechanism | 그 자리를 시장으로 넓히는 방식 (Runtime, Aggregation 등 5종) |\n| 신호 (SIG) | 가설을 강화하거나 약화하는 외부 근거 1건. 출처·방향·강도를 기록 |\n| 관찰 중 | 근거가 엇갈려 점수를 바꾸지 않고 지켜보는 항목 |\n| 수요층 지수 | 시간 빈곤·공간 제약·가사 외주화·돌봄 부담 — 가구의 변화를 재는 4개 지표 ([[시간빈곤지수]] [[공간제약지수]] [[가사외주화지수]] [[돌봄부담지수]]) |\n\n## 변경 이력\n- 2026-10-06: 개요 페이지로 재구성. 출발 질문·방법론·9개 Thesis·평가·변화·결정 질문 순서로 정리, 공유용으로 풀어 씀.\n- 2026-10-06: 포트폴리오 개요 초판. 2026년 1월 이후 글로벌 소스 44건 반영, 6개 Thesis 8건 점수 조정, 4건 관찰 등록.\n", "가사외주화지수": "---\nid: IDX-OUTSRC\nname: 가사외주화지수\nlayer: 수요층 (Korea Futures Lab)\n---\n# 가사외주화지수\n\n가사를 기기·서비스·사람에게 맡기는 정도.\n\n## 관측 변수 후보\n가사서비스 플랫폼 이용, 세탁·청소 대행 시장, 밀키트·배달 지출, 로봇청소기·식기세척기 보급률, 외국인 가사관리사 제도\n\n## 높아질 때의 함의\n작업 단위 성과 계약 수요 → [[PF-06]] 로봇 운영, [[PF-02]] 환경 런타임, [[PF-01]] 구매 위임\n\n## 일본 선행 참조\n가사대행 서비스 시장 성장과 정부 인증 제도\n", "공간제약지수": "---\nid: IDX-SPACE\nname: 공간제약지수\nlayer: 수요층 (Korea Futures Lab)\n---\n# 공간제약지수\n\n가구가 가전·가구를 놓고 쓰는 물리 공간이 얼마나 제약되는가.\n\n## 관측 변수 후보\n1인당 주거 면적, 소형 주택 비중, 오피스텔·원룸 거주 비율, 이사 빈도, 주택 노후도, 빌트인 가전 채택률\n\n## 높아질 때의 함의\n소형·복합·빌트인 수요, 단기 보유·재판매 증가 → [[PF-09]] 중고 인증, [[PF-07]] 집 상태 진단\n\n## 일본 선행 참조\n도시 소형 주거의 일체형 가전, 렌탈·중고 순환 시장\n", "돌봄부담지수": "---\nid: IDX-CARE\nname: 돌봄부담지수\nlayer: 수요층 (Korea Futures Lab)\n---\n# 돌봄부담지수\n\n가구가 고령자·아동 돌봄에 지는 부담의 크기.\n\n## 관측 변수 후보\n고령 1인가구 수, 노인 부양비, 요양보호사 수급, 맞벌이 자녀 돌봄 공백, 통합돌봄 대상자 규모, 원거리 부모 부양 비율\n\n## 높아질 때의 함의\n상태 모니터링·안부 확인·돌봄 로봇 수요 → [[PF-08]] 독립생활, [[PF-06]] 로봇 운영, [[PF-07]] 집 상태 진단\n\n## 일본 선행 참조\n개호보험의 복지용구 대여, 가전 기반 안부 확인 서비스\n", "시간빈곤지수": "---\nid: IDX-TIME\nname: 시간빈곤지수\nlayer: 수요층 (Korea Futures Lab)\n---\n# 시간빈곤지수\n\n가구가 가사·생활 관리에 쓸 수 있는 시간이 얼마나 부족한가.\n\n## 관측 변수 후보\n맞벌이 가구 비율, 주당 노동시간, 통근 시간, 생활시간조사의 가사노동 시간, 1인가구 식사 형태, 간편식·배달 지출 비중\n\n## 높아질 때의 함의\n자동화·위임 수요 증가 → [[PF-01]] 구매 위임, [[PF-04]] 앰비언트 AI, [[PF-06]] 작업 외주\n\n## 일본 선행 참조\n맞벌이 확산기의 시간 단축 가전(식기세척기, 건조기) 보급 곡선\n"}, "digests": [{"date": "2026-10-06", "kind": "baseline", "title": "베이스라인 — 2026년 1~10월 글로벌 소스 백필", "path": "digests/2026-10-06.md", "markdown": "# 다이제스트 2026-10-06 · 베이스라인\n\n2026년 1월 이후 국내외 소스 **44건**(컨설팅·투자은행·산업리서치·정부·글로벌기업·언론)을 수집해 9개 Thesis 위키의 기준선을 만들었다. 채택 42건, 검토 대기 2건. 6개 Thesis에서 8개 기준 점수를 조정했고 4건을 관찰 목록에 올렸다.\n\n## 이번 회차 핵심 3가지\n1. **Control Point를 먼저 가져가는 쪽이 제조사가 아니다.** 구글은 구매 위임장(AP2)을 규격화했고, 크라켄은 2GW 유연 부하를 중립 플랫폼으로 운영하며, 북미 TV OS는 리테일러로 넘어가고 있다. PF-01 독점우위를 낮추고 PF-04·05를 관찰에 올렸다.\n2. **PF-06 로봇 운영이 공동 1위로 올라섰다.** 골드만삭스 휴머노이드 전망 4.7배 상향, IFR 서비스 로봇 24% 성장, LG CEO 직속 로봇사업센터 신설이 한 방향을 가리킨다(TAM·실행 용이성 각 +0.5).\n3. **공공이 지불자로 등장했다.** 통합돌봄 시행, 일본 개호 테크놀로지 보조, EU 수리권. 가장 약했던 PF-08(TAM·수익화 +0.5)과 PF-09(실행 +0.5)의 점수가 처음으로 올라갔다.\n\n## 점수 변경\n| PF | 기준 | 변경 | 근거 |\n|---|---|:-:|---|\n| [[PF-01]] | LG 독점우위 | 4.5 → 4.0 | [[SIG-20261006-13]] [[SIG-20261006-14]] |\n| [[PF-04]] | 전략적 차별성 | 4.0 → 3.5 | [[SIG-20261006-27]] [[SIG-20261006-38]] |\n| [[PF-06]] | TAM | 4.5 → 5.0 | [[SIG-20261006-18]] [[SIG-20261006-20]] |\n| [[PF-06]] | 실행 용이성 | 4.0 → 4.5 | [[SIG-20261006-21]] |\n| [[PF-07]] | TAM | 4.0 → 4.5 | [[SIG-20261006-35]] [[SIG-20261006-36]] |\n| [[PF-08]] | TAM | 2.0 → 2.5 | [[SIG-20261006-01]] [[SIG-20261006-02]] |\n| [[PF-08]] | 수익화 | 2.0 → 2.5 | [[SIG-20261006-40]] [[SIG-20261006-41]] |\n| [[PF-09]] | 실행 용이성 | 2.5 → 3.0 | [[SIG-20261006-44]] [[SIG-20261006-42]] |\n\n## 관찰 등록 (변경 보류)\n- [[PF-02]] 독점우위 — 범용 로봇 모델 vs 환경 측 계약\n- [[PF-03]] 독점우위 — JCI 에이전틱 빌딩 OS, 냉각 M&A\n- [[PF-04]] 독점우위 — 북미 리테일러 TV OS 확대\n- [[PF-05]] 독점우위 — Kraken·단지 플랫폼. 0.5 하락 시 Strategic Core 이탈\n\n## 2x2 재배치 검토 (분기 첫 실행)\n사분면 이동은 없다. 다만 이동 조건이 가까운 Thesis가 둘이다.\n- **PF-05 Core → Moonshot 위험** — X축 8.0으로 경계선. 독점우위가 0.5 내려가면 이탈.\n- **PF-03 Moonshot → Core 조건** — 실행 용이성 +0.5면 X축 8.0 도달. 데이터센터 계약에 운영·성과 보증이 들어가는 신호가 조건.\n\n## 검토 대기\n- [[SIG-20261006-08]] EU DPP 일정 — 1차 출처 확인\n- [[SIG-20261006-10]] 에디온 — 원문 접근 제한\n\n## 다음 회차 관찰 포인트\n- LG 데이터센터 계약의 운영·유지보수 조항 (PF-03)\n- Homey 에너지 기능 실적, 크라켄 기기 파트너 (PF-05)\n- 베어로보틱스 관제의 타사 로봇 연동 (PF-06)\n- 통합돌봄 예산의 기기·ICT 항목 (PF-08)\n- webOS 외부 AI 파트너 계약 구조, 지역별 TV OS 점유율 (PF-04)\n"}], "decisions": [{"id": "D-01", "pf": ["PF-05"], "question": "Flexible Energy Network를 유럽(Homey·히트펌프) 기준으로 평가할 것인가, 국내 사업을 포함해 평가할 것인가?", "why": "범위에 따라 LG 독점우위가 달라진다. 유럽은 Homey와 히트펌프로 기기 측 기반이 있지만, 국내는 건설사 단지 플랫폼이 부하 제어 권한을 먼저 쥐고 보상도 작다. 현재 가로축이 8.0으로 사분면 경계에 있어, 독점우위가 0.5만 내려가도 Strategic Core에서 Moonshot으로 이동한다.", "options": ["유럽 기준 — Core 유지 가능성 높음, 국내는 별도 과제로 분리", "국내 포함 — 독점우위 하향 압력, Moonshot 이동 가능"], "watch_signals": ["Homey 에너지 기능 사용 실적", "Kraken·유럽 유틸리티의 가전 제조사 연동", "국민DR 가정 참여 규모와 보상 단가"], "evidence": ["SIG-20261006-31", "SIG-20261006-03", "SIG-20261006-34"], "owner": "AX 포트폴리오 검토 (경영진 보고 전 확정)", "due": "2026년 4분기", "status": "open"}, {"id": "D-02", "pf": ["PF-03"], "question": "데이터센터 냉각 사업을 '장비 공급'에서 '냉각 성능·가동률 보증'으로 넓힐 것인가?", "why": "북미 5GW 계약으로 HVAC 앵커의 사업 체력은 확인됐지만, 계약 내용은 장비 공급이다. Space OS의 Control Point는 가동률 책임이므로 운영 계약이 없으면 플랫폼이 아니다. 운영·성과 보증이 들어가면 실행 용이성이 오를 근거가 되고, 가로축이 8.0에 닿아 Moonshot에서 Strategic Core로 이동할 수 있다.", "options": ["성능 보증 계약 시범 — Core 이동 조건 충족 시도", "장비 공급 유지 — PF-03은 장기 Moonshot으로 유지"], "watch_signals": ["LG 데이터센터 계약의 운영·유지보수·성능 보증 조항", "경쟁사의 현장 서비스 M&A", "본부 간 손익 통합 논의"], "evidence": ["SIG-20261006-05", "SIG-20261006-24", "SIG-20261006-23"], "owner": "ES사업본부 · AX", "due": "2027년 1분기", "status": "open"}, {"id": "D-03", "pf": ["PF-06"], "question": "베어로보틱스 관제에 타사 로봇을 받아들일 것인가?", "why": "Robot Operations는 총점 공동 1위로 올라섰지만 네트워크 효과(3.5)는 타사 로봇을 실제로 받아들이기 전까지 오르지 않는다. 자사 로봇만 운영하면 좋은 RaaS 사업이고, 타사 로봇에 작업을 배정하는 순간 플랫폼이 된다. 로봇 제조사들이 운영까지 직접 하는 흐름이 굳어지기 전에 정해야 한다.", "options": ["타사 연동 개방 — 할당권 확보, 네트워크 효과 상향 근거", "자사 로봇 중심 — 운영 사업으로 키우되 플랫폼 전환은 보류"], "watch_signals": ["로봇 제조사의 타사 관제 연동 허용 여부", "㎡당 로봇 청소 원가 ÷ 인력 청소 단가", "로봇사업센터 KPI(판매 대수 vs 운영 성과)"], "evidence": ["SIG-20261006-21", "SIG-20261006-20", "SIG-20261006-06"], "owner": "로봇사업센터", "due": "2027년 상반기", "status": "open"}, {"id": "D-04", "pf": ["PF-08", "PF-07"], "question": "Independent Living을 Home Diagnostics의 부가서비스로 계속 둘 것인가, 지자체 대상 독립 과제로 다시 볼 것인가?", "why": "9월 판단은 단독 수익화가 어렵고 사고 리스크가 커서 PF-07에 통합하는 것이었다. 이후 통합돌봄 시행과 지자체의 돌봄 기기 구매, 일본의 공공 보조가 확인되면서 '공공이 돈을 내는' 경로가 생겼고 TAM·수익화 점수가 올랐다. 다만 여전히 Hedge & Defense에 있고 책임 리스크는 그대로다.", "options": ["통합 유지 — PF-07 방문 접점 위 고령 특화 서비스", "B2G 독립 과제 — 1~2개 지자체 통합돌봄 시범부터"], "watch_signals": ["통합돌봄 예산 중 기기·ICT 항목", "지자체 돌봄 기기 조달 단가·평가 기준", "돌봄 기기 사고 책임 가이드라인"], "evidence": ["SIG-20261006-01", "SIG-20261006-40", "SIG-20261006-41"], "owner": "AX 포트폴리오 검토", "due": "2027년 1분기", "status": "open"}, {"id": "D-05", "pf": ["PF-01"], "question": "Household CFO를 '구매를 대신하는 에이전트'가 아니라 '수요 신호를 공급하는 쪽'으로 다시 정의할 것인가?", "why": "구글이 위임장 기반 결제 규격을, 아마존이 소모품 자동 재구매를 먼저 내놓으면서 구매 위임의 형식과 첫 시장을 플랫폼이 선점했다. LG 독점우위는 4.5에서 4.0으로 내려갔다. LG만 할 수 있는 것은 '이 가구에 무엇이 언제 필요한지'를 기기 상태로 증명하는 일이다.", "options": ["재정의 — 표준 위임장 위에 기기 상태 기반 수요 신호를 공급", "원안 유지 — LG Agent가 직접 구매·협상"], "watch_signals": ["AP2·UCP 등 커머스 규격에 IoT·가전 제조사 참여", "국내 카드사 에이전트 결제의 첫 상용 카테고리", "구독 가구의 소모품 자동 배송 비중"], "evidence": ["SIG-20261006-13", "SIG-20261006-14", "SIG-20261006-12"], "owner": "AX · 구독사업", "due": "2026년 4분기", "status": "open"}], "feed": [{"date": "2026-10-06", "pf": "PF-01", "text": "위키 초판. 2026년 1월 이후 글로벌 소스 반영. 독점우위 4.5→4.0 (구글 AP2·아마존 자동구매)."}, {"date": "2026-10-06", "pf": "PF-02", "text": "위키 초판. 점수 변경 없음, 독점우위 관찰 등록 (범용 로봇 모델 vs 환경 측 계약)."}, {"date": "2026-10-06", "pf": "PF-03", "text": "위키 초판. 점수 변경 없음(장비 공급 ≠ Uptime 책임). 독점우위 관찰 등록."}, {"date": "2026-10-06", "pf": "PF-04", "text": "위키 초판. 전략적 차별성 4.0→3.5 (삼성 멀티 에이전트 TV·SmartThings). 독점우위 관찰 등록 (북미 리테일러 OS)."}, {"date": "2026-10-06", "pf": "PF-05", "text": "위키 초판. 점수 유지, 독점우위 관찰 등록 (Kraken·단지 플랫폼). 3.5로 내려가면 사분면 이동."}, {"date": "2026-10-06", "pf": "PF-06", "text": "위키 초판. TAM 4.5→5.0, 실행 용이성 4.0→4.5. 총점 36.0으로 공동 1위."}, {"date": "2026-10-06", "pf": "PF-07", "text": "위키 초판. TAM 4.0→4.5 (국내외 노후 주택·수리 연기 근거)."}, {"date": "2026-10-06", "pf": "PF-08", "text": "위키 초판. TAM 2.0→2.5, 수익화 2.0→2.5 (통합돌봄·지자체 조달·일본 공공 보조)."}, {"date": "2026-10-06", "pf": "PF-09", "text": "위키 초판. 실행 용이성 2.5→3.0 (회수·리퍼 사업 착수, EU 수리권)."}, {"date": "2026-10-06", "pf": "Portfolio", "text": "개요 페이지로 재구성. 출발 질문·방법론·9개 Thesis·평가·변화·결정 질문 순서로 정리, 공유용으로 풀어 씀."}, {"date": "2026-10-06", "pf": "Portfolio", "text": "포트폴리오 개요 초판. 2026년 1월 이후 글로벌 소스 44건 반영, 6개 Thesis 8건 점수 조정, 4건 관찰 등록."}]};
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const QC = {"Strategic Core":"var(--q-core)","Moonshots":"var(--q-moon)","Quick Wins":"var(--q-quick)","Hedge & Defense":"var(--q-hedge)"};
const DIR = {"+":["강화","p-pos"],"-":["약화","p-neg"],"new":["신규","p-new"]};
const TIERS = ["컨설팅","투자은행","산업리서치","정부·공공","글로벌기업","언론"];
const f1 = x => Number(x).toFixed(1);
const dlt = d => Math.abs(d)<1e-9 ? '<span class="d-0">±0.0</span>' : (d>0?`<span class="d-up">+${f1(d)}</span>`:`<span class="d-dn">−${f1(-d)}</span>`);
const PF_IDS = DATA ? Object.keys(DATA.thesis).sort() : [];
const IDX_SLUG = DATA ? Object.fromEntries(DATA.indices.map((n,i)=>[n,"idx-"+i])) : {};
const SLUG_IDX = Object.fromEntries(Object.entries(IDX_SLUG).map(([k,v])=>[v,k]));

function md(src){
  let s = src.replace(/^---\n[\s\S]*?\n---\n?/, "").replace(/<!-- \/?AUTO:[A-Z]+ -->/g, "");
  s = s.replace(/\[\[([^\]]+)\]\]/g, (m, k) => {
    k = k.trim();
    if (k.startsWith("SIG-")) return `<a class="wl" href="#signals" data-sig="${esc(k)}">${esc(k.replace("SIG-",""))}</a>`;
    if (IDX_SLUG[k]) return `<a class="wl" href="#wiki-${IDX_SLUG[k]}">${esc(k)}</a>`;
    if (k === "Portfolio") return `<a class="wl" href="#overview">개요</a>`;
    return `<a class="wl" href="#wiki-${esc(k)}">${esc(k)}</a>`;
  });
  let html;
  if (window.marked && marked.parse) html = marked.parse(s, {gfm:true, breaks:false});
  else html = '<pre style="white-space:pre-wrap;font-family:inherit">'+esc(s)+"</pre>";
  html = html.replace(/<table>/g,'<div class="tw"><table>').replace(/<\/table>/g,'</table></div>');
  html = html.replace(/<!-- VIZ:MAP -->/g, ()=>`<figure class="mapcard viz">${mapSVG()}<figcaption class="legend">${Object.entries(QC).map(([n,c])=>`<span><i style="background:${c}"></i>${n}</span>`).join("")}<span>· 점선 원은 9월 기준선 위치</span></figcaption></figure>`);
  html = html.replace(/<!-- VIZ:STACKS -->/g, ()=>stacksHTML());
  return html;
}
function stacksHTML(){
  const rows=[["Physical AI","로봇과 공간의 실행 계층",["PF-02","PF-03","PF-06"],"→"],
              ["Household","집과 생활의 의사결정 계층",["PF-07","PF-01","PF-08","PF-09"],"→"],
              ["Distribution & Infra","접근 경로와 자원 계층",["PF-04","PF-05"],"·"]];
  return `<div class="stacks viz">${rows.map(([n,sub,ids,sep])=>`<div class="srow"><div class="slab"><b>${esc(n)}</b><span>${esc(sub)}</span></div><div class="snodes">${ids.map((id,i)=>{
    const t=DATA.thesis[id], k=t.calc.current;
    return `${i?`<span class="sep" aria-hidden="true">${sep}</span>`:""}<a class="snode" href="#wiki-${id}" style="--qc:${QC[k.quadrant]}"><span class="pfid">${id}</span><b>${esc(t.name)}</b><small>${esc(t.name_ko)} · ${f1(k.total)}점</small></a>`;}).join("")}</div></div>`).join("")}</div>`;
}

/* ---------- home ---------- */
function digestBullets(d){
  const m = d.markdown.match(/## 이번 회차 핵심 3가지\n([\s\S]*?)(\n## |$)/);
  if(!m) return [];
  return m[1].trim().split(/\n(?=\d+\.)/).map(x=>x.replace(/^\d+\.\s*/,""));
}
function mapSVG(){
  const W=420,H=330,P={l:44,r:14,t:16,b:40}, lo=4, hi=10.5;
  const sx=v=>P.l+(v-lo)/(hi-lo)*(W-P.l-P.r), sy=v=>H-P.b-(v-lo)/(hi-lo)*(H-P.t-P.b);
  const qr=DATA.quadrant_rule; let g="";
  g+=`<rect x="${sx(qr.x_threshold)}" y="${sy(hi)}" width="${sx(hi)-sx(qr.x_threshold)}" height="${sy(qr.y_threshold)-sy(hi)}" fill="var(--accent-soft)"/>`;
  for(let v=4; v<=10; v+=2){
    g+=`<line x1="${sx(v)}" x2="${sx(v)}" y1="${sy(lo)}" y2="${sy(hi)}" stroke="var(--line)"/>`;
    g+=`<line y1="${sy(v)}" y2="${sy(v)}" x1="${sx(lo)}" x2="${sx(hi)}" stroke="var(--line)"/>`;
    g+=`<text x="${sx(v)}" y="${H-P.b+14}" font-size="10" text-anchor="middle" fill="var(--muted)" font-family="IBM Plex Mono,monospace">${v}</text>`;
    g+=`<text x="${P.l-6}" y="${sy(v)+3}" font-size="10" text-anchor="end" fill="var(--muted)" font-family="IBM Plex Mono,monospace">${v}</text>`;
  }
  g+=`<line x1="${sx(qr.x_threshold)}" x2="${sx(qr.x_threshold)}" y1="${sy(lo)}" y2="${sy(hi)}" stroke="var(--muted)" stroke-dasharray="3 3"/>`;
  g+=`<line y1="${sy(qr.y_threshold)}" y2="${sy(qr.y_threshold)}" x1="${sx(lo)}" x2="${sx(hi)}" stroke="var(--muted)" stroke-dasharray="3 3"/>`;
  const ql=[["Strategic Core",hi-0.1,hi-0.15,"end"],["Moonshots",lo+0.1,hi-0.15,"start"],["Quick Wins",hi-0.1,lo+0.25,"end"],["Hedge & Defense",lo+0.1,lo+0.25,"start"]];
  ql.forEach(([n,x,y,a])=>g+=`<text x="${sx(x)}" y="${sy(y)+4}" font-size="10" text-anchor="${a}" fill="${QC[n]}" font-weight="500">${n}</text>`);
  // collision offsets for identical points
  const seen={};
  PF_IDS.forEach(id=>{
    const c=DATA.thesis[id].calc, b=c.baseline, k=c.current;
    const key=k.x+"_"+k.y; const n=(seen[key]=(seen[key]||0)+1)-1;
    const ox=n*16, cx=sx(k.x)+ox, cy=sy(k.y);
    if(b.x!==k.x||b.y!==k.y){
      g+=`<circle cx="${sx(b.x)+ox}" cy="${sy(b.y)}" r="9" fill="none" stroke="var(--muted)" stroke-dasharray="2 2"/>`;
      g+=`<line x1="${sx(b.x)+ox}" y1="${sy(b.y)}" x2="${cx}" y2="${cy}" stroke="var(--muted)"/>`;
    }
    g+=`<a href="#wiki-${id}"><circle cx="${cx}" cy="${cy}" r="11" fill="${QC[k.quadrant]}"/><text x="${cx}" y="${cy+3.5}" font-size="9.5" text-anchor="middle" fill="var(--surface)" font-family="IBM Plex Mono,monospace" font-weight="500">${id.slice(3)}</text></a>`;
  });
  g+=`<text x="${(W+P.l)/2}" y="${H-6}" font-size="10.5" text-anchor="middle" fill="var(--muted)">X · LG 독점우위 + 실행 용이성 →</text>`;
  g+=`<text transform="translate(12 ${(H-P.b+P.t)/2}) rotate(-90)" font-size="10.5" text-anchor="middle" fill="var(--muted)">Y · 네트워크 효과 + TAM →</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="2x2 포트폴리오 지도">${g}</svg>`;
}
function strip(id){
  const c=DATA.thesis[id].calc;
  return `<div class="strip">${DATA.criteria.map(k=>{
    const v=c.current.scores[k.key], b=c.baseline.scores[k.key];
    const h=v>=5?"--h4":v>=4.5?"--h3":v>=4?"--h2":v>=3?"--h1":"--h0";
    return `<i style="background:var(${h})" class="${v!==b?"chg":""}" title="${esc(k.label)} ${f1(v)}${v!==b?` (기준선 ${f1(b)})`:""}"></i>`;}).join("")}</div>
  <div class="strip-l">${["TAM","가치","독점","네트","해자","수익","실행","차별"].map(x=>`<span>${x}</span>`).join("")}</div>`;
}
function overview(target){
  const src=DATA.wiki["Portfolio"]||"";
  const v=$("v-overview");
  if(!v.dataset.ready){
    v.innerHTML=`<div class="wiki ov"><nav class="toc" id="ov-toc" aria-label="장 목차"></nav><article class="doc ovdoc" id="ov-doc">${md(src)}</article></div>`;
    const hs=[...v.querySelectorAll(".ovdoc h2")];
    hs.forEach((h,i)=>h.id="ch-"+(i+1));
    $("ov-toc").innerHTML=`<div class="grp">개요 · 목차</div>`+hs.map((h,i)=>`<a href="#ch-${i+1}" data-ch="ch-${i+1}">${esc(h.textContent)}</a>`).join("")+
      `<div class="grp">더 보기</div><a href="#wiki-PF-01">Thesis 위키 9개</a><a href="#signals">신호 레이더 · ${DATA.signals.length}건</a><a href="#digest">다이제스트</a>`;
    v.dataset.ready="1";
  }
  document.querySelectorAll("#ov-toc a[data-ch]").forEach(a=>a.setAttribute("aria-current", a.dataset.ch===target?"page":"false"));
  if(target){ const el=$(target); if(el) el.scrollIntoView({block:"start"}); } else window.scrollTo(0,0);
}

/* ---------- signals ---------- */
function sigCard(s){
  const [lab,cls]=DIR[s.direction];
  return `<article class="sig" id="s-${s.id}">
    <div class="top-l"><span class="pill ${cls}">${lab}</span><span class="str" title="강도 ${s.strength}/3">${"●".repeat(s.strength)}${"○".repeat(3-s.strength)}</span><span class="tier">${esc(s.tier)}</span><span>${esc(s.published)}</span>${s.japan?"<span>일본</span>":""}${s.status==="review"?'<span class="pill p-warn">검토 대기</span>':""}<span>${esc(s.id)}</span></div>
    <h4>${esc(s.title)}</h4>
    <p>${esc(s.summary)}</p>
    <div class="tags">${s.pf.map(p=>`<a class="tag pf" href="#wiki-${p}">${p}</a>`).join("")}${s.index.map(i=>`<a class="tag" href="#wiki-${IDX_SLUG[i]}">${esc(i)}</a>`).join("")}</div>
    <div class="src">${esc(s.source)} · <a href="${esc(s.url)}" target="_blank" rel="noopener">원문</a></div>
  </article>`;
}
const fs={pf:"",tier:"",dir:"",status:""};
function signalsView(focus){
  const S=DATA.signals;
  if(!$("v-signals").dataset.ready){
    $("v-signals").innerHTML=`<div><p class="eyebrow">신호 레이더</p><h1 style="margin:0;font-size:1.4rem">국내외 신호 원장</h1></div>
    <div><div class="filters">
      <select id="f-pf" aria-label="Thesis"><option value="">모든 Thesis</option>${PF_IDS.map(p=>`<option value="${p}">${p} ${esc(DATA.thesis[p].name)}</option>`).join("")}</select>
      <select id="f-tier" aria-label="출처 유형"><option value="">모든 출처 유형</option>${TIERS.map(t=>`<option>${t}</option>`).join("")}</select>
      <select id="f-dir" aria-label="방향"><option value="">모든 방향</option><option value="+">강화</option><option value="-">약화</option><option value="new">신규</option></select>
      <select id="f-status" aria-label="상태"><option value="">모든 상태</option><option value="accepted">채택</option><option value="review">검토 대기</option></select>
      <span class="count" id="f-count"></span></div><div class="ledger" id="ledger"></div></div>`;
    ["pf","tier","dir","status"].forEach(k=>$("f-"+k).onchange=e=>{fs[k]=e.target.value;renderLedger();});
    $("v-signals").dataset.ready="1";
  }
  renderLedger();
  if(focus){ const el=$("s-"+focus); if(el){ document.querySelectorAll(".sig.hl").forEach(x=>x.classList.remove("hl")); el.classList.add("hl"); el.scrollIntoView({block:"center"}); } }
}
function renderLedger(){
  const L=DATA.signals.filter(s=>(!fs.pf||s.pf.includes(fs.pf))&&(!fs.tier||s.tier===fs.tier)&&(!fs.dir||s.direction===fs.dir)&&(!fs.status||s.status===fs.status))
    .sort((a,b)=>b.published.localeCompare(a.published));
  $("f-count").textContent=`${L.length}건`;
  $("ledger").innerHTML=L.length?L.map(sigCard).join(""):'<div class="empty">조건에 맞는 신호가 없습니다. 필터를 바꿔 보세요.</div>';
}

/* ---------- wiki ---------- */
function wikiView(page){
  const key = SLUG_IDX[page] || page;
  const src = DATA.wiki[key];
  const toc = `<nav class="toc" aria-label="위키 목차">
    <div class="grp">개요</div><a href="#overview"><span>ALL</span>개요로 돌아가기</a>
    <div class="grp">Thesis</div>${PF_IDS.map(p=>`<a href="#wiki-${p}" ${page===p?'aria-current="page"':""}><span>${p}</span>${esc(DATA.thesis[p].name)}</a>`).join("")}
    <div class="grp">수요층 지수</div>${DATA.indices.map(n=>`<a href="#wiki-${IDX_SLUG[n]}" ${page===IDX_SLUG[n]?'aria-current="page"':""}><span>IDX</span>${esc(n)}</a>`).join("")}
  </nav>`;
  let head="";
  if(DATA.thesis[key]){
    const t=DATA.thesis[key], c=t.calc.current;
    head=`<div class="doc-head"><span class="qchip" style="color:${QC[c.quadrant]}">${esc(c.quadrant)}</span><span>총점 ${f1(c.total)} ${dlt(c.total-t.calc.baseline.total)}</span><span>Stack ${esc(t.stack)}</span><span>확신도 ${esc(t.conviction)}</span><span>갱신 ${esc(t.updated)}</span><span>출처 ${t.signal_count}건</span></div>`;
  }
  $("v-wiki").innerHTML=`<div class="wiki">${toc}<article class="doc">${head}${src?md(src):'<div class="empty">문서를 찾을 수 없습니다.</div>'}</article></div>`;
  window.scrollTo(0,0);
}

/* ---------- digest ---------- */
function digestView(){
  $("v-digest").innerHTML=`<div><p class="eyebrow">다이제스트</p><h1 style="margin:0;font-size:1.4rem">회차별 정리</h1></div>`+
    DATA.digests.map(d=>`<article class="doc"><div class="doc-head"><span>${esc(d.date)}</span><span>${esc(d.kind)}</span><span>${esc(d.path)}</span></div>${md(d.markdown)}</article>`).join("");
}

/* ---------- drawer ---------- */
function openSig(id){
  const s=DATA.signals.find(x=>x.id===id); if(!s) return;
  const dr=$("drawer");
  dr.innerHTML=`<button class="close" type="button" id="dr-close">닫기</button>${sigCard(s)}<a href="#signals" data-focus="${s.id}">신호 레이더에서 보기</a>`;
  dr.hidden=false; $("dr-close").onclick=()=>dr.hidden=true; $("dr-close").focus();
}
document.addEventListener("click",e=>{
  const a=e.target.closest("a[data-sig]");
  if(a){ e.preventDefault(); openSig(a.dataset.sig); return; }
  const f=e.target.closest("a[data-focus]");
  if(f){ e.preventDefault(); $("drawer").hidden=true; location.hash="signals"; setTimeout(()=>signalsView(f.dataset.focus),0); }
});
document.addEventListener("keydown",e=>{ if(e.key==="Escape") $("drawer").hidden=true; });

/* ---------- router ---------- */
function route(){
  if(!DATA){ $("v-overview").innerHTML='<div class="empty">아직 빌드된 데이터가 없습니다. 첫 수집 후 이 페이지가 채워집니다.</div>'; return; }
  $("gen").textContent=DATA.generated+" 갱신";
  let h=(location.hash||"#overview").slice(1);
  if(h==="wiki-Portfolio") h="overview";
  const v=h.startsWith("wiki-")?"wiki":(["signals","digest"].includes(h)?h:"overview");
  ["overview","wiki","signals","digest"].forEach(x=>$("v-"+x).hidden=x!==v);
  document.querySelectorAll("header nav a").forEach(a=>a.setAttribute("aria-current", a.dataset.v===v?"page":"false"));
  if(v==="overview") overview(h.startsWith("ch-")?h:null);
  else if(v==="wiki") wikiView(h.slice(5));
  else if(v==="signals"){ signalsView(); window.scrollTo(0,0); }
  else { digestView(); window.scrollTo(0,0); }
}
window.addEventListener("hashchange",route);
route();
</script>
