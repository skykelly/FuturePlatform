:root{
  --bg:#f2f3ef; --surface:#ffffff; --surface2:#f8f9f6; --ink:#1b231f; --muted:#5d6a63; --line:#d8ddd6;
  --accent:#1f6f5c; --accent-soft:#e0eee8; --accent-ink:#ffffff;
  --pos:#2f7d4f; --neg:#b4472f; --new:#7a5a12; --warn:#9a6b10; --chip:#ecefea;
  --q-core:#1f6f5c; --q-moon:#3b5b8c; --q-quick:#a07514; --q-hedge:#7d6a63;
  --h0:#eef1ec; --h1:#d6e6de; --h2:#a9cfbd; --h3:#6fae93; --h4:#2f7d63;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111513; --surface:#191f1c; --surface2:#1e2521; --ink:#e3e9e5; --muted:#98a59e; --line:#2b3430;
  --accent:#5cc2a3; --accent-soft:#1c2f28; --accent-ink:#0f1a16;
  --pos:#6cc48f; --neg:#e58a72; --new:#d8b25a; --warn:#d8b25a; --chip:#232b27;
  --q-core:#5cc2a3; --q-moon:#86a6d8; --q-quick:#d8b25a; --q-hedge:#b3a39b;
  --h0:#1f2723; --h1:#20382f; --h2:#2b5545; --h3:#3f8268; --h4:#5cc2a3; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#111513; --surface:#191f1c; --surface2:#1e2521; --ink:#e3e9e5; --muted:#98a59e; --line:#2b3430;
  --accent:#5cc2a3; --accent-soft:#1c2f28; --accent-ink:#0f1a16;
  --pos:#6cc48f; --neg:#e58a72; --new:#d8b25a; --warn:#d8b25a; --chip:#232b27;
  --q-core:#5cc2a3; --q-moon:#86a6d8; --q-quick:#d8b25a; --q-hedge:#b3a39b;
  --h0:#1f2723; --h1:#20382f; --h2:#2b5545; --h3:#3f8268; --h4:#5cc2a3; color-scheme:dark }
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6}
a{color:var(--accent)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:10px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center}
.brand{font-weight:700;font-size:1.05rem;letter-spacing:-.01em;display:flex;align-items:baseline;gap:8px}
.brand small{font-family:var(--f-mono);font-weight:400;font-size:.72rem;color:var(--muted)}
nav{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
nav a{text-decoration:none;color:var(--muted);font-size:.88rem;padding:6px 10px;border-radius:4px}
nav a[aria-current="page"]{color:var(--accent-ink);background:var(--accent)}
nav a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:22px 64px}
.view{display:grid;gap:30px}
h1,h2,h3{text-wrap:balance}
.eyebrow{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:0 0 12px}
.sec-h h2{font-size:1.05rem;margin:0}
.sec-h a{font-size:.85rem}
/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:20px;align-items:stretch}
.brief{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:18px 20px;display:grid;gap:10px;align-content:start;min-width:0}
.brief h1{font-size:1.45rem;margin:0;line-height:1.35}
.brief .meta{font-family:var(--f-mono);font-size:.78rem;color:var(--muted)}
.brief ol{margin:4px 0 0;padding-left:1.2em;display:grid;gap:8px}
.brief li{font-size:.92rem}
.brief li strong{display:block}
.mapcard{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:14px;min-width:0;display:grid;gap:6px}
.mapcard svg{width:100%;height:auto;display:block}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:.75rem;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:-1px}
/* stats */
.stats{display:flex;flex-wrap:wrap;gap:24px;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.stats div{display:grid}
.stats b{font-size:1.25rem;font-weight:500}
.stats span{font-size:.7rem;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
/* cards */
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.tcard{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:14px 16px;display:grid;gap:8px;text-decoration:none;color:inherit;min-width:0;align-content:start}
.tcard:hover,.tcard:focus-visible{border-color:var(--accent);outline:none}
.tc-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pfid{font-family:var(--f-mono);font-size:.8rem;color:var(--accent);font-weight:500}
.qchip{font-size:.7rem;padding:2px 8px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.tcard h3{margin:0;font-size:1rem;line-height:1.35}
.tcard h3 small{display:block;font-weight:400;color:var(--muted);font-size:.8rem}
.tcard p{margin:0;font-size:.85rem;color:var(--muted)}
.score{display:flex;align-items:baseline;gap:8px;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.score b{font-size:1.35rem;font-weight:500}
.score span{font-size:.75rem;color:var(--muted)}
.d-up{color:var(--pos)} .d-dn{color:var(--neg)} .d-0{color:var(--muted)}
.strip{display:grid;grid-template-columns:repeat(8,1fr);gap:2px}
.strip i{height:14px;border-radius:2px;display:block;position:relative}
.strip i.chg::after{content:"";position:absolute;inset:-2px;border:1.5px solid var(--ink);border-radius:3px}
.strip-l{display:grid;grid-template-columns:repeat(8,1fr);gap:2px;font-size:.58rem;color:var(--muted);text-align:center;font-family:var(--f-mono)}
.tc-foot{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:.75rem;color:var(--muted);font-family:var(--f-mono)}
.tc-upd{font-size:.8rem;border-top:1px dashed var(--line);padding-top:8px;color:var(--ink)}
/* lists */
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:14px 16px;min-width:0}
.rows{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.rows li{display:grid;gap:2px;font-size:.88rem;border-bottom:1px solid var(--line);padding-bottom:10px}
.rows li:last-child{border-bottom:0;padding-bottom:0}
.rows .r-h{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:baseline;font-family:var(--f-mono);font-size:.78rem}
.rows .r-t{color:var(--muted);font-size:.84rem}
.pill{font-family:var(--f-mono);font-size:.72rem;padding:1px 7px;border-radius:3px;border:1px solid currentColor}
.p-pos{color:var(--pos)} .p-neg{color:var(--neg)} .p-new{color:var(--new)} .p-warn{color:var(--warn);border-style:dashed}
/* signals */
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.filters select,.filters label{font:inherit;font-size:.85rem}
.filters select{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:6px 8px}
.filters .count{margin-left:auto;font-family:var(--f-mono);font-size:.8rem;color:var(--muted)}
.ledger{display:grid;gap:10px}
.sig{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:14px 16px;display:grid;gap:7px;min-width:0;scroll-margin-top:80px}
.sig.hl{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.sig .top-l{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:.75rem;color:var(--muted);font-family:var(--f-mono)}
.str{letter-spacing:2px;color:var(--accent)}
.tier{font-size:.72rem;background:var(--chip);border-radius:3px;padding:1px 7px;font-family:var(--f-body);color:var(--ink)}
.sig h4{margin:0;font-size:.98rem;line-height:1.45}
.sig p{margin:0;font-size:.9rem;max-width:72ch}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:.74rem;background:var(--chip);border-radius:3px;padding:2px 7px;text-decoration:none;color:var(--ink)}
.tag.pf{font-family:var(--f-mono);color:var(--accent)}
.src{font-size:.8rem;color:var(--muted)}
/* wiki */
.wiki{display:grid;grid-template-columns:220px minmax(0,1fr);gap:24px;align-items:start}
.toc{position:sticky;top:calc(env(safe-area-inset-top,0px) + 64px);display:grid;gap:2px;font-size:.88rem}
.toc a{text-decoration:none;color:var(--ink);padding:6px 10px;border-radius:4px;display:flex;gap:8px;align-items:baseline}
.toc a span{font-family:var(--f-mono);font-size:.75rem;color:var(--accent);min-width:42px}
.toc a[aria-current="page"]{background:var(--accent-soft);color:var(--ink);font-weight:500}
.toc .grp{font-family:var(--f-mono);font-size:.7rem;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;padding:12px 10px 4px}
.doc{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:24px 28px;min-width:0}
.doc h1{font-size:1.5rem;margin:0 0 6px;line-height:1.35}
.doc h2{font-size:1.1rem;margin:30px 0 10px;padding-top:14px;border-top:1px solid var(--line)}
.doc h3{font-size:.98rem;margin:18px 0 8px}
.doc p,.doc li{max-width:74ch}
.doc blockquote{margin:10px 0 18px;padding:10px 14px;background:var(--surface2);border-left:3px solid var(--accent);color:var(--ink)}
.doc blockquote p{margin:0}
.doc table{border-collapse:collapse;font-size:.86rem;width:100%;min-width:520px}
.doc th,.doc td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}
.doc th{font-weight:500;color:var(--muted);font-size:.78rem}
.doc td:nth-child(n+2){font-variant-numeric:tabular-nums}
.doc th,.doc td{word-break:keep-all;overflow-wrap:anywhere}
.tw{overflow-x:auto;margin:8px 0}
.doc code{font-family:var(--f-mono);font-size:.85em;background:var(--chip);padding:1px 4px;border-radius:3px}
.doc ol li,.doc ul li{margin:4px 0}
.wl{font-family:var(--f-mono);font-size:.82em;text-decoration:none;background:var(--accent-soft);padding:0 5px;border-radius:3px;white-space:nowrap}
.doc-head{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;margin-bottom:12px;font-family:var(--f-mono);font-size:.78rem;color:var(--muted)}
/* overview */
.ovdoc{padding:28px 34px}
.ovdoc h1{font-size:1.75rem;letter-spacing:-.015em;margin-bottom:10px}
.ovdoc h2{scroll-margin-top:calc(env(safe-area-inset-top,0px) + 70px);font-size:1.25rem}
.ovdoc h3{scroll-margin-top:80px}
.ovdoc > blockquote:first-of-type{font-size:1.02rem}
.ovdoc hr{border:0;border-top:1px solid var(--line);margin:22px 0}
.doc details{border:1px solid var(--line);border-radius:6px;margin:8px 0;background:var(--surface2)}
.doc details > summary{cursor:pointer;padding:10px 14px;list-style:none;display:flex;gap:8px;align-items:baseline}
.doc details > summary::-webkit-details-marker{display:none}
.doc details > summary::before{content:"+";font-family:var(--f-mono);color:var(--accent);width:1em;flex:none}
.doc details[open] > summary::before{content:"−"}
.doc details > *:not(summary){margin-left:14px;margin-right:14px}
.doc details[open]{padding-bottom:6px}
.viz{margin:14px 0}
.stacks{display:grid;gap:10px}
.srow{display:grid;grid-template-columns:170px minmax(0,1fr);gap:12px;align-items:center;background:var(--surface2);border:1px solid var(--line);border-radius:6px;padding:10px 12px}
.slab{display:grid;gap:2px}
.slab b{font-size:.92rem}
.slab span{font-size:.75rem;color:var(--muted)}
.snodes{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.snode{display:grid;gap:1px;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--qc);border-radius:4px;padding:6px 10px;min-width:0}
.snode:hover,.snode:focus-visible{border-color:var(--accent);outline:none}
.snode b{font-size:.84rem;font-weight:500}
.snode small{font-size:.72rem;color:var(--muted)}
.snode .pfid{font-size:.7rem}
.sep{color:var(--muted);font-family:var(--f-mono)}
.mapcard.viz{max-width:560px}
@media (max-width:760px){.ovdoc{padding:20px 16px}.srow{grid-template-columns:minmax(0,1fr)}}
/* drawer */
.drawer{position:fixed;right:0;top:0;bottom:0;width:min(440px,100%);background:var(--surface);border-left:1px solid var(--line);box-shadow:-8px 0 24px rgba(0,0,0,.12);padding:calc(env(safe-area-inset-top,0px) + 18px) 18px calc(env(safe-area-inset-bottom,0px) + 18px);overflow:auto;z-index:20;display:grid;gap:10px;align-content:start}
.drawer .close{justify-self:end;background:none;border:1px solid var(--line);color:var(--ink);border-radius:4px;padding:4px 10px;font:inherit;font-size:.85rem;cursor:pointer}
.empty{color:var(--muted);padding:24px;text-align:center;border:1px dashed var(--line);border-radius:6px}
@media (max-width:980px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.hero{grid-template-columns:minmax(0,1fr)}}
@media (max-width:760px){.two{grid-template-columns:minmax(0,1fr)}.wiki{grid-template-columns:minmax(0,1fr)}.toc{position:static;grid-template-columns:repeat(2,minmax(0,1fr))}.toc .grp{grid-column:1/-1}.doc{padding:18px 16px}}
@media (max-width:560px){.cards{grid-template-columns:minmax(0,1fr)}nav{margin-left:0}}
@media (prefers-reduced-motion:no-preference){.tcard,.toc a{transition:background .15s,border-color .15s}}
</style>
